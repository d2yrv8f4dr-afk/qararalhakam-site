<style>
/* Layout: a referee's notebook — app bar, a stepper of parts, one working column; turf + chalk illustrations, yellow-card highlight */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#16231C; --muted:#5B6B61; --line:#D9E0DA;
  --pitch:#1D6B47; --pitch-soft:#E3F0E8; --card:#E8B400; --card-soft:#FBF1CC; --red:#C2362B; --red-soft:#F8E1DE;
  --turf1:#2F8A57; --turf2:#2A7D4F; --chalk:#F7FAF5; --night:#123524;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1814; --surface:#16221C; --ink:#E6EEE8; --muted:#97A99E; --line:#26362D;
  --pitch:#5CC48F; --pitch-soft:#1B3528; --card:#F2C94C; --card-soft:#3A3115; --red:#F0786C; --red-soft:#3B1E1B;
  --turf1:#1F5E3C; --turf2:#1B5335; --chalk:#E2EBE4; --night:#0B1F15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1814; --surface:#16221C; --ink:#E6EEE8; --muted:#97A99E; --line:#26362D;
  --pitch:#5CC48F; --pitch-soft:#1B3528; --card:#F2C94C; --card-soft:#3A3115; --red:#F0786C; --red-soft:#3B1E1B;
  --turf1:#1F5E3C; --turf2:#1B5335; --chalk:#E2EBE4; --night:#0B1F15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--pitch)}
:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 16px}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right))}
.tabbar button{display:grid;justify-items:center;gap:2px;border:0;background:none;font:inherit;font-size:.72rem;font-weight:600;color:var(--muted);padding:4px 0;cursor:pointer;border-radius:12px}
.tabbar button b{font-size:1.25rem;line-height:1.2;filter:grayscale(1);opacity:.7;transition:transform .15s}
.tabbar button[aria-pressed="true"]{color:var(--pitch)}.tabbar button[aria-pressed="true"] b{filter:none;opacity:1;transform:translateY(-2px) scale(1.08)}
@media (min-width:900px){.tabbar{inset-inline:calc(50% - 300px);bottom:14px;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px #0002}}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin-inline-end:auto}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.nav button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.nav button[aria-pressed="true"]{background:var(--pitch);color:var(--surface)}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-family:var(--f-mono);font-size:.85rem}

h1{font-size:1.6rem;font-weight:800} h2{font-size:1.2rem;font-weight:600} h3{font-size:1.02rem;font-weight:600}
.mono{font-family:var(--f-mono);font-size:.82rem}

[hidden]{display:none!important}
.muted{color:var(--muted)}

.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px}
.results{display:grid;gap:6px}

.laws{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}

.step[aria-current="step"]{border-color:var(--pitch);background:var(--pitch-soft)}
.step.done i{background:var(--pitch);color:var(--surface)}
.part{display:grid;gap:14px}

.fig svg{width:min(100%,calc(440px * var(--ar,2)));height:auto;display:block;margin-inline:auto;direction:ltr}
.fig figcaption{padding:8px 12px;font-size:.85rem;color:#DDE8E0;background:var(--night)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;text-decoration:none;color:inherit;display:inline-block}
.btn.primary{background:var(--pitch);color:var(--surface);border-color:var(--pitch)}
.btn[aria-pressed="true"]{border-color:var(--card);background:var(--card-soft)}
svg .hl{stroke:var(--card)!important;stroke-width:6!important}
svg .hlf.hl{fill:var(--card)!important}
.prose{max-width:68ch;display:grid;gap:12px}
.prose p,.prose ul,.prose ol{margin:0}
.prose ul,.prose ol{padding-inline-start:1.3em;display:grid;gap:4px}
.ref{font-family:var(--f-mono);font-size:.78rem;color:var(--pitch);white-space:nowrap}
.note{border-inline-start:3px solid var(--card);background:var(--surface);padding:8px 12px}
.note.judge{border-color:var(--pitch)}
.note.err{border-color:var(--red);background:var(--red-soft)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.links{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}

.links{display:grid;gap:8px}.lnk{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}.lnk:hover{border-color:var(--pitch)}.lnk i{font-style:normal;font-size:1.5rem}.lnk span{display:grid;gap:2px;min-width:0}.lnk small{font-size:.8rem;color:var(--muted)}.lnk .u{direction:ltr;text-align:start;color:var(--pitch)}

/* sign out automatically after 30 minutes without any activity (public site) */
/* the last activity time is kept on the device, so closing the app and coming back later also counts as idle */
const IDLE_MS=10*60*1000;

["pointerdown","keydown","scroll","touchstart"].forEach(e=>addEventListener(e,touchActive,{passive:true}));

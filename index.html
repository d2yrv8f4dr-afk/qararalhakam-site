دات «المنطقة الحصرية لقائدي الفريقين» التي تحدد من يقترب من الحكم، وهي لا تمنحه حق الاعتراض."},"en":{"s":"The captain has special powers and is allowed to argue the referee's decisions.","w":"The captain has no special status or privileges but carries a degree of responsibility for the team's behaviour. Competitions may use the 'Only the captain' guidelines to control who approaches the referee; that grants no right to dissent."}},{"id":"gk-swap-anytime","ref":"3.4 · 3.5","t":false,"ar":{"s":"يمكن لأي لاعب أن يتبادل مكانه مع حارس المرمى في أي لحظة طالما بدّلا القميصين.","w":"يجب إبلاغ الحكم قبل التبادل، وأن يتم أثناء توقف اللعب. وإذا حدث دون إذن الحكم، يترك الحكم اللعب مستمرًا ثم يُنذر اللاعبين كليهما عند خروج الكرة من اللعب في المرة التالية، إلا إذا تم التبادل أثناء الاستراحة بين الشوطين (ومنها استراحة الوقت الإضافي) أو في الفترة بين نهاية المباراة وبداية الوقت الإضافي أو ركلات الترجيح."},"en":{"s":"Any player can swap with the goalkeeper at any moment as long as they change shirts.","w":"The referee must be informed before the change, and it must be made during a stoppage. If they swap without permission, play continues and both players are cautioned when the ball is next out of play, unless the swap happened at half-time (including half-time of extra time) or between the end of the match and the start of extra time or penalties."}},{"id":"ten-second-sub","ref":"3.5","t":true,"ar":{"s":"اللاعب المراد استبداله إذا تباطأ في الخروج قد يجعل فريقه يلعب ناقصًا لمدة دقيقة على الأقل.","w":"صحيح: إذا لم يغادر اللاعب المراد استبداله الملعب خلال عشر ثوانٍ من رفع لوحة التبديل أو إشارة الحكم (ما لم يتعذر ذلك لأسباب أمنية أو للإصابة)، فعليه أن يغادر مع ذلك، ويُستأنف اللعب دون دخول البديل، ولا يدخل البديل إلا بإذن الحكم عند أول توقف بعد مرور دقيقة على الاستئناف. ولا يمكن إلغاء التبديل ولا استخدام بديل آخر، ولا يُنذر اللاعب إلا إذا أخّر الاستئناف بشكل مفرط."},"en":{"s":"A player being substituted who dawdles off the pitch can leave his team a player short for at least a minute.","w":"True: if the player being substituted is not off within ten seconds of the board or the referee's signal (unless safety/security or injury prevents it), he must still leave, play restarts without the substitute, and the substitute may enter only with the referee's permission at the first stoppage after one minute has passed since the restart. The substitution cannot be cancelled nor another substitute used; the player is cautioned only if he excessively delays the restart."}}]},"4":{"pages":{"ar":"ع ص 67–71 · EN p.67–71","en":"EN p.67–71 · AR p.67–71"},"parts":[{"id":"safety","title":{"ar":"السلامة","en":"Safety"},"ref":"4.1","k":["سلامة","safety","خطرة","dangerous","إكسسوارات","accessories","خاتم","ring","ساعة","watch","شريط","tape"],"body":{"ar":"<ul><li>لا يستخدم اللاعب ولا يرتدي أي شيء <b>خطر</b>.</li>\n<li>الإكسسوارات مسموحة إذا لم تكن خطرة وكانت <b>مغطاة بأمان</b>. أما الأشياء الخطرة فيجب <b>نزعها</b>، ولا يكفي تغطيتها بشريط.</li>\n<li>يُفحص اللاعبون <b>قبل المباراة</b>، والبدلاء <b>قبل دخولهم</b>.</li></ul>\n<div class=\"tbl\"><table><tr><th>إذا وُجد شيء ممنوع أو خطر</th><th>الإجراء</th></tr>\n<tr><td>يأمر الحكم اللاعب</td><td>بنزعه</td></tr>\n<tr><td>لا يستطيع أو يرفض</td><td>يغادر الملعب في التوقف التالي</td></tr>\n<tr><td>يرفض الامتثال أو يرتديه مرة أخرى</td><td><b>إنذار</b></td></tr></table></div>","en":"<ul><li>A player must not use or wear anything <b>dangerous</b>.</li>\n<li>Accessories are allowed if not dangerous and <b>safely covered</b>. Dangerous items must be <b>removed</b>; taping them is not enough.</li>\n<li>Players are inspected <b>before the match</b>, substitutes <b>before entering</b>.</li></ul>\n<div class=\"tbl\"><table><tr><th>If an item is unauthorised or dangerous</th><th>Action</th></tr>\n<tr><td>Referee orders the player</td><td>to remove it</td></tr>\n<tr><td>Unable or unwilling</td><td>leaves at the next stoppage</td></tr>\n<tr><td>Refuses or wears it again</td><td><b>Caution</b></td></tr></table></div>"},"quiz":[{"ar":["لاعب يرتدي سلسلة معدنية خطرة ويريد تغطيتها بشريط لاصق. مسموح؟",["نعم","لا، يجب نزعها"],"الخطر يُنزع ولا يُغطى. (4.1)"],"en":["A player wants to tape over a dangerous metal chain. Allowed?",["Yes","No, it must be removed"],"Dangerous items are removed, not taped. (4.1)"],"a":1,"lvl":"b"},{"ar":["لاعب نزع خاتمًا خطرًا بطلب الحكم ثم عاد وارتداه. الإجراء؟",["تنبيه شفهي","إنذار"],"(4.1)"],"en":["A player removed a dangerous ring on request, then wore it again. Action?",["Verbal warning","Caution"],"(4.1)"],"a":1,"lvl":"b"}]},{"id":"compulsory","title":{"ar":"المعدات الإلزامية","en":"Compulsory equipment"},"ref":"4.2","fig":"kit","k":["قميص","shirt","شورت","shorts","جوارب","socks","واقي الساق","shinguard","حذاء","footwear","شارة القائد","armband"],"body":{"ar":"<p>خمس قطع <b>منفصلة</b> إلزامية:</p>\n<ol><li><b>قميص بأكمام</b>.</li><li><b>شورت</b>.</li><li><b>جوارب</b>: أي شريط أو مادة فوقها بنفس لون الجزء الذي تغطيه.</li>\n<li><b>واقيا الساقين</b>: من مادة مناسبة وبحجم يوفر حماية معقولة، و<b>مغطيان بالجوارب</b>. واللاعب مسؤول عن حجمهما وملاءمتهما.</li><li><b>حذاء</b>.</li></ol>\n<ul><li><b>شارة القائد:</b> الشارة المعتمدة من منظم المسابقة، أو شارة بلون واحد قد تحمل كلمة «captain» أو حرف «C» أو ترجمتهما بلون واحد.</li>\n<li><b>فقد حذاءه أو واقي الساق عرَضًا:</b> يعيده في أقرب وقت، وقبل خروج الكرة من اللعب على الأكثر. وإذا لعب الكرة أو <b>سجّل هدفًا</b> قبل ذلك، <b>يُحتسب الهدف</b>.</li></ul>","en":"<p>Five <b>separate</b> compulsory items:</p>\n<ol><li>A <b>shirt with sleeves</b>.</li><li><b>Shorts</b>.</li><li><b>Socks</b>: any tape or material outside must match the colour of that part of the sock.</li>\n<li><b>Shinguards</b>: suitable material, a size giving reasonable protection, <b>covered by the socks</b>. The player is responsible for them.</li><li><b>Footwear</b>.</li></ol>\n<ul><li><b>Captain's armband:</b> the one issued or authorised by the organiser, or a single-colour armband that may carry ‘captain’, ‘C’ or a translation in one colour.</li>\n<li><b>Footwear or shinguard lost accidentally:</b> replace it as soon as possible, at the latest when the ball is next out of play. If the player plays the ball or <b>scores</b> before that, the <b>goal stands</b>.</li></ul>"},"quiz":[{"ar":["طار حذاء المهاجم عرَضًا فسدد بقدمه الحافية وسجل. القرار؟",["يُلغى الهدف","يُحتسب الهدف"],"(4.2)"],"en":["The striker's boot comes off accidentally and he scores barefoot. Decision?",["No goal","Goal"],"(4.2)"],"a":1,"lvl":"p"},{"ar":["لاعب يضع شريطًا أبيض فوق جوارب حمراء. مسموح؟",["نعم","لا"],"يجب أن يكون بلون الجورب. (4.2)"],"en":["White tape over red socks. Allowed?",["Yes","No"],"Must match the sock colour. (4.2)"],"a":1,"lvl":"b"},{"ar":["من المسؤول عن حجم واقي الساق وملاءمته؟",["الحكم","اللاعب"],"(4.2)"],"en":["Who is responsible for shinguard size and suitability?",["Referee","Player"],"(4.2)"],"a":1,"lvl":"b"}]},{"id":"colours","title":{"ar":"الألوان","en":"Colours"},"ref":"4.3","k":["ألوان","colour","color","حارس","goalkeeper","قميص داخلي","undershirt","سروال داخلي","undershorts","tights"],"body":{"ar":"<ul><li>ألوان الفريقين تميز كلًّا منهما عن الآخر وعن حكام المباراة.</li>\n<li>كل حارس بلون يميزه عن اللاعبين الآخرين والحكام.</li>\n<li>إذا تشابه قميصا الحارسين ولا يوجد بديل، <b>يسمح الحكم بإقامة المباراة</b>.</li></ul>\n<div class=\"tbl\"><table><tr><th>القطعة</th><th>اللون المسموح</th></tr>\n<tr><td>القميص الداخلي</td><td>لون واحد مطابق للون الأساسي لكمّ القميص، <b>أو</b> نقش يطابق الكمّ تمامًا</td></tr>\n<tr><td>السروال الداخلي / الطويل</td><td>لون الشورت الأساسي أو لون أسفله، و<b>بنفس اللون لكل لاعبي الفريق</b></td></tr></table></div>","en":"<ul><li>Teams wear colours distinguishing them from each other and the match officials.</li>\n<li>Each goalkeeper wears colours distinguishable from other players and officials.</li>\n<li>If both goalkeepers' shirts match and neither has another, the <b>referee allows the match</b>.</li></ul>\n<div class=\"tbl\"><table><tr><th>Item</th><th>Permitted colour</th></tr>\n<tr><td>Undershirt</td><td>One colour matching the main colour of the shirt sleeve, <b>or</b> a pattern exactly replicating the sleeve</td></tr>\n<tr><td>Undershorts / tights</td><td>Main colour of the shorts or their lowest part, <b>same colour for the whole team</b></td></tr></table></div>"},"quiz":[{"ar":["الحارسان بنفس لون القميص ولا بديل لديهما. القرار؟",["تُلغى المباراة","تُقام المباراة"],"(4.3)"],"en":["Both goalkeepers wear the same colour, no spare shirt. Decision?",["Match off","Match played"],"(4.3)"],"a":1,"lvl":"b"},{"ar":["لاعبان من نفس الفريق: أحدهما بسروال طويل أسود والآخر أبيض، والشورت أبيض. مسموح؟",["نعم","لا، يجب لون واحد للفريق"],"(4.3)"],"en":["Two team-mates wear black and white tights; shorts are white. Allowed?",["Yes","No, one colour for the team"],"(4.3)"],"a":1,"lvl":"p"}]},{"id":"other","title":{"ar":"معدات أخرى والأجهزة الإلكترونية","en":"Other equipment and electronics"},"ref":"4.4","k":["قفاز","gloves","غطاء الرأس","head cover","نظارة","spectacles","إلكتروني","electronic","سماعة","earpiece","epts","تتبع"],"body":{"ar":"<ul><li><b>مسموح:</b> معدات حماية غير خطرة، مثل القفازات وأغطية الرأس وأقنعة الوجه وواقيات الركبة والذراع من مادة لينة خفيفة، وقبعات الحراس، والنظارات الرياضية. ويجوز للحارس ارتداء بنطال رياضي طويل.</li></ul>\n<h3>غطاء الرأس (غير قبعة الحارس)</h3>\n<ul><li>أسود أو بلون القميص الأساسي، وموحّد لكل لاعبي الفريق.</li><li>لائق بالمظهر المهني، و<b>غير متصل بالقميص</b>.</li><li>غير خطر (مثل آلية فتح وإغلاق حول الرقبة)، و<b>بلا أجزاء بارزة</b>.</li></ul>\n<h3>الأجهزة الإلكترونية</h3>\n<div class=\"tbl\"><table><tr><th>الفئة</th><th>القاعدة</th></tr>\n<tr><td>اللاعبون والبدلاء والمستبدَلون والمطرودون</td><td><b>ممنوع</b> أي جهاز إلكتروني أو اتصال (إلا أجهزة تتبع الأداء EPTS المسموحة)</td></tr>\n<tr><td>مسؤولو الفريق</td><td><b>مسموح</b> لأسباب صحة اللاعبين وسلامتهم أو لأسباب فنية، بأجهزة صغيرة محمولة فقط: ميكروفون، سماعة، هاتف، ساعة ذكية، جهاز لوحي، حاسوب محمول</td></tr>\n<tr><td>مسؤول يستخدم جهازًا غير مسموح أو يتصرف بشكل غير لائق بسببه</td><td><b>طرد</b></td></tr></table></div>\n<p><b>أجهزة تتبع الأداء (EPTS):</b> في المسابقات الرسمية يضمن المنظم أنها غير خطرة ومطابقة لبرنامج FIFA للجودة، وأن بياناتها إلى المنطقة الفنية دقيقة.</p>","en":"<ul><li><b>Allowed:</b> non-dangerous protective equipment such as gloves, headgear, facemasks, soft lightweight knee and arm protectors, goalkeepers' caps and sports spectacles. Goalkeepers may wear tracksuit bottoms.</li></ul>\n<h3>Head covers (other than goalkeepers' caps)</h3>\n<ul><li>Black or the shirt's main colour, the same for the whole team.</li><li>Professional in appearance and <b>not attached to the shirt</b>.</li><li>Not dangerous (e.g. a neck fastening) and with <b>no protruding parts</b>.</li></ul>\n<h3>Electronic communication</h3>\n<div class=\"tbl\"><table><tr><th>Who</th><th>Rule</th></tr>\n<tr><td>Players, substitutes, substituted and sent-off players</td><td><b>No</b> electronic or communication equipment (except permitted EPTS)</td></tr>\n<tr><td>Team officials</td><td><b>Allowed</b> for player welfare, safety or tactics, using small handheld devices only: microphone, headphone, earpiece, phone, smartwatch, tablet, laptop</td></tr>\n<tr><td>Official using unauthorised equipment or behaving inappropriately because of it</td><td><b>Sent off</b></td></tr></table></div>\n<p><b>EPTS:</b> in official competitions the organiser ensures wearables are safe, meet the FIFA Quality Programme, and that data sent to the technical area is accurate.</p>"},"quiz":[{"ar":["لاعب يضع سماعة في أذنه لتلقي تعليمات المدرب. مسموح؟",["نعم","لا"],"الأجهزة ممنوعة على اللاعبين. (4.4)"],"en":["A player wears an earpiece to hear the coach. Allowed?",["Yes","No"],"Players may not use such devices. (4.4)"],"a":1,"lvl":"b"},{"ar":["مساعد المدرب يستخدم جهازًا لوحيًا في المنطقة الفنية لتحليل اللعب. مسموح؟",["نعم","لا"],"(4.4)"],"en":["An assistant coach uses a tablet in the technical area for tactics. Allowed?",["Yes","No"],"(4.4)"],"a":0,"lvl":"p"},{"ar":["غطاء رأس لاعب متصل بقميصه. مسموح؟",["نعم","لا"],"(4.4)"],"en":["A player's head cover is attached to the shirt. Allowed?",["Yes","No"],"(4.4)"],"a":1,"lvl":"b"}]},{"id":"slogans","title":{"ar":"العبارات والصور والإعلانات","en":"Slogans, statements, images and advertising"},"ref":"4.5","k":["شعار","slogan","عبارة","statement","سياسي","political","ديني","religious","إعلان","advertising","ملابس داخلية","undergarment"],"body":{"ar":"<ul><li>لا تحمل المعدات أي عبارات أو صور <b>سياسية أو دينية أو شخصية</b>.</li>\n<li>لا يكشف اللاعب ملابس داخلية تحمل ذلك، أو إعلانًا غير شعار المصنّع.</li>\n<li>العقوبة على المخالفة تفرضها <b>جهة تنظيم المسابقة أو الاتحاد الوطني أو FIFA</b>.</li></ul>\n<div class=\"tbl\"><table><tr><th>مسموح عادةً</th><th>غير مسموح</th></tr>\n<tr><td>رقم اللاعب واسمه، وشعار الفريق، وشعارات تدعم كرة القدم والاحترام والنزاهة، والإعلانات المسموحة باللوائح، وبيانات المباراة (الفريقان، التاريخ، المسابقة، الملعب)</td>\n<td>أي شخص حي أو متوفى (إلا إن كان جزءًا من اسم المسابقة)، أو حزب أو جماعة سياسية، أو حكومة أو إداراتها، أو منظمة تمييزية أو مسيئة لكثيرين، أو حدث سياسي محدد</td></tr></table></div>\n<ul><li>المسموح يكون على <b>مقدمة القميص</b> أو <b>شارة القائد</b>، وأحيانًا على الشارة فقط.</li>\n<li>عند إحياء ذكرى حدث وطني أو دولي، تُراعى مشاعر الفريق المنافس وجمهوره والعامة. ويُفضَّل حسم الخلافات قبل المباراة.</li></ul>","en":"<ul><li>Equipment must not carry <b>political, religious or personal</b> slogans, statements or images.</li>\n<li>Players must not reveal undergarments showing these, or advertising other than the manufacturer's logo.</li>\n<li>Sanctions come from the <b>competition organiser, national FA or FIFA</b>.</li></ul>\n<div class=\"tbl\"><table><tr><th>Usually allowed</th><th>Not allowed</th></tr>\n<tr><td>Number and name, team crest, slogans promoting football, respect and integrity, advertising permitted by the rules, and match facts (teams, date, competition, venue)</td>\n<td>Any person living or dead (unless part of the competition name), political parties or groups, governments or their departments, discriminatory or widely offensive organisations, a specific political act or event</td></tr></table></div>\n<ul><li>Permitted items go on the <b>shirt front</b> and/or <b>armband</b>, sometimes only the captain's armband.</li>\n<li>When commemorating an event, consider the opponents, their supporters and the public. Settle disputes before the match.</li></ul>"},"quiz":[{"ar":["لاعب يكشف قميصًا داخليًا عليه صورة شخصية سياسية بعد تسجيله. من يعاقبه على مخالفة القانون 4؟",["الحكم بطرده","جهة تنظيم المسابقة أو الاتحاد"],"(4.5)"],"en":["A player reveals an undershirt with a political figure after scoring. Who sanctions the Law 4 offence?",["Referee, by sending off","Competition organiser or FA"],"(4.5)"],"a":1,"lvl":"p"},{"ar":["هل يُسمح بتاريخ المباراة واسم الملعب على القميص؟",["نعم","لا"],"بيانات المباراة مسموحة عادةً. (4.5)"],"en":["May the shirt show the match date and venue?",["Yes","No"],"Match facts are usually allowed. (4.5)"],"a":0,"lvl":"b"}]},{"id":"sanctions","title":{"ar":"المخالفات والعقوبات","en":"Offences and sanctions"},"ref":"4.6","k":["مخالفات المعدات","equipment offence","تصحيح","correct","دخول دون إذن","re-enter"],"body":{"ar":"<ol><li><b>لا يلزم إيقاف اللعب.</b> يأمر الحكم اللاعب بمغادرة الملعب لتصحيح معداته.</li>\n<li>يغادر عند توقف اللعب، إلا إذا كان قد صحّحها.</li>\n<li>قبل العودة: <b>يفحص أحد الحكام</b> المعدات.</li>\n<li>يعود <b>بإذن الحكم فقط</b>، ويجوز الإذن أثناء اللعب.</li></ol>\n<div class=\"tbl\"><table><tr><th>دخل دون إذن</th><th>القرار</th></tr>\n<tr><td>العقوبة</td><td><b>إنذار</b></td></tr>\n<tr><td>أوقف الحكم اللعب للإنذار، ولا تدخّل</td><td><b>ركلة حرة غير مباشرة</b> من مكان الكرة</td></tr>\n<tr><td>كان هناك تدخّل</td><td><b>ركلة حرة مباشرة</b> (أو ركلة جزاء) من مكان التدخل</td></tr></table></div>","en":"<ol><li><b>Play need not be stopped.</b> The referee tells the player to leave and correct the equipment.</li>\n<li>The player leaves when play stops, unless already corrected.</li>\n<li>Before returning: a <b>match official checks</b> the equipment.</li>\n<li>Re-entry <b>only with the referee's permission</b>, which may be given during play.</li></ol>\n<div class=\"tbl\"><table><tr><th>Entered without permission</th><th>Decision</th></tr>\n<tr><td>Sanction</td><td><b>Caution</b></td></tr>\n<tr><td>Play stopped to caution, no interference</td><td><b>Indirect free kick</b> from the ball's position</td></tr>\n<tr><td>With interference</td><td><b>Direct free kick</b> (or penalty) from where it happened</td></tr></table></div>"},"quiz":[{"ar":["هل يجب إيقاف اللعب فور ملاحظة مخالفة في المعدات؟",["نعم","لا"],"(4.6)"],"en":["Must play stop as soon as an equipment offence is seen?",["Yes","No"],"(4.6)"],"a":1,"lvl":"b"},{"ar":["لاعب صحّح معداته ودخل دون إذن، وأوقف الحكم اللعب لإنذاره دون تدخّل. الاستئناف؟",["ركلة حرة غير مباشرة من مكان الكرة","ركلة حرة مباشرة","كرة مسقطة"],"(4.6)"],"en":["A player re-enters without permission; play stopped to caution, no interference. Restart?",["IFK from the ball's position","Direct free kick","Dropped ball"],"(4.6)"],"a":0,"lvl":"p"}]}],"cases":[{"id":"ring-tape","lvl":"b","ref":"4.1","a":2,"ar":{"s":"في فحص المعدات قبل المباراة يرتدي لاعب خاتمًا كبيرًا بحجر بارز حاد الحواف، وتقدّر أنه يشكل خطورة. يرفض خلعه ويقترح تغطيته بشريط لاصق. ما قرارك؟","o":["يُسمح له بتغطيته بالشريط","يُسمح له باللعب ويُنذر","يجب خلع الخاتم، فالتغطية بالشريط غير مقبولة"],"d":"يُطلب منه خلع الخاتم قبل المشاركة","r":"لا يوجد (قبل المباراة)","x":"لا يوجد، لكن يُنذر إذا رفض الامتثال أو أعاد ارتداءه","w":"منذ تعديلات 2026/27 يُسمح بارتداء الملحقات (الإكسسوارات) غير الخطرة إذا كانت مغطاة بشكل آمن ومُحكم، وتقدير الخطورة يعود للحكم. أما الشيء الخطر فيجب نزعه، ولا تكفي تغطيته بشريط لاصق أو غيره. واللاعب الذي يرفض الامتثال أو يعيد ارتداءه يُنذر، ولا يشارك ما لم يُصحح وضعه."},"en":{"s":"At the pre-match equipment check a player wears a large ring with a raised, sharp-edged stone, which you judge dangerous. He won't take it off and offers to tape over it. Your call?","o":["Allow it if taped","Let him play and caution him","The ring must come off; taping is not acceptable"],"d":"Order the ring removed before he takes part","r":"None (pre-match)","x":"None — but a caution if he refuses or puts it back on","w":"Since 2026/27, non-dangerous accessories may be worn if safely and securely covered, so whether an item is dangerous is the referee's judgement. A dangerous item must come off; taping or covering it is not enough. A player who refuses or puts it back on is cautioned, and he can't take part until it is corrected."}},{"id":"lost-boot-goal","lvl":"b","ref":"4.2","a":0,"ar":{"s":"فقد مهاجم حذاءه دون قصد أثناء هجمة، وقبل أن يستبدله ركل الكرة بقدمه الحافية وسجل هدفًا. ما قرارك؟","o":["يُحتسب الهدف","يُلغى الهدف وركلة حرة غير مباشرة للمنافس","يُلغى الهدف ويُنذر اللاعب"],"d":"احتساب الهدف، ويعيد اللاعب ارتداء حذائه","r":"ركلة البداية","x":"لا يوجد","w":"اللاعب الذي يفقد حذاءه أو واقي الساق بغير قصد عليه استبداله في أقرب وقت، وفي موعد أقصاه خروج الكرة التالي من اللعب. وإذا لعب الكرة أو سجل قبل ذلك يُحتسب الهدف."},"en":{"s":"A forward accidentally loses a boot during an attack and, before replacing it, scores with his bare foot. Your call?","o":["Award the goal","Disallow; indirect free kick to the opponents","Disallow and caution the player"],"d":"Award the goal; the player puts the boot back on","r":"Kick-off","x":"None","w":"A player who accidentally loses a boot or shinguard must replace it as soon as possible, at the latest when the ball next goes out of play. If he plays the ball or scores before that, the goal stands."}},{"id":"reenter-no-permission","lvl":"b","ref":"4.6","a":1,"ar":{"s":"خرج لاعب لتعديل جواربه التي لا تغطي واقي الساق، ثم عاد إلى الملعب دون إذنك ولم يتدخل في اللعب. أوقفت اللعب لإنذاره. ما الاستئناف؟","o":["ركلة حرة مباشرة من مكان عودته","ركلة حرة غير مباشرة من مكان الكرة عند الإيقاف","كرة مسقطة"],"d":"إيقاف اللعب وإنذار اللاعب","r":"ركلة حرة غير مباشرة من مكان الكرة عند إيقاف اللعب","x":"إنذار (العودة دون إذن)","w":"اللاعب الذي يخرج لتصحيح معداته يجب أن تُفحص معداته ولا يعود إلا بإذن الحكم. إذا عاد دون إذن يُنذر، وإذا أُوقف اللعب لذلك تُحتسب ركلة حرة غير مباشرة من مكان الكرة، أما إذا تدخّل فتكون ركلة حرة مباشرة (أو ركلة جزاء) من موضع التدخل."},"en":{"s":"A player leaves to fix socks that don't cover his shinguards, then comes back on without your permission and doesn't interfere. You stop play to caution him. Restart?","o":["Direct free kick from where he re-entered","Indirect free kick from where the ball was when play stopped","Dropped ball"],"d":"Stop play and caution the player","r":"Indirect free kick from the ball's position when play was stopped","x":"Caution (re-entering without permission)","w":"A player correcting equipment must have it checked and may only return with the referee's permission. Re-entering without it is a caution; if play is stopped for that, it's an indirect free kick from the ball's position — or a direct free kick (or penalty) from the point of interference if he interfered."}},{"id":"undershirt-colour","lvl":"p","ref":"4.3 · 4.6","a":2,"ar":{"s":"أثناء هجمة لاحظت أن أكمام القميص الداخلي لأحد اللاعبين بلون يختلف عن لون أكمام قميصه. ما قرارك؟","o":["إيقاف اللعب فورًا وإنذاره","تجاهل الأمر لأنه لا يشكل خطرًا","يستمر اللعب، وتطلب منه الخروج لتصحيح ذلك عند توقف اللعب ما لم يكن قد صححه"],"d":"لا حاجة لإيقاف اللعب، ويُصحح اللاعب لباسه خارج الملعب","r":"حسب سبب التوقف التالي","x":"لا يوجد","w":"القميص الداخلي يجب أن يكون بلون واحد مطابق للون الرئيسي لكم القميص أو بنقش مطابق له تمامًا. ومخالفات المعدات لا تستلزم إيقاف اللعب، فيخرج اللاعب عند التوقف ليصححها، ولا يعود إلا بعد الفحص وبإذن الحكم. ولا إنذار ما دام يمتثل."},"en":{"s":"During an attack you notice a player's undershirt sleeves are a different colour from his shirt sleeves. Your call?","o":["Stop play at once and caution him","Ignore it — it's not dangerous","Play on; he leaves to correct it when play stops, unless already corrected"],"d":"No need to stop play; the player corrects it off the field","r":"Per the next stoppage","x":"None","w":"Undershirts must be a single colour matching the main colour of the shirt sleeve, or exactly replicate the sleeve. Equipment offences don't require play to be stopped: the player leaves at the stoppage, is checked and returns with permission. No caution while he complies."}},{"id":"tablet-official","lvl":"p","ref":"4.4","a":0,"ar":{"s":"في المنطقة الفنية يستخدم مساعد المدرب جهازًا لوحيًا لأغراض تكتيكية. بعد قرار احتسبته ضد فريقه، أسرع إلى الحكم الرابع ولوّح بالشاشة في وجهه محتجًا بإعادة اللقطة. الكرة خارج الملعب لرمية تماس. ما قرارك؟","o":["طرد مساعد المدرب، ثم رمية التماس","إنذاره فقط، فاستخدام الجهاز مسموح","مصادرة الجهاز دون عقوبة"],"d":"طرد مساعد المدرب من المنطقة الفنية","r":"رمية التماس","x":"طرد","w":"يُسمح لإداريي الفريق باستخدام أجهزة محمولة صغيرة لأغراض تكتيكية أو لسلامة اللاعبين، لكن إداري الفريق الذي يتصرف بشكل غير لائق نتيجة استخدام هذه الأجهزة يُطرد. والاستئناف يبقى كما كان مقررًا لأن الكرة كانت خارج اللعب."},"en":{"s":"In the technical area an assistant coach uses a tablet for tactics. After a decision against his team he rushes to the fourth official and waves the screen at him, protesting with the replay. The ball is out for a throw-in. Your call?","o":["Send off the assistant coach, then the throw-in","Caution only — the device is allowed","Confiscate the device, no sanction"],"d":"Send off the assistant coach","r":"Throw-in","x":"Sending-off","w":"Team officials may use small handheld devices for tactical or player-welfare reasons, but one who behaves inappropriately as a result of using such equipment is sent off. The restart stays as it was, since the ball was already out of play."}}],"myths":[{"id":"lost-boot-goal","ref":"4.2","t":false,"ar":{"s":"الهدف الذي يسجله لاعب فقد حذاءه للتو بدون قصد يُلغى.","w":"اللاعب الذي يفقد حذاءه أو واقي الساق بدون قصد عليه استبداله في أقرب وقت ممكن، وفي موعد لا يتجاوز خروج الكرة من اللعب في المرة التالية، وإذا لعب الكرة أو سجل هدفًا قبل ذلك يُحتسب الهدف."},"en":{"s":"A goal scored by a player whose boot has just come off accidentally doesn't count.","w":"A player who accidentally loses footwear or a shinguard must replace it as soon as possible and no later than when the ball next goes out of play; if they play the ball or score before then, the goal stands."}},{"id":"gk-same-colour","ref":"4.3","t":false,"ar":{"s":"إذا ارتدى حارسا المرمى قميصين بنفس اللون، لا يمكن أن تبدأ المباراة.","w":"يجب أن يتميز كل حارس عن بقية اللاعبين وعن الحكام، لكن إذا تطابق لونا قميصي الحارسين ولم يكن لدى أي منهما قميص آخر، يسمح الحكم بإقامة المباراة."},"en":{"s":"If both goalkeepers wear the same colour shirt, the match can't start.","w":"Each goalkeeper must stand out from the other players and the officials, but if the two goalkeepers' shirts match and neither has another shirt, the referee allows the match to be played."}},{"id":"reenter-during-play","ref":"4.6","t":true,"ar":{"s":"اللاعب الذي خرج لتصحيح معداته يمكن أن يعود إلى الملعب بإذن الحكم والكرة ما زالت في اللعب.","w":"صحيح: بعد أن يفحص أحد حكام المباراة معداته، يعود اللاعب بإذن الحكم فقط، ويجوز منح هذا الإذن أثناء اللعب. أما من يدخل دون إذن فيُنذر، وإذا أُوقف اللعب لذلك يُستأنف بركلة حرة غير مباشرة من مكان الكرة، أو بركلة حرة مباشرة (أو ركلة جزاء) إذا تدخل في اللعب."},"en":{"s":"A player who went off to fix his kit can come back on with the referee's permission while the ball is still in play.","w":"True: once a match official has checked the equipment, the player may re-enter only with the referee's permission, which may be given during play. Entering without permission is a caution; if play is stopped for it, the restart is an indirect free kick from the ball's position, or a direct free kick (or penalty kick) if he interfered."}}]},"5":{"pages":{"ar":"ع ص 73–82 · EN p.73–82","en":"EN p.73–82 · AR p.73–82"},"parts":[{"id":"authority","title":{"ar":"سلطة الحكم وقراراته","en":"Authority and decisions"},"ref":"5.1 · 5.2","k":["سلطة","authority","قرار","decision","روح اللعبة","spirit","نهائي","final","تغيير القرار","change decision","saot","تقنية"],"body":{"ar":"<ul><li>يدير كل مباراة حكم له <b>السلطة الكاملة</b> لتطبيق القوانين.</li>\n<li>يقرر بأفضل ما يستطيع وفق القوانين و<b>روح اللعبة</b>، وبناءً على <b>رأيه</b> وتقديره ضمن إطار القوانين.</li>\n<li>يجوز للمسابقات استخدام تقنيات تساعده: بروتوكول حكم الفيديو، وتقنية خط المرمى، وتقنية التسلل شبه الآلية (SAOT).</li>\n<li>قراراته في الوقائع المتصلة باللعب، ومنها احتساب الهدف ونتيجة المباراة، <b>نهائية</b>، ويجب احترامها دائمًا.</li></ul>\n<div class=\"tbl\"><table><tr><th>متى لا يستطيع تغيير قرار الاستئناف؟</th></tr>\n<tr><td>بعد <b>استئناف اللعب</b></td></tr>\n<tr><td>بعد إعلان نهاية الشوط ومغادرة الملعب</td></tr>\n<tr><td>بعد إلغاء المباراة</td></tr></table></div>\n<p class=\"note\">استثناء: إذا غادر الملعب في نهاية الشوط متجهًا إلى منطقة المراجعة، أو ليعيد اللاعبين، فيمكنه تغيير قرار عن حادثة قبل نهاية الشوط.</p>\n<ul><li><b>عقوبة بعد الاستئناف</b> (عدا القانون 12.4 وبروتوكول الفيديو): فقط إذا كان حكم آخر قد رصد المخالفة وحاول إبلاغه قبل الاستئناف، ولا يُطبق الاستئناف المرتبط بها.</li>\n<li>إذا أصيب الحكم بما يمنعه، يستمر اللعب تحت إشراف الحكام الآخرين حتى خروج الكرة.</li></ul>","en":"<ul><li>Each match is controlled by a referee with <b>full authority</b> to enforce the Laws.</li>\n<li>Decisions follow the Laws and the <b>spirit of the game</b>, based on the referee's <b>opinion</b> and discretion within the Laws.</li>\n<li>Competitions may use technology: the VAR protocol, goal line technology, and semi-automated offside technology (SAOT).</li>\n<li>Decisions on facts connected with play, including goals and the result, are <b>final</b> and must be respected.</li></ul>\n<div class=\"tbl\"><table><tr><th>A restart decision can't be changed after…</th></tr>\n<tr><td>play has <b>restarted</b></td></tr>\n<tr><td>the half is signalled over and the referee has left the field</td></tr>\n<tr><td>the match is abandoned</td></tr></table></div>\n<p class=\"note\">Exception: leaving the field at the end of a half to go to the RRA, or to call the players back, still allows a change for an incident before the end of the half.</p>\n<ul><li><b>Sanction after the restart</b> (except Law 12.4 and VAR): only if another official spotted it and tried to tell the referee before the restart; the related restart doesn't apply.</li>\n<li>If the referee is incapacitated, play may continue under the other officials until the ball is next out.</li></ul>"},"quiz":[{"ar":["اكتشف الحكم أن قرار ركلة المرمى كان خاطئًا بعد تنفيذها. هل يغيّره؟",["نعم","لا"],"(5.2)"],"en":["The referee realises a goal kick was wrong after it was taken. Change it?",["Yes","No"],"(5.2)"],"a":1,"lvl":"b"},{"ar":["على أي أساس يتخذ الحكم قراره؟",["رأيه وتقديره وفق القوانين وروح اللعبة","طلب القائد"],"(5.2)"],"en":["What are the referee's decisions based on?",["Opinion and discretion within the Laws and spirit","The captain's request"],"(5.2)"],"a":0,"lvl":"b"}]},{"id":"powers","title":{"ar":"الصلاحيات: الميزة والإجراء الانضباطي","en":"Powers: advantage and discipline"},"ref":"5.3","k":["ميزة","advantage","إنذار","caution","طرد","sending-off","بطاقة","card","مسؤول الفريق","team official","المخالفة الأخطر","more serious"],"body":{"ar":"<p><b>واجبات أساسية:</b> يطبق القوانين، ويدير المباراة مع الحكام الآخرين، ويحسب الوقت، ويسجل الأحداث، ويرفع التقرير، ويشرف على الاستئنافات.</p>\n<h3>الميزة</h3>\n<p>يترك اللعب يستمر إذا وقعت مخالفة (أو نُفذ استئناف خطأ والكرة في اللعب) وكان الفريق المتضرر سيستفيد. إذا <b>لم تتحقق الميزة</b> في حينها أو خلال <b>ثوانٍ قليلة</b>، يعاقب المخالفة الأصلية أو يأمر بالإعادة.</p>\n<h3>الإجراء الانضباطي</h3>\n<ul><li>عند <b>وقوع أكثر من مخالفة في وقت واحد</b>: يعاقب <b>الأخطر</b> من حيث العقوبة، والاستئناف، والشدة البدنية، والأثر التكتيكي.</li>\n<li>سلطته الانضباطية تبدأ من <b>دخول الملعب للمعاينة</b> قبل المباراة حتى <b>مغادرته</b> بعدها، ومنها ركلات الترجيح.</li>\n<li>لاعب ارتكب مخالفة طرد قبل دخول الملعب في بداية المباراة: يمنعه الحكم من المشاركة.</li>\n<li>البطاقات (وحيث تسمح اللوائح: الاستبعاد المؤقت) من دخول الملعب في البداية حتى نهاية المباراة، ومنها الاستراحة والوقت الإضافي والترجيح.</li>\n<li><b>مسؤولو الفريق:</b> تحذير، أو بطاقة صفراء، أو حمراء، في الملعب ومحيطه والمنطقة الفنية. إذا لم يُعرف المخالف: يُعاقب <b>المدرب الأعلى</b> الموجود. الطبيب المطرود يبقى إذا لم يكن هناك غيره.</li>\n<li>يأخذ برأي الحكام الآخرين فيما لم يره.</li></ul>","en":"<p><b>Core duties:</b> enforce the Laws, control the match with the other officials, keep time and records, send a report, and supervise restarts.</p>\n<h3>Advantage</h3>\n<p>Let play continue after an offence (or an incorrect restart with the ball in play) when the other team benefits. If the <b>advantage doesn't happen</b> then or within a <b>few seconds</b>, penalise the original offence or order a retake.</p>\n<h3>Disciplinary action</h3>\n<ul><li>When <b>several offences happen at once</b>: punish the <b>more serious</b> one in sanction, restart, physical severity and tactical impact.</li>\n<li>Disciplinary authority runs from <b>entering the field for the pre-match inspection</b> until <b>leaving it</b> after the match, including penalties.</li>\n<li>A player who commits a sending-off offence before entering at the start: the referee can stop them taking part.</li>\n<li>Cards (and temporary dismissals where permitted) from entering at the start until after the match, including half-time, extra time and penalties.</li>\n<li><b>Team officials:</b> warning, yellow or red in the field, its surrounds and the technical area. If the offender can't be identified, the <b>senior coach</b> present is sanctioned. A sent-off medical official may stay if no one else is available.</li>\n<li>Acts on other officials' advice for incidents not seen.</li></ul>"},"quiz":[{"ar":["طبّق الحكم الميزة لكنها لم تتحقق خلال ثوانٍ. ماذا يفعل؟",["يترك اللعب","يعاقب المخالفة الأصلية"],"(5.3)"],"en":["Advantage played but doesn't materialise within seconds. Action?",["Play on","Penalise the original offence"],"(5.3)"],"a":1,"lvl":"b"},{"ar":["مخالفة من المنطقة الفنية ولم يُعرف من ارتكبها. من يُعاقب؟",["القائد","المدرب الأعلى الموجود","لا أحد"],"(5.3)"],"en":["An offence from the technical area; offender unknown. Who is sanctioned?",["Captain","Senior coach present","No one"],"(5.3)"],"a":1,"lvl":"p"},{"ar":["متى تبدأ سلطة الحكم الانضباطية؟",["عند ركلة البداية","عند دخول الملعب للمعاينة قبل المباراة"],"(5.3)"],"en":["When does the referee's disciplinary authority start?",["At kick-off","On entering the field for the pre-match inspection"],"(5.3)"],"a":1,"lvl":"p"}]},{"id":"injuries","title":{"ar":"الإصابات","en":"Injuries"},"ref":"5.3","k":["إصابة","injury","علاج","treatment","نقالة","stretcher","دم","bleeding","دقيقة","one minute"],"body":{"ar":"<ul><li><b>إصابة خفيفة:</b> يستمر اللعب حتى تخرج الكرة.</li>\n<li><b>إصابة خطيرة:</b> يوقف اللعب ويُخرَج اللاعب. لا علاج داخل الملعب.</li>\n<li>إذا أوقفت الإصابة اللعب أو أخّرت الاستئناف: يخرج المصاب، ويعود بعد <b>دقيقة من الاستئناف</b> (وفق بروتوكول العلاج خارج الملعب)، من خط التماس إذا كانت الكرة في اللعب، ومن أي خط إذا كانت خارجه.</li></ul>\n<h3>استثناءات من الخروج للعلاج</h3>\n<ol><li>إصابة الحارس.</li><li>اصطدام الحارس بلاعب واحتاجا العناية.</li><li>اصطدام لاعبين من نفس الفريق.</li><li>إصابة بالغة.</li><li>إصابة بسبب مخالفة بدنية عوقب عليها المنافس بإنذار أو طرد.</li><li>المصاب هو منفذ ركلة جزاء محتسبة.</li></ol>\n<ul><li><b>النزيف:</b> يخرج اللاعب، ويعود بإشارة الحكم بعد توقف النزيف وخلوّ ملابسه من الدم.</li>\n<li>إذا دخل الأطباء أو النقالة بإذن الحكم: يخرج اللاعب على النقالة أو ماشيًا. من يرفض يُنذر (سلوك غير رياضي).</li>\n<li>إذا قرر الحكم إنذار أو طرد المصاب: يُظهر البطاقة <b>قبل</b> خروجه.</li>\n<li>إذا أُوقف اللعب للإصابة فقط، دون مخالفة: <b>كرة مسقطة</b>.</li></ul>","en":"<ul><li><b>Slight injury:</b> play on until the ball is out.</li>\n<li><b>Serious injury:</b> stop play and have the player removed. No treatment on the field.</li>\n<li>If the injury stopped or delayed play: the player leaves and may return <b>one minute after the restart</b> (per the off-field treatment protocol), from the touchline if the ball is in play, from any line if it's out.</li></ul>\n<h3>Exceptions to leaving for treatment</h3>\n<ol><li>A goalkeeper is injured.</li><li>Goalkeeper and outfield player collide and need attention.</li><li>Team-mates collide and need attention.</li><li>A severe injury.</li><li>Injury from a physical offence for which the opponent is cautioned or sent off.</li><li>The injured player is taking an awarded penalty.</li></ol>\n<ul><li><b>Bleeding:</b> the player leaves and returns on the referee's signal once it has stopped and no blood is on the kit.</li>\n<li>If doctors or stretcher-bearers enter with permission, the player leaves on the stretcher or on foot; refusing is a caution.</li>\n<li>If the injured player is to be cautioned or sent off, show the card <b>before</b> they leave.</li>\n<li>If play stopped only for the injury, with no offence: <b>dropped ball</b>.</li></ul>"},"quiz":[{"ar":["الحارس أصيب ودخل الطبيب لعلاجه. هل يجب أن يخرج الحارس؟",["نعم","لا"],"إصابة الحارس استثناء. (5.3)"],"en":["The goalkeeper is injured and treated. Must he leave the field?",["Yes","No"],"Goalkeeper injury is an exception. (5.3)"],"a":1,"lvl":"b"},{"ar":["أوقف الحكم اللعب لإصابة دون أي مخالفة. الاستئناف؟",["كرة مسقطة","ركلة حرة غير مباشرة"],"(5.3)"],"en":["Play stopped for an injury, no offence. Restart?",["Dropped ball","Indirect free kick"],"(5.3)"],"a":0,"lvl":"b"},{"ar":["قرر الحكم إنذار لاعب مصاب سيخرج للعلاج. متى يُظهر البطاقة؟",["قبل خروجه","عند عودته"],"(5.3)"],"en":["The referee will caution an injured player leaving for treatment. When is the card shown?",["Before he leaves","When he returns"],"(5.3)"],"a":0,"lvl":"p"}]},{"id":"outside","title":{"ar":"التدخل الخارجي","en":"Outside interference"},"ref":"5.3","k":["تدخل خارجي","outside interference","صافرة","whistle","جمهور","spectator","إضاءة","floodlights","حيوان","animal","كرة إضافية","extra ball"],"body":{"ar":"<div class=\"tbl\"><table><tr><th>الحالة</th><th>القرار</th></tr>\n<tr><td>إضاءة غير كافية</td><td>إيقاف أو تعليق أو إلغاء</td></tr>\n<tr><td>جسم ألقاه متفرج أصاب حكمًا أو لاعبًا أو مسؤولًا</td><td>حسب الخطورة: استمرار، أو إيقاف، أو تعليق، أو إلغاء</td></tr>\n<tr><td>متفرج أطلق صافرة أثّرت على اللعب</td><td>إيقاف ← <b>كرة مسقطة</b></td></tr>\n<tr><td>كرة إضافية أو جسم أو حيوان دخل الملعب <b>وتدخّل</b> في اللعب</td><td>إيقاف ← <b>كرة مسقطة</b></td></tr>\n<tr><td>نفس الحالة لكنه <b>لم يتدخل</b></td><td>يستمر اللعب، ويُزال في أول فرصة</td></tr></table></div>\n<div class=\"note\">كرة متجهة للمرمى، والتدخل لم يمنع مدافعًا من لعبها: <b>يُحتسب الهدف</b> إذا دخلت، حتى لو لُمست، ما لم يكن التدخل من الفريق المهاجم.</div>\n<p>ولا يسمح الحكم لأي شخص غير مخوّل بدخول الملعب.</p>","en":"<div class=\"tbl\"><table><tr><th>Situation</th><th>Decision</th></tr>\n<tr><td>Inadequate floodlights</td><td>Stop, suspend or abandon</td></tr>\n<tr><td>An object thrown by a spectator hits an official, player or team official</td><td>Depending on severity: continue, stop, suspend or abandon</td></tr>\n<tr><td>A spectator's whistle interferes with play</td><td>Stop → <b>dropped ball</b></td></tr>\n<tr><td>Extra ball, object or animal enters and <b>interferes</b></td><td>Stop → <b>dropped ball</b></td></tr>\n<tr><td>Same, but <b>no interference</b></td><td>Play on; remove it at the first opportunity</td></tr></table></div>\n<div class=\"note\">A ball going into the goal where the interference doesn't stop a defender playing it: <b>goal</b> if it goes in, even after contact, unless the interference was by the attacking team.</div>\n<p>No unauthorised persons may enter the field.</p>"},"quiz":[{"ar":["صافرة من المدرجات جعلت اللاعبين يتوقفون. الاستئناف؟",["كرة مسقطة","ركلة حرة غير مباشرة"],"(5.3)"],"en":["A whistle from the stands makes players stop. Restart?",["Dropped ball","Indirect free kick"],"(5.3)"],"a":0,"lvl":"b"},{"ar":["كرة ثانية دخلت الملعب بعيدًا عن اللعب ولم تؤثر. القرار؟",["إيقاف فوري","يستمر اللعب وتُزال لاحقًا"],"(5.3)"],"en":["A second ball rolls on far from play and doesn't interfere. Decision?",["Stop at once","Play on; remove later"],"(5.3)"],"a":1,"lvl":"p"}]},{"id":"var","title":{"ar":"حكم الفيديو المساعد","en":"Video assistant referee"},"ref":"5.4","k":["var","فيديو","video","خطأ واضح","clear and obvious","مراجعة","review","هوية","mistaken identity","ركنية خاطئة"],"body":{"ar":"<p>يُستخدم فقط إذا استوفى المنظم متطلبات دليل VAR وحصل على <b>إذن مكتوب من FIFA</b>.</p>\n<h3>يتدخل فقط في «خطأ واضح وجليّ» أو «حادثة خطيرة فائتة» في:</h3>\n<ol><li>هدف / لا هدف.</li><li>ركلة جزاء / لا ركلة جزاء.</li><li>بطاقة حمراء مباشرة (ومنها إنذار ثانٍ خاطئ بوضوح).</li><li>خطأ في هوية اللاعب المعاقَب.</li><li>ركلة ركنية محتسبة خطأً بوضوح، إذا أمكن تغييرها فورًا دون تأخير الاستئناف (<b>خيار للمسابقة</b>).</li></ol>\n<ul><li><b>القرار النهائي للحكم</b>: بناءً على معلومات حكم الفيديو، أو بمراجعة اللقطة بنفسه في الملعب.</li>\n<li>يجب أن يتخذ الحكم قرارًا دائمًا (ولو بعدم المعاقبة)، ولا يتغير إلا لخطأ واضح وجليّ، عدا «الحادثة الخطيرة الفائتة».</li>\n<li><b>بعد استئناف اللعب</b> لا مراجعة إلا لـ: خطأ الهوية، أو طرد محتمل بسبب سلوك مشين أو بصق أو عض أو تصرفات مسيئة جدًا.</li></ul>","en":"<p>Only where the organiser meets the VAR Handbook requirements and has <b>written permission from FIFA</b>.</p>\n<h3>Only for a ‘clear and obvious error’ or ‘serious missed incident’ in:</h3>\n<ol><li>Goal / no goal.</li><li>Penalty / no penalty.</li><li>Direct red card (including a clearly wrong second caution).</li><li>Mistaken identity.</li><li>A clearly wrongly awarded corner kick, if it can be changed at once without delaying the restart (<b>competition option</b>).</li></ol>\n<ul><li><b>The referee decides</b>, based on the VAR's information and/or an on-field review.</li>\n<li>The referee must always make a decision (even not to penalise); it changes only for a clear and obvious error, except a serious missed incident.</li>\n<li><b>After play restarts</b>, reviews only for mistaken identity or a possible sending-off for violent conduct, spitting, biting or extremely offensive actions.</li></ul>"},"quiz":[{"ar":["هل يراجع حكم الفيديو إنذارًا أول عاديًا؟",["نعم","لا"],"ليس من الحالات الأربع. (5.4)"],"en":["Does VAR review a normal first caution?",["Yes","No"],"Not a reviewable category. (5.4)"],"a":1,"lvl":"b"},{"ar":["بعد الاستئناف، أي حالة تجوز مراجعتها؟",["ركلة جزاء فائتة","عض لاعب لمنافس"],"(5.4)"],"en":["After the restart, which can still be reviewed?",["A missed penalty","A player biting an opponent"],"(5.4)"],"a":1,"lvl":"p"},{"ar":["من يتخذ القرار النهائي؟",["حكم الفيديو","الحكم"],"(5.4)"],"en":["Who makes the final decision?",["The VAR","The referee"],"(5.4)"],"a":1,"lvl":"b"}]},{"id":"equipment","title":{"ar":"معدات الحكم وإشاراته ومسؤوليته","en":"Equipment, signals and liability"},"ref":"5.5 · 5.6 · 5.7","fig":"signals","k":["صافرة","whistle","ساعة","watch","بطاقات","cards","إشارات","signals","كاميرا","body camera","مسؤولية","liability","عد تنازلي","countdown"],"body":{"ar":"<h3>معدات إلزامية</h3>\n<p>صافرة، وساعة، وبطاقتان حمراء وصفراء، ودفتر (أو وسيلة تسجيل).</p>\n<h3>معدات مسموحة</h3>\n<ul><li>أجهزة التواصل مع الحكام الآخرين (رايات بإشارة صوتية، سماعات).</li><li>أجهزة تتبع اللياقة (EPTS).</li>\n<li><b>كاميرا الجسم</b> إذا وفّرها المنظم وتحكّم في تسجيلاتها. ولا يُبث عبر ميكروفونها التواصل مع حكم الفيديو، ويجوز استخدام تسجيلاتها في المسائل الانضباطية.</li></ul>\n<p>أي جهاز إلكتروني آخر، ومنه الكاميرات، <b>ممنوع</b> على حكام الملعب.</p>\n<h3>الإشارات المعتمدة</h3>\n<p>الإشارات المرسومة في الكتاب: الركلة الحرة غير المباشرة والمباشرة، والميزة، والركلة الركنية، وركلة المرمى، والبطاقة الحمراء والصفراء، و«التحقق» (الإصبع على الأذن والذراع الأخرى ممدودة)، و«المراجعة» (إشارة الشاشة)، و<b>العد التنازلي لخمس ثوانٍ</b>. جرّبها في <b>مدرّب الإشارات</b> من الصفحة الرئيسية.</p>\n<h3>المسؤولية</h3>\n<p>لا يُحاسَب الحكام عن إصابة أو ضرر أو خسارة ناتجة عن قراراتهم وفق القوانين، مثل: صلاحية الملعب والطقس، أو إلغاء المباراة، أو ملاءمة المعدات والكرة، أو إيقاف اللعب لإخراج مصاب.</p>","en":"<h3>Compulsory equipment</h3>\n<p>Whistle, watch, red and yellow cards, notebook (or other record).</p>\n<h3>Permitted equipment</h3>\n<ul><li>Communication with other officials (beep flags, headsets).</li><li>EPTS or fitness monitoring.</li>\n<li><b>Body cameras</b> if supplied and controlled by the organiser; their microphones may not broadcast VAR communication; footage may be used for discipline.</li></ul>\n<p>Any other electronic equipment, including cameras, is <b>prohibited</b> for on-field officials.</p>\n<h3>Approved signals</h3>\n<p>The book's signal graphics: indirect and direct free kick, advantage, corner kick, goal kick, red and yellow card, 'check' (finger to ear, other arm extended), 'review' (TV signal) and the <b>five-second countdown</b>. Practise them in the <b>signals trainer</b> on the home page.</p>\n<h3>Liability</h3>\n<p>Officials aren't liable for injury, damage or loss resulting from decisions under the Laws, e.g. pitch or weather fitness, abandoning a match, suitability of equipment and ball, or stopping play to remove an injured player.</p>"},"quiz":[{"ar":["أي مما يلي ليس من معدات الحكم الإلزامية؟",["صافرة","ساعة","سماعة اتصال"],"السماعة مسموحة وليست إلزامية. (5.5)"],"en":["Which is not compulsory referee equipment?",["Whistle","Watch","Headset"],"A headset is permitted, not compulsory. (5.5)"],"a":2,"lvl":"b"},{"ar":["إشارة الركلة الحرة غير المباشرة؟",["الذراع مرفوعة لأعلى","الذراع تشير للأمام"],"(5.6)"],"en":["Indirect free kick signal?",["Arm raised above the head","Arm pointing forward"],"(5.6)"],"a":0,"lvl":"b"}]}],"cases":[{"id":"injury-leave","lvl":"b","ref":"5.3","a":1,"ar":{"s":"أوقفت اللعب لإصابة لاعب (ليس حارس المرمى) سقط وحده دون أي احتكاك، والإصابة ليست من الإصابات الخطرة، ودخل الطاقم الطبي لتقييم حالته. ما الإجراء الصحيح؟","o":["يُعالج داخل الملعب ويواصل اللعب","يغادر الملعب، ولا يعود إلا بعد دقيقة من استئناف اللعب، ثم كرة مسقطة","يغادر ويعود فور الاستئناف، والاستئناف ركلة حرة غير مباشرة"],"d":"يغادر اللاعب المصاب الملعب","r":"كرة مسقطة","x":"لا يوجد","w":"إذا أُوقف اللعب أو تأخر استئنافه بسبب إصابة، يغادر المصاب الملعب ولا يعود إلا بعد دقيقة من الاستئناف، مع استثناءات منها إصابة الحارس أو الإصابة الخطيرة أو الإصابة الناتجة عن مخالفة بدنية عوقب عليها المنافس بإنذار أو طرد. وما دامت الإصابة ليست نتيجة مخالفة فالاستئناف كرة مسقطة."},"en":{"s":"You stop play for an outfield player who went down alone with no contact; it is not a severe injury, and the medical staff come on to assess him. Correct procedure?","o":["Treated on the field and plays on","He leaves, returns only one minute after the restart; dropped ball","He leaves and returns at the restart; indirect free kick"],"d":"The injured player leaves the field","r":"Dropped ball","x":"None","w":"When an injury stops play or delays the restart, the player must leave and may return only one minute after play restarts, with exceptions such as an injured goalkeeper, a severe injury, or an injury from a physical offence for which the opponent is cautioned or sent off. As no offence caused it, restart with a dropped ball."}},{"id":"spectator-whistle","lvl":"b","ref":"5.3","a":0,"ar":{"s":"أثناء هجمة أطلق متفرج صفارة، فتوقف المدافعون ظنًا أنك أوقفت اللعب، وواصل المهاجم. ما قرارك؟","o":["إيقاف اللعب ثم كرة مسقطة","يستمر اللعب لأن الصفارة ليست صفارتك","ركلة حرة غير مباشرة للفريق المدافع"],"d":"إيقاف اللعب لأن الصفارة أثرت في اللعب","r":"كرة مسقطة","x":"لا يوجد","w":"إذا أطلق متفرج صفارة تداخلت مع اللعب، يُوقف الحكم اللعب ويُستأنف بكرة مسقطة. أما إذا لم تؤثر في اللعب فيمكن أن يستمر."},"en":{"s":"During an attack a spectator blows a whistle; the defenders stop, thinking you blew, while the forward plays on. Your call?","o":["Stop play, then a dropped ball","Play on — it wasn't your whistle","Indirect free kick to the defending team"],"d":"Stop play because the whistle interfered","r":"Dropped ball","x":"None","w":"If a spectator's whistle interferes with play, the referee stops play and restarts with a dropped ball. If it doesn't affect play, play may continue."}},{"id":"advantage-fails","lvl":"b","ref":"5.3","a":2,"ar":{"s":"قرب خط المنتصف عرقل مدافع مهاجمًا، فأشرت بالميزة لأن زميل المهاجم استلم الكرة، لكنه فقدها خلال ثانيتين ولم تتحقق أي ميزة. ما قرارك؟","o":["يستمر اللعب لأنك أعطيت الميزة","كرة مسقطة","العودة لاحتساب الركلة الحرة المباشرة من مكان العرقلة"],"d":"إيقاف اللعب ومعاقبة المخالفة الأصلية","r":"ركلة حرة مباشرة من مكان العرقلة","x":"حسب طبيعة العرقلة (قد يستوجب إنذارًا)","w":"يطبق الحكم الميزة إذا كانت في مصلحة الفريق المتضرر، ويعاقب على المخالفة الأصلية إذا لم تتحقق الميزة المتوقعة حينها أو خلال ثوانٍ قليلة. وتقدير تحقق الميزة يعود للحكم."},"en":{"s":"Near the halfway line a defender trips an attacker. You signal advantage as the attacker's teammate collects the ball, but he loses it within two seconds and no advantage has developed. Your call?","o":["Play on — advantage was given","Dropped ball","Come back for the direct free kick at the trip"],"d":"Stop play and penalise the original offence","r":"Direct free kick from where the trip occurred","x":"Depends on the trip (may be a caution)","w":"The referee plays advantage when it benefits the non-offending team, and penalises the original offence if the expected advantage doesn't follow at that time or within a few seconds. Whether it ensued is the referee's judgement."}},{"id":"late-caution-ar","lvl":"p","ref":"5.2","a":1,"ar":{"s":"أشار الحكم المساعد إلى تدخل متهور يستحق الإنذار، وحاول إبلاغك عبر السماعة، لكنك لم تسمعه واستُؤنف اللعب برمية تماس. أبلغك عند التوقف التالي. ما قرارك؟","o":["لا يمكن فعل شيء بعد الاستئناف","إنذار اللاعب الآن، دون احتساب الركلة الحرة الخاصة بتلك المخالفة","إنذار اللاعب واحتساب الركلة الحرة الأصلية"],"d":"إنذار اللاعب المخالف","r":"حسب سبب التوقف الحالي (لا تُحتسب ركلة المخالفة الأصلية)","x":"إنذار","w":"يجوز إصدار العقوبة الانضباطية بعد الاستئناف إذا كان أحد الحكام الآخرين قد رصد المخالفة وحاول إبلاغ الحكم قبل الاستئناف، لكن الاستئناف المرتبط بتلك المخالفة لا يُطبق. ولو لم يحاول أحد الإبلاغ قبل الاستئناف لما جاز ذلك (عدا ما يسمح به القانون 12.4 وبروتوكول الفيديو)."},"en":{"s":"The assistant referee flagged a reckless, cautionable challenge and tried to tell you on the headset, but you missed it and play restarted with a throw-in. He tells you at the next stoppage. Your call?","o":["Nothing can be done after the restart","Caution the player now, without the free kick for that offence","Caution and award the original free kick"],"d":"Caution the offending player","r":"As for the current stoppage (the original free kick is not given)","x":"Caution","w":"A sanction may be issued after a restart if another match official identified the offence and tried to communicate it before the restart, but the restart linked to that offence does not apply. Without that attempt it would not be possible (except under Law 12.4 and the VAR protocol)."}},{"id":"extra-ball-goal","lvl":"p","ref":"5.3","a":0,"ar":{"s":"سدد مهاجم كرة متجهة إلى المرمى، فدخلت كرة إضافية من المدرجات ولمست كرة المباراة قليلًا دون أن تمنع أي مدافع من لعبها، ثم دخلت كرة المباراة المرمى. ما قرارك؟","o":["يُحتسب الهدف","يُلغى الهدف وكرة مسقطة","يُلغى الهدف وركلة مرمى"],"d":"احتساب الهدف وإزالة الكرة الإضافية","r":"ركلة البداية","x":"لا يوجد","w":"إذا تداخلت كرة إضافية مع اللعب يُوقف اللعب ويُستأنف بكرة مسقطة، إلا إذا كانت الكرة متجهة إلى المرمى ولم يمنع التداخل مدافعًا من لعبها؛ فيُحتسب الهدف حتى لو حدث تلامس، ما لم يكن التداخل من الفريق المهاجم."},"en":{"s":"A shot is heading into goal when an extra ball from the stands rolls on and lightly touches the match ball without stopping any defender from playing it; the match ball goes in. Your call?","o":["Award the goal","Disallow; dropped ball","Disallow; goal kick"],"d":"Award the goal and remove the extra ball","r":"Kick-off","x":"None","w":"An extra ball that interferes with play normally means stopping for a dropped ball. The exception: if the ball is going into the goal and the interference doesn't stop a defender playing it, the goal counts when it goes in, even after contact, unless the attacking team caused the interference."}}],"myths":[{"id":"advantage-no-going-back","ref":"5.3","t":false,"ar":{"s":"بمجرد أن يطبّق الحكم الأفضلية، لا يمكنه العودة إلى المخالفة الأصلية.","w":"إذا لم تتحقق الأفضلية المتوقعة في حينها أو خلال ثوانٍ قليلة، يعود الحكم ويعاقب على المخالفة الأصلية."},"en":{"s":"Once the referee plays advantage, there's no going back to the original foul.","w":"If the expected advantage does not materialise at that moment or within a few seconds, the referee goes back and penalises the original offence."}},{"id":"no-cards-after-whistle","ref":"5.3","t":false,"ar":{"s":"بعد صافرة نهاية الشوط أو المباراة لا يستطيع الحكم إشهار البطاقات.","w":"للحكم صلاحية إشهار البطاقات الصفراء والحمراء من دخوله أرض الملعب في بداية المباراة حتى ما بعد نهايتها، بما في ذلك فترة ما بين الشوطين والوقت الإضافي وركلات الترجيح."},"en":{"s":"After the half-time or full-time whistle, the referee can't show cards any more.","w":"The referee can show yellow and red cards from entering the field at the start of the match until after it has ended, including the half-time interval, extra time and penalties (shoot-out)."}},{"id":"head-coach-takes-card","ref":"5.3","t":true,"ar":{"s":"إذا أساء أحد مسؤولي الفريق في المنطقة الفنية ولم يُعرف المخالف، يتلقى العقوبة المدرب الأعلى رتبة الموجود في المنطقة الفنية.","w":"صحيح: عندما يتعذّر تحديد المخالف من مسؤولي الفريق، تُوجَّه العقوبة إلى المدرب الأعلى رتبة الموجود في المنطقة الفنية."},"en":{"s":"If a team official misbehaves and the culprit can't be identified, the senior coach present in the technical area receives the sanction.","w":"True: when the offending team official cannot be identified, the sanction goes to the senior coach present in the technical area."}}]},"6":{"pages":{"ar":"ع ص 83–90 · EN p.85–90","en":"EN p.85–90 · AR p.83–90"},"parts":[{"id":"team","title":{"ar":"فريق التحكيم وأدواره","en":"The officiating team"},"ref":"6","fig":"crew","k":["حكام","officials","مساعد","assistant","رابع","fourth","فريق التحكيم","تقرير","report"],"body":{"ar":"<p>يجوز تعيين حكام آخرين يساعدون الحكم، و<b>القرار النهائي دائمًا للحكم</b>:</p>\n<div class=\"tbl\"><table><tr><th>الفئة</th><th>من يشملها</th></tr>\n<tr><td>حكام الملعب</td><td>الحكم، والحكمان المساعدان، والحكم الرابع، والحكمان المساعدان الإضافيان، والحكم المساعد الاحتياطي</td></tr>\n<tr><td>حكام الفيديو</td><td>حكم الفيديو المساعد (VAR)، ومساعد واحد على الأقل (AVAR)</td></tr></table></div>\n<ul><li>يعملون <b>تحت توجيه الحكم</b>. إذا تدخّل أحدهم بشكل غير لائق أو أساء التصرف، يعفيه الحكم ويرفع تقريرًا.</li>\n<li>يساعدون في المخالفات التي يرونها <b>أوضح من الحكم</b>، ويرفعون تقريرًا عن أي سوء سلوك خطير وقع بعيدًا عن نظر الحكم، ويُبلغون الحكم بذلك.</li>\n<li>يساعدون في فحص الملعب والكرات والمعدات، وتسجيل الوقت والأهداف والمخالفات.</li>\n<li><b>لوائح المسابقة</b> تحدد من يحل محل حكم لا يستطيع البدء أو الاستمرار، خاصة: من يحل محل الحكم نفسه (الرابع، أم المساعد الأول، أم المساعد الإضافي الأول).</li></ul>","en":"<p>Other officials may be appointed to assist the referee; <b>the final decision is always the referee's</b>:</p>\n<div class=\"tbl\"><table><tr><th>Group</th><th>Who</th></tr>\n<tr><td>On-field officials</td><td>Referee, two assistant referees, fourth official, two additional assistant referees, reserve assistant referee</td></tr>\n<tr><td>Video officials</td><td>Video assistant referee (VAR) and at least one assistant VAR (AVAR)</td></tr></table></div>\n<ul><li>They work <b>under the referee's direction</b>. For undue interference or improper conduct, the referee relieves them and reports it.</li>\n<li>They help with offences they see <b>more clearly than the referee</b>, report serious misconduct out of the referee's view, and tell the referee about any report.</li>\n<li>They help inspect the field, balls and equipment and keep records of time, goals and misconduct.</li>\n<li><b>Competition rules</b> state who replaces an official who can't start or continue, especially who takes over from the referee.</li></ul>"},"quiz":[{"ar":["من صاحب القرار النهائي؟",["الحكم المساعد","الحكم","حكم الفيديو"],"(6)"],"en":["Who makes the final decision?",["Assistant referee","Referee","VAR"],"(6)"],"a":1,"lvl":"b"},{"ar":["من يحدد من يحل محل الحكم إذا أصيب؟",["القانون مباشرة","لوائح المسابقة"],"(6)"],"en":["Who decides who replaces an injured referee?",["The Law directly","Competition rules"],"(6)"],"a":1,"lvl":"p"}]},{"id":"ar4th","title":{"ar":"الحكم المساعد والحكم الرابع","en":"Assistant referees and fourth official"},"ref":"6.1 · 6.2","k":["الحكم المساعد","assistant referee","راية","flag","الحكم الرابع","fourth official","الوقت بدل الضائع","additional time","9.15"],"body":{"ar":"<h3>الحكم المساعد يشير إلى:</h3>\n<ul><li>خروج <b>الكرة بكاملها</b> من الملعب، ولأي فريق الركنية أو ركلة المرمى أو رمية التماس.</li>\n<li>لاعب في موقف تسلل <b>يمكن معاقبته</b>.</li>\n<li>طلب تبديل.</li>\n<li>في ركلات الجزاء: تحرك الحارس عن خط المرمى قبل الركل، وهل عبرت الكرة الخط. وإذا وُجد مساعدون إضافيون، يقف المساعد على امتداد علامة الجزاء.</li></ul>\n<p>ويراقب إجراءات التبديل، و<b>يجوز له دخول الملعب</b> للمساعدة في ضبط مسافة 9.15 م.</p>\n<h3>الحكم الرابع يساعد في:</h3>\n<ul><li>الإشراف على التبديل، وفحص معدات اللاعبين والبدلاء.</li>\n<li>عودة اللاعب بعد إشارة الحكم أو موافقته.</li>\n<li>الإشراف على الكرات البديلة.</li>\n<li>إظهار <b>الحد الأدنى</b> للوقت الإضافي الذي ينوي الحكم احتسابه في نهاية كل شوط.</li>\n<li>إبلاغ الحكم بأي سلوك غير مسؤول من الموجودين في المنطقة الفنية.</li></ul>","en":"<h3>Assistant referees indicate:</h3>\n<ul><li>When the <b>whole ball</b> leaves the field, and which team gets the corner, goal kick or throw-in.</li>\n<li>When a player in an offside position <b>may be penalised</b>.</li>\n<li>A substitution request.</li>\n<li>At penalties: the goalkeeper leaving the line early and whether the ball crossed the line. With additional ARs, the AR stands level with the penalty mark.</li></ul>\n<p>They also monitor substitutions and <b>may enter the field</b> to help control the 9.15 m distance.</p>\n<h3>The fourth official helps with:</h3>\n<ul><li>Supervising substitutions and checking equipment.</li>\n<li>A player's re-entry after the referee's signal.</li>\n<li>Replacement balls.</li>\n<li>Showing the <b>minimum</b> additional time the referee intends to play at the end of each half.</li>\n<li>Reporting irresponsible behaviour in the technical area.</li></ul>"},"quiz":[{"ar":["هل يجوز للحكم المساعد دخول الملعب لضبط مسافة 9.15 م؟",["نعم","لا"],"(6.1)"],"en":["May an assistant referee enter the field to control the 9.15 m distance?",["Yes","No"],"(6.1)"],"a":0,"lvl":"p"},{"ar":["الوقت الذي يعلنه الحكم الرابع في نهاية الشوط هو…",["الوقت المحدد بالضبط","الحد الأدنى للوقت الإضافي"],"(6.2)"],"en":["The time shown by the fourth official is…",["The exact time","The minimum additional time"],"(6.2)"],"a":1,"lvl":"b"}]},{"id":"aar","title":{"ar":"المساعدون الإضافيون والاحتياطي","en":"Additional and reserve assistants"},"ref":"6.3 · 6.4","k":["مساعد إضافي","additional assistant","خط المرمى","goal line","احتياطي","reserve"],"body":{"ar":"<h3>الحكم المساعد الإضافي (خلف خط المرمى) قد يشير إلى:</h3>\n<ul><li>عبور <b>الكرة بكاملها</b> خط المرمى، ومنه دخول الهدف.</li>\n<li>لمن الركلة الركنية أو ركلة المرمى.</li>\n<li>في ركلات الجزاء: تحرك الحارس قبل الركل، وهل عبرت الكرة الخط.</li></ul>\n<h3>الحكم المساعد الاحتياطي</h3>\n<p>يحل محل المساعد أو الرابع أو المساعد الإضافي إذا لم يستطع الاستمرار، ويساعد الحكم مثل بقية حكام الملعب.</p>","en":"<h3>Additional assistant referees (behind the goal line) may indicate:</h3>\n<ul><li>When the <b>whole ball</b> crosses the goal line, including goals.</li>\n<li>Which team gets the corner or goal kick.</li>\n<li>At penalties: the goalkeeper moving early and whether the ball crossed the line.</li></ul>\n<h3>Reserve assistant referee</h3>\n<p>Replaces an assistant, fourth official or additional assistant who can't continue, and assists like the other on-field officials.</p>"},"quiz":[{"ar":["أين يقف الحكم المساعد الإضافي عادةً؟",["عند خط المنتصف","عند خط المرمى"],"(6.3)"],"en":["Where is the additional assistant referee usually positioned?",["Halfway line","Goal line"],"(6.3)"],"a":1,"lvl":"b"},{"ar":["من يحل محل الحكم الرابع إذا لم يستطع الاستمرار؟",["المساعد الاحتياطي","مدرب الفريق المضيف"],"(6.4)"],"en":["Who replaces a fourth official who can't continue?",["Reserve assistant referee","Home team coach"],"(6.4)"],"a":0,"lvl":"p"}]},{"id":"vmo","title":{"ar":"حكام الفيديو","en":"Video match officials"},"ref":"6.5","k":["حكم الفيديو","var","avar","مساعد حكم الفيديو","مراجعة","check","review"],"body":{"ar":"<p><b>حكم الفيديو المساعد (VAR)</b> يساعد الحكم بإعادة اللقطات، فقط في «خطأ واضح وجليّ» أو «حادثة خطيرة فائتة» في: هدف/لا هدف، ركلة جزاء/لا جزاء، بطاقة حمراء (ومنها إنذار ثانٍ خاطئ بوضوح)، أو خطأ في هوية اللاعب المعاقَب.</p>\n<h3>مساعد حكم الفيديو (AVAR) يساعد بشكل أساسي في:</h3>\n<ul><li>متابعة البث التلفزيوني أثناء انشغال حكم الفيديو بالتحقق أو المراجعة.</li>\n<li>تسجيل الحالات ومشكلات الاتصال أو التقنية.</li>\n<li>مساعدة حكم الفيديو في التواصل مع الحكم، مثل إبلاغه بـ«أوقف اللعب» أو «أخّر الاستئناف».</li>\n<li>تسجيل الوقت الضائع بسبب التحقق أو المراجعة.</li>\n<li>إبلاغ الجهات المعنية بالقرارات المتعلقة بالفيديو.</li></ul>","en":"<p>The <b>VAR</b> assists the referee using replays only for a ‘clear and obvious error’ or ‘serious missed incident’ in: goal/no goal, penalty/no penalty, red card (including a clearly wrong second caution), or mistaken identity.</p>\n<h3>The AVAR mainly helps by:</h3>\n<ul><li>Watching the TV feed while the VAR is busy with a check or review.</li>\n<li>Recording incidents and communication or technology problems.</li>\n<li>Helping the VAR communicate with the referee, e.g. ‘stop play’ or ‘delay the restart’.</li>\n<li>Recording time lost to checks and reviews.</li>\n<li>Communicating VAR decisions to relevant parties.</li></ul>"},"quiz":[{"ar":["من يسجل الوقت الضائع بسبب مراجعة الفيديو؟",["الحكم الرابع","مساعد حكم الفيديو (AVAR)"],"(6.5)"],"en":["Who records time lost to VAR reviews?",["Fourth official","AVAR"],"(6.5)"],"a":1,"lvl":"b"}]},{"id":"signals","title":{"ar":"إشارات الحكم المساعد","en":"Assistant referee signals"},"ref":"6.6","fig":"arflags","k":["إشارات المساعد","signals","راية","flag","تسلل","offside","رمية تماس","throw-in"],"body":{"ar":"<div class=\"tbl\"><table><tr><th>الحالة</th><th>الإشارة</th></tr>\n<tr><td>تبديل</td><td>رفع الراية أفقيًا بكلتا اليدين فوق الرأس</td></tr>\n<tr><td>رمية تماس</td><td>الراية بزاوية 45° في اتجاه الفريق المستحق</td></tr>\n<tr><td>ركلة مرمى</td><td>الراية أفقيًا نحو منطقة المرمى</td></tr>\n<tr><td>ركلة ركنية</td><td>الراية نحو قوس الركنية القريب</td></tr>\n<tr><td>تسلل</td><td>رفع الراية عموديًا، ثم خفضها بثلاث زوايا تحدد مكان المخالفة: <b>للأسفل</b> = الجانب القريب، <b>أفقيًا</b> = وسط الملعب، <b>للأعلى</b> = الجانب البعيد</td></tr>\n<tr><td>خطأ</td><td>هزّ الراية ثم الإشارة لاتجاه الركلة الحرة</td></tr></table></div>\n<p class=\"muted\">الوصف تقريبي للتعلم؛ الرسوم المعتمدة في كتاب القوانين (ص 88–90 بالإنجليزية).</p>","en":"<div class=\"tbl\"><table><tr><th>Situation</th><th>Signal</th></tr>\n<tr><td>Substitution</td><td>Flag held horizontally above the head with both hands</td></tr>\n<tr><td>Throw-in</td><td>Flag at 45° towards the team entitled to it</td></tr>\n<tr><td>Goal kick</td><td>Flag horizontal towards the goal area</td></tr>\n<tr><td>Corner kick</td><td>Flag towards the nearest corner arc</td></tr>\n<tr><td>Offside</td><td>Flag raised vertically, then lowered to one of three angles: <b>down</b> = near side, <b>horizontal</b> = middle, <b>up</b> = far side</td></tr>\n<tr><td>Foul</td><td>Wave the flag, then point in the free kick direction</td></tr></table></div>\n<p class=\"muted\">Descriptions are simplified for study; the approved graphics are in the Laws (EN pp.88–90).</p>"},"quiz":[{"ar":["رفع المساعد الراية للتسلل ثم وجّهها أفقيًا. أين المخالفة؟",["الجانب القريب","وسط الملعب","الجانب البعيد"],"(6.6)"],"en":["The AR signals offside then holds the flag horizontal. Where?",["Near side","Middle","Far side"],"(6.6)"],"a":1,"lvl":"b"},{"ar":["إشارة طلب التبديل؟",["الراية أفقيًا فوق الرأس بكلتا اليدين","هز الراية"],"(6.6)"],"en":["Signal for a substitution?",["Flag horizontal above the head, both hands","Waving the flag"],"(6.6)"],"a":0,"lvl":"b"}]}],"cases":[{"id":"ar-sees-strike","lvl":"b","ref":"6 · 5.3","a":1,"ar":{"s":"الكرة خارج الملعب لركلة مرمى، وخلف ظهرك ضرب لاعب منافسه بقوة. أبلغك الحكم المساعد بما رآه قبل الاستئناف. ما قرارك؟","o":["لا شيء، فأنت لم تر الحادثة","طرد اللاعب بناءً على إفادة المساعد، ثم ركلة المرمى","إنذار اللاعب، ثم ركلة حرة مباشرة"],"d":"طرد اللاعب (سلوك مشين)","r":"ركلة المرمى","x":"طرد","w":"يتصرف الحكم بناءً على إفادة الحكام الآخرين في الحوادث التي لم يرها، ويساعده الحكام الآخرون في الملعب عندما تكون رؤيتهم أوضح. ولأن الحادثة وقعت والكرة خارج اللعب، يبقى الاستئناف ركلة المرمى."},"en":{"s":"The ball is out for a goal kick when, behind your back, a player strikes an opponent hard. The assistant referee tells you before the restart. Your call?","o":["Nothing — you didn't see it","Send the player off on the AR's information, then the goal kick","Caution, then a direct free kick"],"d":"Send off the player (violent conduct)","r":"Goal kick","x":"Sending-off","w":"The referee acts on the advice of other match officials about incidents the referee did not see; on-field officials assist when they have a clearer view. As the ball was already out of play, the restart remains the goal kick."}},{"id":"added-time-board","lvl":"b","ref":"6.2","a":2,"ar":{"s":"رفع الحكم الرابع لوحة الوقت بدل الضائع 4 دقائق، ثم أُضيع وقت إضافي بسبب إصابة واحتفال طويل، فلعبت 6 دقائق. احتج المدرب. هل قرارك صحيح؟","o":["لا، يجب إنهاء الشوط عند 4 دقائق تمامًا","لا، الحكم الرابع هو من يقرر نهاية الشوط","نعم، اللوحة تبيّن الحد الأدنى فقط"],"d":"القرار صحيح ويُرفض الاحتجاج","r":"لا يوجد","x":"لا يوجد (ويمكن التعامل مع المدرب إذا تجاوز الاحتجاج المسؤول)","w":"يبيّن الحكم الرابع الحد الأدنى للوقت الإضافي الذي ينوي الحكم لعبه، والحكم هو ضابط الوقت فيمكنه زيادته إذا ضاع وقت آخر."},"en":{"s":"The fourth official shows 4 minutes of additional time; more time is then lost to an injury and a long celebration, so you play 6. The coach protests. Was your decision correct?","o":["No — the half must end at exactly 4","No — the fourth official decides when the half ends","Yes — the board shows only the minimum"],"d":"Correct; the protest is rejected","r":"None","x":"None (the coach may be dealt with if his protest becomes irresponsible)","w":"The fourth official indicates the minimum additional time the referee intends to play; the referee is the timekeeper and may extend it if more time is lost."}},{"id":"ar-ten-yards","lvl":"b","ref":"6.1","a":0,"ar":{"s":"عند ركلة حرة قرب خط التماس في جهة الحكم المساعد، يقف المدافعون أقرب من المسافة القانونية. دخل الحكم المساعد الملعب لإبعادهم. هل تصرفه صحيح؟","o":["نعم، يجوز له دخول الملعب للمساعدة في ضبط مسافة 9.15 م","لا، لا يدخل الملعب أبدًا","لا، هذا من مهام الحكم الرابع"],"d":"تصرف صحيح","r":"الركلة الحرة","x":"لا يوجد (حسب سلوك المدافعين)","w":"يجوز للحكم المساعد دخول الملعب للمساعدة في ضبط مسافة 9.15 م (10 ياردات)، ضمن مهامه في مساعدة الحكم."},"en":{"s":"At a free kick near the touchline on the assistant referee's side, defenders stand too close. The AR steps onto the field to move them back. Is that correct?","o":["Yes — he may enter to help control the 9.15 m distance","No — he must never enter the field","No — that's the fourth official's job"],"d":"Correct","r":"Free kick","x":"None (depends on the defenders' behaviour)","w":"The assistant referee may enter the field of play to help control the 9.15 m (10 yards) distance, as part of assisting the referee."}},{"id":"referee-down","lvl":"p","ref":"6 · 5.2","a":1,"ar":{"s":"أثناء هجمة سقط الحكم مصابًا ولا يستطيع المتابعة. ما الإجراء الصحيح؟","o":["إيقاف اللعب فورًا وإلغاء المباراة","يستمر اللعب تحت إشراف الحكام الآخرين حتى تخرج الكرة، ثم يحل محله من تحدده لوائح المسابقة","يتولى الحكم الرابع تلقائيًا في كل الأحوال"],"d":"يستمر اللعب حتى تخرج الكرة من اللعب","r":"حسب سبب خروج الكرة","x":"لا يوجد","w":"إذا عجز الحكم، يمكن أن يستمر اللعب تحت إشراف الحكام الآخرين حتى تخرج الكرة. ولوائح المسابقة هي التي تحدد بوضوح من يحل محله: الحكم الرابع أو الحكم المساعد الأول أو الحكم المساعد الإضافي الأول."},"en":{"s":"During an attack the referee goes down injured and can't continue. Correct procedure?","o":["Stop play at once and abandon the match","Play continues under the other officials until the ball is out; the replacement is whoever competition rules name","The fourth official always takes over automatically"],"d":"Play continues until the ball is out of play","r":"As for why the ball went out","x":"None","w":"If the referee is incapacitated, play may continue under the other match officials' supervision until the ball is next out. Competition rules must state who takes over: the fourth official, the senior assistant referee or the senior additional assistant referee."}},{"id":"var-first-caution","lvl":"p","ref":"6.5 · 5.4","a":2,"ar":{"s":"أنذرت لاعبًا لأول مرة في المباراة، ويرى حكم الفيديو المساعد في الإعادة أن الإنذار خاطئ بوضوح لأن اللاعب لم يلمس منافسه. هل يجوز لحكم الفيديو المساعد التدخل؟","o":["نعم، يوصي بمراجعة ميدانية لإلغاء الإنذار","نعم، فكل قرار انضباطي قابل للمراجعة","لا، الإنذار الأول (غير الثاني) خارج نطاق تدخل حكم الفيديو المساعد ما لم يكن خطأً في هوية اللاعب"],"d":"يبقى الإنذار، ولا تدخل من حكم الفيديو المساعد","r":"حسب القرار الأصلي","x":"إنذار (يبقى)","w":"يتدخل حكم الفيديو المساعد فقط في حالات الخطأ الواضح والظاهر أو الحادثة الخطيرة الفائتة المتعلقة بالهدف، وركلة الجزاء، والطرد (ومنه الإنذار الثاني الخاطئ بوضوح)، والخطأ في هوية اللاعب المعاقب. أما إنذار أول خاطئ للاعب الصحيح فلا يدخل في ذلك."},"en":{"s":"You caution a player for the first time; the VAR sees on replay that it was clearly wrong — no contact was made. May the VAR intervene?","o":["Yes — recommend an on-field review to cancel it","Yes — every disciplinary decision is reviewable","No — a first (not second) caution is outside VAR scope, unless it's mistaken identity"],"d":"The caution stands; no VAR intervention","r":"As per the original decision","x":"Caution (stands)","w":"The VAR assists only for a clear and obvious error or serious missed incident regarding goal/no goal, penalty/no penalty, red card (including a clearly incorrect second caution) and mistaken identity. A wrong first caution to the right player is not covered."}}],"myths":[{"id":"flag-decides-offside","ref":"6.1","t":false,"ar":{"s":"راية الحكم المساعد هي التي تقرر مخالفة التسلل.","w":"الحكم المساعد يشير فقط إلى أن لاعباً في موقف التسلل قد يُعاقب، أما القرار النهائي فيعود دائماً إلى الحكم."},"en":{"s":"The assistant referee's flag is what decides offside.","w":"The assistant only signals that a player in an offside position may be penalised; the final decision always belongs to the referee."}},{"id":"var-reviews-any-foul","ref":"6.5","t":false,"ar":{"s":"حكم الفيديو المساعد يستطيع التدخل في أي مخالفة يراها على الشاشة.","w":"يتدخل حكم الفيديو المساعد فقط عند خطأ واضح وجلي أو حالة جسيمة فائتة تتعلق بالهدف، أو ركلة الجزاء، أو الطرد (ومنه الإنذار الثاني الخاطئ بوضوح)، أو الخطأ في هوية اللاعب المعاقَب، وكذلك ركلة ركنية احتُسبت خطأً بوضوح إذا سمحت لوائح المسابقة بذلك وأمكن تصحيحها فوراً."},"en":{"s":"The VAR can step in on any foul it spots on the screen.","w":"The VAR only helps with a clear and obvious error or serious missed incident involving goal/no goal, penalty/no penalty, red cards (including a clearly wrong second caution) or mistaken identity, plus, where competition rules allow, a clearly wrongly awarded corner kick that can be corrected immediately."}},{"id":"ar-enters-field-distance","ref":"6.1","t":true,"ar":{"s":"يحق للحكم المساعد دخول أرض الملعب لضبط مسافة الجدار.","w":"صحيح: يجوز للحكم المساعد الدخول إلى أرض الملعب للمساعدة في فرض مسافة 9.15 م (10 ياردات)."},"en":{"s":"The assistant referee is allowed to run onto the pitch to push the wall back.","w":"True: the assistant referee may enter the field of play to help enforce the 9.15 m (10 yds) distance."}}]},"7":{"pages":{"ar":"ع ص 91–94 · EN p.93–94","en":"EN p.93–94 · AR p.91–94"},"parts":[{"id":"periods","title":{"ar":"الشوطان والاستراحة","en":"Periods and half-time"},"ref":"7.1 · 7.2","fig":"clock","k":["مدة","duration","45","شوط","half","استراحة","half-time","15 دقيقة","تقليص","reduce"],"body":{"ar":"<ul><li>المباراة <b>شوطان متساويان، كل منهما 45 دقيقة</b>.</li>\n<li>لا يجوز تقليص المدة إلا <b>باتفاق الحكم والفريقين قبل البداية</b>، ووفق لوائح المسابقة.</li>\n<li><b>الاستراحة بين الشوطين لا تتجاوز 15 دقيقة</b>. تحددها لوائح المسابقة، ولا تُغيَّر إلا بإذن الحكم.</li>\n<li>في الوقت الإضافي يُسمح بين شوطيه باستراحة قصيرة للشرب، لا تتجاوز <b>دقيقة واحدة</b>.</li></ul>","en":"<ul><li>A match is <b>two equal halves of 45 minutes</b>.</li>\n<li>It may be shortened only if <b>the referee and both teams agree before kick-off</b> and competition rules allow.</li>\n<li><b>Half-time may not exceed 15 minutes</b>; competition rules set it and only the referee may change it.</li>\n<li>At half-time of extra time a short drinks break of up to <b>one minute</b> is allowed.</li></ul>"},"quiz":[{"ar":["أقصى مدة للاستراحة بين الشوطين؟",["10 دقائق","15 دقيقة","20 دقيقة"],"(7.2)"],"en":["Maximum half-time interval?",["10 minutes","15 minutes","20 minutes"],"(7.2)"],"a":1,"lvl":"b"},{"ar":["أثناء الشوط الثاني اتفق القائدان مع الحكم على إنهاء المباراة مبكرًا. مسموح؟",["نعم","لا، الاتفاق يكون قبل البداية فقط"],"(7.1)"],"en":["During the second half the captains and referee agree to shorten the match. Allowed?",["Yes","No, only before kick-off"],"(7.1)"],"a":1,"lvl":"p"}]},{"id":"lost","title":{"ar":"تعويض الوقت الضائع","en":"Allowance for time lost"},"ref":"7.3","k":["وقت ضائع","time lost","وقت بدل ضائع","additional time","تبديل","احتفال","celebration","تبريد","cooling","شرب","drinks"],"body":{"ar":"<p>يعوّض الحكم في كل شوط <b>كل الوقت الضائع</b> في ذلك الشوط بسبب:</p>\n<div class=\"tbl\"><table><tr><th>السبب</th><th>ملاحظة</th></tr>\n<tr><td>التبديلات</td><td></td></tr>\n<tr><td>تقييم المصابين وإخراجهم</td><td></td></tr>\n<tr><td>إضاعة الوقت</td><td></td></tr>\n<tr><td>العقوبات الانضباطية</td><td></td></tr>\n<tr><td>التوقفات الطبية التي تسمح بها اللوائح</td><td>استراحة الشرب ≤ <span class=\"num\">1</span> دقيقة · استراحة التبريد <span class=\"num\">90 ث – 3 د</span></td></tr>\n<tr><td>التحقق والمراجعة بالفيديو</td><td></td></tr>\n<tr><td>الاحتفال بالأهداف</td><td></td></tr>\n<tr><td>أي سبب آخر</td><td>مثل تأخير كبير للاستئناف بسبب عنصر خارجي</td></tr></table></div>\n<ul><li>يعلن الحكم الرابع <b>الحد الأدنى</b> للوقت الإضافي في نهاية الدقيقة الأخيرة من الشوط. ويجوز للحكم <b>زيادته لا إنقاصه</b>.</li>\n<li>لا يعوّض الحكم خطأ في حساب الوقت في الشوط الأول بتغيير مدة الشوط الثاني.</li></ul>","en":"<p>In each half the referee adds <b>all playing time lost</b> in that half through:</p>\n<div class=\"tbl\"><table><tr><th>Cause</th><th>Note</th></tr>\n<tr><td>Substitutions</td><td></td></tr>\n<tr><td>Assessing and removing injured players</td><td></td></tr>\n<tr><td>Wasting time</td><td></td></tr>\n<tr><td>Disciplinary sanctions</td><td></td></tr>\n<tr><td>Medical stoppages allowed by competition rules</td><td>Drinks break ≤ <span class=\"num\">1</span> min · cooling break <span class=\"num\">90 s – 3 min</span></td></tr>\n<tr><td>VAR checks and reviews</td><td></td></tr>\n<tr><td>Goal celebrations</td><td></td></tr>\n<tr><td>Any other cause</td><td>e.g. a significant restart delay from an outside agent</td></tr></table></div>\n<ul><li>The fourth official shows the <b>minimum</b> additional time at the end of the last minute of the half. The referee may <b>increase but not reduce</b> it.</li>\n<li>A timekeeping error in the first half is not corrected by changing the second half.</li></ul>"},"quiz":[{"ar":["أُعلن 4 دقائق وقتًا إضافيًا. هل يجوز للحكم إنهاء الشوط بعد 3 دقائق؟",["نعم","لا، يجوز الزيادة لا الإنقاص"],"(7.3)"],"en":["4 minutes were shown. May the referee end the half after 3?",["Yes","No — increase only, never reduce"],"(7.3)"],"a":1,"lvl":"b"},{"ar":["هل يُحتسب وقت الاحتفال بالهدف ضمن الوقت الضائع؟",["نعم","لا"],"(7.3)"],"en":["Is time spent celebrating a goal added on?",["Yes","No"],"(7.3)"],"a":0,"lvl":"b"},{"ar":["أخطأ الحكم فأنهى الشوط الأول قبل وقته بدقيقتين. هل يضيفهما للشوط الثاني؟",["نعم","لا"],"(7.3)"],"en":["The referee ended the first half two minutes early by mistake. Add them to the second half?",["Yes","No"],"(7.3)"],"a":1,"lvl":"p"}]},{"id":"pk-abandon","title":{"ar":"ركلة الجزاء آخر الشوط، والمباراة الملغاة","en":"Penalty at the end of a half; abandoned match"},"ref":"7.4 · 7.5","k":["ركلة جزاء نهاية الشوط","penalty end of half","ملغاة","abandoned","إعادة المباراة","replay"],"body":{"ar":"<ul><li>إذا وجب تنفيذ ركلة جزاء أو إعادتها، <b>يُمدَّد الشوط</b> حتى تكتمل الركلة، ولو انتهى الوقت.</li>\n<li><b>المباراة الملغاة تُعاد</b>، إلا إذا قررت لوائح المسابقة أو منظموها غير ذلك.</li></ul>","en":"<ul><li>If a penalty kick must be taken or retaken, the <b>half is extended</b> until it is completed, even after time is up.</li>\n<li>An <b>abandoned match is replayed</b> unless the competition rules or organisers decide otherwise.</li></ul>"},"quiz":[{"ar":["احتُسبت ركلة جزاء في آخر ثانية من الشوط. القرار؟",["ينتهي الشوط","يُمدَّد الشوط حتى تُنفذ"],"(7.4)"],"en":["A penalty is awarded in the last second of the half. Decision?",["Half ends","Half extended until it is taken"],"(7.4)"],"a":1,"lvl":"b"}]}],"cases":[{"id":"added-time-reduce","lvl":"b","ref":"7.3","a":2,"ar":{"s":"أظهر الحكم الرابع ثلاث دقائق وقتًا بدل ضائع، ولم يحدث أي توقف خلالها. بعد دقيقتين يرغب الحكم في إنهاء الشوط لأن الفريقين يلعبان دون جدية. ما قرارك؟","o":["يُنهي الشوط، فالوقت المعلن تقديري","يُنهيه بعد دقيقتين ونصف كحل وسط","لا يُنهيه قبل انقضاء الدقائق الثلاث كاملة"],"d":"يستمر اللعب حتى تنقضي الدقائق الثلاث على الأقل","r":"لا يوجد","x":"لا يوجد","w":"ما يعلنه الحكم الرابع هو الحد الأدنى من الوقت بدل الضائع. يجوز للحكم زيادته، ولا يجوز له تقليصه."},"en":{"s":"The fourth official shows three minutes of additional time and there are no stoppages in it. After two minutes the referee wants to end the half because neither team is really playing. Your call?","o":["End the half: the figure shown is only a guide","End it after two and a half minutes as a compromise","Don't end it before the full three minutes have been played"],"d":"Play continues until at least the three minutes have elapsed","r":"None","x":"None","w":"The figure shown by the fourth official is the minimum additional time. The referee may increase it but may not reduce it."}},{"id":"penalty-time-up","lvl":"b","ref":"7.4","a":0,"ar":{"s":"في الثواني الأخيرة من الشوط الثاني احتسب الحكم ركلة جزاء، وانتهى الوقت قبل تنفيذها. ما قرارك؟","o":["يُمدَّد الشوط حتى تُنفَّذ ركلة الجزاء وتكتمل","تنتهي المباراة لأن الوقت انقضى","تُنفَّذ ركلة الجزاء فقط إذا وافق الفريق المدافع"],"d":"تمديد الشوط لتنفيذ ركلة الجزاء","r":"ركلة جزاء","x":"لا يوجد","w":"إذا وجب تنفيذ ركلة جزاء أو إعادتها، يُمدَّد الشوط حتى تكتمل الركلة، ولو كان الوقت قد انتهى."},"en":{"s":"In the final seconds of the second half the referee awards a penalty kick, and time runs out before it is taken. Your call?","o":["Extend the half until the penalty is taken and completed","End the match because time is up","Take it only if the defending team agrees"],"d":"Extend the half for the penalty kick","r":"Penalty kick","x":"None","w":"If a penalty kick has to be taken or retaken, the half is extended until the kick is completed, even if time has expired."}},{"id":"abandoned-replay","lvl":"b","ref":"7.5","a":1,"ar":{"s":"أُوقفت مباراة نهائيًا في الدقيقة 70 بسبب عاصفة رعدية، والنتيجة 2-0. ماذا يحدث للمباراة؟","o":["تُعتمد النتيجة 2-0 لأن معظم الوقت قد لُعب","تُعاد المباراة، ما لم تنص لوائح المنافسة أو منظموها على غير ذلك","تُستكمل الدقائق العشرون المتبقية في اليوم التالي دائمًا"],"d":"المباراة ملغاة، ويُرفع تقرير بذلك","r":"لا يوجد","x":"لا يوجد","w":"القاعدة العامة أن المباراة الملغاة تُعاد، إلا إذا قررت لوائح المنافسة أو منظموها خلاف ذلك. والحكم لا يقرر اعتماد النتيجة أو استكمال الوقت المتبقي بنفسه."},"en":{"s":"A match is abandoned in the 70th minute because of a thunderstorm, with the score at 2-0. What happens to the match?","o":["The 2-0 result stands because most of the time was played","The match is replayed, unless the competition rules or organisers decide otherwise","The remaining 20 minutes are always completed the next day"],"d":"Match abandoned; report it","r":"None","x":"None","w":"The general rule is that an abandoned match is replayed, unless the competition rules or organisers determine otherwise. The referee does not decide on their own to confirm the result or complete the remaining time."}},{"id":"first-half-timing-error","lvl":"p","ref":"7.3","a":1,"ar":{"s":"في الاستراحة اكتشف الحكم أنه أنهى الشوط الأول قبل وقته بثلاث دقائق بسبب خطأ في التوقيت. ما الإجراء الصحيح؟","o":["يُضيف ثلاث دقائق إلى الشوط الثاني لتعويض الخطأ","يُلعب الشوط الثاني بمدته العادية مع تعويض الوقت الضائع فيه فقط","يُقلّص الشوط الثاني ثلاث دقائق لتحقيق العدالة"],"d":"لا تُعدَّل مدة الشوط الثاني","r":"ركلة البداية لبدء الشوط الثاني","x":"لا يوجد","w":"لا يجوز للحكم تعويض خطأ في ضبط الوقت خلال الشوط الأول بتغيير مدة الشوط الثاني. والوقت بدل الضائع في كل شوط يُحسب مما ضاع في ذلك الشوط نفسه. أما التبعات الإدارية للخطأ فتعود إلى الجهات المختصة."},"en":{"s":"At half-time the referee realises they ended the first half three minutes early because of a timekeeping error. What is the correct procedure?","o":["Add three minutes to the second half to make up for it","Play a normal second half, adding only the time lost in that half","Shorten the second half by three minutes to be fair"],"d":"The length of the second half is not changed","r":"Kick-off to start the second half","x":"None","w":"The referee must not compensate for a first-half timekeeping error by changing the length of the second half. Additional time in each half covers only time lost in that half. Any administrative consequences are for the competition

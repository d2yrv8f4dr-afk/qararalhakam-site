 on a goal kick can give the other team a corner kick.","w":"If a team deliberately delays a goal kick, the referee runs a five-second countdown; if the kick is not taken in time, the opponents get a corner kick on the side nearest where the goal kick was to be taken."}}]},"17":{"pages":{"ar":"ع ص 143–144 · EN p.149–150","en":"EN p.149–150 · AR p.143–144"},"parts":[{"id":"procedure","title":{"ar":"متى وكيف تُنفذ الركلة الركنية","en":"When and how a corner kick is taken"},"ref":"17 · 17.1","fig":"corner","k":["ركلة ركنية","corner kick","منطقة الركنية","corner area","قوس الركنية","corner arc","راية الركنية","corner flagpost","9.15","ثماني ثوان","eight seconds"],"body":{"ar":"<p>تُمنح الركلة الركنية عندما تتجاوز الكرة <b>بكاملها</b> خط المرمى، على الأرض أو في الهواء، وكان آخر من لمسها <b>لاعبًا مدافعًا</b>، ولم يُحرز هدف. وتُمنح أيضًا عند معاقبة:</p>\n<ul><li>الحارس على الإمساك بالكرة بيده أو ذراعه <b>أكثر من ثماني ثوانٍ</b>.</li><li>لاعب على <b>تأخير ركلة المرمى</b> لفريقه (العد التنازلي، القانون 16).</li></ul>\n<p>يجوز التسجيل منها مباشرة، لكن <b>في مرمى المنافس فقط</b>. وإذا دخلت مرمى المنفذ مباشرة: ركلة ركنية للمنافس.</p>\n<h3>الإجراءات</h3>\n<ul><li>توضع الكرة داخل <b>منطقة الركنية الأقرب</b> إلى نقطة خروجها، أو إلى موقع الحارس عند معاقبته.</li>\n<li>الكرة <b>ثابتة</b>، ويركلها لاعب من الفريق المهاجم.</li>\n<li>تصبح في اللعب عندما <b>تُركل وتتحرك بوضوح</b>، ولا يلزم أن تخرج من منطقة الركنية.</li>\n<li><b>لا تُحرَّك</b> راية الركنية.</li>\n<li>يبقى المنافسون على بعد <b>9.15 م</b> على الأقل <b>من قوس الركنية</b> حتى تصبح الكرة في اللعب.</li></ul>","en":"<p>A corner kick is awarded when the <b>whole</b> ball crosses the goal line, on the ground or in the air, last touched by a <b>defender</b>, and no goal is scored. It is also awarded when the referee penalises:</p>\n<ul><li>the goalkeeper for controlling the ball with hand/arm for <b>more than eight seconds</b>;</li><li>a player for <b>delaying a goal kick</b> for their team (Law 16 countdown).</li></ul>\n<p>A goal may be scored directly, but <b>only against the opponents</b>; straight into the kicker's own goal gives a corner to the opponents.</p>\n<h3>Procedure</h3>\n<ul><li>The ball is placed in the <b>nearest corner area</b> to where it went out, or to the goalkeeper's position when penalised.</li>\n<li><b>Stationary</b>, kicked by an attacker.</li>\n<li>In play when <b>kicked and it clearly moves</b>; it need not leave the corner area.</li>\n<li>The corner flagpost <b>must not be moved</b>.</li>\n<li>Opponents at least <b>9.15 m from the corner arc</b> until the ball is in play.</li></ul>"},"quiz":[{"ar":["تُقاس مسافة 9.15 م في الركنية من:",["راية الركنية","قوس الركنية","الكرة"],"(17.1)"],"en":["The 9.15 m at a corner is measured from:",["The flagpost","The corner arc","The ball"],"(17.1)"],"a":1,"lvl":"b"},{"ar":["أمسك الحارس الكرة بيديه أكثر من ثماني ثوانٍ. القرار؟",["ركلة حرة غير مباشرة","ركلة ركنية للمنافس","إنذار فقط"],"(17) وانظر القانون 12."],"en":["The goalkeeper holds the ball for more than eight seconds. Decision?",["Indirect free kick","Corner kick to the opponents","Caution only"],"(17) See also Law 12."],"a":1,"lvl":"p"},{"ar":["المنفذ أزاح راية الركنية ليسهل الركل. ما الصحيح؟",["مسموح","لا يجوز تحريك الراية"],"(17.1)"],"en":["The kicker moves the flagpost to help the kick. Correct?",["Allowed","The flagpost must not be moved"],"(17.1)"],"a":1,"lvl":"b"},{"ar":["هل يجب أن تخرج الكرة من منطقة الركنية لتصبح في اللعب؟",["نعم","لا، يكفي أن تُركل وتتحرك بوضوح"],"(17.1)"],"en":["Must the ball leave the corner area to be in play?",["Yes","No — kicked and clearly moves"],"(17.1)"],"a":1,"lvl":"b"}]},{"id":"offences","title":{"ar":"المخالفات والعقوبات","en":"Offences and sanctions"},"ref":"17 · 17.2","k":["لمس مرتين","second touch","لمس الكرة باليد","handball","إعادة","retake","ركل الكرة على منافس","kick at an opponent"],"body":{"ar":"<ul><li><b>لمس ثانٍ</b> من المنفذ قبل أن تلمس الكرة لاعبًا آخر: <b>ركلة حرة غير مباشرة</b>.</li>\n<li><b>لمس الكرة باليد</b> من المنفذ: <b>ركلة حرة مباشرة</b>، أو <b>ركلة جزاء</b> داخل منطقة جزائه. أما إذا كان المنفذ هو الحارس: <b>ركلة حرة غير مباشرة</b>.</li>\n<li>أي مخالفة أخرى: <b>تُعاد الركلة</b>.</li></ul>\n<div class=\"note judge\"><b>تقدير الحكم:</b> إذا ركل المنفذ الكرة عمدًا على منافس ليلعبها مجددًا، دون تهور أو استخدام قوة مفرطة ودون إهمال، يستمر اللعب.</div>\n<div class=\"note\"><b>تنبيه تعليمي:</b> المسافة والتشتيت عند الركنية تخضع أيضًا لقواعد سوء السلوك العامة في القانون 12 (عدم احترام المسافة = إنذار).</div>","en":"<ul><li><b>Second touch</b> by the kicker before another player touches it: <b>indirect free kick</b>.</li>\n<li><b>Handball</b> by the kicker: <b>direct free kick</b>, or a <b>penalty</b> in their own penalty area — but an <b>indirect free kick</b> if the kicker was the goalkeeper.</li>\n<li>Any other offence: <b>retake</b>.</li></ul>\n<div class=\"note judge\"><b>Referee judgement:</b> deliberately kicking the ball at an opponent to play it again, without carelessness, recklessness or excessive force — play continues.</div>\n<div class=\"note\"><b>Study note:</b> failing to respect the distance at a corner is also covered by the general misconduct rules in Law 12 (caution).</div>"},"quiz":[{"ar":["نفّذ المهاجم الركنية بلمسة قصيرة ثم لعبها ثانية قبل أن يلمسها أحد. القرار؟",["ركلة حرة غير مباشرة","إعادة الركلة","يستمر اللعب"],"(17.2)"],"en":["The kicker taps the corner and plays it again before anyone touches it. Decision?",["Indirect free kick","Retake","Play on"],"(17.2)"],"a":0,"lvl":"b"},{"ar":["ركل المنفذ الكرة عمدًا في ساق مدافع قريب، دون قوة مفرطة، ليلعبها مجددًا. القرار؟",["يستمر اللعب","ركلة حرة غير مباشرة","إعادة الركلة"],"(17.2)"],"en":["The kicker deliberately plays it off a nearby defender's leg, without excessive force, to play it again. Decision?",["Play on","Indirect free kick","Retake"],"(17.2)"],"a":0,"lvl":"p"},{"ar":["وُضعت الكرة خارج منطقة الركنية ونُفذت. القرار؟",["يستمر اللعب","تُعاد الركلة","ركلة مرمى"],"(17.2) أي مخالفة أخرى = إعادة."],"en":["The ball was placed outside the corner area and kicked. Decision?",["Play on","Retake","Goal kick"],"(17.2) Any other offence = retake."],"a":1,"lvl":"b"}]}],"cases":[{"id":"ck-short-tap","lvl":"b","ref":"17.1","a":1,"ar":{"s":"لمس منفذ الركلة الركنية الكرة لمسة خفيفة فتحركت بوضوح لكنها بقيت داخل منطقة الركنية، ثم جاء زميله وراوغ بها. ما قرارك؟","o":["تُعاد الركلة لأن الكرة لم تغادر منطقة الركنية","يستمر اللعب","ركلة حرة غير مباشرة للمدافعين"],"d":"يستمر اللعب","r":"لا يوجد","x":"لا يوجد","w":"تصبح الكرة في اللعب في الركلة الركنية عندما تُركل وتتحرك بوضوح، ولا يلزم أن تغادر منطقة الركنية. ولمس الزميل لها بعد ذلك صحيح."},"en":{"s":"The corner taker touches the ball lightly; it clearly moves but stays in the corner area, then a team-mate comes and dribbles it. Your call?","o":["Retake — the ball didn't leave the corner area","Play on","Indirect free kick to the defenders"],"d":"Play on","r":"None","x":"None","w":"At a corner the ball is in play once it is kicked and clearly moves; it need not leave the corner area. The team-mate playing it next is legal."}},{"id":"ck-direct-goal","lvl":"b","ref":"17","a":0,"ar":{"s":"نُفذت ركلة ركنية مقوّسة فدخلت الكرة مرمى المنافس مباشرة دون أن يلمسها أي لاعب. ما قرارك؟","o":["هدف","ركلة مرمى","تُعاد الركلة الركنية"],"d":"يُحتسب الهدف","r":"ركلة البداية","x":"لا يوجد","w":"يجوز إحراز هدف مباشرة من الركلة الركنية في مرمى المنافس. أما إذا دخلت الكرة مرمى فريق المنفذ مباشرة فتُحتسب ركلة ركنية للمنافس."},"en":{"s":"An in-swinging corner goes directly into the opponents' goal without touching any player. Your call?","o":["Goal","Goal kick","Retake the corner"],"d":"Goal","r":"Kick-off","x":"None","w":"A goal may be scored directly from a corner kick against the opponents. If it went directly into the kicker's own goal, a corner kick would be awarded to the opponents."}},{"id":"ck-flagpost","lvl":"b","ref":"17.1 · 17.2","a":2,"ar":{"s":"قبل تنفيذ الركلة الركنية أمال المنفذ الراية الركنية بيده ليسهل الركل، ثم نفّذ الركلة. ما قرارك؟","o":["يستمر اللعب لأن الراية لم تُنزع","ركلة مرمى للفريق المدافع","تُعاد الركلة الركنية بعد إعادة الراية إلى وضعها"],"d":"إعادة الراية إلى مكانها","r":"إعادة الركلة الركنية","x":"لا يوجد","w":"يجب عدم تحريك الراية الركنية. وهذه مخالفة لإجراءات الركلة لم يُحدد لها القانون 17 عقوبة خاصة، فتندرج تحت \"أي مخالفة أخرى\" ويُعاد تنفيذ الركلة."},"en":{"s":"Before taking a corner the kicker bends the corner flagpost aside with his hand to make the kick easier, then takes it. Your call?","o":["Play on — the flag wasn't removed","Goal kick to the defending team","Retake the corner once the flagpost is restored"],"d":"Restore the flagpost","r":"Corner kick retaken","x":"None","w":"The corner flagpost must not be moved. Law 17 gives no specific sanction for this procedural breach, so it falls under 'any other offence' and the kick is retaken."}},{"id":"ck-double-touch","lvl":"p","ref":"17.2","a":0,"ar":{"s":"لمس المنفذ الكرة في الركلة الركنية فتحركت بوضوح، ثم انطلق بها هو نفسه قبل أن يلمسها أي لاعب آخر، ظنًا منه أنها لم تصبح في اللعب بعد. ما قرارك؟","o":["ركلة حرة غير مباشرة للفريق المدافع","تُعاد الركلة الركنية","يستمر اللعب"],"d":"إيقاف اللعب","r":"ركلة حرة غير مباشرة للفريق المدافع من موضع اللمسة الثانية","x":"لا يوجد","w":"بمجرد أن تُركل الكرة وتتحرك بوضوح تصبح في اللعب حتى لو بقيت في منطقة الركنية. ولمسها مجددًا من المنفذ قبل أن تلمس لاعبًا آخر يُعاقب بركلة حرة غير مباشرة، لا بإعادة الركلة."},"en":{"s":"The corner taker touches the ball, which clearly moves, then dribbles it himself before anyone else touches it, thinking it wasn't yet in play. Your call?","o":["Indirect free kick to the defending team","Retake the corner","Play on"],"d":"Stop play","r":"Indirect free kick to the defenders where the second touch occurred","x":"None","w":"Once kicked and clearly moving the ball is in play, even inside the corner area. The kicker touching it again before another player is penalised with an indirect free kick, not a retake."}},{"id":"ck-gk-eight-seconds","lvl":"p","ref":"17 · 17.1","a":1,"ar":{"s":"أمسك الحارس الكرة بيديه داخل منطقة جزائه، قريبًا من القائم الأيمن، أكثر من ثماني ثوانٍ، فعاقبه الحكم. ما قرارك؟","o":["ركلة حرة غير مباشرة للمنافس من موضع الحارس","ركلة ركنية للمنافس من منطقة الركنية الأقرب إلى موضع الحارس","ركلة ركنية للمنافس من أي جهة يختارها"],"d":"إيقاف اللعب ومعاقبة الحارس","r":"ركلة ركنية من منطقة الركنية الأقرب إلى موضع الحارس","x":"لا يوجد","w":"سيطرة الحارس على الكرة بيديه أكثر من ثماني ثوانٍ تُعاقب بركلة ركنية للمنافس، لا بركلة حرة غير مباشرة. وتوضع الكرة في منطقة الركنية الأقرب إلى موضع الحارس عند معاقبته."},"en":{"s":"The goalkeeper holds the ball in his hands inside his penalty area, near the right-hand post, for more than eight seconds and the referee penalises him. Your call?","o":["Indirect free kick to the opponents from the keeper's position","Corner kick to the opponents from the corner area nearest the keeper","Corner kick from whichever side the attackers choose"],"d":"Stop play and penalise the goalkeeper","r":"Corner kick from the corner area nearest the goalkeeper's position","x":"None","w":"A goalkeeper controlling the ball with hands for more than eight seconds is penalised with a corner kick to the opponents, not an indirect free kick. The ball is placed in the corner area nearest the keeper's position when penalised."}}],"myths":[{"id":"corner-must-leave-arc","ref":"17.1","t":false,"ar":{"s":"لا تصبح الكرة في اللعب في الركلة الركنية إلا بعد خروجها من منطقة الركنية.","w":"تصبح الكرة في اللعب بمجرد ركلها وتحركها بوضوح، ولا يلزم أن تغادر منطقة الركنية."},"en":{"s":"On a corner kick the ball is not in play until it leaves the corner arc.","w":"The ball is in play once it is kicked and clearly moves; it does not have to leave the corner area."}},{"id":"corner-no-direct-goal","ref":"17.1","t":false,"ar":{"s":"لا يمكن تسجيل هدف مباشرة من ركلة ركنية.","w":"يُحتسب الهدف المسجل مباشرة من الركلة الركنية في مرمى المنافس. أما إن دخلت الكرة مباشرة مرمى فريق المنفذ فتُحتسب ركلة ركنية للمنافس."},"en":{"s":"You can't score directly from a corner kick.","w":"A goal scored directly from a corner kick counts against the opponents; only if the ball goes straight into the kicker's own goal is a corner kick awarded to the other team instead."}},{"id":"corner-kick-off-opponent","ref":"17.2","t":true,"ar":{"s":"يجوز لمنفذ الركلة الركنية أن يركل الكرة عمدًا نحو منافس ليلعبها مجددًا، بشرط ألا يكون ذلك بإهمال أو تهور أو قوة مفرطة.","w":"إذا نفذ اللاعب الركلة بشكل صحيح وركل الكرة عمدًا نحو منافس ليلعبها مرة أخرى، يترك الحكم اللعب مستمرًا ما دام ذلك دون إهمال أو تهور أو قوة مفرطة."},"en":{"s":"A corner taker may deliberately kick the ball at an opponent to play it again, as long as it is not done carelessly, recklessly or with excessive force.","w":"If the kick is taken correctly and the ball is deliberately kicked at an opponent to play it again, play continues, provided it is not careless, reckless or with excessive force."}}]}};const NEW_DATA={"pages":{"ar":"ملخص تعديلات 2026/27 · EN p.167–169، والتفاصيل p.170–185","en":"2026/27 Law changes · EN p.167–169, details p.170–185"},"items":[{"id":"throwin-countdown","law":15,"part":"countdown","title":{"ar":"رمية التماس: عد تنازلي بخمس ثوانٍ","en":"Throw-in: five-second countdown"},"body":{"ar":"إذا أخّر الفريق رميته عمدًا، يطلق الحكم صافرته ويعدّ خمس ثوانٍ بيد مرفوعة. إذا لم تُنفذ الرمية تنتقل <b>للفريق المنافس</b>. ولا إنذار إلا إذا أخّر الفريق بعد ذلك استئناف المنافس بشكل مفرط.","en":"If a team deliberately delays its throw-in, the referee whistles and counts five seconds with a raised hand. If not taken, the throw-in goes <b>to the opponents</b>. A caution only for excessive delay after that."},"q":{"ar":["انتهى العد ولم تُنفذ رمية التماس. القرار؟",["إنذار وإعادة الرمية","رمية تماس للفريق المنافس","ركلة حرة غير مباشرة"],"(15.2)"],"en":["The count ends and the throw-in isn't taken. Decision?",["Caution and retake","Throw-in to the opponents","Indirect free kick"],"(15.2)"],"a":1}},{"id":"goalkick-countdown","law":16,"part":"countdown","title":{"ar":"ركلة المرمى: عد تنازلي بخمس ثوانٍ","en":"Goal kick: five-second countdown"},"body":{"ar":"نفس الإجراء في ركلة المرمى، لكن إذا انتهت الثواني تُحتسب <b>ركلة ركنية للمنافس</b> من الجهة الأقرب. ويعدّ القانون هذه العقوبة كافية، فلا يُنذر اللاعب إلا إذا كان تأخيره مفرطًا.","en":"Same procedure at a goal kick, but when time runs out a <b>corner kick goes to the opponents</b> on the nearest side. The Law treats this as sufficient punishment; a caution only if the delay is extreme."},"q":{"ar":["انتهى العد ولم تُنفذ ركلة المرمى. القرار؟",["ركلة ركنية للمنافس","إنذار الحارس","إعادة ركلة المرمى"],"(16.2)"],"en":["The count ends and the goal kick isn't taken. Decision?",["Corner kick to the opponents","Caution the goalkeeper","Retake the goal kick"],"(16.2)"],"a":0}},{"id":"sub-ten-seconds","law":3,"part":"procedure","title":{"ar":"التبديل: عشر ثوانٍ للخروج","en":"Substitution: ten seconds to leave"},"body":{"ar":"اللاعب المستبدل يخرج خلال <b>عشر ثوانٍ</b> من رفع لوحة التبديل. إذا تأخر، لا يدخل البديل إلا في أول توقف بعد مرور <b>دقيقة</b> من الاستئناف، فيلعب الفريق ناقصًا خلال تلك المدة.","en":"A substituted player must leave within <b>ten seconds</b> of the board going up. If late, the substitute may only enter at the first stoppage after <b>one minute</b> from the restart, so the team plays short meanwhile."},"q":{"ar":["لم يخرج اللاعب المستبدل خلال عشر ثوانٍ. متى يدخل البديل؟",["فورًا","في أول توقف بعد مرور دقيقة من الاستئناف","بين الشوطين فقط"],"(3.3)"],"en":["The substituted player didn't leave within ten seconds. When may the substitute enter?",["Immediately","At the first stoppage after one minute from the restart","Only at half-time"],"(3.3)"],"a":1}},{"id":"friendly-subs","law":3,"part":"subs","title":{"ar":"المباريات الودية الدولية: حتى 8 تبديلات","en":"International friendlies: up to 8 substitutes"},"body":{"ar":"في المباريات الودية للمنتخبات الأولى يُسمح بـ<b>8</b> تبديلات، أو حتى <b>11</b> إذا اتفق الفريقان وأُبلغ الحكم قبل المباراة، مع بقاء حد <b>ثلاث فرص</b> للتبديل.","en":"In senior 'A' international friendlies up to <b>8</b> substitutes may be used, or up to <b>11</b> if both teams agree and inform the referee beforehand; the <b>three substitution opportunities</b> limit still applies."},"q":{"ar":["ودية دولية، والفريقان اتفقا على 11 تبديلًا وأبلغا الحكم. كم فرصة تبديل لكل فريق؟",["ثلاث فرص (إضافة إلى بين الشوطين)","غير محدودة","خمس فرص"],"(3.2)"],"en":["International friendly; both teams agreed on 11 substitutes and told the referee. How many substitution opportunities?",["Three (plus half-time)","Unlimited","Five"],"(3.2)"],"a":0}},{"id":"accessories","law":4,"part":"safety","title":{"ar":"الإكسسوارات مسموحة بشرط","en":"Accessories allowed, with conditions"},"body":{"ar":"الإكسسوارات صارت <b>مسموحة</b> إذا كانت <b>غير خطرة ومغطاة بأمان</b>. أما الشيء الخطر فيُنزع ولا يكفي تغطيته. والحكام أيضًا يجوز لهم ارتداء الإكسسوارات غير الخطرة.","en":"Accessories are now <b>permitted</b> if <b>not dangerous and safely covered</b>. A dangerous item must be removed — covering isn't enough. Referees may also wear non-dangerous accessories."},"q":{"ar":["لاعب يرتدي سوارًا قماشيًا غير خطر ومغطى بإحكام. القرار؟",["يجب نزعه","مسموح","يُنذر"],"(4.1)"],"en":["A player wears a non-dangerous fabric band, securely covered. Decision?",["Must be removed","Allowed","Caution"],"(4.1)"],"a":1}},{"id":"injury-minute","law":5,"part":"injuries","title":{"ar":"الإصابة: الخروج دقيقة كاملة","en":"Injury: off for one minute"},"body":{"ar":"اللاعب الذي يُعالج داخل الملعب أو يتسبب في إيقاف اللعب لإصابته، يخرج ولا يعود إلا بعد <b>دقيقة</b> من الاستئناف. ومن الاستثناءات: الحارس، والإصابة الناتجة عن مخالفة عقوبتها إنذار أو طرد.","en":"A player treated on the field, or who causes play to stop through injury, must leave and may return only <b>one minute</b> after the restart. Exceptions include the goalkeeper and an injury caused by an offence punished with a yellow or red card."},"q":{"ar":["لاعب أُصيب بتدخل متهور نال عليه المنافس إنذارًا. هل يجب أن يخرج بعد العلاج؟",["نعم، دقيقة كاملة","لا، يجوز أن يبقى","يخرج حتى نهاية الشوط"],"(5.3)"],"en":["A player is injured by a reckless challenge for which the opponent is cautioned. Must he leave after treatment?",["Yes, for one minute","No, he may stay","Until half-time"],"(5.3)"],"a":1}},{"id":"advantage-restart","law":5,"part":"powers","title":{"ar":"الميزة عند الاستئناف الخاطئ","en":"Advantage after an incorrect restart"},"body":{"ar":"يجوز للحكم تطبيق <b>الميزة</b> إذا نُفّذ استئناف بطريقة خاطئة (رمية تماس أو ركلة حرة مثلًا) وأصبحت الكرة في اللعب واستفاد المنافس منها، بدل إعادة الاستئناف.","en":"The referee may play <b>advantage</b> when a restart (e.g. throw-in or free kick) is taken incorrectly, the ball is in play and the opponents benefit, instead of ordering a retake."},"q":{"ar":["نُفذت رمية تماس بطريقة خاطئة، فقطع المنافس الكرة وانطلق بهجمة. الأفضل؟",["إيقاف اللعب وإعادة الرمية","تطبيق الميزة وترك اللعب يستمر","كرة مسقطة"],"(5.3)"],"en":["A throw-in is taken incorrectly; the opponents intercept and break away. Best call?",["Stop and retake","Play advantage","Dropped ball"],"(5.3)"],"a":1}},{"id":"var-additions","law":5,"part":"var","title":{"ar":"حكم الفيديو: حالات جديدة للمراجعة","en":"VAR: new reviewable incidents"},"body":{"ar":"صار بإمكان حكم الفيديو المساعد مراجعة: <b>الطرد الناتج عن إنذار ثانٍ خاطئ بوضوح</b>، و<b>الخطأ في هوية اللاعب</b> المعاقب حتى لو كان المخالف من الفريق الآخر، و<b>الركلة الركنية الممنوحة بالخطأ بوضوح</b> إذا أمكن تصحيحها فورًا (حسب لوائح المسابقة).","en":"VAR may now review: a <b>red card from a clearly wrong second yellow</b>, <b>mistaken identity</b> even when the offender was from the other team, and a <b>clearly wrongly awarded corner</b> if it can be corrected immediately (competition option)."},"q":{"ar":["طرد الحكم لاعبًا بإنذار ثانٍ خاطئ بوضوح. هل يمكن لحكم الفيديو التدخل؟",["لا، الإنذارات لا تُراجع أبدًا","نعم، في نسخة 2026/27"],"(5.4)"],"en":["A player is sent off for a clearly wrong second yellow. Can VAR intervene?",["No, cautions are never reviewed","Yes, in 2026/27"],"(5.4)"],"a":1}},{"id":"body-cameras","law":5,"part":"equipment","title":{"ar":"كاميرات الحكام","en":"Referee body cameras"},"body":{"ar":"يجوز للمسابقات تزويد الحكام والمساعدين والحكم الرابع بـ<b>كاميرات جسدية</b>، بشرط أن تتحكم الجهة المنظمة في التسجيلات. ويجوز استخدامها في القضايا الانضباطية، لكن لا يُبث حديث الحكام مع حكم الفيديو.","en":"Competitions may give referees, assistants and fourth officials <b>body cameras</b>, provided the organiser controls the footage. It may be used for disciplinary matters, but communication with the VAR may not be broadcast."},"q":{"ar":["هل يجوز للحكم ارتداء كاميرته الشخصية في المباراة؟",["نعم","لا، فقط الكاميرا التي توفرها الجهة المنظمة"],"(5.5)"],"en":["May a referee wear his own personal camera in a match?",["Yes","No — only cameras supplied by the organiser"],"(5.5)"],"a":1}},{"id":"dropped-ball","law":8,"part":"dropped","title":{"ar":"الكرة المسقطة: لمن تُعطى؟","en":"Dropped ball: who gets it?"},"body":{"ar":"خارج منطقة الجزاء تُسقط الكرة لفريق <b>كان سيحتفظ بها أو يستحوذ عليها</b>، ويشمل ذلك الفريق الذي كان سينفذ الاستئناف لو خرجت الكرة. وإذا ارتطمت بأحد الحكام أو بعنصر خارجي تُسقط <b>في مكان الارتطام</b>.","en":"Outside the penalty area the ball is dropped for the team that <b>would have kept or gained possession</b>, including the team that would have taken the restart had the ball gone out. If it hit a match official or outside agent, it is dropped <b>where the contact happened</b>."},"q":{"ar":["ارتطمت الكرة بالحكم وتغيّر الاستحواذ. أين تُسقط الكرة؟",["في مكان الارتطام","في مكان آخر لمسة","في منتصف الملعب"],"(8.2)"],"en":["The ball hits the referee and possession changes. Where is it dropped?",["Where it hit the referee","Where it was last touched","At the centre mark"],"(8.2)"],"a":0}},{"id":"double-touch","law":14,"part":"offences","title":{"ar":"اللمسة المزدوجة غير المقصودة في ركلة الجزاء","en":"Accidental double touch at a penalty"},"body":{"ar":"إذا لمس المنفذ الكرة بقدميه معًا أو لمست قدمه الأخرى بعد الركل مباشرة <b>دون قصد</b>: إذا دخلت المرمى تُعاد الركلة، وإذا لم تدخل تُحتسب ركلة حرة غير مباشرة (وفي ركلات الترجيح تُسجل ضائعة). وأُلغي الإنذار التلقائي للمنفذ إذا خالف هو والحارس في الوقت نفسه.","en":"If the kicker <b>accidentally</b> kicks with both feet or the ball touches the other foot right after the kick: in the goal → retake; not in → indirect free kick (in a shoot-out, recorded as missed). The automatic caution for the kicker when he and the goalkeeper offend together was removed."},"q":{"ar":["في ركلات الترجيح لمست الكرة قدم المنفذ الأخرى دون قصد ودخلت المرمى. القرار؟",["هدف","تُعاد الركلة","تُسجل ضائعة"],"(10.3)"],"en":["In a shoot-out the ball accidentally touches the kicker's other foot and goes in. Decision?",["Goal","Retake","Recorded as missed"],"(10.3)"],"a":1}},{"id":"dogso-advantage","law":12,"part":"advantage","title":{"ar":"منع فرصة هدف مع الميزة","en":"DOGSO with advantage"},"body":{"ar":"إذا طبّق الحكم الميزة بعد مخالفة <b>منع فرصة واضحة لتسجيل هدف</b> وسُجل الهدف، <b>لا يُنذر المخالف</b> ولا يُطرد. وأُضيف «موقع المهاجمين وعددهم» إلى ما يُنظر فيه عند تقدير الفرصة الواضحة.","en":"If the referee plays advantage after a <b>DOGSO</b> offence and a goal is scored, the offender is <b>not cautioned</b> or sent off. The location and number of <b>attackers</b> is now also considered when judging DOGSO."},"q":{"ar":["مدافع أمسك مهاجمًا منفردًا بالمرمى، وطبّق الحكم الميزة فسُجل الهدف. العقوبة؟",["إنذار","طرد","لا عقوبة"],"(12.4)"],"en":["A defender holds an attacker through on goal; the referee plays advantage and a goal is scored. Sanction?",["Caution","Sending-off","None"],"(12.4)"],"a":2}},{"id":"captain-2027","law":3,"part":"goal-captain","title":{"ar":"قريبًا: «المنطقة الحصرية لقائدي الفريقين» إلزامية","en":"Coming: 'Only the captain' compulsory"},"body":{"ar":"إعلان مسبق: إرشادات «المنطقة الحصرية لقائدي الفريقين» (Only the captain)، أي أن القائد وحده يتحدث مع الحكم عن القرارات، تصبح <b>إلزامية في كل المسابقات</b> ابتداءً من <b>1 يوليو 2027</b>.","en":"Advance notice: the 'Only the captain' guidelines (only the captain approaches the referee about decisions) become <b>compulsory for all competitions</b> from <b>1 July 2027</b>."},"q":{"ar":["متى تصبح إرشادات «المنطقة الحصرية لقائدي الفريقين» إلزامية لكل المسابقات؟",["الآن في 2026/27","ابتداءً من 1 يوليو 2027"],"(ملخص التعديلات)"],"en":["When do the 'Only the captain' guidelines become compulsory for all competitions?",["Now, in 2026/27","From 1 July 2027"],"(Law changes summary)"],"a":1}}]};const MATCH_DATA={"matches":[{"id":"derby","title":{"ar":"ديربي الأزرق والأحمر","en":"Blue v Red derby"},"intro":{"ar":"أنت حكم المباراة. ستمر بك 13 لقطة من البداية حتى النهاية. قراراتك تُسجل في «دفتر الحكم»، وبعضها يؤثر على ما بعده، فانتبه للبطاقات.","en":"You are the referee. 13 moments from kick-off to the final whistle. Your decisions go into the referee's notebook, and some affect later ones, so keep track of the cards."},"teams":{"B":{"ar":"الأزرق","en":"Blue"},"R":{"ar":"الأحمر","en":"Red"}},"events":[{"id":"kickoff","min":1,"ref":"8.1","ar":{"s":"صافرة البداية. منفذ ركلة البداية من الفريق الأحمر يركل الكرة إلى الخلف نحو زميله في نصف ملعبه.","w":"تصبح الكرة في اللعب عندما تُركل وتتحرك بوضوح، في أي اتجاه. لا يلزم أن تتجه للأمام."},"en":{"s":"Kick-off. The Red kicker plays the ball backwards to a team-mate in his own half.","w":"The ball is in play when it is kicked and clearly moves, in any direction. It need not go forward."},"o":[{"ar":"تُعاد ركلة البداية","en":"Retake the kick-off"},{"ar":"يستمر اللعب","en":"Play on"},{"ar":"ركلة حرة غير مباشرة للأزرق","en":"Indirect free kick to Blue"}],"a":1},{"id":"throwin","min":9,"ref":"15.1","ar":{"s":"رمية تماس للأزرق. لحظة الرمي، القدم الأمامية للرامي داخل الملعب بالكامل.","w":"يجب أن يكون جزء من كل قدم على خط التماس أو خارجه. الرمية غير الصحيحة تنتقل للفريق المنافس."},"en":{"s":"Blue throw-in. At delivery the thrower's front foot is fully inside the field.","w":"Part of each foot must be on or /* ---------- state ---------- */
let lang="ar", cur=1, part=0;
const store={get(k,d){try{const v=localStorage.getItem("qh2:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("qh2:"+k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
const t=k=>T[lang][k];
const ans=(law,p)=>store.get(`a:${law}:${p}`,{});
const quizOf=(law,i)=>{const pt=LAW_DATA[law].parts[i];return pt.quiz.concat((EDITS[`${law}-${pt.id}`]||{}).quiz||[])};
const track=()=>store.get("track","b");
const inTrack=q=>track()==="p"||q.lvl!=="p";
const reqIdx=(law,p)=>quizOf(law,p).map((q,i)=>inTrack(q)?i:-1).filter(i=>i>=0);
const partDone=(law,p)=>{const a=ans(law,p);return reqIdx(law,p).every(i=>i in a)};
const partScore=(law,p)=>{const a=ans(law,p),R=reqIdx(law,p);return [R.filter(i=>a[i]).length,R.length]};

function applyLang(){

  renderIndex();renderSearch();if(!$("#lawView").hidden)renderLaw();renderSuggest();renderProgress();if(!$("#v-exam").hidden)renderExam();if(!$("#v-news").hidden)renderNews();if(!$("#v-review").hidden)renderReview();if(!$("#v-signals").hidden)renderSignals();if(!$("#v-myths").hidden)renderMyths();if(!$("#v-match").hidden)renderMatch();if(!$("#v-bank").hidden)renderBank();if(!$("#v-analyze").hidden)renderAnalyze();if(!$("#v-assess").hidden)renderAssess();

/* index */
const LAW_IDS=()=>Object.keys(LAW_DATA).map(Number).sort((a,b)=>a-b);
function nextTarget(){for(const law of LAW_IDS()){const ps=LAW_DATA[law].parts;for(let i=0;i<ps.length;i++)if(!partDone(law,i))return [law,i]}return [1,0]}
function renderIndex(){
  const box=$("#laws");box.innerHTML="";
  LAWS.forEach(([n,a,e])=>{const ready=!!LAW_DATA[n];const b=document.createElement("button");b.className="law"+(ready?" ready":"");
    b.innerHTML=`<b>${n}</b><span></span><small></small>`;b.querySelector("span").textContent=ar()?a:e;
    b.querySelector("small").textContent=ready?`${t("parts")(LAW_DATA[n].parts.length)} · ${LAW_DATA[n].parts.filter((_,i)=>partDone(n,i)).length}✓`:t("soon");
    if(ready)b.onclick=()=>openLaw(n);else b.disabled=true;box.append(b)});
  const [nl,np]=nextTarget(),L=LAWS[nl-1],started=Object.keys(ans(1,0)).length>0;
  const nu=$("#nextUp");nu.innerHTML=`<span class="eyebrow" style="color:#C9D8CE"></span><h2></h2><button class="btn primary"></button>`;
  nu.querySelector(".eyebrow").textContent=t("nextUpH");
  nu.querySelector("h2").textContent=`${t("lawN")(nl)} — ${ar()?L[1]:L[2]} · ${t("part")} ${np+1}: ${LAW_DATA[nl].parts[np].title[lang]}`;
  const b=nu.querySelector("button");b.textContent=started?t("cont"):t("start");b.onclick=()=>openLaw(nl,np);
  renderTiles();renderDaily();
}
function norm(s){return s.toLowerCase().replace(/[ً-ْ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim()}
function renderSearch(){
  const qv=norm($("#q").value),box=$("#results");box.innerHTML="";if(!qv)return;
  const lawNum=/^\d{1,2}$/.test(qv)&&LAW_DATA[+qv]?+qv:null;
  const INDEX=[];LAW_IDS().forEach(l=>LAW_DATA[l].parts.forEach((pt,p)=>INDEX.push([l,p,[...(pt.k||[]),pt.title.ar,pt.title.en]])));
  const hits=INDEX.filter(([l,p,k])=>(lawNum&&l===lawNum&&p===0)||k.some(x=>norm(x).includes(qv)));
  if(!hits.length){const p=document.createElement("p");p.className="muted";p.textContent=t("noRes");box.append(p);return}
  hits.slice(0,8).forEach(([l,p])=>{const b=document.createElement("button");b.textContent=`${t("lawN")(l)} · ${t("part")} ${p+1}: ${LAW_DATA[l].parts[p].title[lang]}`;b.onclick=()=>openLaw(l,p);box.append(b)});
}

function closeLaw(){$("#lawView").hidden=true;$("#indexView").hidden=false;renderIndex()}
const casesOf=law=>LAW_DATA[law].cases||[];
const resIdx=law=>LAW_DATA[law].parts.length+(casesOf(law).length?1:0);

const LVL={b:["مبتدئ","Beginner"],p:["محترف","Professional"]};

  $("#lawEyebrow").textContent=t("lawN")(cur);$("#lawTitle").textContent=ar()?L[1]:L[2];$("#lawPages").textContent=D.pages[lang];

  const save=document.createElement("button");save.className="btn primary";save.textContent=ar()?"حفظ":"Save";save.hidden=true;

  const reset=document.createElement("button");reset.className="btn";reset.textContent=ar()?"استعادة النص الأصلي":"Restore original";reset.hidden=!(ed.body&&ed.body[lang]);
  const sel=document.createElement("select");sel.id="st-"+key;sel.setAttribute("aria-label","status");Object.entries(STATUS).forEach(([k,v])=>{const o=document.createElement("option");o.value=k;o.textContent=v[ar()?0:1];if((ed.status||"draft")===k)o.selected=true;sel.append(o)});
  const note=document.createElement("span");note.className="muted";note.style.fontSize=".8rem";

    try{await saveEdit(key,{body:{[lang]:clean(pr.innerHTML)}});pr.contentEditable="false";renderPart()}catch(e){save.disabled=false;note.textContent=ar()?"تعذّر الحفظ. حاول مرة أخرى.":"Could not save. Try again."}};
  reset.onclick=async()=>{if(reset.dataset.sure!=="1"){reset.dataset.sure="1";reset.textContent=ar()?"اضغط للتأكيد":"Click to confirm";return}const b={...(ed.body||{})};delete b[lang];await saveEdit(key,{body:null});const e2=EDITS[key];e2.body=b;await DB.doc("edits/"+key).set(e2);renderPart()};
  sel.onchange=async()=>{await saveEdit(key,{status:sel.value});renderPart()};
  bar.append(label,edit,save,cancel,reset,sel,note);return bar}
function addQuestion(key){const d=document.createElement("details");d.className="addq";

  <p class="muted" style="margin:0;font-size:.8rem">${ar()?"اختر الدائرة بجانب الإجابة الصحيحة.":"Tick the circle next to the correct answer."}</p>
  <input type="text" id="aq-why-${key}" placeholder="${ar()?"التعليل والمرجع، مثل: (11.2)":"Explanation and reference, e.g. (11.2)"}">
  <button class="btn primary" type="submit" style="justify-self:start">${ar()?"إضافة السؤال":"Add question"}</button></form>`;
  d.querySelector("form").addEventListener("submit",async e=>{e.preventDefault();const f=e.target,g=id=>f.querySelector("#"+CSS.escape(id)).value.trim();
    const opts=[0,1,2,3].map(i=>g(`aq-o${i}-${key}`));const okIdx=+f.querySelector("input[type=radio]:checked").value;if(!opts[okIdx])return;
    const kept=[],map={};opts.forEach((o,i)=>{if(o){map[i]=kept.length;kept.push(o)}});
    const item={id:"q"+Date.now(),added:true,a:map[okIdx]};item[lang]=[g(`aq-q-${key}`),kept,g(`aq-why-${key}`)];
    const e0=EDITS[key]||{};await saveEdit(key,{quiz:[...(e0.quiz||[]),item]});renderPart()});

/* real photos: stored per part, with credit and licence */
let ASSETS=null,DB=null,PHOTOS={};
const LIC={own:["تصوير قرار الحكم","Qarar Al-Hakam photo"],cc0:["ملكية عامة / CC0","Public domain / CC0"],ccby:["رخصة CC BY","CC BY licence"],ccbysa:["رخصة CC BY-SA","CC BY-SA licence"],free:["رخصة مجانية (Unsplash / Pexels)","Free licence (Unsplash / Pexels)"],paid:["ترخيص مدفوع","Paid licence"]};
function photoBlock(p){
  const key=`${cur}-${p.id}`,ph=PHOTOS[key],wrap=document.createElement("div");wrap.style.display="grid";wrap.style.gap="8px";
  if(ph){const f=document.createElement("figure");f.className="photo";
    const img=document.createElement("img");img.src="/_blob/"+ph.asset;img.alt=ph.alt||p.title[lang];img.loading="lazy";f.append(img);
    const c=document.createElement("figcaption");const a=document.createElement("span");a.textContent="📷 "+(ph.credit||"");const l=document.createElement("span");l.textContent=(LIC[ph.license]||["",""])[ar()?0:1];c.append(a,l);
    if(ph.source){const s=document.createElement("a");s.href=ph.source;s.target="_blank";s.rel="noopener";s.textContent=ar()?"المصدر ↗":"Source ↗";c.append(s)}
    if(ASSETS){const del=document.createElement("button");del.className="btn";del.style.fontSize=".8rem";del.style.marginInlineStart="auto";del.textContent=ar()?"حذف الصورة":"Remove photo";
      del.onclick=async()=>{if(del.dataset.sure!=="1"){del.dataset.sure="1";del.textContent=ar()?"اضغط مرة أخرى للتأكيد":"Click again to confirm";return}
        del.disabled=true;try{await DB.doc("photos/"+key).delete();await ASSETS.delete(ph.asset).catch(()=>{})}catch(e){del.textContent=ar()?"تعذّر الحذف":"Could not remove";del.disabled=false}};c.append(del)}
    f.append(c);wrap.append(f)}
  if(ASSETS&&DB){const term=encodeURIComponent(p.title.en+" football");const d=document.createElement("details");d.className="addphoto";
    d.innerHTML=`<summary>${ph?(ar()?"استبدال الصورة الحقيقية":"Replace the real photo"):(ar()?"＋ إضافة صورة حقيقية لهذا الجزء":"＋ Add a real photo for this part")}</summary>
    <div class="links" style="margin-block-start:10px"><span class="muted" style="font-size:.85rem">${ar()?"مجاني:":"Free:"}</span>
    <a class="btn" target="_blank" rel="noopener" href="https://commons.wikimedia.org/w/index.php?search=${term}&title=Special:MediaSearch&type=image">Wikimedia Commons ↗</a>
    <a class="btn" target="_blank" rel="noopener" href="https://unsplash.com/s/photos/${term}">Unsplash ↗</a>
    <a class="btn" target="_blank" rel="noopener" href="https://www.pexels.com/search/${term}/">Pexels ↗</a></div>
    <div class="links" style="margin-block-start:6px"><span class="muted" style="font-size:.85rem">${ar()?"مدفوع:":"Paid:"}</span>
    <a class="btn" target="_blank" rel="noopener" href="https://www.istockphoto.com/search/2/image?phrase=${term}">iStock ↗</a>
    <a class="btn" target="_blank" rel="noopener" href="https://stock.adobe.com/search?k=${term}">Adobe Stock ↗</a>
    <a class="btn" target="_blank" rel="noopener" href="https://www.shutterstock.com/search/${term}">Shutterstock ↗</a>
    <a class="btn" target="_blank" rel="noopener" href="https://www.gettyimages.com/search/2/image?phrase=${term}">Getty Images ↗</a></div>
    <form><label>${ar()?"الصورة (JPG أو PNG)":"Photo (JPG or PNG)"}<input id="ph-file-${key}" type="file" accept="image/jpeg,image/png,image/webp" required></label>
    <label>${ar()?"نوع الترخيص":"Licence"}<select id="ph-lic-${key}">${Object.entries(LIC).map(([k,v])=>`<option value="${k}">${v[ar()?0:1]}</option>`).join("")}</select></label>
    <label>${ar()?"اسم المصوّر أو الجهة (يظهر تحت الصورة)":"Photographer or owner (shown under the photo)"}<input id="ph-credit-${key}" type="text" required></label>
    <label>${ar()?"رابط المصدر أو الترخيص":"Source or licence link"}<input id="ph-src-${key}" type="url" placeholder="https://"></label>
    <label>${ar()?"وصف الصورة لمن لا يراها":"Short description for screen readers"}<input id="ph-alt-${key}" type="text"></label>
    <label class="check"><input id="ph-ok-${key}" type="checkbox" required><span>${ar()?"أؤكد أن لدينا حق استخدام هذه الصورة في المنصة وفق ترخيصها، وأنها لا تُظهر أشخاصًا دون موافقتهم.":"I confirm we have the right to use this photo under its licence, and it shows no one without consent."}</span></label>
    <button class="btn primary" type="submit" style="justify-self:start">${ar()?"رفع الصورة":"Upload photo"}</button><p class="phmsg muted" hidden></p></form>`;
    const form=d.querySelector("form"),msg=d.querySelector(".phmsg");
    form.addEventListener("submit",async e=>{e.preventDefault();const file=form.querySelector("input[type=file]").files[0];if(!file)return;
      const btn=form.querySelector("button");btn.disabled=true;msg.hidden=false;msg.textContent=ar()?"جارٍ الرفع…":"Uploading…";
      try{const up=await ASSETS.upload(file);const old=ph?.asset;
        await DB.doc("photos/"+key).set({asset:up.id,license:form.querySelector("select").value,credit:form.querySelector(`#ph-credit-${CSS.escape(key)}`).value.trim(),
          source:form.querySelector("input[type=url]").value.trim(),alt:form.querySelector(`#ph-alt-${CSS.escape(key)}`).value.trim(),law:cur,part:p.id,at:new Date().toISOString()});
        if(old)ASSETS.delete(old).catch(()=>{});
      }catch(err){btn.disabled=false;msg.textContent=(ar()?"تعذّر الرفع: ":"Upload failed: ")+(err?.code==="too_large"||err?.code==="file_too_large"?(ar()?"الملف كبير جدًا (الحد 20 ميغابايت).":"file too large (20 MB max)."):(ar()?"حاول مرة أخرى.":"try again."))}});
    wrap.append(d)}
  return wrap.children.length?wrap:null;
}
(async()=>{
  try{DB=await (async()=>null)("db")}catch(e){DB=null}
  if(DB){DB.collection("photos").onSnapshot(snap=>{const n={};snap.docs.forEach(d=>{if(d.exists)n[d.id]=d.data()});PHOTOS=n;
    if(!$("#lawView").hidden&&LAW_DATA[cur]&&part<LAW_DATA[cur].parts.length&&!document.activeElement?.closest?.(".addphoto"))renderPart()},()=>{})}

/* progress */
function renderProgress(){
  let done=0,tot=0,R=0,Nn=0,lawsDone=0;const pl=$("#progLaws");pl.innerHTML="";
  Object.keys(LAW_DATA).map(Number).forEach(n=>{const D=LAW_DATA[n];let all=true;const rows=D.parts.map((p,i)=>{tot++;if(partDone(n,i))done++;else all=false;const [r,k]=partScore(n,i);const a=Object.keys(ans(n,i)).length;R+=r;Nn+=a;return [p.title[lang],r,k]});if(all)lawsDone++;
    const sec=document.createElement("div");sec.style.display="grid";sec.style.gap="8px";const h=document.createElement("h2");h.textContent=`${t("lawN")(n)} — ${ar()?LAWS[n-1][1]:LAWS[n-1][2]}`;const tb=document.createElement("div");tb.className="topics";bars(tb,rows);sec.append(h,tb);pl.append(sec)});
  const st=$("#stats");st.innerHTML="";
  [[t("stParts"),`${done}/${tot}`],[t("stAcc"),Nn?Math.round(R/Nn*100)+"%":"—"],[t("stLaws"),`${lawsDone}/17`]].forEach(([l,v])=>{const d=document.createElement("div");d.className="stat";d.innerHTML="<b></b><span class='muted'></span>";d.querySelector("b").textContent=v;d.querySelector("span").textContent=l;st.append(d)});
  const fv=$("#favs");fv.innerHTML="";const fav=store.get("fav",{});const ids=Object.keys(fav).filter(k=>fav[k]);
  if(!ids.length){const p=document.createElement("p");p.className="muted";p.textContent=t("favEmpty");fv.append(p)}
  ids.forEach(n=>{const b=document.createElement("button");b.className="law ready";b.innerHTML="<b></b><span></span>";b.querySelector("b").textContent=n;b.querySelector("span").textContent=ar()?LAWS[n-1][1]:LAWS[n-1][2];b.onclick=()=>{go("guide");openLaw(+n)};fv.append(b)});
}
$("#favLaw").onclick=()=>{const f=store.get("fav",{});f[cur]=!f[cur];store.set("fav",f);$("#favLaw").setAttribute("aria-pressed",!!f[cur])};

/* assistant */
let sample=null,ctl=null,turns=[],chatReady=false,chatOff=false;
const SUGGEST={ar:["لاعب داخل قوس الجزاء أثناء ركلة الجزاء، هل هو داخل المنطقة؟","انكسرت العارضة في الدقيقة 80 ولا يوجد بديل، ما القرار؟","مهاجم متقدم لحظة التمرير والكرة ارتدت من مدافع إليه، هل هو متسلل؟"],
 en:["A player stands inside the penalty arc. Is he inside the penalty area?","The crossbar breaks in the 80th minute and there is no spare. Decision?","The attacker was ahead at the pass and the ball deflected off a defender to him. Offside?"]};
function renderSuggest(){const box=$("#suggest");box.innerHTML="";SUGGEST[lang].forEach(s=>{const b=document.createElement("button");b.className="btn";b.textContent=s;b.onclick=()=>{$("#askIn").value=s;ask()};box.append(b)})}
function addMsg(c,x){const d=document.createElement("div");d.className="msg "+c;d.textContent=x;$("#log").append(d);$("#log").scrollTop=1e9;return d}
function knowledge(){const tmp=document.createElement("div");let out="";
  for(const n in LAW_DATA){out+=`\n\n### القانون ${n} — ${LAWS[n-1][1]}\n`;LAW_DATA[n].parts.forEach(p=>{tmp.innerHTML=(EDITS[`${n}-${p.id}`]?.body?.ar)||p.body.ar;out+=`\n[${p.ref}] ${p.title.ar}: ${tmp.textContent.replace(/\s+/g," ").trim()}\n`})}return out}
function rules(){return `You are the study assistant of "Qarar Al-Hakam", an independent educational platform for football referees, not affiliated with IFAB or FIFA.
Answer ONLY from the approved-summary knowledge below (Laws of the Game 2026/27, Laws ${LAW_IDS().join(', ')}). Do not use outside knowledge.
If the question is outside these Laws or the knowledge does not settle it, say so briefly and suggest asking a qualified referee instructor. Never invent rules.
Reply in ${ar()?"Arabic":"English"}. Keep it short: the decision, the restart or sanction if any, why, and the section reference like (1.6) or (11.2). Say when a point depends on the referee's judgement or competition rules. Plain text.

KNOWLEDGE (Arabic):${knowledge()}`}
async function initChat(){if(chatReady)return;chatReady=true;addMsg("bot",t("hello"));
  try{sample=await (async()=>null)("sample")}catch(e){sample=null}
  if(!sample){chatOff=true;addMsg("sys",t("unavailable"));$("#askBtn").disabled=true}}
async function ask(){const qv=$("#askIn").value.trim();if(!qv||!sample||chatOff)return;
  $("#askIn").value="";addMsg("me",qv);turns.push({role:"user",content:qv});turns=turns.slice(-8);
  const bubble=addMsg("bot",t("thinking"));ctl=new AbortController();$("#askBtn").disabled=true;$("#stopBtn").hidden=false;
  try{const {text}=await sample([{role:"user",content:rules()},...turns],{cache:false,signal:ctl.signal,onText:({text})=>{bubble.textContent=text;$("#log").scrollTop=1e9}});turns.push({role:"assistant",content:text})}
  catch(e){bubble.textContent=e.text||"";const c=e.code;
    if(c==="cancelled"){if(!e.text)bubble.remove()}
    else if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){chatOff=true;addMsg("sys",t("declined"))}
    else if(c==="rate_limited")addMsg("sys",t("limited"));else addMsg("sys",t("failed"));
    if(turns[turns.length-1]?.role==="user")turns.pop()}
  finally{$("#askBtn").disabled=chatOff;$("#stopBtn").hidden=true}}
$("#askForm").addEventListener("submit",e=>{e.preventDefault();ask()});
$("#askIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}});
$("#stopBtn").onclick=()=>ctl?.abort();

document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
$("#backBtn").onclick=closeLaw;$("#q").addEventListener("input",renderSearch);
$("#langBtn").onclick=()=>{lang=ar()?"en":"ar";store.set("lang",lang);applyLang()};
lang=store.get("lang","ar");applyLang();

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#123524">
<meta name="apple-mobile-web-app-title" content="قرار الحكم">
<title>قرار الحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a referee's notebook — app bar, a stepper of parts, one working column; turf + chalk illustrations, yellow-card highlight */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#16231C; --muted:#5B6B61; --line:#D9E0DA;
  --pitch:#1D6B47; --pitch-soft:#E3F0E8; --card:#E8B400; --card-soft:#FBF1CC; --red:#C2362B; --red-soft:#F8E1DE;
  --turf1:#2F8A57; --turf2:#2A7D4F; --chalk:#F7FAF5; --night:#123524;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1814; --surface:#16221C; --ink:#E6EEE8; --muted:#97A99E; --line:#26362D;
  --pitch:#5CC48F; --pitch-soft:#1B3528; --card:#F2C94C; --card-soft:#3A3115; --red:#F0786C; --red-soft:#3B1E1B;
  --turf1:#1F5E3C; --turf2:#1B5335; --chalk:#E2EBE4; --night:#0B1F15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1814; --surface:#16221C; --ink:#E6EEE8; --muted:#97A99E; --line:#26362D;
  --pitch:#5CC48F; --pitch-soft:#1B3528; --card:#F2C94C; --card-soft:#3A3115; --red:#F0786C; --red-soft:#3B1E1B;
  --turf1:#1F5E3C; --turf2:#1B5335; --chalk:#E2EBE4; --night:#0B1F15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--pitch)}
:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin-inline-end:auto}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.nav button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.nav button[aria-pressed="true"]{background:var(--pitch);color:var(--surface)}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-family:var(--f-mono);font-size:.85rem}
.proto{margin-block:14px 0;font-size:.85rem;color:var(--muted);background:var(--card-soft);border-radius:var(--r);padding:8px 12px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.4;margin:0}
h1{font-size:1.6rem;font-weight:800} h2{font-size:1.2rem;font-weight:600} h3{font-size:1.02rem;font-weight:600}
.mono{font-family:var(--f-mono);font-size:.82rem}
.eyebrow{font-size:.85rem;color:var(--muted);font-weight:500}
[hidden]{display:none!important}
.muted{color:var(--muted)}
section[data-view]{display:grid;gap:20px;padding-block-start:20px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px}
.results{display:grid;gap:6px}
.results button{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 12px;cursor:pointer}
.laws{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.law{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:start;cursor:pointer;min-width:0}
.law b{font-family:var(--f-mono);color:var(--pitch);font-weight:500;font-variant-numeric:tabular-nums}
.law span{min-width:0}
.law small{grid-column:2;color:var(--muted);font-size:.78rem}
.law[disabled]{cursor:default;opacity:.55}
.law.ready{border-color:var(--pitch);background:var(--pitch-soft)}
.next-up{background:var(--night);color:#F7FAF5;border-radius:var(--r);padding:16px;display:grid;gap:8px}
.next-up .btn{justify-self:start}
.lawhead{display:grid;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:.78rem;border-radius:999px;padding:2px 10px;border:1px solid var(--line);background:var(--surface)}
.chip.draft{background:var(--card-soft);border-color:transparent}
.steps{display:flex;gap:6px;overflow-x:auto;padding-block:4px}
.step{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 6px;cursor:pointer;font-size:.88rem}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-family:var(--f-mono);font-size:.78rem}
.step[aria-current="step"]{border-color:var(--pitch);background:var(--pitch-soft)}
.step.done i{background:var(--pitch);color:var(--surface)}
.part{display:grid;gap:14px}
.fig{border-radius:var(--r);overflow:hidden;background:var(--night);display:grid}
.fig svg{width:min(100%,calc(440px * var(--ar,2)));height:auto;display:block;margin-inline:auto;direction:ltr}
.fig figcaption{padding:8px 12px;font-size:.85rem;color:#DDE8E0;background:var(--night)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;text-decoration:none;color:inherit;display:inline-block}
.btn.primary{background:var(--pitch);color:var(--surface);border-color:var(--pitch)}
.btn[aria-pressed="true"]{border-color:var(--card);background:var(--card-soft)}
svg .hl{stroke:var(--card)!important;stroke-width:6!important}
svg .hlf.hl{fill:var(--card)!important}
.prose{max-width:68ch;display:grid;gap:12px}
.prose p,.prose ul,.prose ol{margin:0}
.prose ul,.prose ol{padding-inline-start:1.3em;display:grid;gap:4px}
.ref{font-family:var(--f-mono);font-size:.78rem;color:var(--pitch);white-space:nowrap}
.note{border-inline-start:3px solid var(--card);background:var(--surface);padding:8px 12px}
.note.judge{border-color:var(--pitch)}
.note.err{border-color:var(--red);background:var(--red-soft)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.links{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.qi{display:grid;gap:8px;padding-block-end:12px;border-bottom:1px dashed var(--line)}
.qi:last-of-type{border-bottom:0;padding-block-end:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:6px 12px;cursor:pointer;text-align:start}
.opts button.right{border-color:var(--pitch);background:var(--pitch-soft)}
.opts button.wrong{border-color:var(--red);background:var(--red-soft)}
.opts button[disabled]{cursor:default}
.opts button.sel{border-color:var(--ink);background:var(--card-soft);font-weight:500}
.exlv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.exlv article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.exbar{position:sticky;top:0;z-index:2;background:var(--bg);padding-block:8px;display:grid;gap:6px}
.exbar .row{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.extime{font-family:"IBM Plex Mono",monospace;font-size:1.1rem}.extime.low{color:var(--red)}
.big{font-family:var(--f-display);font-size:2.4rem;font-weight:800;margin:0}
.why{font-size:.9rem;color:var(--muted)}
.partnav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.topics{display:grid;gap:8px}
.topic{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:10px;align-items:center;font-size:.92rem}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--pitch)}
.meter i.weak{background:var(--red)}
.case dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;padding:10px 12px;background:var(--pitch-soft);border-radius:10px}
.case dt{color:var(--muted);font-size:.85rem;padding-top:2px}.case dd{margin:0;font-weight:500}
.case .sit{margin:0;font-weight:500;line-height:1.8}
.lvl{display:flex;gap:6px;flex-wrap:wrap}
.trackbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.trackbar .muted{font-weight:400;font-size:.85rem;flex-basis:100%}
.qlvl{font-size:.72rem;border-radius:999px;padding:1px 8px;justify-self:start;background:var(--pitch-soft);color:var(--pitch)}
.qlvl.p{background:var(--red-soft);color:var(--red)}
details.pro{border:1px dashed var(--line);border-radius:var(--r);padding:8px 12px}
details.pro summary{cursor:pointer;font-weight:600;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile.star{grid-column:1/-1;background:linear-gradient(135deg,var(--night),#1D6B47);color:#fff;border:0}.tile.star b,.tile.star small,.tile.star span{color:#E8F0EA}
.anform{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.anform>*{min-width:0}.anform input,.anform select,.field textarea{width:100%;box-sizing:border-box;min-width:0}
.anform label,.field{display:grid;gap:4px;font-size:.85rem;font-weight:600}
.anform input,.anform select,.anform textarea,.field input,.field select,.field textarea{font:inherit;font-weight:400;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.vwrap{position:relative;border-radius:var(--r);overflow:hidden;background:#000}
.vid{width:100%;height:auto;display:block}
.tele{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}
.tele.on{pointer-events:auto;cursor:crosshair;outline:3px solid var(--card);outline-offset:-3px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.tools .btn[aria-pressed="true"]{background:var(--card);color:#16231C}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer}.sw[aria-pressed="true"]{outline:3px solid var(--ink)}
.shot{max-width:100%;width:260px;border-radius:10px;border:1px solid var(--line);display:block}
.inc{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.inc:last-child{border-bottom:0}.inc .tbtn{font-family:"IBM Plex Mono",monospace;cursor:pointer;border:0;background:var(--night);color:#fff;border-radius:8px;padding:3px 8px}
.ev{font-size:.75rem;border-radius:999px;padding:1px 8px}.ev.ok{background:var(--pitch-soft);color:var(--pitch)}.ev.bad{background:var(--red-soft);color:var(--red)}.ev.miss{background:#FFE8CC;color:#B35C00}.ev.jd{background:var(--card-soft)}
.score{display:grid;grid-template-columns:minmax(0,1fr) 150px 36px;gap:10px;align-items:center}
.score input[type=range]{width:100%}
.printonly{display:none}
@media print{.bar,.proto,.btn,.tiles,.trackbar,button,details.book,.noprint{display:none!important}.printonly{display:block}body{background:#fff}section[data-view]{padding:0}.quiz{border:1px solid #999;break-inside:avoid}}
.minute{display:inline-block;font-family:"IBM Plex Mono",monospace;font-weight:600;background:var(--night);color:#fff;border-radius:8px;padding:2px 10px;justify-self:start}
.book{background:var(--card-soft);border-radius:var(--r);padding:10px 14px}.book summary{cursor:pointer;font-weight:600}.book ul{margin:8px 0 0;padding-inline-start:18px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:grid;gap:4px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;color:var(--ink);font:inherit}
.tile b{font-family:var(--f-display);font-size:1.35rem;color:var(--pitch)}.tile span{font-size:.85rem;font-weight:600}.tile small{color:var(--muted);font-size:.75rem}
.tile.new b{color:var(--red)}.tile[disabled]{opacity:.6;cursor:default}
.newcard{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--card);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.newcard h2{margin:0;font-size:1.1rem}.newcard p{margin:0;line-height:1.8}
@media (max-width:420px){.tiles{gap:6px}.tile{padding:10px 8px}.tile b{font-size:1.15rem}}
.step.cases i{background:var(--card-soft)}
.tip{border-inline-start:3px solid var(--red);background:var(--red-soft);padding:8px 12px}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-rows:auto 1fr auto;min-height:420px}
.chat header{padding:10px 14px;border-bottom:1px solid var(--line);font-size:.88rem;color:var(--muted)}
.log{padding:14px;display:grid;gap:10px;align-content:start;overflow-y:auto;max-height:520px}
.msg{max-width:88%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--pitch);color:var(--surface)}
.msg.bot{justify-self:start;background:var(--bg);border:1px solid var(--line)}
.msg.sys{justify-self:center;font-size:.85rem;color:var(--muted)}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.compose textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:8px 12px;height:44px}
.suggest{display:flex;flex-wrap:wrap;gap:6px}
.suggest .btn{font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.star{border:0;background:none;cursor:pointer;font-size:1.1rem;color:var(--muted);padding:0 4px}
.star[aria-pressed="true"]{color:var(--card)}
.photo{margin:0;border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.photo img{display:block;width:100%;max-height:460px;object-fit:cover}
.photo figcaption{padding:6px 12px;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.addphoto{border:1px dashed var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px}
.addphoto summary{cursor:pointer;font-weight:500;color:var(--pitch)}
.addphoto form{display:grid;gap:10px;margin-block-start:10px}
.addphoto label{display:grid;gap:4px;font-size:.88rem}
.addphoto input[type=text],.addphoto input[type=url],.addphoto select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0}
.addphoto .check{display:flex;gap:8px;align-items:flex-start}
.addphoto .phmsg{font-size:.85rem}
.chip.ok{background:var(--pitch-soft);border-color:var(--pitch);color:var(--pitch)}
.chip.rev{background:var(--card-soft);border-color:var(--card)}
.edbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px dashed var(--pitch);border-radius:var(--r);padding:8px 10px;background:var(--surface)}
.edbar select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px}
.prose.editing{outline:2px dashed var(--card);outline-offset:6px;border-radius:4px;padding:4px}
.addq{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.addq summary{cursor:pointer;color:var(--pitch);font-weight:500}
.addq form{display:grid;gap:8px;margin-block-start:10px}
.addq input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.addq .opt{display:flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .4s ease} svg .hl{transition:stroke .2s}}
@media (max-width:560px){.topic{grid-template-columns:minmax(0,1fr) 80px auto} h1{font-size:1.35rem}}
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="5" y="2" width="12" height="18" rx="2" fill="var(--card)" transform="rotate(-10 11 11)"/><rect x="9" y="5" width="12" height="18" rx="2" fill="var(--red)" transform="rotate(8 15 14)"/></svg>
    <span data-t="brand">قرار الحكم</span>
  </div>
  <nav class="nav" aria-label="sections">
    <button data-go="guide" aria-pressed="true" data-t="navGuide">الدليل</button>
        <button data-go="exam" aria-pressed="false" data-t="navExam">الاختبار</button>
    <button data-go="progress" aria-pressed="false" data-t="navProg">تقدّمي</button>
  </nav>
  <button class="lang" id="langBtn" aria-label="Switch language">EN</button>
</div></div>

<main class="wrap">
  <p class="proto" data-t="proto"></p>

  <section data-view="guide" id="v-guide">
    <div id="indexView" style="display:grid;gap:16px">
      <div class="next-up" id="nextUp"></div>
      <div class="trackbar" id="trackbar"></div>
      <div class="tiles" id="tiles"></div>
      <div id="daily"></div>
      <div class="search"><input id="q" type="search" autocomplete="off" data-tp="searchPh"></div>
      <div class="results" id="results"></div>
      <h2 data-t="lawsTitle"></h2>
      <div class="laws" id="laws"></div>
    </div>
    <div id="lawView" hidden style="display:grid;gap:16px">
      <button class="btn" id="backBtn" style="justify-self:start" data-t="back"></button>
      <div class="lawhead">
        <span class="eyebrow" id="lawEyebrow"></span>
        <h1 id="lawTitle"></h1>
        <div class="meta">
          <span class="chip" data-t="chipSrc"></span>
          <span class="chip mono" id="lawPages"></span>
          <span class="chip draft" data-t="chipDraft"></span>
          <button class="star" id="favLaw" aria-pressed="false" aria-label="favorite">★</button>
        </div>
      </div>
      <nav class="steps" id="steps" aria-label="parts"></nav>
      <div id="partBody"></div>
    </div>
  </section>

  <section data-view="assistant" id="v-assistant" hidden>
    <div class="prose">
      <h1 data-t="askTitle"></h1>
      <p class="muted" data-t="askLead"></p>
    </div>
    <div class="suggest" id="suggest"></div>
    <div class="chat">
      <header data-t="askWarn"></header>
      <div class="log" id="log" aria-live="polite"></div>
      <form class="compose" id="askForm">
        <textarea id="askIn" rows="1" data-tp="askPh"></textarea>
        <button class="btn primary" id="askBtn" type="submit" data-t="send"></button>
        <button class="btn" id="stopBtn" type="button" hidden data-t="stop"></button>
      </form>
    </div>
  </section>

  <section data-view="news" id="v-news" hidden><div id="newsBox" style="display:grid;gap:16px"></div></section>
  <section data-view="signals" id="v-signals" hidden><div id="sigBox" style="display:grid;gap:16px"></div></section>
  <section data-view="myths" id="v-myths" hidden><div id="mythBox" style="display:grid;gap:16px"></div></section>
  <section data-view="match" id="v-match" hidden><div id="matchBox" style="display:grid;gap:16px"></div></section>
  <section data-view="bank" id="v-bank" hidden><div id="bankBox" style="display:grid;gap:16px"></div></section>
  <section data-view="analyze" id="v-analyze" hidden><div id="anBox" style="display:grid;gap:16px"></div></section>
  <section data-view="assess" id="v-assess" hidden><div id="asBox" style="display:grid;gap:16px"></div></section>
  <section data-view="review" id="v-review" hidden><div id="reviewBox" style="display:grid;gap:16px"></div></section>
  <section data-view="exam" id="v-exam" hidden><div id="examBox" style="display:grid;gap:16px"></div></section>

/*DATA*/const LAW_DATA={"1":{"pages":{"ar":"ع ص 45–53 · EN p.45–53","en":"EN p.45–53 · AR p.45–53"},"parts":[{"id":"lines","title":{"ar":"الأرضية والخطوط","en":"Surface and markings"},"ref":"1.1 · 1.2","fig":"lines","body":{"ar":"<p><b>الأرضية:</b> طبيعية، أو صناعية بالكامل <b>إذا سمحت لوائح المسابقة</b>، أو هجين إذا سمحت. الصناعية يجب أن تكون <b>خضراء</b>.</p>\n  <ul><li>الملعب <b>مستطيل</b>، وخطوطه متصلة وغير خطرة، وعرضها واحد لا يتجاوز <b>12 سم</b>.</li>\n  <li>الخطان الطويلان <b>خطَّا التماس</b>، والقصيران <b>خطَّا المرمى</b>. خط المنتصف يقسمه نصفين، وحول علامة المنتصف دائرة نصف قطرها <b>9.15 م</b>.</li>\n  <li><b>الخط جزء من المنطقة التي يحدها:</b> الكرة على خط التماس ما زالت في الملعب.</li>\n  <li>علامة <b>اختيارية</b> خارج الملعب على بعد 9.15 م من قوس الركنية تساعد في إبعاد المدافعين.</li></ul>\n  <div class=\"note\"><b>عقوبة:</b> لاعب يضع علامات غير مسموحة على الملعب ← <b>إنذار</b> عند خروج الكرة من اللعب.</div>","en":"<p><b>Surface:</b> natural, or wholly artificial <b>if competition rules permit</b>, or hybrid if permitted. Artificial surfaces must be <b>green</b>.</p>\n  <ul><li>The field is <b>rectangular</b>; lines are continuous, not dangerous, all the same width, at most <b>12 cm</b>.</li>\n  <li>The two longer lines are <b>touchlines</b>, the shorter ones <b>goal lines</b>. The halfway line splits the field; the centre circle has a <b>9.15 m</b> radius.</li>\n  <li><b>Lines belong to the areas they bound:</b> a ball on the touchline is still in the field.</li>\n  <li>An <b>optional</b> mark off the field, 9.15 m from the corner arc, helps keep defenders back.</li></ul>\n  <div class=\"note\"><b>Sanction:</b> a player making unauthorised marks → <b>caution</b> when the ball is next out of play.</div>"},"quiz":[{"ar":["الكرة تتدحرج على خط التماس ولم تتجاوزه بالكامل. هل هي في اللعب؟",["نعم","لا"],"الخط جزء من الميدان. (1.2)"],"en":["The ball rolls along the touchline without wholly crossing it. In play?",["Yes","No"],"Lines are part of the field. (1.2)"],"a":0,"lvl":"b"},{"ar":["نصف قطر دائرة المنتصف؟",["7.32 م","9.15 م","11 م"],"9.15 م. (1.2)"],"en":["Radius of the centre circle?",["7.32 m","9.15 m","11 m"],"9.15 m. (1.2)"],"a":1,"lvl":"b"},{"ar":["لاعب يرسم بقدمه خطًا على العشب أثناء المباراة. الإجراء؟",["لا شيء","إنذار عند خروج الكرة","طرد"],"سلوك غير رياضي. (1.2)"],"en":["A player scrapes a mark on the pitch during play. Action?",["Nothing","Caution when ball is out","Send off"],"Unsporting behaviour. (1.2)"],"a":1,"lvl":"p"}],"k":["خط التماس","touchline","خط المرمى","goal line","خط المنتصف","halfway","دائرة","centre","خطوط","lines","عشب","صناعي","artificial","12 سم"]},{"id":"dims","title":{"ar":"الأبعاد","en":"Dimensions"},"ref":"1.3 · 1.4","fig":"dims","body":{"ar":"<div class=\"tbl\"><table><tr><th></th><th>خط التماس</th><th>خط المرمى</th></tr>\n  <tr><td>عمومًا</td><td class=\"num\">90 – 120 م</td><td class=\"num\">45 – 90 م</td></tr>\n  <tr><td>المباريات الدولية</td><td class=\"num\">100 – 110 م</td><td class=\"num\">64 – 75 م</td></tr></table></div>\n  <ul><li><b>خط التماس أطول من خط المرمى دائمًا</b>، فلا يجوز ملعب مربع.</li><li>للمسابقة تحديد مقاس بعينه داخل هذه الحدود.</li>\n  <li>القياس من <b>الحافة الخارجية</b> للخطوط.</li></ul>","en":"<div class=\"tbl\"><table><tr><th></th><th>Touchline</th><th>Goal line</th></tr>\n  <tr><td>General</td><td class=\"num\">90 – 120 m</td><td class=\"num\">45 – 90 m</td></tr>\n  <tr><td>International</td><td class=\"num\">100 – 110 m</td><td class=\"num\">64 – 75 m</td></tr></table></div>\n  <ul><li><b>The touchline must be longer than the goal line</b>, so no square fields.</li><li>Competitions may set exact sizes within these limits.</li>\n  <li>Measure from the <b>outside</b> of the lines.</li></ul>"},"quiz":[{"ar":["ملعب 100 × 100 م. هل يصلح؟",["نعم","لا"],"خط التماس يجب أن يكون أطول. (1.3)"],"en":["A 100 × 100 m field. Valid?",["Yes","No"],"The touchline must be longer. (1.3)"],"a":1,"lvl":"b"},{"ar":["أقل طول لخط التماس في مباراة دولية؟",["90 م","100 م","110 م"],"100 م. (1.4)"],"en":["Minimum touchline length in an international match?",["90 m","100 m","110 m"],"100 m. (1.4)"],"a":1,"lvl":"p"}],"k":["أبعاد","مقاس","طول","عرض","dimensions","length","90","120","100","110","64","75"]},{"id":"areas","title":{"ar":"منطقة المرمى ومنطقة الجزاء","en":"Goal area and penalty area"},"ref":"1.5 · 1.6","fig":"areas","body":{"ar":"<div class=\"tbl\"><table><tr><th>العنصر</th><th>المقاس</th></tr>\n  <tr><td>منطقة المرمى</td><td><span class=\"num\">5.5 م</span> من الحافة الداخلية لكل قائم، وتمتد <span class=\"num\">5.5 م</span></td></tr>\n  <tr><td>منطقة الجزاء</td><td><span class=\"num\">16.5 م</span> من الحافة الداخلية لكل قائم، وتمتد <span class=\"num\">16.5 م</span></td></tr>\n  <tr><td>علامة الجزاء</td><td><span class=\"num\">11 م</span> من منتصف المسافة بين القائمين</td></tr>\n  <tr><td>قوس الجزاء</td><td>نصف قطر <span class=\"num\">9.15 م</span> من علامة الجزاء، <b>خارج</b> المنطقة</td></tr></table></div>\n  <p><b>قوس الجزاء ليس جزءًا من منطقة الجزاء.</b> وظيفته إبعاد اللاعبين 9.15 م عن الكرة عند ركلة الجزاء.</p>\n  <div class=\"note err\"><b>تنبيه على النسخة العربية:</b> كُتب في ص 48 «6.5 مترًا» لمنطقة الجزاء، والصحيح في النسخة الإنجليزية المعتمدة <b>16.5 م</b>.</div>","en":"<div class=\"tbl\"><table><tr><th>Element</th><th>Size</th></tr>\n  <tr><td>Goal area</td><td><span class=\"num\">5.5 m</span> from the inside of each post, extending <span class=\"num\">5.5 m</span></td></tr>\n  <tr><td>Penalty area</td><td><span class=\"num\">16.5 m</span> from the inside of each post, extending <span class=\"num\">16.5 m</span></td></tr>\n  <tr><td>Penalty mark</td><td><span class=\"num\">11 m</span> from the midpoint between the posts</td></tr>\n  <tr><td>Penalty arc</td><td><span class=\"num\">9.15 m</span> radius from the mark, <b>outside</b> the area</td></tr></table></div>\n  <p><b>The arc is not part of the penalty area.</b> It keeps players 9.15 m from the ball at a penalty kick.</p>\n  <div class=\"note err\"><b>Note on the Arabic edition:</b> page 48 prints “6.5 m” for the penalty area; the authoritative English text says <b>16.5 m</b>.</div>"},"quiz":[{"ar":["كم تبعد علامة الجزاء عن خط المرمى؟",["9.15 م","11 م","16.5 م"],"11 م. (1.6)"],"en":["Distance from the goal line to the penalty mark?",["9.15 m","11 m","16.5 m"],"11 m. (1.6)"],"a":1,"lvl":"b"},{"ar":["لاعب داخل قوس الجزاء. هل هو داخل منطقة الجزاء؟",["نعم","لا"],"القوس خارج المنطقة. (1.6)"],"en":["A player stands inside the penalty arc. Inside the penalty area?",["Yes","No"],"The arc is outside the area. (1.6)"],"a":1,"lvl":"b"},{"ar":["كم تمتد منطقة المرمى داخل الملعب؟",["5.5 م","11 م","16.5 م"],"5.5 م. (1.5)"],"en":["How far does the goal area extend into the field?",["5.5 m","11 m","16.5 m"],"5.5 m. (1.5)"],"a":0,"lvl":"b"}],"k":["منطقة الجزاء","penalty area","منطقة المرمى","goal area","علامة الجزاء","penalty mark","قوس","arc","16.5","5.5","11","9.15"]},{"id":"corner","title":{"ar":"منطقة الركنية والرايات","en":"Corner area and flagposts"},"ref":"1.7 · 1.8","fig":"corner","body":{"ar":"<ul><li><b>منطقة الركنية:</b> ربع دائرة نصف قطرها <b>1 م</b> من قائم الراية، داخل الملعب.</li>\n  <li><b>راية الركنية إجبارية</b> في كل زاوية: ارتفاع <b>لا يقل</b> عن <b>1.5 م</b>، ورأس غير مدبب.</li>\n  <li><b>رايتا المنتصف اختياريتان</b>، على بعد 1 م على الأقل خارج خط التماس.</li></ul>\n  <div class=\"note err\"><b>تنبيه على النسخة العربية:</b> في رسم ص 48 كُتب «لا يزيد ارتفاع قائم الراية عن 1.5 متر»، والصحيح <b>لا يقل</b> (كما في ص 49 والنسخة الإنجليزية).</div>","en":"<ul><li><b>Corner area:</b> a quarter circle of <b>1 m</b> radius from each corner flagpost, inside the field.</li>\n  <li><b>Corner flagposts are compulsory</b>: at least <b>1.5 m</b> high, non-pointed top.</li>\n  <li><b>Halfway flagposts are optional</b>, at least 1 m outside the touchline.</li></ul>\n  <div class=\"note err\"><b>Note on the Arabic edition:</b> the page 48 graphic says the flagpost is “not more than 1.5 m”; the correct rule is <b>not less than</b> 1.5 m.</div>"},"quiz":[{"ar":["هل يجوز لعب مباراة دون رايات ركنية؟",["نعم","لا"],"رايات الركنية إجبارية. (1.8)"],"en":["Can a match be played without corner flagposts?",["Yes","No"],"They are compulsory. (1.8)"],"a":1,"lvl":"b"},{"ar":["أقل ارتفاع لقائم راية الركنية؟",["1 م","1.5 م","2 م"],"1.5 م. (1.8)"],"en":["Minimum height of a corner flagpost?",["1 m","1.5 m","2 m"],"1.5 m. (1.8)"],"a":1,"lvl":"b"}],"k":["ركنية","corner","راية","flag","1.5"]},{"id":"tech","title":{"ar":"المنطقة الفنية","en":"Technical area"},"ref":"1.9","fig":"tech","body":{"ar":"<ul><li>تمتد <b>1 م</b> على جانبي منطقة الجلوس وحتى <b>1 م</b> من خط التماس، وتُحدد بخطوط.</li>\n  <li><b>عدد</b> الموجودين فيها تحدده <b>لوائح المسابقة</b>، ويُحدَّدون قبل المباراة.</li>\n  <li>يبقون داخلها ويتصرفون بمسؤولية، إلا لحالة خاصة مثل دخول الطبيب <b>بإذن الحكم</b>.</li>\n  <li><b>شخص واحد فقط في كل مرة</b> يعطي التعليمات الفنية.</li></ul>","en":"<ul><li>Extends <b>1 m</b> either side of the seats and up to <b>1 m</b> from the touchline, marked with lines.</li>\n  <li>The <b>number</b> of occupants is set by <b>competition rules</b>; they are named before the match.</li>\n  <li>They stay inside and behave responsibly, except in special cases such as a doctor entering <b>with the referee's permission</b>.</li>\n  <li><b>Only one person at a time</b> may give tactical instructions.</li></ul>"},"quiz":[{"ar":["المدرب ومساعده يوجهان اللاعبين معًا من حافة المنطقة الفنية. مسموح؟",["نعم","لا"],"شخص واحد في كل مرة. (1.9)"],"en":["Coach and assistant both shout tactics at the same time. Allowed?",["Yes","No"],"One person at a time. (1.9)"],"a":1,"lvl":"b"},{"ar":["من يحدد عدد الموجودين في المنطقة الفنية؟",["الحكم","لوائح المسابقة","المدرب"],"لوائح المسابقة. (1.9)"],"en":["Who sets how many may occupy the technical area?",["Referee","Competition rules","Coach"],"Competition rules. (1.9)"],"a":1,"lvl":"p"}],"k":["المنطقة الفنية","technical area","مدرب","coach","بدلاء"]},{"id":"goals","title":{"ar":"المرميان وتقنية خط المرمى","en":"Goals and goal line technology"},"ref":"1.10 · 1.11","fig":"goal","body":{"ar":"<ul><li>في <b>منتصف</b> خط المرمى: <b>7.32 م</b> بين الحافتين الداخليتين للقائمين، و<b>2.44 م</b> من أسفل العارضة إلى الأرض.</li>\n  <li>القائمان والعارضة <b>بيض</b>، بعرض وعمق متساويين ≤ <b>12 سم</b>، وبشكل واحد في المرميين.</li>\n  <li>المرمى، حتى المتنقل، <b>مثبت في الأرض</b>. والشباك لا تعيق الحارس.</li></ul>\n  <h3>إذا انكسرت العارضة</h3>\n  <ol><li>يوقف اللعب حتى تُصلح.</li><li>يُستأنف <b>بكرة مسقطة</b>.</li><li>إذا تعذر الإصلاح ← <b>تُلغى المباراة</b>.</li><li><b>لا حبل</b> ولا مادة مرنة مكانها.</li></ol>\n  <h3>تقنية خط المرمى (GLT)</h3>\n  <p>لتحديد <b>دخول الهدف فقط</b>، وبنص لوائح المسابقة. الإشارة خلال <b>ثانية</b> لساعة الحكم أو سماعته. يختبرها الحكم قبل المباراة، وإن لم تعمل لا يستخدمها ويبلغ.</p>","en":"<ul><li>At the <b>centre</b> of each goal line: <b>7.32 m</b> between the inside of the posts and <b>2.44 m</b> from the lower edge of the crossbar to the ground.</li>\n  <li>Posts and crossbar are <b>white</b>, same width and depth ≤ <b>12 cm</b>, same shape in both goals.</li>\n  <li>Goals, including portable ones, are <b>firmly secured</b>. Nets must not interfere with the goalkeeper.</li></ul>\n  <h3>If the crossbar breaks</h3>\n  <ol><li>Stop play until repaired.</li><li>Restart with a <b>dropped ball</b>.</li><li>If it cannot be repaired → <b>abandon the match</b>.</li><li><b>No rope</b> or flexible material in its place.</li></ol>\n  <h3>Goal line technology (GLT)</h3>\n  <p>Decides <b>only whether a goal was scored</b>, if competition rules provide for it. Signal within <b>one second</b> to the referee's watch or earpiece. Tested before the match; if it fails, not used and reported.</p>"},"quiz":[{"ar":["المسافة بين القائمين؟",["7.32 م","7.44 م","8 م"],"7.32 م. (1.10)"],"en":["Distance between the posts?",["7.32 m","7.44 m","8 m"],"7.32 m. (1.10)"],"a":0,"lvl":"b"},{"ar":["انكسرت العارضة ولا بديل، فاقترحوا ربط حبل. القرار؟",["يُسمح بالحبل","تُلغى المباراة إن تعذر الإصلاح"],"لا حبل أبدًا. (1.10)"],"en":["Crossbar broken, no spare; someone suggests a rope. Decision?",["Rope allowed","Abandon if it can't be repaired"],"Never a rope. (1.10)"],"a":1,"lvl":"b"},{"ar":["هل تُستخدم تقنية خط المرمى لخروج الكرة من خط التماس؟",["نعم","لا"],"لخط المرمى وتحديد الهدف فقط. (1.11)"],"en":["Is GLT used for the ball crossing the touchline?",["Yes","No"],"Only for whether a goal was scored. (1.11)"],"a":1,"lvl":"p"}],"k":["مرمى","goal","قائم","post","عارضة","crossbar","7.32","2.44","تقنية خط المرمى","glt","شباك","net"]},{"id":"var","title":{"ar":"الإعلانات والشعارات وحكم الفيديو","en":"Advertising, logos and VAR"},"ref":"1.12 · 1.13 · 1.14","fig":"var","body":{"ar":"<ul><li><b>الإعلانات</b> ممنوعة على أرض الملعب وداخل الشباك والمنطقة الفنية ومنطقة المراجعة وضمن 1 م من الخطوط، وعلى المرميين والرايات. اللوحات القائمة تبعد 1 م على الأقل.</li>\n  <li><b>الشعارات</b> ممنوعة على الملعب والمرميين والشباك وقوائم الرايات أثناء اللعب، ومسموحة على <b>قماش الرايات</b>.</li>\n  <li>في مباريات <b>حكم الفيديو</b>: غرفة تشغيل الفيديو (VOR)، ومنطقة مراجعة (RRA) واحدة على الأقل، ظاهرة خارج الملعب ومحددة بوضوح.</li></ul>\n  <div class=\"tbl\"><table><tr><th>من يدخل…</th><th>العقوبة</th></tr><tr><td>غرفة تشغيل الفيديو (VOR)</td><td><b>طرد</b> 🟥</td></tr><tr><td>منطقة مراجعة الحكم (RRA)</td><td><b>إنذار</b> 🟨</td></tr></table></div>\n  <p class=\"muted\">ينطبق على اللاعب والبديل والمستبدَل ومسؤول الفريق.</p>","en":"<ul><li><b>Advertising</b> is banned on the field, inside the nets, the technical area, the RRA and within 1 m of the lines, and on goals and flagposts. Upright boards at least 1 m away.</li>\n  <li><b>Logos</b> are banned on the field, goals, nets and flagposts during play, but allowed on the <b>flags</b> themselves.</li>\n  <li>In <b>VAR</b> matches: a video operation room (VOR) and at least one referee review area (RRA), visible outside the field and clearly marked.</li></ul>\n  <div class=\"tbl\"><table><tr><th>Entering…</th><th>Sanction</th></tr><tr><td>Video operation room (VOR)</td><td><b>Sending-off</b> 🟥</td></tr><tr><td>Referee review area (RRA)</td><td><b>Caution</b> 🟨</td></tr></table></div>\n  <p class=\"muted\">Applies to players, substitutes, substituted players and team officials.</p>"},"quiz":[{"ar":["بديل يدخل منطقة مراجعة الحكم ليجادله. العقوبة؟",["إنذار","طرد"],"(1.14)"],"en":["A substitute enters the RRA to argue. Sanction?",["Caution","Sending-off"],"(1.14)"],"a":0,"lvl":"p"},{"ar":["مسؤول فريق يدخل غرفة تشغيل الفيديو. العقوبة؟",["إنذار","طرد"],"(1.14)"],"en":["A team official enters the VOR. Sanction?",["Caution","Sending-off"],"(1.14)"],"a":1,"lvl":"p"},{"ar":["شعار النادي على قماش راية الركنية؟",["مسموح","ممنوع"],"مسموح على الرايات. (1.13)"],"en":["Club logo on the corner flag itself?",["Allowed","Not allowed"],"Allowed on the flags. (1.13)"],"a":0,"lvl":"b"}],"k":["إعلان","advert","شعار","logo","var","فيديو","rra","vor","مراجعة"]}],"cases":[{"id":"ball-on-line","lvl":"b","ref":"1.2 · 9.1","a":1,"ar":{"s":"تدحرجت الكرة على خط التماس، وجزء منها فوق الخط ولم تتجاوزه بكاملها. المساعد لم يرفع رايته. ما قرارك؟","o":["رمية تماس للفريق المنافس","الكرة في اللعب، يستمر اللعب","كرة مسقطة"],"d":"الكرة في اللعب","r":"لا يوجد، يستمر اللعب","x":"لا يوجد","w":"الخطوط جزء من المناطق التي تحدّها، فالكرة على خط التماس ما زالت داخل الملعب. لا تخرج إلا إذا تجاوزت الخط بكاملها."},"en":{"s":"The ball rolls along the touchline, part of it on the line, not wholly over it. The assistant doesn't flag. Your call?","o":["Throw-in to the opponents","Ball in play — play on","Dropped ball"],"d":"Ball in play","r":"None — play on","x":"None","w":"Lines belong to the areas they bound, so a ball on the touchline is still on the field. It is out only when wholly over the line."}},{"id":"boot-marks","lvl":"b","ref":"1.2 · 12.4","a":2,"ar":{"s":"أثناء اللعب والكرة في الطرف الآخر من الملعب، رسم الحارس بحذائه خطًا على الأرض أمام مرماه. ما قرارك؟","o":["إيقاف اللعب فورًا وإنذاره","لا شيء، هذا مسموح للحارس","ترك اللعب يستمر، وإنذاره عند أول خروج للكرة"],"d":"يستمر اللعب، ثم إنذار عند أول توقف","r":"حسب سبب التوقف التالي","x":"إنذار (بطاقة صفراء) لسلوك غير رياضي","w":"وضع علامات غير مصرح بها على الملعب سلوك غير رياضي. إذا لاحظه الحكم أثناء اللعب يُنذر اللاعب عندما تخرج الكرة من اللعب في المرة التالية، ولا يوقف اللعب لأجله."},"en":{"s":"During play, with the ball at the far end, the goalkeeper scrapes a line in front of goal with a boot. Your call?","o":["Stop play now and caution","Nothing — goalkeepers may do this","Let play continue; caution when the ball next goes out"],"d":"Play on, caution at the next stoppage","r":"Per the reason for the next stoppage","x":"Caution (yellow) for unsporting behaviour","w":"Making unauthorised marks is unsporting behaviour. Seen during play, the player is cautioned when the ball next goes out of play; play isn't stopped for it."}},{"id":"crossbar-broken","lvl":"b","ref":"1.10","a":0,"ar":{"s":"انكسرت العارضة أثناء اللعب بعد اصطدام الحارس بها. ما الإجراء الصحيح؟","o":["إيقاف اللعب حتى تُصلح أو تُستبدل، ثم كرة مسقطة","استبدالها مؤقتًا بحبل وإكمال المباراة","إكمال اللعب ثم إصلاحها بين الشوطين"],"d":"إيقاف اللعب حتى تُصلح العارضة أو تُستبدل","r":"كرة مسقطة","x":"لا يوجد. وإذا تعذر الإصلاح تُلغى المباراة","w":"إذا انكسرت العارضة أو تحركت من مكانها يُوقف اللعب حتى تُصلح أو تُستبدل، ويُستأنف بكرة مسقطة. لا يجوز استبدالها بحبل أو بأي مادة مرنة أو خطرة. وإذا تعذر إصلاحها تُلغى المباراة."},"en":{"s":"The crossbar breaks during play after the goalkeeper collides with it. Correct procedure?","o":["Stop play until repaired or replaced, then a dropped ball","Use a rope as a temporary crossbar and continue","Play on and fix it at half-time"],"d":"Stop play until the crossbar is repaired or replaced","r":"Dropped ball","x":"None. If it can't be repaired, the match is abandoned","w":"If the crossbar is displaced or broken, play stops until it is repaired or put back; the restart is a dropped ball. It may not be replaced by a rope or anything flexible or dangerous. If it can't be repaired, the match is abandoned."}},{"id":"halfway-flags","lvl":"p","ref":"1.8","a":1,"ar":{"s":"في تفقد الملعب قبل المباراة: رايتا الركنية موجودتان، ووُضعت رايتا خط المنتصف على خط التماس نفسه. ما قرارك؟","o":["لا مشكلة، رايتا المنتصف إلزاميتان في هذا الموضع","تُبعد رايتا المنتصف مترًا على الأقل خارج خط التماس، أو تُزالان","تُلغى المباراة"],"d":"تُبعد رايتا المنتصف مترًا على الأقل خارج خط التماس، أو تُزالان","r":"لا يوجد (قبل المباراة)","x":"لا يوجد","w":"رايات الركنية إلزامية، وارتفاعها 1.5 م على الأقل وبرأس غير مدبب. أما رايتا خط المنتصف فاختياريتان، وإذا وُضعتا يجب أن تكونا على بعد متر واحد على الأقل خارج خط التماس."},"en":{"s":"Pre-match inspection: corner flagposts are in place, but halfway-line flagposts stand on the touchline itself. Your call?","o":["Fine — halfway flags are compulsory there","Move them at least 1 m outside the touchline, or remove them","Abandon the match"],"d":"Move the halfway flagposts at least 1 m outside the touchline, or remove them","r":"None (pre-match)","x":"None","w":"Corner flagposts are compulsory (at least 1.5 m, non-pointed top). Halfway flagposts are optional; if used, they must be at least 1 m outside the touchline."}},{"id":"glt-test","lvl":"p","ref":"1.11","a":2,"ar":{"s":"مباراة تنص لوائحها على استخدام تقنية خط المرمى (GLT). في الاختبار قبل المباراة لم يعمل النظام وفق دليل الاختبار. ما قرارك؟","o":["تأجيل المباراة حتى يُصلح النظام","استخدام النظام مع الحذر","عدم استخدام النظام، وإبلاغ الجهات المختصة، وإدارة المباراة بدونه"],"d":"لا يُستخدم النظام، ويُرفع تقرير للجهات المختصة","r":"لا يوجد (قبل المباراة)","x":"لا يوجد","w":"إذا لم تعمل التقنية وفق دليل الاختبار، يجب على الحكم ألا يستخدمها، وأن يبلغ الجهات المختصة. والقرار في الأهداف يعود عندها إلى تقدير طاقم التحكيم."},"en":{"s":"Competition rules require goal-line technology (GLT). In the pre-match test the system fails the Testing Manual. Your call?","o":["Postpone until it's fixed","Use it with caution","Don't use it, report it to the appropriate authorities, and officiate without it"],"d":"Don't use GLT; report it to the appropriate authorities","r":"None (pre-match)","x":"None","w":"If the technology doesn't work per the Testing Manual, the referee must not use it and must report this to the appropriate authorities. Goal decisions then rest with the match officials."}}],"myths":[{"id":"line-is-out","ref":"1.2 · 9.1","t":false,"ar":{"s":"الكرة التي تلمس الخط تكون قد خرجت من الملعب.","w":"الخطوط جزء من المساحات التي تحدها، فالكرة التي تلمس خط التماس أو خط المرمى لم تغادر ميدان اللعب. لا تخرج الكرة من اللعب إلا إذا تجاوزت الخط بكاملها، سواء على الأرض أو في الهواء."},"en":{"s":"If the ball is touching the line, it's out.","w":"Lines belong to the areas they bound, so a ball touching the touchline or goal line has not left the field of play. It is out of play only when the whole ball has passed over the line, on the ground or in the air."}},{"id":"fixed-pitch-size","ref":"1.3","t":false,"ar":{"s":"كل ملاعب كرة القدم يجب أن تكون بمقاس واحد هو 105 × 68 مترًا.","w":"لا يوجد مقاس واحد: طول خط التماس بين 90 و120 مترًا وخط المرمى بين 45 و90 مترًا، مع اشتراط أن يكون خط التماس أطول. وفي المباريات الدولية يكون الطول بين 100 و110 أمتار والعرض بين 64 و75 مترًا."},"en":{"s":"Every football pitch has to be exactly 105 by 68 metres.","w":"There is no single size: the touchline must be 90-120 m and the goal line 45-90 m, with the touchline always longer. For international matches the range is 100-110 m by 64-75 m."}},{"id":"rra-entry-caution","ref":"1.14","t":true,"ar":{"s":"اللاعب الذي يدخل منطقة مراجعة الحكم يُعاقب بالإنذار.","w":"صحيح: في المباريات التي تستخدم حكم الفيديو المساعد، يُنذر أي لاعب أو بديل أو لاعب مستبدل أو إداري يدخل منطقة مراجعة الحكم (RRA)، أما دخول غرفة تشغيل الفيديو (VOR) فعقوبته الطرد."},"en":{"s":"A player who steps into the referee review area gets a yellow card.","w":"True: in matches using VAR, a player, substitute, substituted player or team official who enters the referee review area (RRA) is cautioned; entering the video operation room (VOR) is a sending-off."}}]},"2":{"pages":{"ar":"ع ص 55–56 · EN p.55–56","en":"EN p.55–56 · AR p.55–56"},"parts":[{"id":"specs","title":{"ar":"المواصفات والمقاييس","en":"Qualities and measurements"},"ref":"2.1","fig":"ball","k":["كرة","ball","محيط","circumference","وزن","weight","ضغط","pressure","68","70","410","450","جودة","quality"],"body":{"ar":"<p>كل كرة يجب أن تكون:</p>\n<div class=\"tbl\"><table><tr><th>الصفة</th><th>الحد</th></tr>\n<tr><td>الشكل</td><td>مستديرة، ومن مادة مناسبة</td></tr>\n<tr><td>المحيط</td><td class=\"num\">68 – 70 سم</td></tr>\n<tr><td>الوزن عند بداية المباراة</td><td class=\"num\">410 – 450 غ</td></tr>\n<tr><td>الضغط عند مستوى سطح البحر</td><td class=\"num\">0.6 – 1.1 ضغط جوي</td></tr></table></div>\n<ul><li>في المسابقات الرسمية التي ينظمها FIFA أو الاتحادات القارية: يجب أن تحمل الكرة إحدى علامات <b>برنامج FIFA للجودة</b>. وللاتحادات الوطنية أن تشترط ذلك في مسابقاتها.</li>\n<li><b>الإعلانات على الكرة</b> في المسابقات الرسمية ممنوعة، إلا شعار المسابقة والجهة المنظمة والعلامة التجارية للمصنّع.</li></ul>\n<div class=\"note judge\"><b>مسؤولية الحكم:</b> يفحص الكرات قبل المباراة. الوزن المذكور هو <b>عند بداية</b> المباراة، لأن الكرة قد يتغير وزنها بالمطر.</div>","en":"<p>Every ball must be:</p>\n<div class=\"tbl\"><table><tr><th>Quality</th><th>Limit</th></tr>\n<tr><td>Shape</td><td>Spherical, suitable material</td></tr>\n<tr><td>Circumference</td><td class=\"num\">68 – 70 cm</td></tr>\n<tr><td>Weight at the start of the match</td><td class=\"num\">410 – 450 g</td></tr>\n<tr><td>Pressure at sea level</td><td class=\"num\">0.6 – 1.1 atm</td></tr></table></div>\n<ul><li>In official FIFA or confederation competitions the ball must carry a <b>FIFA Quality Programme</b> mark; national FAs may require it too.</li>\n<li><b>No advertising on the ball</b> in official competitions, except the competition logo, the organiser and the manufacturer's trademark.</li></ul>\n<div class=\"note judge\"><b>Referee's job:</b> check the balls before the match. The weight limit applies <b>at the start</b>; rain can change it later.</div>"},"quiz":[{"ar":["محيط الكرة القانوني؟",["60 – 64 سم","68 – 70 سم","72 – 74 سم"],"(2.1)"],"en":["Legal circumference?",["60 – 64 cm","68 – 70 cm","72 – 74 cm"],"(2.1)"],"a":1,"lvl":"b"},{"ar":["متى يُقاس وزن الكرة (410 – 450 غ)؟",["عند بداية المباراة","في أي وقت"],"الحد عند البداية. (2.1)"],"en":["When does the 410–450 g weight limit apply?",["At the start of the match","At any time"],"At the start. (2.1)"],"a":0,"lvl":"b"},{"ar":["في مسابقة رسمية، هل يُسمح بإعلان راعٍ تجاري على الكرة؟",["نعم","لا، فقط شعار المسابقة والمنظم والمصنّع"],"(2.1)"],"en":["In an official competition, may a sponsor's advert appear on the ball?",["Yes","No — only competition, organiser and manufacturer marks"],"(2.1)"],"a":1,"lvl":"p"}]},{"id":"defective","title":{"ar":"الكرة التالفة والكرات الإضافية","en":"Defective ball and additional balls"},"ref":"2.2 · 2.3","fig":"ballflow","k":["تالفة","defective","انفجرت","burst","كرة مسقطة","dropped ball","استبدال","replace","إضافية","additional"],"body":{"ar":"<div class=\"tbl\"><table><tr><th>متى تلفت الكرة؟</th><th>القرار</th></tr>\n<tr><td>أثناء اللعب</td><td>يوقف اللعب ويُستأنف <b>بكرة مسقطة</b></td></tr>\n<tr><td>عند تنفيذ ركلة البداية أو ركلة المرمى أو الركنية أو الحرة أو الجزاء أو رمية التماس</td><td><b>تُعاد</b> الركلة أو الرمية</td></tr>\n<tr><td>أثناء ركلة جزاء أو ركلات الترجيح وهي تتحرك للأمام، <b>قبل</b> أن تلمس لاعبًا أو العارضة أو القائم</td><td><b>تُعاد</b> ركلة الجزاء</td></tr></table></div>\n<ul><li>لا تُغيَّر الكرة أثناء المباراة <b>إلا بإذن الحكم</b>.</li>\n<li>يجوز وضع <b>كرات إضافية</b> مطابقة للقانون 2 حول الملعب، واستخدامها تحت إشراف الحكم.</li></ul>","en":"<div class=\"tbl\"><table><tr><th>When did the ball become defective?</th><th>Decision</th></tr>\n<tr><td>During play</td><td>Stop and restart with a <b>dropped ball</b></td></tr>\n<tr><td>At a kick-off, goal kick, corner, free kick, penalty kick or throw-in</td><td>The restart is <b>retaken</b></td></tr>\n<tr><td>During a penalty kick or penalties, moving forward, <b>before</b> touching a player, the crossbar or a post</td><td>The penalty is <b>retaken</b></td></tr></table></div>\n<ul><li>The ball may not be changed during the match <b>without the referee's permission</b>.</li>\n<li><b>Additional balls</b> meeting Law 2 may be placed around the field; their use is under the referee's control.</li></ul>"},"quiz":[{"ar":["انفجرت الكرة أثناء هجمة. كيف يُستأنف اللعب؟",["ركلة حرة غير مباشرة","كرة مسقطة","رمية تماس"],"(2.2)"],"en":["The ball bursts during an attack. Restart?",["Indirect free kick","Dropped ball","Throw-in"],"(2.2)"],"a":1,"lvl":"b"},{"ar":["انفجرت الكرة لحظة تنفيذ ركلة ركنية. القرار؟",["تُعاد الركنية","كرة مسقطة"],"تُعاد الركلة. (2.2)"],"en":["The ball bursts as a corner kick is taken. Decision?",["Retake the corner","Dropped ball"],"Retake. (2.2)"],"a":0,"lvl":"b"},{"ar":["انفجرت الكرة في ركلة جزاء قبل أن تلمس أحدًا أو القائم. القرار؟",["تُعاد ركلة الجزاء","كرة مسقطة","ركلة مرمى"],"(2.2)"],"en":["The ball bursts at a penalty before touching anyone or the frame. Decision?",["Retake the penalty","Dropped ball","Goal kick"],"(2.2)"],"a":0,"lvl":"p"}]}],"cases":[{"id":"burst-play","lvl":"b","ref":"2.2","a":1,"ar":{"s":"أثناء اللعب انفجرت الكرة في منتصف الملعب بعد التحام. ما قرارك؟","o":["يستمر اللعب حتى تخرج الكرة","إيقاف اللعب، ثم كرة مسقطة","رمية تماس للفريق الذي كان مستحوذًا"],"d":"إيقاف اللعب وتبديل الكرة","r":"كرة مسقطة","x":"لا يوجد","w":"إذا تلفت الكرة أثناء اللعب يُوقف اللعب ويُستأنف بكرة مسقطة."},"en":{"s":"During play the ball bursts in midfield after a challenge. Your call?","o":["Play on until it goes out","Stop play, then a dropped ball","Throw-in to the team in possession"],"d":"Stop play and replace the ball","r":"Dropped ball","x":"None","w":"If the ball becomes defective during play, play is stopped and restarted with a dropped ball."}},{"id":"burst-corner","lvl":"b","ref":"2.2","a":2,"ar":{"s":"عند تنفيذ ركلة ركنية انفجرت الكرة لحظة ركلها، قبل أن تلمس أحدًا. ما قرارك؟","o":["كرة مسقطة","ركلة مرمى","تُعاد الركلة الركنية"],"d":"تُعاد الركلة الركنية بكرة سليمة","r":"ركلة ركنية (إعادة)","x":"لا يوجد","w":"إذا تلفت الكرة عند تنفيذ ركلة البداية أو ركلة المرمى أو الركنية أو الركلة الحرة أو ركلة الجزاء أو رمية التماس، يُعاد الاستئناف نفسه."},"en":{"s":"At a corner kick the ball bursts as it is kicked, before touching anyone. Your call?","o":["Dropped ball","Goal kick","Retake the corner"],"d":"Retake the corner with a sound ball","r":"Corner kick (retaken)","x":"None","w":"If the ball becomes defective at a kick-off, goal kick, corner, free kick, penalty or throw-in, the restart is retaken."}},{"id":"ball-size","lvl":"b","ref":"2.1","a":0,"ar":{"s":"في فحص الكرات قبل المباراة كان محيط إحدى الكرات 72 سم. ما قرارك؟","o":["لا تُستخدم، فالمحيط يجب أن يكون بين 68 و70 سم","تُستخدم إذا كان الضغط مناسبًا","تُستخدم كرة احتياطية فقط"],"d":"استبعاد الكرة","r":"لا يوجد (قبل المباراة)","x":"لا يوجد","w":"الكرة يجب أن تكون كروية ومحيطها بين 68 و70 سم، ووزنها بين 410 و450 غرامًا عند بداية المباراة، وضغطها بين 0.6 و1.1 ضغط جوي. والكرات الإضافية حول الملعب يجب أن تستوفي الشروط نفسها."},"en":{"s":"In the pre-match ball check one ball measures 72 cm round. Your call?","o":["Don't use it — circumference must be 68–70 cm","Use it if the pressure is right","Use it as a spare only"],"d":"Reject the ball","r":"None (pre-match)","x":"None","w":"A ball must be spherical, 68–70 cm in circumference, 410–450 g at the start and 0.6–1.1 atm. Additional balls around the field must meet the same requirements."}},{"id":"burst-penalty","lvl":"p","ref":"2.2","a":2,"ar":{"s":"نُفذت ركلة جزاء، وانفجرت الكرة وهي تتجه للأمام قبل أن تلمس الحارس أو القائمين أو العارضة. ما قرارك؟","o":["كرة مسقطة للحارس","ركلة مرمى","تُعاد ركلة الجزاء"],"d":"تُعاد ركلة الجزاء","r":"ركلة جزاء (إعادة)","x":"لا يوجد","w":"إذا تلفت الكرة في ركلة الجزاء أو ركلات الترجيح وهي تتحرك للأمام وقبل أن تلمس لاعبًا أو العارضة أو القائمين، تُعاد الركلة."},"en":{"s":"A penalty is taken and the ball bursts while moving forward, before touching the goalkeeper, posts or crossbar. Your call?","o":["Dropped ball to the goalkeeper","Goal kick","Retake the penalty"],"d":"Retake the penalty","r":"Penalty kick (retaken)","x":"None","w":"If the ball becomes defective during a penalty or shoot-out kick while moving forward and before touching a player, crossbar or posts, the kick is retaken."}},{"id":"burst-rebound","lvl":"p","ref":"2.2 · 8.2","a":1,"ar":{"s":"ارتطمت ركلة الجزاء بالقائم وارتدت داخل منطقة الجزاء، ثم انفجرت الكرة قبل أن يلمسها أي لاعب. ما قرارك؟","o":["تُعاد ركلة الجزاء","إيقاف اللعب وكرة مسقطة لحارس الفريق المدافع","ركلة مرمى"],"d":"إيقاف اللعب","r":"كرة مسقطة لحارس الفريق المدافع داخل منطقة جزائه","x":"لا يوجد","w":"الإعادة تكون فقط إذا تلفت الكرة قبل أن تلمس لاعبًا أو القائم أو العارضة. هنا لمست القائم فأصبحت في اللعب العادي، فيُوقف اللعب ويُستأنف بكرة مسقطة. ولأن اللعب توقف والكرة داخل منطقة الجزاء، تُسقط لحارس الفريق المدافع."},"en":{"s":"A penalty hits the post and rebounds inside the penalty area, then the ball bursts before any player touches it. Your call?","o":["Retake the penalty","Stop play; dropped ball to the defending goalkeeper","Goal kick"],"d":"Stop play","r":"Dropped ball to the defending goalkeeper in their penalty area","x":"None","w":"A retake applies only if the ball fails before touching a player, the posts or crossbar. Here it hit the post, so it's normal play: stop and restart with a dropped ball — for the defending goalkeeper, as play stopped inside the penalty area."}}],"myths":[{"id":"burst-ball-possession","ref":"2.2 · 8.2","t":false,"ar":{"s":"إذا انفجرت الكرة أثناء اللعب، يحتسب الحكم ركلة حرة للفريق الذي كانت الكرة بحوزته.","w":"لا توجد ركلة حرة: يوقف الحكم اللعب ويستأنفه بكرة مسقطة. إذا كانت الكرة داخل منطقة الجزاء تُسقط لحارس الفريق المدافع، وإذا كانت خارجها تُسقط للاعب واحد من الفريق الذي كان سيحتفظ بالكرة أو يستحوذ عليها، ويبتعد الباقون 4 أمتار على الأقل. وإذا تلفت الكرة عند تنفيذ استئناف (مثل ركلة ركنية أو رمية تماس) يُعاد ذلك الاستئناف."},"en":{"s":"If the ball bursts during play, the referee awards a free kick to the team that had it.","w":"There is no free kick: play is stopped and restarted with a dropped ball. Inside the penalty area it goes to the defending goalkeeper; outside, to one player of the team that would have kept or gained possession, with everyone else at least 4 m away. If the ball becomes defective at a restart such as a corner kick or throw-in, that restart is retaken."}},{"id":"swap-ball-freely","ref":"2.2","t":false,"ar":{"s":"يحق للاعب أن يأخذ أي كرة احتياطية من جانب الملعب ويكمل اللعب بها متى شاء.","w":"لا يجوز تغيير الكرة أثناء المباراة دون إذن الحكم، والكرات الإضافية الموضوعة حول الملعب يكون استخدامها تحت سيطرة الحكم."},"en":{"s":"A player can grab any spare ball from the side and carry on with it whenever they like.","w":"The ball may not be changed during the match without the referee's permission, and the use of additional balls placed around the field is under the referee's control."}},{"id":"penalty-ball-bursts","ref":"2.2","t":true,"ar":{"s":"إذا انفجرت الكرة وهي في طريقها إلى المرمى من ركلة جزاء، تُعاد الركلة.","w":"صحيح: إذا تلفت الكرة أثناء ركلة الجزاء أو ركلات الترجيح وهي تتحرك للأمام وقبل أن تلمس لاعبًا أو العارضة أو القائمين، تُعاد ركلة الجزاء."},"en":{"s":"If the ball bursts on its way to goal from a penalty, the kick is retaken.","w":"True: if the ball becomes defective during a penalty kick or penalties as it moves forward and before it touches a player, the crossbar or a goalpost, the penalty kick is retaken."}}]},"3":{"pages":{"ar":"ع ص 59–65 · EN p.59–65","en":"EN p.59–65 · AR p.59–65"},"parts":[{"id":"number","title":{"ar":"عدد اللاعبين","en":"Number of players"},"ref":"3.1","fig":"team","k":["عدد اللاعبين","players","11","سبعة","7","seven","حارس","goalkeeper"],"body":{"ar":"<ul><li>فريقان، لكل منهما <b>11 لاعبًا كحد أقصى</b>، أحدهم حارس المرمى.</li>\n<li><b>لا تبدأ المباراة ولا تستمر</b> إذا كان لدى أحد الفريقين <b>أقل من 7 لاعبين</b>.</li>\n<li>إذا نقص الفريق عن 7 لأن لاعبًا خرج <b>متعمدًا</b>: الحكم غير ملزم بإيقاف اللعب فورًا ويمكنه تطبيق الميزة، لكن <b>لا يُستأنف اللعب</b> بعد خروج الكرة ما دام العدد أقل من 7.</li>\n<li>إذا اشترطت اللوائح تسمية اللاعبين والبدلاء قبل البداية وبدأ فريق بأقل من 11، فلا يشارك عند وصوله إلا من هو مسجل في القائمة.</li></ul>","en":"<ul><li>Two teams of <b>up to 11 players</b>, one of them the goalkeeper.</li>\n<li>A match <b>may not start or continue</b> if a team has <b>fewer than 7</b>.</li>\n<li>If a team drops below 7 because a player <b>deliberately</b> left: the referee need not stop play at once and may play advantage, but play <b>must not restart</b> after the ball is out while the team has fewer than 7.</li>\n<li>If competition rules require names before kick-off and a team starts with fewer than 11, only named players and substitutes may join on arrival.</li></ul>"},"quiz":[{"ar":["أقل عدد لاعبين لبدء المباراة أو استمرارها؟",["6","7","8"],"(3.1)"],"en":["Minimum number of players to start or continue?",["6","7","8"],"(3.1)"],"a":1,"lvl":"b"},{"ar":["فريق لديه 7 لاعبين، وطُرد لاعب. هل تستمر المباراة؟",["نعم","لا"],"صار العدد 6، أقل من 7. (3.1)"],"en":["A team with 7 players has one sent off. Does the match continue?",["Yes","No"],"Now 6, below 7. (3.1)"],"a":1,"lvl":"b"}]},{"id":"subs","title":{"ar":"عدد التبديلات","en":"Number of substitutions"},"ref":"3.2","k":["تبديل","substitut","خمسة","five","فرص","opportunit","وقت إضافي","extra time","عودة المستبدلين","return","ارتجاج","concussion"],"body":{"ar":"<div class=\"tbl\"><table><tr><th>نوع المباراة</th><th>القاعدة</th></tr>\n<tr><td>المسابقات الرسمية</td><td>حتى <b>5</b> تبديلات يحددها FIFA أو الاتحاد القاري أو الوطني. في مسابقات الدرجة الأولى والمنتخبات الأولى التي تسمح بـ5: <b>3 فرص تبديل</b> كحد أقصى، إضافة إلى التبديل بين الشوطين</td></tr>\n<tr><td>الوقت الإضافي</td><td>ما لم يُستخدم يُستخدم فيه. وإن سمحت اللوائح ببديل إضافي فله فرصة إضافية. التبديل قبل الوقت الإضافي وبين شوطيه لا يُحسب فرصة</td></tr>\n<tr><td>مباريات المنتخبات الأولى الأخرى</td><td>حتى <b>15</b> بديلًا في القائمة، يُستخدم منهم <b>8</b>، أو حتى 11 باتفاق الفريقين وإبلاغ الحكم</td></tr>\n<tr><td>المباريات الأخرى</td><td>عدد أكبر باتفاق الفريقين وإبلاغ الحكم. بدون اتفاق: <b>6</b> تبديلات</td></tr></table></div>\n<ul><li><b>فرصة التبديل:</b> تبديلات الفريق في توقف واحد تُحسب فرصة واحدة. وإذا بدّل الفريقان في الوقت نفسه تُحسب فرصة لكل منهما.</li>\n<li><b>لوائح المسابقة</b> تحدد عدد البدلاء في القائمة (من 3 إلى 15)، والبديل الإضافي في الوقت الإضافي.</li>\n<li><b>عودة المستبدلين</b> مسموحة فقط في كرة الناشئين والقدامى وذوي الإعاقة والقاعدة الشعبية، بموافقة الاتحاد المعني.</li>\n<li><b>تبديلات الارتجاج الإضافية الدائمة</b> يجوز للمسابقات استخدامها وفق البروتوكول الخاص.</li></ul>","en":"<div class=\"tbl\"><table><tr><th>Match type</th><th>Rule</th></tr>\n<tr><td>Official competitions</td><td>Up to <b>5</b> substitutes, set by FIFA, the confederation or the national FA. In top-division and senior ‘A’ competitions allowing 5: at most <b>3 substitution opportunities</b>, plus half-time</td></tr>\n<tr><td>Extra time</td><td>Unused substitutes/opportunities carry over; an extra substitute (if permitted) brings one extra opportunity. Changes before extra time and at its half-time don't count as opportunities</td></tr>\n<tr><td>Other senior ‘A’ internationals</td><td>Up to <b>15</b> named, <b>8</b> used, or up to 11 if both teams agree and the referee is told</td></tr>\n<tr><td>All other matches</td><td>More if both teams agree and the referee is told; otherwise <b>6</b></td></tr></table></div>\n<ul><li><b>Opportunity:</b> all of a team's changes in one stoppage count as one; if both teams change at once, it counts for both.</li>\n<li><b>Competition rules</b> set how many may be named (3 to 15) and any extra substitute in extra time.</li>\n<li><b>Return substitutions</b> only in youth, veterans, disability and grassroots football, with the relevant FA's agreement.</li>\n<li><b>Additional permanent concussion substitutions</b> may be used under the protocol.</li></ul>"},"quiz":[{"ar":["فريق أجرى 3 تبديلات في توقف واحد. كم فرصة استخدم؟",["فرصة واحدة","3 فرص"],"(3.2)"],"en":["A team makes 3 changes in one stoppage. Opportunities used?",["One","Three"],"(3.2)"],"a":0,"lvl":"b"},{"ar":["مباراة ودية لم يتفق فيها الفريقان على العدد. كم تبديلًا مسموحًا؟",["3","5","6"],"(3.2)"],"en":["A friendly with no agreement on numbers. How many substitutes?",["3","5","6"],"(3.2)"],"a":2,"lvl":"b"},{"ar":["هل عودة اللاعب المستبدَل مسموحة في دوري المحترفين؟",["نعم","لا"],"فقط في فئات محددة. (3.2)"],"en":["Are return substitutions allowed in a professional league?",["Yes","No"],"Only in specific categories. (3.2)"],"a":1,"lvl":"p"}]},{"id":"procedure","title":{"ar":"إجراءات التبديل وتغيير الحارس","en":"Substitution procedure and changing the goalkeeper"},"ref":"3.3 · 3.4","fig":"sub","k":["إجراءات التبديل","procedure","عشر ثوان","10","ten seconds","لوحة","board","خط المنتصف","تغيير الحارس","goalkeeper change"],"body":{"ar":"<ul><li>أسماء البدلاء تُعطى للحكم <b>قبل البداية</b>؛ ومن لم يُسجَّل لا يشارك.</li>\n<li>يُبلَغ الحكم قبل أي تبديل.</li></ul>\n<h3>اللاعب الخارج</h3>\n<ul><li>يأخذ إذن الحكم، ويخرج من <b>أقرب نقطة</b> على خط الحدود، إلا إذا أشار الحكم لغير ذلك (السلامة أو الإصابة).</li>\n<li>يجب أن يخرج خلال <b>10 ثوانٍ</b> من رفع لوحة التبديل أو إشارة الحكم. وفي التبديلات المتعددة: خلال 10 ثوانٍ من إعلان آخر تبديل.</li>\n<li>يذهب مباشرة للمنطقة الفنية أو غرفة الملابس، ولا يشارك مرة أخرى (إلا حيث تُسمح العودة).</li>\n<li>إذا رفض الخروج، يستمر اللعب.</li></ul>\n<h3>البديل يدخل فقط</h3>\n<ol><li>أثناء توقف اللعب،</li><li>من <b>خط المنتصف</b>،</li><li>بعد خروج اللاعب المستبدَل،</li><li>بعد إشارة الحكم.</li></ol>\n<p>يكتمل التبديل <b>بدخول البديل</b>، فيصبح لاعبًا ويمكنه تنفيذ أي استئناف.</p>\n<h3>تغيير الحارس</h3>\n<p>أي لاعب يبادل الحارس مكانه بشرطين: <b>إبلاغ الحكم</b>، وأن يكون التغيير <b>أثناء توقف اللعب</b>.</p>","en":"<ul><li>Substitutes' names go to the referee <b>before kick-off</b>; anyone not named may not play.</li>\n<li>The referee is told before any substitution.</li></ul>\n<h3>The player going off</h3>\n<ul><li>Gets permission and leaves at the <b>nearest point</b> of the boundary, unless the referee indicates otherwise (safety or injury).</li>\n<li>Must be off within <b>10 seconds</b> of the board or the referee's signal; with several changes, within 10 seconds of the last one being indicated.</li>\n<li>Goes straight to the technical area or dressing room and takes no further part (unless return substitutions apply).</li>\n<li>If they refuse to leave, play continues.</li></ul>\n<h3>The substitute enters only</h3>\n<ol><li>during a stoppage,</li><li>at the <b>halfway line</b>,</li><li>after the player has left,</li><li>after the referee's signal.</li></ol>\n<p>The substitution is complete <b>when the substitute enters</b>; they can then take any restart.</p>\n<h3>Changing the goalkeeper</h3>\n<p>Any player may swap with the goalkeeper if the <b>referee is informed</b> and it happens <b>during a stoppage</b>.</p>"},"quiz":[{"ar":["من أين يدخل البديل؟",["أي نقطة","خط المنتصف","خلف المرمى"],"(3.3)"],"en":["Where does the substitute enter?",["Anywhere","Halfway line","Behind the goal"],"(3.3)"],"a":1,"lvl":"b"},{"ar":["خلال كم ثانية يجب أن يخرج اللاعب المستبدَل؟",["5","10","30"],"(3.3)"],"en":["Within how many seconds must the substituted player leave?",["5","10","30"],"(3.3)"],"a":1,"lvl":"b"},{"ar":["متى يكتمل التبديل؟",["عند رفع اللوحة","عند خروج اللاعب","عند دخول البديل"],"(3.3)"],"en":["When is the substitution complete?",["When the board goes up","When the player leaves","When the substitute enters"],"(3.3)"],"a":2,"lvl":"b"}]},{"id":"offences","title":{"ar":"المخالفات والعقوبات والمطرودون","en":"Offences, sanctions and sent-off players"},"ref":"3.5 · 3.6","k":["مخالفات","offences","تأخير","10 ثوان","دقيقة","minute","مطرود","sent off","قائمة","team list"],"body":{"ar":"<div class=\"tbl\"><table><tr><th>المخالفة</th><th>الإجراء</th></tr>\n<tr><td>بديل مسجل بدأ المباراة بدل لاعب مسجل دون إبلاغ الحكم</td><td>يستمر البديل، بلا عقوبة، ولا ينقص عدد التبديلات، ويصبح اللاعب بديلًا، ويُرفع تقرير</td></tr>\n<tr><td>لاعب بادل الحارس دون إذن</td><td>يستمر اللعب، ويُنذر الاثنان عند خروج الكرة (إلا إذا كان التغيير بين الشوطين أو قبل الوقت الإضافي أو الترجيح)</td></tr>\n<tr><td>اللاعب المستبدَل لم يخرج خلال 10 ثوانٍ</td><td>يخرج على أي حال، ولا يُنذر إلا إذا أخّر الاستئناف كثيرًا. <b>لا يدخل البديل</b>، ويُستأنف اللعب، ولا يُلغى التبديل ولا يُغيَّر البديل. يدخل البديل بإذن الحكم في <b>أول توقف بعد مرور دقيقة</b> من الاستئناف</td></tr>\n<tr><td>أي مخالفة أخرى لإجراءات التبديل</td><td>إنذار + <b>ركلة حرة غير مباشرة</b> من مكان الكرة</td></tr></table></div>\n<h3>المطرودون</h3>\n<ul><li>طُرد <b>قبل تقديم القائمة</b>: لا يُسجَّل فيها بأي صفة.</li>\n<li>طُرد <b>بعد تسجيله وقبل البداية</b>: يحل محله بديل مسجل (ولا يُعوَّض البديل)، ولا ينقص عدد التبديلات.</li>\n<li>طُرد <b>بعد ركلة البداية</b>: لا يُعوَّض.</li>\n<li>بديل مسجل طُرد قبل البداية أو بعدها: لا يُعوَّض.</li></ul>","en":"<div class=\"tbl\"><table><tr><th>Offence</th><th>Action</th></tr>\n<tr><td>A named substitute starts instead of a named player without telling the referee</td><td>Substitute continues, no sanction, substitutions not reduced, player becomes a substitute, report</td></tr>\n<tr><td>A player swaps with the goalkeeper without permission</td><td>Play on; caution both when the ball is next out (not if done at half-time or before extra time/penalties)</td></tr>\n<tr><td>Substituted player not off within 10 seconds</td><td>Must still leave; cautioned only for excessive delay. <b>Substitute may not enter yet</b>, play restarts, the substitution can't be cancelled or changed. The substitute enters with permission at the <b>first stoppage after one minute</b></td></tr>\n<tr><td>Any other procedural offence</td><td>Caution + <b>indirect free kick</b> from where the ball was</td></tr></table></div>\n<h3>Sent-off players</h3>\n<ul><li>Sent off <b>before the team list</b>: can't be named in any capacity.</li>\n<li><b>After being named, before kick-off</b>: may be replaced by a named substitute (who can't be replaced); substitutions not reduced.</li>\n<li><b>After kick-off</b>: can't be replaced.</li>\n<li>A named substitute sent off before or after kick-off can't be replaced.</li></ul>"},"quiz":[{"ar":["اللاعب المستبدَل تأخر أكثر من 10 ثوانٍ. متى يدخل البديل؟",["فورًا","في أول توقف بعد مرور دقيقة من الاستئناف","بين الشوطين"],"(3.5)"],"en":["The substituted player took more than 10 seconds. When may the substitute enter?",["Immediately","First stoppage after one minute from the restart","At half-time"],"(3.5)"],"a":1,"lvl":"p"},{"ar":["لاعب بادل الحارس أثناء اللعب دون إذن. القرار؟",["إيقاف فوري وركلة حرة","يستمر اللعب ويُنذر الاثنان عند خروج الكرة"],"(3.5)"],"en":["A player swaps with the goalkeeper during play without permission. Decision?",["Stop at once, free kick","Play on; caution both when the ball is out"],"(3.5)"],"a":1,"lvl":"b"},{"ar":["لاعب طُرد في الدقيقة 30. هل يُعوَّض ببديل؟",["نعم","لا"],"(3.6)"],"en":["A player is sent off in the 30th minute. Can he be replaced?",["Yes","No"],"(3.6)"],"a":1,"lvl":"b"}]},{"id":"extra","title":{"ar":"الأشخاص الزائدون واللاعب خارج الملعب","en":"Extra persons and players off the field"},"ref":"3.7 · 3.8","fig":"extra","k":["شخص زائد","extra person","عنصر خارجي","outside agent","مسؤول الفريق","team official","دخول دون إذن","without permission"],"body":{"ar":"<ul><li><b>مسؤولو الفريق:</b> المدرب وغيره من المسجلين في القائمة (غير اللاعبين والبدلاء).</li>\n<li><b>العنصر الخارجي:</b> أي شخص غير مسجل في القائمة كلاعب أو بديل أو مسؤول.</li></ul>\n<h3>إذا دخل شخص زائد الملعب</h3>\n<p>يوقف الحكم اللعب <b>فقط إذا تدخل في اللعب</b>، ويُخرجه عند التوقف، ويتخذ الإجراء الانضباطي.</p>\n<div class=\"tbl\"><table><tr><th>من تدخّل؟</th><th>الاستئناف</th></tr>\n<tr><td>مسؤول فريق، أو بديل، أو مستبدَل، أو مطرود</td><td><b>ركلة حرة مباشرة</b> أو ركلة جزاء</td></tr>\n<tr><td>عنصر خارجي</td><td><b>كرة مسقطة</b></td></tr></table></div>\n<div class=\"note\">كرة متجهة للمرمى، والتدخل <b>لم يمنع</b> مدافعًا من لعبها: يُحتسب الهدف إذا دخلت، حتى لو لُمست، <b>ما لم يكن التدخل من الفريق المهاجم</b>.</div>\n<h3>لاعب يعود دون إذن</h3>\n<ul><li>يوقف الحكم اللعب (ليس فورًا إن لم يتدخل أو أمكن تطبيق الميزة)، و<b>يُنذر</b> اللاعب.</li>\n<li>الاستئناف: <b>ركلة حرة مباشرة</b> من مكان التدخل، أو <b>غير مباشرة</b> من مكان الكرة إن لم يحدث تدخل.</li>\n<li>تجاوز الخط كجزء من حركة اللعب <b>ليس مخالفة</b>.</li></ul>","en":"<ul><li><b>Team officials:</b> the coach and others named on the team list (not players or substitutes).</li>\n<li><b>Outside agent:</b> anyone not named as a player, substitute or team official.</li></ul>\n<h3>If an extra person enters the field</h3>\n<p>The referee stops play <b>only if there is interference</b>, has the person removed and takes disciplinary action.</p>\n<div class=\"tbl\"><table><tr><th>Who interfered?</th><th>Restart</th></tr>\n<tr><td>Team official, substitute, substituted or sent-off player</td><td><b>Direct free kick</b> or penalty kick</td></tr>\n<tr><td>Outside agent</td><td><b>Dropped ball</b></td></tr></table></div>\n<div class=\"note\">A ball heading into goal where the interference <b>does not stop</b> a defender playing it: goal awarded if it goes in, even after contact, <b>unless the interference was by the attacking team</b>.</div>\n<h3>Player re-entering without permission</h3>\n<ul><li>Stop play (not at once if no interference or advantage applies) and <b>caution</b> the player.</li>\n<li>Restart: <b>direct free kick</b> where they interfered, or <b>indirect</b> from the ball's position if no interference.</li>\n<li>Crossing a line as part of playing movement is <b>not an offence</b>.</li></ul>"},"quiz":[{"ar":["مشجع دخل الملعب ولمس الكرة فأوقف الحكم اللعب. الاستئناف؟",["ركلة حرة مباشرة","كرة مسقطة"],"عنصر خارجي. (3.7)"],"en":["A spectator runs on and touches the ball; play stopped. Restart?",["Direct free kick","Dropped ball"],"Outside agent. (3.7)"],"a":1,"lvl":"b"},{"ar":["بديل دخل الملعب وأوقف هجمة بلمس الكرة. الاستئناف؟",["ركلة حرة مباشرة","كرة مسقطة"],"(3.7)"],"en":["A substitute runs on and stops an attack by touching the ball. Restart?",["Direct free kick","Dropped ball"],"(3.7)"],"a":0,"lvl":"p"},{"ar":["لاعب عاد دون إذن ولم يتدخل، وأوقف الحكم اللعب لإنذاره. الاستئناف؟",["ركلة حرة غير مباشرة من مكان الكرة","ركلة حرة مباشرة"],"(3.8)"],"en":["A player returns without permission, no interference; referee stops play to caution. Restart?",["IFK from the ball's position","Direct free kick"],"(3.8)"],"a":0,"lvl":"p"}]},{"id":"goal-captain","title":{"ar":"هدف مع شخص زائد، وقائد الفريق","en":"Goal with an extra person; team captain"},"ref":"3.9 · 3.10","k":["هدف","goal","شخص زائد","extra person","قائد","captain","شارة","armband"],"body":{"ar":"<p>بعد الهدف و<b>قبل الاستئناف</b> اكتشف الحكم أن شخصًا زائدًا كان في الملعب <b>وتدخل في اللعب</b>:</p>\n<div class=\"tbl\"><table><tr><th>الشخص الزائد</th><th>القرار</th></tr>\n<tr><td>من الفريق <b>المسجِّل</b> (لاعب، بديل، مستبدَل، مطرود، مسؤول)</td><td><b>يُلغى الهدف</b> — ركلة حرة مباشرة من مكانه</td></tr>\n<tr><td>عنصر خارجي تدخّل</td><td><b>يُلغى الهدف</b> — كرة مسقطة (إلا في حالة الكرة المتجهة للمرمى المذكورة في الجزء السابق)</td></tr>\n<tr><td>من الفريق <b>الذي استقبل</b> الهدف</td><td><b>يُحتسب الهدف</b></td></tr>\n<tr><td>عنصر خارجي لم يتدخل</td><td><b>يُحتسب الهدف</b></td></tr></table></div>\n<ul><li>في كل الحالات يُخرَج الشخص الزائد.</li>\n<li>إذا اكتُشف الأمر <b>بعد الاستئناف</b>: لا يُلغى الهدف. وإن كان الشخص ما زال في الملعب: يوقف اللعب، ويُخرجه، ويستأنف بكرة مسقطة أو ركلة حرة حسب الحالة، ويرفع تقريرًا.</li></ul>\n<h3>قائد الفريق</h3>\n<p>لكل فريق قائد في الملعب يرتدي <b>شارة</b>. <b>لا امتيازات خاصة</b> له، لكن عليه جزء من المسؤولية عن سلوك فريقه. ويجوز للمسابقات تطبيق إرشادات «المنطقة الحصرية لقائدي الفريقين».</p>","en":"<p>After a goal and <b>before the restart</b>, the referee realises an extra person was on the field <b>and interfered</b>:</p>\n<div class=\"tbl\"><table><tr><th>Extra person</th><th>Decision</th></tr>\n<tr><td>From the <b>scoring</b> team (player, substitute, substituted, sent-off, official)</td><td><b>No goal</b> — direct free kick from their position</td></tr>\n<tr><td>Outside agent who interfered</td><td><b>No goal</b> — dropped ball (unless the goal-bound exception in the previous part applies)</td></tr>\n<tr><td>From the team that <b>conceded</b></td><td><b>Goal</b></td></tr>\n<tr><td>Outside agent who did not interfere</td><td><b>Goal</b></td></tr></table></div>\n<ul><li>In all cases the extra person is removed.</li>\n<li>Realised <b>after the restart</b>: the goal stands. If the person is still on: stop, remove them, restart with a dropped ball or free kick, and report.</li></ul>\n<h3>Team captain</h3>\n<p>Each team has a captain on the field wearing an <b>armband</b>. <b>No special status or privileges</b>, but some responsibility for the team's behaviour. Competitions may use the ‘Only the captain’ guidelines.</p>"},"quiz":[{"ar":["سُجل هدف، ثم اكتشف الحكم قبل الاستئناف أن بديلًا من الفريق المسجِّل كان في الملعب وتدخّل. القرار؟",["يُحتسب الهدف","يُلغى الهدف — ركلة حرة مباشرة"],"(3.9)"],"en":["Goal scored; before the restart the referee sees a substitute of the scoring team was on and interfered. Decision?",["Goal","No goal — direct free kick"],"(3.9)"],"a":1,"lvl":"p"},{"ar":["نفس الحالة لكن الاكتشاف بعد استئناف اللعب. القرار؟",["يُلغى الهدف","يبقى الهدف"],"(3.9)"],"en":["Same, but realised after play restarted. Decision?",["Goal disallowed","Goal stands"],"(3.9)"],"a":1,"lvl":"p"},{"ar":["هل لقائد الفريق امتيازات خاصة؟",["نعم","لا"],"(3.10)"],"en":["Does the captain have special privileges?",["Yes","No"],"(3.10)"],"a":1,"lvl":"b"}]}],"cases":[{"id":"six-players","lvl":"b","ref":"3.1 · 7.5","a":1,"ar":{"s":"فريق أصبح يلعب بسبعة لاعبين بعد أربع حالات طرد، ثم طُرد لاعب خامس فأصبح لديه ستة. ما قرارك؟","o":["تستمر المباراة","لا تستمر المباراة، ويُرفع تقرير","تستمر إذا وافق المنافس"],"d":"لا يُستأنف اللعب، وتُلغى المباراة","r":"لا يوجد","x":"الطرد، ويُرفع تقرير للجهات المختصة","w":"لا تبدأ المباراة ولا تستمر إذا قل عدد لاعبي أي فريق عن سبعة، فتُلغى المباراة ويُرفع تقرير. أما مصير النتيجة (إعادة المباراة أو غير ذلك) فتحدده لوائح المسابقة أو منظموها، لا الحكم."},"en":{"s":"A team down to seven after four dismissals has a fifth player sent off, leaving six. Your call?","o":["The match continues","The match cannot continue; report it","It continues if the opponents agree"],"d":"Play does not resume; the match is abandoned","r":"None","x":"The sending-off; report to the authorities","w":"A match may not start or continue if either team has fewer than seven players, so it is abandoned and reported. Whether it is replayed or another outcome applies is for the competition rules or organisers, not the referee."}},{"id":"sub-interferes","lvl":"b","ref":"3.7 · 12.4","a":0,"ar":{"s":"أثناء اللعب دخل بديل الملعب دون إذن وقطع تمريرة في منتصف الملعب. ما قرارك؟","o":["إيقاف اللعب، ركلة حرة مباشرة من مكان التدخل، وإنذار البديل","كرة مسقطة وإخراج البديل","ركلة حرة غير مباشرة بدون إنذار"],"d":"إيقاف اللعب وإخراج البديل","r":"ركلة حرة مباشرة من موضع التدخل","x":"إنذار (دخول الملعب دون إذن)","w":"تدخّل بديل في اللعب يُستأنف بركلة حرة مباشرة (أو ركلة جزاء)، ودخوله دون إذن يستوجب الإنذار. أما إذا كان المتدخل عنصرًا خارجيًا فالاستئناف كرة مسقطة."},"en":{"s":"During play a substitute runs on without permission and intercepts a pass in midfield. Your call?","o":["Stop play, direct free kick from where it happened, caution the substitute","Dropped ball and remove the substitute","Indirect free kick, no caution"],"d":"Stop play and remove the substitute","r":"Direct free kick from the position of the interference","x":"Caution (entering without permission)","w":"Interference by a substitute restarts with a direct free kick (or penalty); entering without permission is a caution. Interference by an outside agent would restart with a dropped ball."}},{"id":"gk-swap","lvl":"b","ref":"3.4 · 3.5","a":2,"ar":{"s":"في توقف للعب تبادل لاعب مكانه مع الحارس دون إبلاغ الحكم، واكتشف الحكم ذلك بعد الاستئناف. ما قرارك؟","o":["إيقاف اللعب فورًا وطرد الاثنين","لا شيء، فالتبديل تم في توقف","يستمر اللعب، وإنذار الاثنين عند خروج الكرة التالي"],"d":"يستمر اللعب","r":"حسب سبب التوقف التالي","x":"إنذار للاعبين الاثنين","w":"تبديل الحارس يحتاج إبلاغ الحكم ويكون في توقف. وإذا تم دون إذن يترك الحكم اللعب يستمر، ويُنذر الاثنين عند خروج الكرة التالي، إلا إذا تم التبادل بين الشوطين."},"en":{"s":"During a stoppage a player swaps with the goalkeeper without telling the referee; the referee notices after the restart. Your call?","o":["Stop play and send both off","Nothing — it was during a stoppage","Play on; caution both when the ball next goes out"],"d":"Play on","r":"Per the next stoppage","x":"Caution both players","w":"A goalkeeper change needs the referee to be informed and a stoppage. Without permission, play continues and both are cautioned when the ball is next out — unless the swap happened at half-time."}},{"id":"extra-sub-goal","lvl":"p","ref":"3.9","a":1,"ar":{"s":"سُجل هدف، وقبل الاستئناف اكتشف الحكم أن بديلًا من الفريق المسجل كان داخل الملعب وتدخّل في اللعبة. ما قرارك؟","o":["يُحتسب الهدف ويُنذر البديل","يُلغى الهدف، ركلة حرة مباشرة من موضع البديل، ويُنذر","يُلغى الهدف وكرة مسقطة"],"d":"إلغاء الهدف وإخراج البديل","r":"ركلة حرة مباشرة من موضع الشخص الزائد","x":"إنذار البديل، وتقرير للجهات المختصة","w":"إذا اكتُشف قبل الاستئناف أن شخصًا زائدًا من الفريق المسجل كان داخل الملعب وتدخل، يُلغى الهدف ويُستأنف بركلة حرة مباشرة من موضعه. ولو كان من الفريق الذي استقبل الهدف لاحتُسب الهدف. وبعد الاستئناف لا يمكن إلغاء الهدف."},"en":{"s":"A goal is scored; before the restart the referee realises a substitute of the scoring team was on the field and interfered. Your call?","o":["Award the goal; caution the substitute","Disallow; direct free kick from the substitute's position; caution","Disallow; dropped ball"],"d":"Disallow the goal and remove the substitute","r":"Direct free kick from the extra person's position","x":"Caution the substitute; report","w":"Found before the restart: an extra person from the scoring team who interfered means the goal is disallowed, restart with a direct free kick from their position. From the conceding team, the goal stands. After the restart it can't be disallowed."}},{"id":"ten-seconds","lvl":"p","ref":"3.3 · 3.5","a":2,"ar":{"s":"رُفعت لوحة التبديل، ولم يخرج اللاعب المستبدل خلال عشر ثوانٍ، ولا توجد إصابة. ما الإجراء الصحيح؟","o":["إلغاء التبديل","يدخل البديل فورًا ويُنذر اللاعب","يخرج اللاعب، ويُستأنف اللعب بدون البديل، ويدخل البديل في أول توقف بعد مرور دقيقة"],"d":"يخرج اللاعب، ولا يدخل البديل الآن","r":"يُستأنف اللعب بنقص لاعب","x":"لا إنذار إلا إذا أخّر الاستئناف بشكل مفرط بعد العشر ثوانٍ","w":"إذا لم يخرج اللاعب خلال عشر ثوانٍ (بلا سبب أمني أو إصابة)، يخرج مع ذلك، ويُستأنف اللعب، ولا يدخل البديل إلا بإذن الحكم في أول توقف بعد مرور دقيقة من الاستئناف. ولا يُلغى التبديل ولا يُغيَّر البديل."},"en":{"s":"The substitution board goes up and the player doesn't leave within ten seconds; no injury. Correct procedure?","o":["Cancel the substitution","Substitute enters now; caution the player","Player leaves, play restarts without the substitute, who enters at the first stoppage after one minute"],"d":"Player leaves; the substitute can't enter yet","r":"Play restarts a player short","x":"No caution unless the restart is excessively delayed beyond ten seconds","w":"If the player hasn't left within ten seconds (no safety or injury reason), they still leave, play restarts, and the substitute enters only with permission at the first stoppage after one minute. The substitution can't be cancelled or changed."}}],"myths":[{"id":"captain-privileges","ref":"3.10","t":false,"ar":{"s":"قائد الفريق له صلاحيات خاصة ويمكنه الاعتراض على قرارات الحكم.","w":"القائد ليس له وضع خاص ولا امتيازات، لكنه يتحمل قدرًا من المسؤولية عن سلوك فريقه. ويجوز للمسابقات تطبيق إرشا

 authorities."}},{"id":"penalty-extended-rebound","lvl":"p","ref":"7.4 · 14.1","a":2,"ar":{"s":"في نهاية الشوط احتُسبت ركلة جزاء، والوقت قد انتهى. صدّ الحارس الكرة فارتدت إلى منفذ الركلة نفسه، فسددها في المرمى. ما قرارك؟","o":["هدف، فالكرة لا تزال في اللعب","تُعاد ركلة الجزاء لأن الحارس لمس الكرة","لا هدف، تكتمل الركلة عندما يلعب الكرة لاعب غير الحارس المدافع وينتهي الشوط"],"d":"عدم احتساب الهدف وإنهاء الشوط","r":"لا يوجد (انتهى الشوط)","x":"لا يوجد","w":"عندما يُمدَّد الوقت لتنفيذ ركلة الجزاء، تكتمل الركلة إذا توقفت الكرة أو خرجت من اللعب أو لعبها أي لاعب غير الحارس المدافع، بما في ذلك المنفذ نفسه. لذا لا يُحتسب ما يأتي بعد ذلك."},"en":{"s":"At the end of a half a penalty kick is taken after time has expired. The goalkeeper saves, the ball rebounds to the kicker, who scores. Your call?","o":["Goal: the ball is still in play","Retake, because the goalkeeper touched the ball","No goal: the kick is completed once a player other than the defending goalkeeper plays the ball; the half ends"],"d":"Disallow the goal and end the half","r":"None (half over)","x":"None","w":"When time is extended for a penalty kick, the kick is completed when the ball stops moving, goes out of play or is played by any player other than the defending goalkeeper, including the kicker. Anything after that does not count."}}],"myths":[{"id":"added-time-is-maximum","ref":"7.3","t":false,"ar":{"s":"الوقت المحتسب بدل الضائع على اللوحة هو الحد الأقصى ولا يُلعب أكثر منه.","w":"ما يُعلَن هو الحد الأدنى من الوقت الإضافي؛ يجوز للحكم زيادته لكن لا يجوز إنقاصه."},"en":{"s":"The added time shown on the board is the maximum that can be played.","w":"The board shows the minimum additional time; the referee may increase it but never reduce it."}},{"id":"compensate-first-half-error","ref":"7.3","t":false,"ar":{"s":"إذا أنهى الحكم الشوط الأول مبكراً بالخطأ، يعوّض ذلك بإطالة الشوط الثاني.","w":"لا يجوز للحكم تعويض خطأ في حساب الوقت خلال الشوط الأول بتغيير مدة الشوط الثاني."},"en":{"s":"If the referee ends the first half early by mistake, they make up for it in the second half.","w":"The referee must not compensate for a first-half timekeeping error by changing the length of the second half."}},{"id":"half-extended-for-penalty","ref":"7.4","t":true,"ar":{"s":"يمكن أن يستمر الشوط بعد انتهاء وقته فقط من أجل تنفيذ ركلة جزاء.","w":"صحيح: إذا وجب تنفيذ ركلة جزاء أو إعادتها، يُمدَّد الشوط حتى اكتمال تنفيذها."},"en":{"s":"A half can run past its time purely so a penalty kick can be taken.","w":"True: if a penalty kick has to be taken or retaken, the half is extended until the kick is completed."}}]},"8":{"pages":{"ar":"ع ص 95–98 · EN p.97–98","en":"EN p.97–98 · AR p.95–98"},"parts":[{"id":"kickoff","title":{"ar":"ركلة البداية","en":"Kick-off"},"ref":"8 · 8.1","fig":"kickoff","k":["ركلة البداية","kick-off","قرعة","coin toss","استئناف","restart","منتصف","centre mark"],"body":{"ar":"<p><b>ركلة البداية</b> تبدأ الشوطين وشوطي الوقت الإضافي، وتُستأنف بها المباراة بعد الهدف. الاستئنافات الأخرى: الركلات الحرة، وركلة الجزاء، ورمية التماس، وركلة المرمى، والركنية (القوانين 13–17). و<b>الكرة المسقطة</b> هي الاستئناف حين يوقف الحكم اللعب ولا يحدد القانون استئنافًا آخر.</p>\n<p class=\"note\">المخالفة التي تقع والكرة <b>خارج اللعب</b> لا تغيّر طريقة الاستئناف.</p>\n<h3>القرعة</h3>\n<ol><li>الفريق الفائز بالقرعة يختار: <b>المرمى</b> الذي يهاجمه في الشوط الأول، <b>أو</b> تنفيذ ركلة البداية.</li>\n<li>المنافس يأخذ الخيار الآخر.</li>\n<li>في الشوط الثاني يتبادل الفريقان الجهتين، وينفذ ركلة البداية الفريق الذي اختار المرمى في الشوط الأول.</li>\n<li>بعد الهدف، ينفذ ركلة البداية الفريق الذي استقبل الهدف.</li></ol>\n<h3>في كل ركلة بداية</h3>\n<ul><li>كل اللاعبين في نصف ملعبهم، عدا المنفذ.</li><li>المنافسون على بعد <b>9.15 م</b> على الأقل حتى تصبح الكرة في اللعب.</li>\n<li>الكرة ثابتة على علامة المنتصف، ويعطي الحكم إشارته.</li><li>تصبح الكرة في اللعب <b>عندما تُركل وتتحرك بوضوح</b>.</li>\n<li>يجوز التسجيل <b>مباشرة</b> في مرمى المنافس. وإن دخلت مرمى المنفذ مباشرة: <b>ركلة ركنية</b> للمنافس.</li></ul>\n<div class=\"tbl\"><table><tr><th>المخالفة</th><th>القرار</th></tr>\n<tr><td>المنفذ لمس الكرة مرة ثانية قبل أن يلمسها غيره</td><td>ركلة حرة غير مباشرة، أو <b>مباشرة</b> إن كانت لمسة يد</td></tr>\n<tr><td>أي مخالفة أخرى في الإجراءات</td><td><b>تُعاد</b> ركلة البداية</td></tr></table></div>","en":"<p>A <b>kick-off</b> starts both halves and both halves of extra time, and restarts play after a goal. Other restarts: free kicks, penalty kicks, throw-ins, goal kicks and corners (Laws 13–17). A <b>dropped ball</b> is the restart when the referee stops play and the Law requires no other restart.</p>\n<p class=\"note\">An offence while the ball is <b>out of play</b> doesn't change the restart.</p>\n<h3>The toss</h3>\n<ol><li>The toss winner chooses which <b>goal</b> to attack in the first half <b>or</b> to take the kick-off.</li>\n<li>The opponents get the other choice.</li>\n<li>In the second half teams change ends; the team that chose ends takes the kick-off.</li>\n<li>After a goal, the team that conceded takes the kick-off.</li></ol>\n<h3>For every kick-off</h3>\n<ul><li>All players in their own half except the kicker.</li><li>Opponents at least <b>9.15 m</b> away until the ball is in play.</li>\n<li>Ball stationary on the centre mark; the referee signals.</li><li>The ball is in play <b>when kicked and it clearly moves</b>.</li>\n<li>A goal may be scored <b>directly</b> against the opponents. If it goes directly into the kicker's goal: <b>corner kick</b> to the opponents.</li></ul>\n<div class=\"tbl\"><table><tr><th>Offence</th><th>Decision</th></tr>\n<tr><td>Kicker touches the ball again before anyone else</td><td>Indirect free kick, or <b>direct</b> for handball</td></tr>\n<tr><td>Any other procedural offence</td><td>Kick-off <b>retaken</b></td></tr></table></div>"},"quiz":[{"ar":["سدد لاعب من ركلة البداية مباشرة في مرمى المنافس. القرار؟",["هدف","إعادة"],"(8.1)"],"en":["A player scores directly from the kick-off into the opponents' goal. Decision?",["Goal","Retake"],"(8.1)"],"a":0,"lvl":"b"},{"ar":["الكرة من ركلة البداية دخلت مباشرة مرمى فريق المنفذ. القرار؟",["هدف ذاتي","ركلة ركنية للمنافس"],"(8.1)"],"en":["The kick-off goes directly into the kicker's own goal. Decision?",["Own goal","Corner to opponents"],"(8.1)"],"a":1,"lvl":"p"},{"ar":["لاعب منافس دخل دائرة المنتصف قبل ركل الكرة. القرار؟",["إنذار","إعادة ركلة البداية"],"(8.1)"],"en":["An opponent enters the centre circle before the kick. Decision?",["Caution","Retake the kick-off"],"(8.1)"],"a":1,"lvl":"b"}]},{"id":"dropped","title":{"ar":"الكرة المسقطة","en":"Dropped ball"},"ref":"8.2","fig":"dropped","k":["كرة مسقطة","dropped ball","4 أمتار","4 m","حارس","goalkeeper","استحواذ","possession"],"body":{"ar":"<div class=\"tbl\"><table><tr><th>أين كانت الكرة لحظة الإيقاف؟</th><th>لمن تُسقط؟</th></tr>\n<tr><td>داخل منطقة الجزاء</td><td>لحارس الفريق المدافع داخل منطقة جزائه</td></tr>\n<tr><td>خارج منطقة الجزاء</td><td>للاعب من الفريق الذي <b>كان سيحتفظ بالكرة أو يستحوذ عليها</b> (ومنه الاستئناف لو كانت الكرة ستخرج) إذا أمكن الحكم تحديده، وإلا فللاعب من <b>الفريق الذي لمسها أخيرًا</b></td></tr></table></div>\n<ul><li>تُسقط في مكانها لحظة الإيقاف، إلا إذا ارتطمت بأحد الحكام أو بعنصر خارجي، فتُسقط في مكان الارتطام.</li>\n<li>كل اللاعبين الآخرين من الفريقين على بعد <b>4 م</b> على الأقل حتى تصبح في اللعب.</li>\n<li>تصبح في اللعب <b>عندما تلمس الأرض</b>.</li></ul>\n<div class=\"tbl\"><table><tr><th>الحالة</th><th>القرار</th></tr>\n<tr><td>لمست لاعبًا قبل الأرض</td><td>تُسقط مرة أخرى</td></tr>\n<tr><td>خرجت من الملعب بعد لمس الأرض دون أن يلمسها لاعب</td><td>تُسقط مرة أخرى</td></tr>\n<tr><td>دخلت مرمى <b>المنافس</b> دون أن يلمسها لاعبان على الأقل</td><td>ركلة مرمى</td></tr>\n<tr><td>دخلت مرمى <b>فريق اللاعب</b> دون أن يلمسها لاعبان</td><td>ركلة ركنية</td></tr></table></div>\n<p class=\"note judge\">تحديد «الفريق الذي كان سيحتفظ بالكرة أو يستحوذ عليها» تقدير للحكم.</p>","en":"<div class=\"tbl\"><table><tr><th>Where was the ball when play stopped?</th><th>Dropped for</th></tr>\n<tr><td>Inside the penalty area</td><td>The defending goalkeeper in their penalty area</td></tr>\n<tr><td>Outside the penalty area</td><td>A player of the team that <b>would have kept or gained possession</b> (including from the restart if the ball would have gone out) if the referee can tell; otherwise a player of the <b>team that last touched it</b></td></tr></table></div>\n<ul><li>Dropped where the ball was when play stopped, unless it hit an official or outside agent — then where that happened.</li>\n<li>All other players at least <b>4 m</b> away until it's in play.</li>\n<li>In play <b>when it touches the ground</b>.</li></ul>\n<div class=\"tbl\"><table><tr><th>Situation</th><th>Decision</th></tr>\n<tr><td>Touches a player before the ground</td><td>Drop again</td></tr>\n<tr><td>Leaves the field after touching the ground, untouched</td><td>Drop again</td></tr>\n<tr><td>Enters the <b>opponents'</b> goal without touching two players</td><td>Goal kick</td></tr>\n<tr><td>Enters the <b>team's own</b> goal without touching two players</td><td>Corner kick</td></tr></table></div>\n<p class=\"note judge\">Which team ‘would have kept or gained possession’ is the referee's judgement.</p>"},"quiz":[{"ar":["أوقف الحكم اللعب لإصابة والكرة داخل منطقة الجزاء. لمن تُسقط؟",["لأقرب لاعب","لحارس الفريق المدافع"],"(8.2)"],"en":["Play stopped for injury with the ball in the penalty area. Dropped for?",["Nearest player","Defending goalkeeper"],"(8.2)"],"a":1,"lvl":"b"},{"ar":["على أي بعد يقف بقية اللاعبين؟",["4 م","9.15 م"],"(8.2)"],"en":["How far must other players be?",["4 m","9.15 m"],"(8.2)"],"a":0,"lvl":"b"},{"ar":["ركل اللاعب الكرة المسقطة مباشرة في مرمى المنافس. القرار؟",["هدف","ركلة مرمى"],"لم يلمسها لاعبان. (8.2)"],"en":["A player kicks the dropped ball straight into the opponents' goal. Decision?",["Goal","Goal kick"],"Not touched by two players. (8.2)"],"a":1,"lvl":"p"}]}],"cases":[{"id":"kickoff-own-goal","lvl":"b","ref":"8.1","a":1,"ar":{"s":"عند ركلة البداية ركل اللاعب الكرة إلى الخلف بقوة، فدخلت مباشرة مرمى فريقه دون أن يلمسها أحد. ما قرارك؟","o":["هدف للفريق المنافس","ركلة ركنية للفريق المنافس","تُعاد ركلة البداية"],"d":"لا هدف","r":"ركلة ركنية للفريق المنافس","x":"لا يوجد","w":"يجوز تسجيل هدف مباشرة من ركلة البداية في مرمى المنافس فقط. وإذا دخلت الكرة مرمى فريق المنفذ مباشرة، تُحتسب ركلة ركنية للمنافس."},"en":{"s":"At kick-off the player kicks the ball hard backwards and it goes straight into their own goal without anyone touching it. Your call?","o":["Goal to the opponents","Corner kick to the opponents","Retake the kick-off"],"d":"No goal","r":"Corner kick to the opponents","x":"None","w":"A goal may be scored directly from a kick-off only against the opponents. If the ball goes directly into the kicker's own goal, a corner kick is awarded to the opponents."}},{"id":"kickoff-double-touch","lvl":"b","ref":"8.1","a":2,"ar":{"s":"نفّذ لاعب ركلة البداية، فتحركت الكرة بوضوح، ثم لعبها مرة ثانية بقدمه قبل أن تلمس أي لاعب آخر. ما قرارك؟","o":["تُعاد ركلة البداية","يستمر اللعب، فالكرة أصبحت في اللعب","ركلة حرة غير مباشرة للفريق المنافس"],"d":"إيقاف اللعب","r":"ركلة حرة غير مباشرة للفريق المنافس","x":"لا يوجد","w":"إذا لمس منفذ ركلة البداية الكرة مرة ثانية قبل أن تلمس لاعبًا آخر، تُحتسب ركلة حرة غير مباشرة، أو ركلة حرة مباشرة إذا كانت اللمسة الثانية مخالفة لمس الكرة باليد. أما مخالفات الإجراءات الأخرى فتُعاد فيها ركلة البداية."},"en":{"s":"A player takes the kick-off, the ball clearly moves, and the same player plays it again with their foot before it touches anyone else. Your call?","o":["Retake the kick-off","Play on: the ball is in play","Indirect free kick to the opponents"],"d":"Stop play","r":"Indirect free kick to the opponents","x":"None","w":"If the kick-off taker touches the ball again before it touches another player, an indirect free kick is awarded (a direct free kick if the second touch is a handball offence). Other kick-off procedure offences lead to a retake."}},{"id":"dropped-ball-area","lvl":"b","ref":"8.2","a":0,"ar":{"s":"أوقف الحكم اللعب لإصابة خطيرة في الرأس، وكانت الكرة لحظة الإيقاف داخل منطقة جزاء الفريق المدافع والمهاجمون مستحوذون عليها. ما قرارك؟","o":["كرة مسقطة لحارس الفريق المدافع داخل منطقة جزائه","كرة مسقطة للفريق المهاجم لأنه كان مستحوذًا","ركلة حرة غير مباشرة للفريق المهاجم"],"d":"إيقاف اللعب لعلاج المصاب","r":"كرة مسقطة لحارس الفريق المدافع","x":"لا يوجد","w":"إذا كانت الكرة داخل منطقة الجزاء عند إيقاف اللعب، تُسقط لحارس الفريق المدافع داخل منطقة جزائه بغض النظر عن الاستحواذ. ويجب أن يبتعد بقية اللاعبين 4 م على الأقل حتى تلمس الكرة الأرض."},"en":{"s":"The referee stops play for a serious head injury; at that moment the ball is inside the defending team's penalty area with the attackers in possession. Your call?","o":["Dropped ball to the defending goalkeeper in their penalty area","Dropped ball to the attackers, who had possession","Indirect free kick to the attackers"],"d":"Stop play for the injury","r":"Dropped ball to the defending goalkeeper","x":"None","w":"If the ball was inside the penalty area when play stopped, it is dropped for the defending goalkeeper in their penalty area, whoever had possession. All other players must be at least 4 m away until it touches the ground."}},{"id":"dropped-ball-into-goal","lvl":"p","ref":"8.2","a":2,"ar":{"s":"أُسقطت الكرة خارج منطقة الجزاء للاعب من الفريق (أ)، فسددها مباشرة بعد ارتطامها بالأرض في مرمى الفريق (ب) دون أن يلمسها أي لاعب آخر. ما قرارك؟","o":["هدف، فالكرة أصبحت في اللعب","تُعاد الكرة المسقطة","ركلة مرمى للفريق (ب)"],"d":"لا هدف","r":"ركلة مرمى للفريق (ب)","x":"لا يوجد","w":"إذا دخلت الكرة المسقطة المرمى دون أن تلمس لاعبَين على الأقل، لا يُحتسب الهدف: ركلة مرمى إذا دخلت مرمى المنافس، وركلة ركنية إذا دخلت مرمى الفريق نفسه."},"en":{"s":"A dropped ball outside the penalty area is given to a player of team A, who, after it bounces, shoots straight into team B's goal without anyone else touching it. Your call?","o":["Goal: the ball was in play","Retake the dropped ball","Goal kick to team B"],"d":"No goal","r":"Goal kick to team B","x":"None","w":"If a dropped ball enters the goal without touching at least two players, no goal is awarded: a goal kick if it enters the opponents' goal, a corner kick if it enters the team's own goal."}},{"id":"offence-ball-out","lvl":"p","ref":"8 · 12.4 · 12.5","a":0,"ar":{"s":"خرجت الكرة من خط التماس واحتُسبت رمية تماس للفريق (أ). قبل تنفيذها لكم مدافع من الفريق (ب) منافسًا داخل الملعب. ما قرارك؟","o":["طرد المدافع، ويُستأنف اللعب برمية التماس للفريق (أ)","طرد المدافع وركلة حرة مباشرة للفريق (أ) من مكان المخالفة","إنذار المدافع ورمية التماس"],"d":"طرد المدافع","r":"رمية التماس للفريق (أ)","x":"طرد (سلوك مشين)","w":"المخالفة التي تُرتكب والكرة خارج اللعب لا تُغيّر طريقة الاستئناف، فيبقى الاستئناف رمية التماس. لكن الإجراء الانضباطي يُتخذ كاملًا، وضرب المنافس بقوة مفرطة دون تنافس على الكرة سلوك مشين عقوبته الطرد."},"en":{"s":"The ball goes out over the touchline and a throw-in is given to team A. Before it is taken, a team B defender punches an opponent on the field. Your call?","o":["Send off the defender; restart with team A's throw-in","Send off the defender; direct free kick to team A where it happened","Caution the defender; throw-in"],"d":"Send off the defender","r":"Throw-in to team A","x":"Sending-off (violent conduct)","w":"An offence committed when the ball is not in play does not change how play restarts, so it remains a throw-in. Disciplinary action is still taken in full; punching an opponent with excessive force when not challenging for the ball is violent conduct and a sending-off."}}],"myths":[{"id":"kickoff-must-go-forward","ref":"8.1","t":false,"ar":{"s":"يجب أن تتحرك الكرة إلى الأمام في ركلة البداية.","w":"تصبح الكرة في اللعب عند ركلها وتحركها بوضوح في أي اتجاه، ولا يُشترط أن تتجه إلى الأمام."},"en":{"s":"At kick-off the ball has to be played forwards.","w":"The ball is in play once it is kicked and clearly moves, in any direction; there is no forward requirement."}},{"id":"dropped-ball-contested","ref":"8.2","t":false,"ar":{"s":"في الكرة المسقطة يتنافس لاعب من كل فريق على الكرة.","w":"تُسقط الكرة للاعب واحد فقط (لحارس الفريق المدافع إذا كانت داخل منطقة الجزاء)، ويبتعد جميع اللاعبين الآخرين من الفريقين 4 م (4.5 ياردة) على الأقل حتى تصبح في اللعب."},"en":{"s":"At a dropped ball, one player from each team battles for it.","w":"The ball is dropped for a single player (the defending goalkeeper if it was in the penalty area), and everyone else from both teams must stay at least 4 m (4.5 yds) away until it is in play."}},{"id":"dropped-ball-no-direct-goal","ref":"8.2","t":true,"ar":{"s":"إذا رُكلت الكرة المسقطة مباشرة في مرمى المنافس، لا يُحتسب هدف.","w":"صحيح: إذا دخلت الكرة المسقطة المرمى دون أن يلمسها لاعبان على الأقل، يُستأنف اللعب بركلة مرمى إن دخلت مرمى المنافس، وبركلة ركنية إن دخلت مرمى الفريق نفسه."},"en":{"s":"Kick a dropped ball straight into the opponents' net and the goal doesn't count.","w":"True: if a dropped ball enters a goal without touching at least two players, play restarts with a goal kick (opponents' goal) or a corner kick (own goal)."}}]},"9":{"pages":{"ar":"ع ص 99–100 · EN p.101","en":"EN p.101 · AR p.99–100"},"parts":[{"id":"out","title":{"ar":"الكرة خارج اللعب","en":"Ball out of play"},"ref":"9.1","fig":"linecross","k":["خارج اللعب","out of play","خط","line","بكاملها","wholly","لمس الحكم","touches referee","هجمة واعدة","promising attack"],"body":{"ar":"<p>تكون الكرة <b>خارج اللعب</b> في ثلاث حالات:</p>\n<ol><li>إذا <b>عبرت بكاملها</b> خط المرمى أو خط التماس، على الأرض أو في الهواء.</li>\n<li>إذا أوقف الحكم اللعب.</li>\n<li>إذا لمست <b>أحد الحكام</b> وبقيت في الملعب، ونتج عن ذلك:\n<ul><li>بدء فريق <b>هجمة واعدة</b>، أو</li><li>دخول الكرة <b>المرمى مباشرة</b>، أو</li><li><b>تغيّر الفريق</b> المستحوذ على الكرة.</li></ul>\nفي هذه الحالات الثلاث يُستأنف اللعب <b>بكرة مسقطة</b>.</li></ol>\n<div class=\"note\"><b>تذكّر:</b> الكرة على الخط ما زالت في اللعب. يجب أن تعبر <b>بكاملها</b>.</div>","en":"<p>The ball is <b>out of play</b> when:</p>\n<ol><li>It has <b>wholly passed</b> over the goal line or touchline, on the ground or in the air.</li>\n<li>Play has been stopped by the referee.</li>\n<li>It touches a <b>match official</b>, stays on the field, and:\n<ul><li>a team starts a <b>promising attack</b>, or</li><li>it goes <b>directly into the goal</b>, or</li><li>the team in <b>possession changes</b>.</li></ul>\nIn these cases play restarts with a <b>dropped ball</b>.</li></ol>\n<div class=\"note\"><b>Remember:</b> a ball on the line is still in play. It must cross <b>wholly</b>.</div>"},"quiz":[{"ar":["الكرة في الهواء خارج خط التماس، لكن جزءًا منها ما زال فوق الخط. هل هي في اللعب؟",["نعم","لا"],"يجب أن تعبر بكاملها. (9.1)"],"en":["The ball is in the air beyond the touchline but part of it is still above the line. In play?",["Yes","No"],"It must cross wholly. (9.1)"],"a":0,"lvl":"b"},{"ar":["ارتطمت الكرة بالحكم وانتقلت إلى الفريق الآخر. القرار؟",["يستمر اللعب","كرة مسقطة"],"تغيّر الاستحواذ. (9.1)"],"en":["The ball hits the referee and goes to the other team. Decision?",["Play on","Dropped ball"],"Possession changed. (9.1)"],"a":1,"lvl":"b"}]},{"id":"in","title":{"ar":"الكرة في اللعب","en":"Ball in play"},"ref":"9.2","k":["في اللعب","in play","قائم","post","عارضة","crossbar","راية","flag","مسؤول فريق","team official","بديل","substitute"],"body":{"ar":"<p>الكرة <b>في اللعب</b> في كل الأوقات الأخرى، ومنها:</p>\n<ul><li>عندما تلمس أحد الحكام في غير الحالات الثلاث السابقة.</li>\n<li>عندما ترتد من <b>القائم أو العارضة أو راية الركنية</b> وتبقى في الملعب.</li></ul>\n<div class=\"note\">مسؤول فريق، أو بديل، أو لاعب مستبدَل أو مطرود، أو لاعب خارج الملعب مؤقتًا (لإصابة أو تعديل معدات)، لمس الكرة وهي <b>تخرج بوضوح</b> من الملعب، <b>دون قصد</b> التدخل غير العادل ← <b>ركلة حرة غير مباشرة</b>، ودون عقوبة انضباطية.</div>","en":"<p>The ball is <b>in play</b> at all other times, including:</p>\n<ul><li>When it touches a match official outside the three cases above.</li>\n<li>When it rebounds off a <b>goalpost, crossbar or corner flagpost</b> and stays on the field.</li></ul>\n<div class=\"note\">If a team official, substitute, substituted or sent-off player, or a player temporarily off the field touches the ball while it is <b>clearly leaving</b> the field, <b>without intending</b> to interfere unfairly → <b>indirect free kick</b>, no sanction.</div>"},"quiz":[{"ar":["ارتدت الكرة من راية الركنية وبقيت في الملعب. القرار؟",["يستمر اللعب","رمية تماس"],"(9.2)"],"en":["The ball rebounds off the corner flag and stays on the field. Decision?",["Play on","Throw-in"],"(9.2)"],"a":0,"lvl":"b"},{"ar":["بديل يقف قرب الخط أوقف الكرة دون قصد وهي تخرج بوضوح. القرار؟",["ركلة حرة غير مباشرة دون عقوبة","ركلة حرة مباشرة وإنذار"],"(9.2)"],"en":["A substitute near the line stops a ball clearly going out, without intent. Decision?",["IFK, no sanction","DFK and caution"],"(9.2)"],"a":0,"lvl":"p"}]}],"cases":[{"id":"ball-on-line-air","lvl":"b","ref":"9.1","a":0,"ar":{"s":"عرضية من الجهة اليمنى انحرفت في الهواء نحو خارج خط المرمى، لكنها لم تتجاوزه بكاملها، إذ بقي جزء منها فوق الخط، ثم عادت إلى داخل الملعب. ما قرارك؟","o":["يستمر اللعب، فالكرة لم تتجاوز الخط بكاملها","ركلة مرمى، فقد خرجت في الهواء","كرة مسقطة"],"d":"يستمر اللعب","r":"لا يوجد","x":"لا يوجد","w":"لا تكون الكرة خارج اللعب إلا إذا تجاوزت خط المرمى أو خط التماس بكاملها، على الأرض أو في الهواء. وما دام جزء منها فوق الخط فهي لا تزال في اللعب."},"en":{"s":"A cross from the right swerves in the air out towards the goal line, but it never wholly passes over it: part of the ball stays above the line before it curls back into the field. Your call?","o":["Play on: the whole ball did not cross the line","Goal kick: it went out in the air","Dropped ball"],"d":"Play on","r":"None","x":"None","w":"The ball is out of play only when the whole of it has passed over the goal line or touchline, on the ground or in the air. While any part of it is still above the line, it remains in play."}},{"id":"corner-flag-rebound","lvl":"b","ref":"9.2","a":1,"ar":{"s":"ارتطمت الكرة بقائم راية الركنية وارتدت إلى داخل الملعب، فواصل المهاجم اللعب. ما قرارك؟","o":["ركلة ركنية، فالراية خارج الملعب","يستمر اللعب","ركلة مرمى"],"d":"يستمر اللعب","r":"لا يوجد","x":"لا يوجد","w":"تبقى الكرة في اللعب إذا ارتدت من القائمين أو العارضة أو قائم راية الركنية وبقيت داخل ميدان اللعب."},"en":{"s":"The ball hits the corner flagpost and rebounds into the field, and an attacker carries on. Your call?","o":["Corner kick: the flag is outside the field","Play on","Goal kick"],"d":"Play on","r":"None","x":"None","w":"The ball remains in play when it rebounds off a goalpost, crossbar or corner flagpost and stays on the field of play."}},{"id":"referee-touch-turnover","lvl":"b","ref":"9.1 · 8.2","a":2,"ar":{"s":"في منتصف الملعب ارتطمت تمريرة من الفريق (أ) بالحكم، فارتدت إلى لاعب من الفريق (ب). ما قرارك؟","o":["يستمر اللعب، فالحكم جزء من الملعب","رمية تماس للفريق (أ)","إيقاف اللعب، وكرة مسقطة للفريق (أ) في مكان ملامسة الحكم"],"d":"إيقاف اللعب","r":"كرة مسقطة للفريق (أ) من مكان ملامسة الحكم","x":"لا يوجد","w":"إذا لمست الكرة أحد الحكام وبقيت في الملعب وتغيّر الفريق المستحوذ، تصبح خارج اللعب ويُستأنف بكرة مسقطة. وتُسقط للفريق الذي كان سيحتفظ بها، في مكان الملامسة."},"en":{"s":"In midfield a pass by team A hits the referee and rebounds to a team B player. Your call?","o":["Play on: the referee is part of the field","Throw-in to team A","Stop play; dropped ball to team A where the referee was hit"],"d":"Stop play","r":"Dropped ball to team A at the point of contact","x":"None","w":"If the ball touches a match official, stays on the field and possession changes, it is out of play and restarts with a dropped ball. It goes to the team that would have kept possession, at the point of contact."}},{"id":"referee-touch-no-effect","lvl":"p","ref":"9.1 · 9.2","a":1,"ar":{"s":"مرّر مدافع من الفريق (أ) الكرة في ملعبه، فلمست الحكم المساعد على الخط وبقيت في الملعب، ثم وصلت إلى زميله دون أن يبدأ هجوم واعد. ما قرارك؟","o":["إيقاف اللعب وكرة مسقطة للفريق (أ)","يستمر اللعب","رمية تماس للفريق (ب)"],"d":"يستمر اللعب","r":"لا يوجد","x":"لا يوجد","w":"لمس الكرة لأحد الحكام لا يوقف اللعب بحد ذاته. تصبح خارج اللعب فقط إذا بدأ فريق هجومًا واعدًا، أو دخلت المرمى مباشرة، أو تغيّر الفريق المستحوذ. ولم يحدث أي من ذلك هنا. أما تقدير الهجوم الواعد فيعود للحكم."},"en":{"s":"A team A defender passes in their own half; the ball touches the assistant referee on the line, stays on the field and reaches a team-mate, with no promising attack. Your call?","o":["Stop play; dropped ball to team A","Play on","Throw-in to team B"],"d":"Play on","r":"None","x":"None","w":"A ball touching a match official does not in itself stop play. It is out of play only if a team starts a promising attack, the ball goes directly into the goal, or possession changes. None of these happened. Whether an attack is promising is the referee's judgement."}},{"id":"sub-stops-ball-leaving","lvl":"p","ref":"9.2","a":0,"ar":{"s":"كانت الكرة تتجه بوضوح إلى خارج خط التماس، فأوقفها بقدمه بديل يُجري الإحماء وهو خارج الملعب قبل أن تخرج، دون نية للتأثير على اللعب. ما قرارك؟","o":["ركلة حرة غير مباشرة للمنافس، دون إجراء انضباطي","رمية تماس، فالكرة كانت ستخرج","ركلة حرة مباشرة وإنذار البديل"],"d":"إيقاف اللعب","r":"ركلة حرة غير مباشرة للفريق المنافس","x":"لا يوجد","w":"إذا لمس بديل أو إداري أو لاعب خارج الملعب مؤقتًا الكرة وهي في اللعب لكنها خارجة بوضوح، دون نية للتدخل غير العادل، تُحتسب ركلة حرة غير مباشرة بلا عقوبة انضباطية. أما إذا كان قصده التدخل بشكل غير عادل فيختلف الحكم، وتقدير النية يعود للحكم."},"en":{"s":"The ball is clearly going out over the touchline when a warming-up substitute, off the field, stops it with his foot before it leaves, with no intention to affect play. Your call?","o":["Indirect free kick to the opponents, no disciplinary action","Throw-in: the ball would have gone out","Direct free kick and caution the substitute"],"d":"Stop play","r":"Indirect free kick to the opponents","x":"None","w":"If a substitute, team official or temporarily-off player touches the ball while it is in play but clearly leaving the field, without intending to interfere unfairly, an indirect free kick is given with no sanction. Unfair intent is treated differently; judging intent is for the referee."}}],"myths":[{"id":"ref-touch-always-stops","ref":"9.1","t":false,"ar":{"s":"إذا لمست الكرة الحكم، يجب إيقاف اللعب فورًا.","w":"تبقى الكرة في اللعب بعد لمس أحد حكام المباراة، ولا يُوقف اللعب ويُستأنف بكرة مسقطة إلا إذا بقيت داخل الملعب وبدأ فريق هجمة واعدة، أو دخلت المرمى مباشرة، أو انتقلت حيازتها إلى الفريق الآخر."},"en":{"s":"If the ball hits the referee, play must stop straight away.","w":"The ball stays in play after touching a match official; play stops for a dropped ball only if it remains on the field and a promising attack starts, it goes directly into the goal, or possession changes."}},{"id":"corner-flag-rebound-out","ref":"9.2","t":false,"ar":{"s":"الكرة التي ترتد من قائم الراية الركنية تُعد خارج اللعب.","w":"ما دامت الكرة ترتد من القائم أو العارضة أو قائم الراية الركنية وتبقى داخل ميدان اللعب، فهي لا تزال في اللعب ويستمر اللعب."},"en":{"s":"A ball that bounces off the corner flagpost is out of play.","w":"A ball that rebounds off a goalpost, crossbar or corner flagpost and stays on the field of play is still in play, so play continues."}},{"id":"sub-stops-ball-leaving-ifk","ref":"9.2","t":true,"ar":{"s":"إذا لمس بديلٌ، دون قصد التدخل غير العادل في اللعب، كرةً لا تزال في اللعب لكنها تغادر الملعب بوضوح، تُحتسب ركلة حرة غير مباشرة للفريق المنافس.","w":"إذا لمس مسؤول فريق أو بديل أو لاعب مستبدل أو مطرود أو لاعب خارج الملعب مؤقتًا الكرة وهي في اللعب لكنها تغادر الملعب بوضوح، دون قصد التدخل غير العادل، تُحتسب ركلة حرة غير مباشرة دون أي عقوبة انضباطية. أما إذا كان التدخل غير عادل ومقصودًا فيُعاقب وفق المادتين 3 و12."},"en":{"s":"If a substitute, without meaning to interfere unfairly, touches a ball that is still in play but clearly leaving the field, the opponents get an indirect free kick.","w":"When a team official, substitute, substituted or sent-off player, or a player temporarily off the field touches the ball while it is still in play but clearly leaving the field, without intending to interfere unfairly, an indirect free kick is awarded with no sanction. Deliberate unfair interference is dealt with under Laws 3 and 12 instead."}}]},"10":{"pages":{"ar":"ع ص 101–106 · EN p.103–107","en":"EN p.103–107 · AR p.101–106"},"parts":[{"id":"goal","title":{"ar":"احتساب الهدف","en":"Goal scored"},"ref":"10.1","fig":"goalline","k":["هدف","goal","خط المرمى","goal line","بكاملها","wholly","رمية الحارس","goalkeeper throw"],"body":{"ar":"<p>يُحتسب الهدف عندما تعبر <b>الكرة بكاملها</b> خط المرمى <b>بين القائمين وتحت العارضة</b>، بشرط ألا يكون الفريق المسجِّل قد ارتكب مخالفة.</p>\n<div class=\"tbl\"><table><tr><th>الحالة</th><th>القرار</th></tr>\n<tr><td>رمى الحارس الكرة بيده مباشرة في مرمى المنافس</td><td><b>ركلة مرمى</b></td></tr>\n<tr><td>أعلن الحكم الهدف قبل أن تعبر الكرة الخط بكاملها</td><td><b>كرة مسقطة</b></td></tr></table></div>","en":"<p>A goal is scored when the <b>whole ball</b> passes over the goal line <b>between the posts and under the crossbar</b>, provided the scoring team committed no offence.</p>\n<div class=\"tbl\"><table><tr><th>Situation</th><th>Decision</th></tr>\n<tr><td>Goalkeeper throws the ball directly into the opponents' goal</td><td><b>Goal kick</b></td></tr>\n<tr><td>Referee signals a goal before the ball wholly crossed the line</td><td><b>Dropped ball</b></td></tr></table></div>"},"quiz":[{"ar":["رمى الحارس الكرة بيده من منطقته فدخلت مرمى المنافس مباشرة. القرار؟",["هدف","ركلة مرمى"],"(10.1)"],"en":["The goalkeeper throws the ball directly into the opponents' goal. Decision?",["Goal","Goal kick"],"(10.1)"],"a":1,"lvl":"b"},{"ar":["الكرة على خط المرمى ولم تعبره بكاملها. هدف؟",["نعم","لا"],"(10.1)"],"en":["The ball is on the goal line, not wholly over it. Goal?",["Yes","No"],"(10.1)"],"a":1,"lvl":"b"}]},{"id":"winner","title":{"ar":"الفريق الفائز","en":"Winning team"},"ref":"10.2","k":["فائز","winner","تعادل","draw","وقت إضافي","extra time","الأهداف خارج الأرض","away goals","ترجيح","penalties"],"body":{"ar":"<ul><li>الفائز هو الفريق الذي سجّل أهدافًا <b>أكثر</b>. وإذا تساوى الفريقان أو لم يسجلا، فالنتيجة <b>تعادل</b>.</li></ul>\n<p>إذا اشترطت <b>لوائح المسابقة</b> وجود فائز، فالطرق المسموحة <b>فقط</b>:</p>\n<ol><li>قاعدة الأهداف خارج الأرض.</li><li>وقت إضافي: شوطان متساويان، لا يتجاوز كل منهما <b>15 دقيقة</b>.</li><li>ركلات الترجيح.</li></ol>\n<p>ويجوز الجمع بينها.</p>","en":"<ul><li>The team scoring <b>more</b> goals wins. Equal goals, or none, is a <b>draw</b>.</li></ul>\n<p>If <b>competition rules</b> require a winner, the <b>only</b> permitted procedures are:</p>\n<ol><li>Away goals rule.</li><li>Extra time: two equal periods of at most <b>15 minutes</b>.</li><li>Penalties (shoot-out).</li></ol>\n<p>A combination may be used.</p>"},"quiz":[{"ar":["أقصى مدة لكل شوط من الوقت الإضافي؟",["10 دقائق","15 دقيقة","20 دقيقة"],"(10.2)"],"en":["Maximum length of each extra-time period?",["10 minutes","15 minutes","20 minutes"],"(10.2)"],"a":1,"lvl":"b"},{"ar":["هل يجوز تحديد الفائز بالهدف الذهبي وفق القانون الحالي؟",["نعم","لا"],"ليس من الطرق المسموحة. (10.2)"],"en":["Is a golden goal a permitted way to decide a winner?",["Yes","No"],"Not a permitted procedure. (10.2)"],"a":1,"lvl":"b"}]},{"id":"before","title":{"ar":"ركلات الترجيح: قبل البدء","en":"Penalties: before the shoot-out"},"ref":"10.3","fig":"shootout","k":["ركلات الترجيح","shoot-out","قرعة","toss","مؤهل","eligible","تساوي العدد","reduce numbers","حارس بديل"],"body":{"ar":"<ul><li>تُنفذ <b>بعد نهاية المباراة</b>. اللاعب المطرود أثناء المباراة <b>لا يشارك</b>، والتحذيرات والإنذارات <b>لا تنتقل</b> إلى الترجيح.</li>\n<li><b>قرعة أولى</b> لتحديد المرمى (إلا لظروف الملعب أو السلامة)، ولا يتغير إلا للسلامة أو لتعذّر استخدامه.</li>\n<li><b>قرعة ثانية:</b> الفائز يختار التنفيذ أولًا أو ثانيًا.</li>\n<li><b>المؤهلون:</b> من كانوا في الملعب، أو خارجه مؤقتًا، عند نهاية المباراة. والاستثناء بديل لحارس لا يستطيع الاستمرار.</li>\n<li>كل فريق يحدد ترتيب المنفذين، و<b>لا يُبلَّغ الحكم</b> بالترتيب.</li>\n<li>إذا كان عدد لاعبي أحد الفريقين أكبر، <b>يُنقص</b> عدده ليساوي المنافس، ويُبلغ الحكم باسم ورقم كل مستبعد.</li>\n<li><b>حارس لا يستطيع الاستمرار:</b> يحل محله لاعب مستبعد لتساوي العدد، أو بديل مسجل إن لم يستنفد الفريق تبديلاته. والحارس المستبدَل لا يشارك بعدها. وإن كان قد نفّذ ركلة، فبديله لا ينفذ قبل الجولة التالية.</li></ul>","en":"<ul><li>Taken <b>after the match</b>. A player sent off during the match <b>can't take part</b>; warnings and cautions are <b>not carried forward</b>.</li>\n<li><b>First toss</b> decides the goal (unless ground or safety reasons); changed only for safety or if unusable.</li>\n<li><b>Second toss:</b> the winner chooses to kick first or second.</li>\n<li><b>Eligible:</b> players on the field, or temporarily off, at the end of the match; plus a replacement for a goalkeeper unable to continue.</li>\n<li>Each team picks its order; <b>the referee is not told</b>.</li>\n<li>A team with more players must <b>reduce</b> to match the opponents and tell the referee each excluded player's name and number.</li>\n<li><b>Goalkeeper unable to continue:</b> replaced by an excluded player or, if substitutes remain, a named substitute; the replaced goalkeeper takes no further part. If they had already kicked, the replacement waits until the next round.</li></ul>"},"quiz":[{"ar":["لاعب طُرد في الدقيقة 85. هل يشارك في ركلات الترجيح؟",["نعم","لا"],"(10.3)"],"en":["A player sent off in the 85th minute. Can he take part in penalties?",["Yes","No"],"(10.3)"],"a":1,"lvl":"b"},{"ar":["لاعب حصل على إنذار في المباراة ثم إنذار في الترجيح. هل يُطرد؟",["نعم، إنذار ثانٍ","لا، إنذارات المباراة لا تنتقل"],"(10.3)"],"en":["A player cautioned in the match is cautioned again in the shoot-out. Sent off?",["Yes, second caution","No, match cautions don't carry over"],"(10.3)"],"a":1,"lvl":"p"},{"ar":["فريق لديه 11 لاعبًا ومنافسه 10. ماذا يحدث قبل الترجيح؟",["لا شيء","يُنقص الفريق الأول لاعبًا"],"(10.3)"],"en":["One team has 11, the other 10. What happens before penalties?",["Nothing","The first team reduces by one"],"(10.3)"],"a":1,"lvl":"p"}]},{"id":"during","title":{"ar":"ركلات الترجيح: أثناء التنفيذ","en":"Penalties: during the shoot-out"},"ref":"10.3","k":["أثناء الترجيح","during","دائرة المنتصف","centre circle","خمس ركلات","five kicks","ركلة ثانية","second kick","حارس يتقدم"],"body":{"ar":"<ul><li>يبقى في الملعب فقط المؤهلون والحكام. والمؤهلون، عدا المنفذ والحارسين، داخل <b>دائرة المنتصف</b>.</li>\n<li>حارس فريق المنفذ يقف داخل الملعب، خارج منطقة الجزاء، عند <b>تقاطع خط المرمى مع خط منطقة الجزاء</b>.</li>\n<li>تكتمل الركلة عندما تتوقف الكرة، أو تخرج، أو يوقف الحكم اللعب لمخالفة. ولا يجوز للمنفذ لعبها مرة ثانية عمدًا.</li></ul>\n<div class=\"tbl\"><table><tr><th>الحالة</th><th>القرار</th></tr>\n<tr><td>ركل الكرة بالقدمين معًا عرَضًا، أو لمست قدمه الأخرى فورًا، <b>ودخلت</b></td><td>تُعاد الركلة</td></tr>\n<tr><td>نفس الحالة <b>ولم تدخل</b></td><td>تُسجَّل ضائعة</td></tr>\n<tr><td>مخالفة من الحارس أدت للإعادة</td><td>تحذير في الأولى، و<b>إنذار</b> في التالية</td></tr>\n<tr><td>مخالفة من المنفذ بعد إشارة الحكم</td><td>تُسجَّل ضائعة، ويُنذر المنفذ</td></tr></table></div>\n<h3>التسلسل</h3>\n<ul><li><b>5 ركلات</b> لكل فريق بالتناوب، وكل ركلة لاعب مختلف. ولا ينفذ أحد ركلة ثانية حتى ينفذ كل المؤهلين.</li>\n<li>إذا حُسمت النتيجة قبل اكتمال الخمس، تتوقف الركلات. وعند التعادل بعد الخمس: ركلة لكل فريق حتى يتقدم أحدهما بعدد متساوٍ من الركلات، ويجوز تغيير الترتيب.</li>\n<li>لا يُؤخَّر الترجيح لأجل لاعب غادر الملعب، وتضيع ركلته إن لم يعد في وقتها.</li></ul>\n<h3>عقوبات وتبديلات</h3>\n<ul><li>يجوز إنذار أو طرد لاعب أو بديل أو مستبدَل أو مسؤول.</li><li>الحارس المطرود يحل محله لاعب مؤهل.</li>\n<li>غير الحارس إذا لم يستطع الاستمرار <b>لا يُعوَّض</b>.</li><li>لا تُلغى المباراة إذا نقص الفريق عن 7 لاعبين.</li></ul>","en":"<ul><li>Only eligible players and officials stay on the field. Eligible players, except the kicker and both goalkeepers, stay in the <b>centre circle</b>.</li>\n<li>The kicker's goalkeeper stands on the field, outside the penalty area, where the <b>goal line meets the penalty-area line</b>.</li>\n<li>The kick ends when the ball stops, goes out, or play is stopped for an offence; the kicker may not deliberately play it again.</li></ul>\n<div class=\"tbl\"><table><tr><th>Situation</th><th>Decision</th></tr>\n<tr><td>Kicker accidentally uses both feet, or the ball touches the other foot at once, <b>and it goes in</b></td><td>Retake</td></tr>\n<tr><td>Same, <b>no goal</b></td><td>Recorded as missed</td></tr>\n<tr><td>Goalkeeper offence causing a retake</td><td>Warning first time, <b>caution</b> after</td></tr>\n<tr><td>Kicker's offence after the signal</td><td>Recorded as missed; kicker cautioned</td></tr></table></div>\n<h3>Sequence</h3>\n<ul><li><b>5 kicks</b> each, alternately, each by a different player; nobody kicks twice until all eligible players have kicked.</li>\n<li>Stop early once one side can't be caught. Level after five: one kick each until one leads after the same number; the order may change.</li>\n<li>Don't delay for a player who leaves the field; their kick is forfeited if they don't return in time.</li></ul>\n<h3>Sanctions and replacements</h3>\n<ul><li>Players, substitutes, substituted players and officials may be cautioned or sent off.</li><li>A sent-off goalkeeper is replaced by an eligible player.</li>\n<li>An outfield player unable to continue is <b>not replaced</b>.</li><li>The match isn't abandoned if a team drops below seven.</li></ul>"},"quiz":[{"ar":["أين يقف اللاعبون المؤهلون أثناء الترجيح؟",["خلف المرمى","داخل دائرة المنتصف"],"(10.3)"],"en":["Where do eligible players wait during penalties?",["Behind the goal","Inside the centre circle"],"(10.3)"],"a":1,"lvl":"b"},{"ar":["المنفذ ركل بالقدمين معًا عرَضًا ولم تدخل الكرة. القرار؟",["إعادة","تُسجل ضائعة"],"(10.3)"],"en":["The kicker accidentally uses both feet and misses. Decision?",["Retake","Recorded as missed"],"(10.3)"],"a":1,"lvl":"p"},{"ar":["الحارس تقدّم قبل الركل للمرة الثانية فأُعيدت الركلة. ماذا يحصل له؟",["تحذير","إنذار"],"(10.3)"],"en":["The goalkeeper moves early for a second time, causing a retake. Sanction?",["Warning","Caution"],"(10.3)"],"a":1,"lvl":"p"}]}],"cases":[{"id":"gk-throw-goal","lvl":"b","ref":"10.1","a":1,"ar":{"s":"التقط الحارس الكرة داخل منطقة جزائه ورماها بيده بقوة، فعبرت الملعب كله ودخلت مرمى المنافس مباشرة. ما قرارك؟","o":["هدف","ركلة مرمى للفريق المنافس","ركلة ركنية"],"d":"لا هدف","r":"ركلة مرمى","x":"لا يوجد","w":"إذا رمى الحارس الكرة بيده مباشرة في مرمى المنافس، لا يُحتسب الهدف ويُستأنف اللعب بركلة مرمى."},"en":{"s":"The goalkeeper catches the ball in their penalty area and throws it hard; it travels the length of the field and goes directly into the opponents' goal. Your call?","o":["Goal","Goal kick to the opponents","Corner kick"],"d":"No goal","r":"Goal kick","x":"None","w":"If the goalkeeper throws the ball directly into the opponents' goal, no goal is scored and play restarts with a goal kick."}},{"id":"early-goal-whistle","lvl":"b","ref":"10.1 · 8.2","a":0,"ar":{"s":"أطلق الحكم صافرة الهدف ظنًّا أن الكرة عبرت خط المرمى، لكنها لم تعبره بكاملها، وأبعدها مدافع من فوق الخط. ما قرارك؟","o":["لا هدف، كرة مسقطة لحارس الفريق المدافع","هدف، فقد أُطلقت الصافرة","ركلة ركنية"],"d":"لا هدف","r":"كرة مسقطة لحارس الفريق المدافع داخل منطقة جزائه","x":"لا يوجد","w":"إذا أشار الحكم إلى هدف قبل أن تتجاوز الكرة خط المرمى بكاملها، يُستأنف اللعب بكرة مسقطة. ولأن الكرة كانت داخل منطقة الجزاء عند الإيقاف، تُسقط لحارس الفريق المدافع."},"en":{"s":"The referee whistles for a goal believing the ball has crossed the line, but it had not wholly crossed, and a defender clears it off the line. Your call?","o":["No goal; dropped ball to the defending goalkeeper","Goal: the whistle has gone","Corner kick"],"d":"No goal","r":"Dropped ball to the defending goalkeeper in their penalty area","x":"None","w":"If the referee signals a goal before the whole ball has crossed the goal line, play restarts with a dropped ball. As the ball was in the penalty area when play stopped, it goes to the defending goalkeeper."}},{"id":"shootout-sent-off","lvl":"b","ref":"10.3","a":2,"ar":{"s":"طُرد لاعب في الوقت الإضافي، وبعد نهاية المباراة يريد مدربه أن يكون هذا اللاعب أول منفذ في ركلات الترجيح. ما قرارك؟","o":["مسموح، فركلات الترجيح بعد نهاية المباراة","مسموح إذا لم يكن الفريق قد استنفد تبديلاته","غير مسموح، فاللاعب المطرود لا يشارك في ركلات الترجيح"],"d":"رفض مشاركة اللاعب","r":"لا يوجد","x":"لا يوجد","w":"اللاعب الذي طُرد خلال المباراة لا يحق له المشاركة في ركلات الترجيح. بخلاف الإنذارات والتحذيرات التي لا تنتقل إلى ركلات الترجيح."},"en":{"s":"A player is sent off in extra time, and after the match his coach wants him to take the first kick in the penalty shoot-out. Your call?","o":["Allowed: the shoot-out is after the match","Allowed if the team has substitutions left","Not allowed: a sent-off player cannot take part in the shoot-out"],"d":"Refuse the player's participation","r":"None","x":"None","w":"A player sent off during the match may not take part in the penalty shoot-out. Warnings and cautions, by contrast, are not carried forward into it."}},{"id":"shootout-equalise","lvl":"p","ref":"10.3","a":0,"ar":{"s":"انتهت المباراة والفريق (أ) بأحد عشر لاعبًا والفريق (ب) بعشرة بعد طرد. ما الإجراء قبل ركلات الترجيح؟","o":["يُقلّص الفريق (أ) عدده إلى عشرة، ويُبلغ الحكم باسم ورقم اللاعب المستبعد","يُسمح للفريق (ب) بإدخال بديل ليتساوى العدد","تُنفذ الركلات بلا تغيير، فالعدد لا يؤثر"],"d":"مساواة عدد اللاعبين","r":"لا يوجد","x":"لا يوجد","w":"إذا كان لدى فريق عدد أكبر من منافسه، يجب أن يقلّص عدده ليساويه، ويُبلغ الحكم باسم ورقم كل لاعب مستبعد. ولا يشارك المستبعد في الركلات، إلا لتعويض حارس لا يستطيع الاستمرار."},"en":{"s":"The match ends with team A on eleven players and team B on ten after a sending-off. What happens before the shoot-out?","o":["Team A reduces to ten and gives the referee the name and number of the excluded player","Team B may bring on a substitute to level the numbers","Kicks proceed unchanged: numbers don't matter"],"d":"Equalise the numbers","r":"None","x":"None","w":"If one team has more players than the other, it must reduce to the same number and inform the referee of the name and number of each excluded player. An excluded player cannot take a kick, except as a replacement for a goalkeeper unable to continue."}},{"id":"shootout-double-touch","lvl":"p","ref":"10.3","a":1,"ar":{"s":"في ركلات الترجيح لمست الكرة القدم الداعمة لمنفذ الركلة بشكل عرضي مباشرة بعد ركلها، ثم دخلت المرمى. ما قرارك؟","o":["هدف","تُعاد الركلة","تُسجل الركلة ضائعة ويُنذر المنفذ"],"d":"لا هدف","r":"إعادة الركلة","x":"لا يوجد","w":"إذا ركل المنفذ الكرة بالقدمين معًا عرضيًا، أو لمست قدمه أو ساقه الأخرى مباشرة بعد الركلة: تُعاد الركلة إذا دخلت الكرة المرمى، وتُسجل ضائعة إذا لم تدخل. ولأن اللمسة عرضية فلا إنذار."},"en":{"s":"In the penalty shoot-out the ball accidentally touches the kicker's standing foot immediately after the kick and goes into the goal. Your call?","o":["Goal","Retake the kick","Record it as missed and caution the kicker"],"d":"No goal","r":"Retake the kick","x":"None","w":"If the kicker accidentally kicks the ball with both feet or it touches their other foot or leg immediately after the kick: retake if it goes in, recorded as missed if it does not. As the touch was accidental, there is no caution."}}],"myths":[{"id":"gk-throw-into-goal-counts","ref":"10.1","t":false,"ar":{"s":"إذا رمى حارس المرمى الكرة بيده مباشرة في مرمى المنافس، يُحتسب هدف.","w":"لا يُحتسب الهدف إذا رمى الحارس الكرة مباشرة في مرمى المنافس، ويُستأنف اللعب بركلة مرمى للفريق المنافس."},"en":{"s":"If a goalkeeper throws the ball straight into the opponents' net, it's a goal.","w":"A goal cannot be scored directly from a goalkeeper's throw into the opponents' goal; play restarts with a goal kick to the opponents."}},{"id":"cautions-carry-into-shootout","ref":"10.3","t":false,"ar":{"s":"اللاعب الذي نال إنذارًا خلال المباراة يُطرد إذا نال إنذارًا آخر في ركلات الترجيح.","w":"الإنذارات والتحذيرات الصادرة خلال المباراة لا تنتقل إلى ركلات الترجيح، فيبدأ الجميع بسجل نظيف، أما اللاعب المطرود خلال المباراة فلا يشارك فيها."},"en":{"s":"A player booked during the match is sent off if booked again in the penalty shoot-out.","w":"Warnings and cautions from the match are not carried forward into the penalty shoot-out, so everyone starts with a clean record; a player sent off during the match may not take part."}},{"id":"away-goals-still-allowed","ref":"10.2","t":true,"ar":{"s":"قاعدة الهدف خارج الأرض لا تزال مسموحًا بها في قانون اللعبة.","w":"عندما تشترط لوائح المسابقة وجود فائز بعد التعادل أو في مواجهة ذهاب وإياب، تبقى قاعدة الهدف خارج الأرض إحدى الطرق المسموح بها، إلى جانب شوطين إضافيين متساويين لا يزيد كل منهما على 15 دقيقة، وركلات الترجيح، ويمكن الجمع بينها."},"en":{"s":"The away goals rule is still permitted by the Laws of the Game.","w":"When competition rules require a winner after a draw or a home-and-away tie, the away goals rule remains one of the permitted methods, alongside two equal extra-time periods of no more than 15 minutes each and penalties, and they may be combined."}}]},"11":{"pages":{"ar":"ع ص 107–109 · EN p.109–112","en":"EN p.109–112 · AR p.107–109"},"parts":[{"id":"pos","title":{"ar":"موقف التسلل","en":"Offside position"},"ref":"11.1","fig":"offside","body":{"ar":"<p>الوقوف في موقف تسلل <b>ليس مخالفة</b>. يكون اللاعب في موقف تسلل إذا كان جزء من رأسه أو جسمه أو قدميه:</p>\n  <ul><li>في <b>نصف ملعب المنافس</b> (خط المنتصف لا يُحسب)، و</li><li>أقرب إلى خط مرمى المنافس من <b>الكرة</b> ومن <b>المنافس قبل الأخير</b>.</li></ul>\n  <p><b>اليدان والذراعان لا تُحسبان</b> لأي لاعب، وحدّ الذراع عند أسفل الإبط. <b>على خط واحد</b> = ليس في موقف تسلل.</p>","en":"<p>Being in an offside position is <b>not an offence</b>. A player is in an offside position if any part of the head, body or feet is:</p>\n  <ul><li>in the <b>opponents' half</b> (not on the halfway line), and</li><li>nearer the opponents' goal line than both the <b>ball</b> and the <b>second-last opponent</b>.</li></ul>\n  <p><b>Hands and arms are ignored</b> for every player; the arm ends at the bottom of the armpit. <b>Level</b> = not offside.</p>"},"quiz":[{"ar":["أي جزء لا يُحسب في موقف التسلل؟",["الرأس","القدم","الذراع"],"(11.1)"],"en":["Which part is ignored?",["Head","Foot","Arm"],"(11.1)"],"a":2,"lvl":"b"},{"ar":["على خط واحد مع المنافس قبل الأخير. في موقف تسلل؟",["نعم","لا"],"(11.1)"],"en":["Level with the second-last opponent. Offside position?",["Yes","No"],"(11.1)"],"a":1,"lvl":"b"}],"k":["تسلل","offside","موقف","ذراع","arm","قبل الأخير","second-last"]},{"id":"inv","title":{"ar":"المشاركة في اللعب","en":"Involvement in play"},"ref":"11.2","body":{"ar":"<p>يُحكم على الموقع <b>لحظة لعب الزميل للكرة</b> (أول تلامس؛ وآخر تلامس إذا رماها الحارس بيده). ولا يُعاقَب إلا إذا شارك:</p>\n  <div class=\"tbl\"><table><tr><th>الطريقة</th><th>ببساطة</th></tr>\n  <tr><td>التدخل في اللعب</td><td>لعب الكرة أو لمسها بعد تمريرة زميله</td></tr>\n  <tr><td>التدخل مع منافس</td><td>حجب رؤيته بوضوح، أو منافسته على الكرة، أو محاولة واضحة للعب كرة قريبة تؤثر عليه، أو حركة واضحة تؤثر على قدرته</td></tr>\n  <tr><td>الاستفادة</td><td>لعب كرة ارتدت من القائم أو العارضة أو حكم أو منافس، أو بعد إنقاذ متعمد</td></tr></table></div>","en":"<p>Position is judged <b>when the team-mate plays the ball</b> (first contact; last contact when the goalkeeper throws it). A player is penalised only if involved:</p>\n  <div class=\"tbl\"><table><tr><th>Way</th><th>In short</th></tr>\n  <tr><td>Interfering with play</td><td>Plays or touches the ball after a team-mate's pass</td></tr>\n  <tr><td>Interfering with an opponent</td><td>Clearly blocks their vision, challenges them, clearly tries to play a close ball affecting them, or an obvious action affecting their ability</td></tr>\n  <tr><td>Gaining an advantage</td><td>Plays a ball rebounding off the post, crossbar, an official or an opponent, or after a deliberate save</td></tr></table></div>"},"quiz":[{"ar":["في موقف تسلل، لم يلمس الكرة ولم يؤثر على أحد. القرار؟",["ركلة حرة غير مباشرة","يستمر اللعب"],"(11.2)"],"en":["Offside position, no touch, affects no one. Decision?",["IFK","Play on"],"(11.2)"],"a":1,"lvl":"b"},{"ar":["يقف أمام الحارس ويحجب رؤيته بوضوح والكرة تدخل. القرار؟",["هدف","تسلل"],"تدخل مع منافس. (11.2)"],"en":["Stands in front of the GK clearly blocking vision; ball goes in. Decision?",["Goal","Offside"],"Interfering with an opponent. (11.2)"],"a":1,"lvl":"p"}],"k":["مشاركة","تدخل","interfer","حجب","vision","استفادة","advantage"]},{"id":"del","title":{"ar":"اللعب المتعمد والإنقاذ","en":"Deliberate play and saves"},"ref":"11.2","body":{"ar":"<ul><li>إذا <b>لعب المنافس الكرة عمدًا</b> (ومنه لمسها باليد عمدًا) ثم وصلت للاعب في موقف تسلل: <b>لا تسلل</b>.</li>\n  <li>الاستثناء: <b>الإنقاذ المتعمد</b> لا يُنهي حالة التسلل.</li><li>الارتداد أو الانحراف لا يُنهيها، وفشل التمريرة لا يلغي أنه لعب متعمد.</li></ul>\n  <div class=\"note judge\"><b>مؤشرات التحكم (تقدير الحكم):</b> مسافة الكرة ووضوح رؤيتها، سرعتها، توقع اتجاهها، وجود وقت لتنسيق الحركة، والكرة الأرضية أسهل.</div>","en":"<ul><li>If an <b>opponent deliberately plays</b> the ball (including deliberate handball) and it reaches an offside player: <b>no offside</b>.</li>\n  <li>Exception: a <b>deliberate save</b> does not reset offside.</li><li>A rebound or deflection does not reset it; a failed pass is still deliberate play.</li></ul>\n  <div class=\"note judge\"><b>Indicators of control (referee's judgement):</b> distance and view, speed, expected direction, time to coordinate; a ground ball is easier.</div>"},"quiz":[{"ar":["مدافع يحاول إبعاد الكرة بهدوء فيخطئ وتصل لمهاجم في موقف تسلل.",["تسلل","لا تسلل"],"لعب متعمد. (11.2)"],"en":["A defender calmly miscues a clearance to an offside attacker.",["Offside","No offside"],"Deliberate play. (11.2)"],"a":1,"lvl":"b"},{"ar":["مدافع يصد كرة متجهة للمرمى فترتد لمهاجم في موقف تسلل.",["تسلل","لا تسلل"],"الإنقاذ لا يُنهي الحالة. (11.2)"],"en":["A defender saves a goal-bound shot; it rebounds to an offside attacker.",["Offside","No offside"],"A save does not reset. (11.2)"],"a":0,"lvl":"p"}],"k":["متعمد","deliberate","إنقاذ","save","ارتداد","rebound"]},{"id":"rest","title":{"ar":"الاستثناءات والعقوبة","en":"Exceptions and sanction"},"ref":"11.3 · 11.4","body":{"ar":"<ul><li><b>لا تسلل</b> إذا استلم اللاعب الكرة <b>مباشرة</b> من: ركلة مرمى، أو رمية تماس، أو ركلة ركنية.</li>\n  <li>مخالفة التسلل ← <b>ركلة حرة غير مباشرة</b> من مكان المخالفة، ولو في نصف ملعب اللاعب.</li></ul>\n  <h3>الخروج من الملعب</h3>\n  <ul><li><b>مدافع خرج دون إذن:</b> يُحسب على خط المرمى أو التماس حتى التوقف التالي أو إبعاد فريقه للكرة نحو المنتصف خارج منطقة جزائه. يُنذر إن تعمّد.</li>\n  <li><b>مهاجم خرج ليتجنب المشاركة:</b> مسموح؛ إن عاد وشارك قبل ذلك يُحسب على خط المرمى.</li></ul>","en":"<ul><li><b>No offside</b> directly from a goal kick, throw-in or corner kick.</li>\n  <li>Offside offence → <b>indirect free kick</b> where it happened, even in the player's own half.</li></ul>\n  <h3>Leaving the field</h3>\n  <ul><li><b>Defender off without permission:</b> counts as on the goal line or touchline until the next stoppage or a clearance towards halfway outside the penalty area. Cautioned if deliberate.</li>\n  <li><b>Attacker steps off to avoid involvement:</b> allowed; if they return and get involved before then, they count as on the goal line.</li></ul>"},"quiz":[{"ar":["لا تسلل إذا استلم الكرة مباشرة من…",["ركلة حرة","ركلة ركنية","كرة مسقطة"],"(11.3)"],"en":["No offside directly from a…",["Free kick","Corner kick","Dropped ball"],"(11.3)"],"a":1,"lvl":"b"},{"ar":["الاستئناف بعد مخالفة التسلل؟",["ركلة حرة مباشرة","ركلة حرة غير مباشرة"],"(11.4)"],"en":["Restart after offside?",["Direct free kick","Indirect free kick"],"(11.4)"],"a":1,"lvl":"b"},{"ar":["مدافع خرج دون إذن ليوقع المهاجم في التسلل. كيف يُعامل؟",["لا يُحسب","يُحسب على الخط"],"(11.4)"],"en":["A defender leaves without permission to play an attacker offside. How treated?",["Ignored","Counted on the line"],"(11.4)"],"a":1,"lvl":"p"}],"k":["رمية","throw","ركلة حرة غير مباشرة","indirect","خروج","leav"]}],"cases":[{"id":"offside-not-involved","lvl":"b","ref":"11.1 · 11.2","a":2,"ar":{"s":"عند تمريرة زميله كان المهاجم (أ) في موقف التسلل بعيدًا عن الكرة، ولم يتحرك نحوها ولم يحجب رؤية أحد، فسجّل زميله (ب) القادم من موقف سليم هدفًا. ما قرارك؟","o":["إلغاء الهدف لوجود (أ) في موقف التسلل","ركلة حرة غير مباشرة من مكان (أ)","احتساب الهدف"],"d":"احتساب الهدف","r":"ركلة البداية","x":"لا يوجد","w":"الوجود في موقف التسلل ليس مخالفة بحد ذاته. يُعاقب اللاعب فقط إذا شارك في اللعب الفعلي بلعب الكرة أو التدخل مع منافس أو الاستفادة من وجوده، و(أ) لم يفعل أيًا من ذلك."},"en":{"s":"When the pass is played, attacker A is in an offside position far from the ball, does not move towards it or block anyone's view, and team-mate B, who started onside, scores. Your call?","o":["Disallow: A was in an offside position","Indirect free kick from A's position","Award the goal"],"d":"Award the goal","r":"Kick-off","x":"None","w":"Being in an offside position is not an offence in itself. A player is penalised only for becoming involved in active play by interfering with play or an opponent, or gaining an advantage, and A did none of these."}},{"id":"offside-arm-ahead","lvl":"b","ref":"11.1","a":0,"ar":{"s":"عند لحظة التمرير كانت قدما المهاجم وجسمه على مستوى قبل الأخير من المدافعين، لكن ذراعه الممدودة كانت أقرب إلى خط المرمى. استلم الكرة وسجّل. ما قرارك؟","o":["احتساب الهدف، فالذراع لا تُحتسب في التسلل","إلغاء الهدف وركلة حرة غير مباشرة","إلغاء الهدف وركلة مرمى"],"d":"احتساب الهدف","r":"ركلة البداية","x":"لا يوجد","w":"اليدان والذراعان لا تُحتسبان عند تحديد موقف التسلل لأي لاعب، والحد العلوي للذراع عند أسفل الإبط. واللاعب المساوي لقبل الأخير من المنافسين ليس في موقف التسلل."},"en":{"s":"When the pass is played, the attacker's feet and body are level with the second-last defender, but his outstretched arm is nearer the goal line. He receives and scores. Your call?","o":["Award the goal: arms don't count for offside","Disallow; indirect free kick","Disallow; goal kick"],"d":"Award the goal","r":"Kick-off","x":"None","w":"Hands and arms of all players are not considered when judging offside position; the upper limit of the arm is the bottom of the armpit. A player level with the second-last opponent is not in an offside position."}},{"id":"offside-throw-in","lvl":"b","ref":"11.3","a":1,"ar":{"s":"نفّذ لاعب رمية تماس مباشرة إلى زميله الواقف أقرب إلى خط المرمى من آخر المدافعين، فاستلمها وانطلق نحو المرمى. رفع الحكم المساعد رايته. ما قرارك؟","o":["ركلة حرة غير مباشرة للتسلل","يستمر اللعب، فلا تسلل من رمية التماس مباشرة","تُعاد رمية التماس"],"d":"يستمر اللعب (تجاهل الراية بعد التواصل مع الحكم المساعد)","r":"لا يوجد","x":"لا يوجد","w":"لا توجد مخالفة تسلل إذا استلم اللاعب الكرة مباشرة من رمية التماس أو ركلة المرمى أو الركلة الركنية."},"en":{"s":"A throw-in goes directly to a team-mate standing beyond the last defender, who controls it and heads for goal. The assistant referee raises the flag. Your call?","o":["Indirect free kick for offside","Play on: no offside directly from a throw-in","Retake the throw-in"],"d":"Play on (wave down the flag after communicating with the AR)","r":"None","x":"None","w":"There is no offside offence if a player receives the ball directly from a throw-in, goal kick or corner kick."}},{"id":"offside-deliberate-play","lvl":"p","ref":"11.2","a":1,"ar":{"s":"كرة عالية بطيئة قادمة من بعيد، فتمركز لها المدافع دون ضغط وحاول إبعادها بقدمه، لكنها انحرفت إلى مهاجم كان في موقف التسلل لحظة لعب زميله الكرة، فسجّل. ما قرارك؟","o":["إلغاء الهدف، فالمهاجم استفاد من موقفه","احتساب الهدف، فالمدافع لعب الكرة عمدًا","كرة مسقطة لأن الكرة انحرفت"],"d":"احتساب الهدف","r":"ركلة البداية","x":"لا يوجد","w":"المهاجم الذي يستلم الكرة من منافس لعبها عمدًا لا يُعد مستفيدًا من موقف التسلل، حتى لو كان الإبعاد غير دقيق. وتقدير \"اللعب المتعمد\" للحكم وفق مؤشرات مثل بُعد مسافة الكرة وبطئها ووضوح رؤيتها ووقت المدافع لتنسيق حركته. أما لو كان تصديًا متعمدًا لكرة متجهة إلى المرمى أو قريبة جدًا منه لكانت مخالفة تسلل."},"en":{"s":"A slow, high ball comes from distance; the defender sets himself unchallenged and tries to clear it, but slices it to an attacker who was in an offside position when his team-mate played it. He scores. Your call?","o":["Disallow: the attacker gained an advantage","Award the goal: the defender deliberately played the ball","Dropped ball because of the deflection"],"d":"Award the goal","r":"Kick-off","x":"None","w":"A player receiving the ball from an opponent who deliberately played it has not gained an advantage, even if the clearance was inaccurate. Whether it was deliberate play is the referee's judgement, using indicators such as distance, speed, a clear view and time to coordinate. Had it been a deliberate save of a ball going into or very close to the goal, it would be an offside offence."}},{"id":"offside-defender-off","lvl":"p","ref":"11.4","a":2,"ar":{"s":"خرج مدافع عمدًا من الملعب عبر خط المرمى دون إذن الحكم ليترك المهاجم في موقف التسلل. مُررت الكرة للمهاجم الذي يكون مساويًا لقبل الأخير من المدافعين إذا اعتُبر الخارج على خط المرمى، فسجّل. ما قرارك؟","o":["إلغاء الهدف وركلة حرة غير مباشرة للتسلل","إلغاء الهدف وإنذار المدافع","احتساب الهدف وإنذار المدافع"],"d":"احتساب الهدف","r":"ركلة البداية","x":"إنذار المدافع (مغادرة الملعب عمدًا دون إذن) عند خروج الكرة من اللعب","w":"المدافع الذي يغادر الملعب دون إذن يُعتبر على خط المرمى أو خط التماس لغرض التسلل حتى التوقف التالي أو حتى يلعب فريقه الكرة نحو خط المنتصف وتخرج من منطقة الجزاء. ولأنه غادر عمدًا يُنذر عند خروج الكرة التالي من اللعب."},"en":{"s":"A defender deliberately steps off over the goal line without permission to leave an attacker offside. The ball is passed to the attacker, who is level with the second-last defender if the absent one is counted on the goal line, and he scores. Your call?","o":["Disallow; indirect free kick for offside","Disallow and caution the defender","Award the goal and caution the defender"],"d":"Award the goal","r":"Kick-off","x":"Caution the defender (deliberately leaving without permission) when the ball is out of play","w":"A defender who leaves without permission counts as being on the goal line or touchline for offside until the next stoppage, or until the defending team plays the ball towards halfway and it is outside its penalty area. Having left deliberately, he is cautioned when the ball is next out of play."}}],"myths":[{"id":"offside-position-is-offence","ref":"11.1","t":false,"ar":{"s":"مجرد وجود اللاعب في موقف التسلل يعني مخالفة.","w":"الوجود في موقف التسلل ليس مخالفة بحد ذاته؛ فاللاعب الموجود في موقف التسلل لحظة لعب الكرة أو لمسها من زميله لا يُعاقب إلا إذا شارك في اللعب النشط بالتدخل في اللعب أو التدخل مع منافس أو اكتساب أفضلية."},"en":{"s":"Just being in an offside position is an offence.","w":"Being in an offside position is not an offence in itself; a player in an offside position when a team-mate plays or touches the ball is penalised only on becoming involved in active play by interfering with play, interfering with an opponent or gaining an advantage."}},{"id":"offside-from-throw-in","ref":"11.3","t":false,"ar":{"s":"يمكن أن يكون اللاعب متسللًا إذا استلم الكرة مباشرة من رمية التماس.","w":"لا توجد مخالفة التسلل إذا استلم اللاعب الكرة مباشرة من رمية التماس، وكذلك من ركلة المرمى أو الركلة الركنية."},"en":{"s":"You can be caught offside straight from a throw-in.","w":"There is no offside offence if a player receives the ball directly from a throw-in, and the same applies to a goal kick or a corner kick."}},{"id":"offside-ifk-own-half","ref":"11.4","t":true,"ar":{"s":"قد تُحتسب ركلة حرة غير مباشرة بسبب التسلل داخل نصف ملعب المهاجم نفسه.","w":"تُنفذ الركلة الحرة غير المباشرة من مكان وقوع مخالفة التسلل، حتى لو كان في نصف ملعب اللاعب نفسه، كأن يكون في موقف التسلل ثم يعود إلى نصف ملعبه ليلعب الكرة."},"en":{"s":"An offside free kick can be awarded inside the attacker's own half.","w":"The indirect free kick for offside is taken where the offence occurred, even in the player's own half, for example when a player in an offside position drops back into their own half to play the ball."}}]},"12":{"pages":{"ar":"ع ص 111–124 · EN p.115–128","en":"EN p.115–128 · AR p.111–124"},"parts":[{"id":"dfk","title":{"ar":"الركلة الحرة المباشرة ودرجات الخطأ","en":"Direct free kick and degrees of foul"},"ref":"12.1","fig":"severity","k":["ركلة حرة مباشرة","direct free kick","إهمال","careless","تهور","reckless","قوة مفرطة","excessive force","دفع","push","عرقلة","trip","إمساك","holding"],"body":{"ar":"<p>الركلات الحرة وركلة الجزاء تُحتسب فقط لمخالفات تقع <b>والكرة في اللعب</b>.</p>\n<h3>7 أفعال ضد المنافس تُعاقب بركلة حرة مباشرة إذا ارتُكبت بإهمال أو تهور أو قوة مفرطة:</h3>\n<p>الاندفاع على المنافس · القفز عليه · ركله أو محاولة ركله · دفعه · ضربه أو محاولة ضربه (ومنه النطح) · محاولة قطع الكرة أو منافسته عليها · عرقلته أو محاولة عرقلته.</p>\n<p class=\"note\">أي مخالفة من هذه فيها <b>احتكاك</b> تُعاقب بركلة حرة <b>مباشرة</b>.</p>\n<div class=\"tbl\"><table><tr><th>الدرجة</th><th>المعنى</th><th>العقوبة</th></tr>\n<tr><td><b>إهمال</b></td><td>نقص انتباه أو حذر في المنافسة</td><td>ركلة حرة فقط</td></tr>\n<tr><td><b>تهور</b></td><td>تجاهل الخطر أو العواقب على المنافس</td><td>🟨 إنذار</td></tr>\n<tr><td><b>قوة مفرطة</b></td><td>قوة تتجاوز اللازم أو تعرّض سلامة المنافس للخطر</td><td>🟥 طرد</td></tr></table></div>\n<h3>ومخالفات أخرى عقوبتها ركلة حرة مباشرة:</h3>\n<ul><li>لمسة يد مخالفة (عدا الحارس داخل منطقة جزائه).</li><li>إمساك المنافس.</li><li>إعاقة المنافس <b>مع احتكاك</b>.</li>\n<li>العض أو البصق على شخص في قوائم الفريقين أو على أحد الحكام.</li><li>رمي شيء على الكرة أو المنافس أو أحد الحكام، أو لمس الكرة بشيء ممسوك في اليد.</li></ul>","en":"<p>Free kicks and penalty kicks are only awarded for offences <b>while the ball is in play</b>.</p>\n<h3>Seven actions against an opponent give a direct free kick if careless, reckless or with excessive force:</h3>\n<p>Charges · jumps at · kicks or attempts to kick · pushes · strikes or attempts to strike (including head-butt) · tackles or challenges · trips or attempts to trip.</p>\n<p class=\"note\">If one of these involves <b>contact</b>, it is a <b>direct</b> free kick.</p>\n<div class=\"tbl\"><table><tr><th>Degree</th><th>Meaning</th><th>Sanction</th></tr>\n<tr><td><b>Careless</b></td><td>Lack of attention, consideration or precaution</td><td>Free kick only</td></tr>\n<tr><td><b>Reckless</b></td><td>Disregard of the danger or consequences for the opponent</td><td>🟨 Caution</td></tr>\n<tr><td><b>Excessive force</b></td><td>Exceeds necessary force or endangers the opponent's safety</td><td>🟥 Sending-off</td></tr></table></div>\n<h3>Other direct free kick offences:</h3>\n<ul><li>A handball offence (except the goalkeeper in their penalty area).</li><li>Holding an opponent.</li><li>Impeding an opponent <b>with contact</b>.</li>\n<li>Biting or spitting at someone on the team lists or a match official.</li><li>Throwing an object at the ball, an opponent or an official, or touching the ball with a held object.</li></ul>"},"quiz":[{"ar":["تدخل لاعب بتهور على منافسه. العقوبة؟",["ركلة حرة فقط","ركلة حرة مباشرة وإنذار","طرد"],"(12.1)"],"en":["A player tackles recklessly. Sanction?",["Free kick only","DFK and caution","Sending-off"],"(12.1)"],"a":1,"lvl":"b"},{"ar":["تدخل بقوة مفرطة تعرّض سلامة المنافس للخطر؟",["إنذار","طرد"],"(12.1)"],"en":["A challenge with excessive force endangering the opponent?",["Caution","Sending-off"],"(12.1)"],"a":1,"lvl":"b"},{"ar":["لاعب أمسك قميص منافسه. الاستئناف؟",["ركلة حرة مباشرة","ركلة حرة غير مباشرة"],"(12.1)"],"en":["A player holds an opponent's shirt. Restart?",["Direct free kick","Indirect free kick"],"(12.1)"],"a":0,"lvl":"b"}]},{"id":"handball","title":{"ar":"لمسة اليد","en":"Handball"},"ref":"12.1","fig":"handball","k":["لمسة يد","handball","يد","hand","ذراع","arm","أكبر بشكل غير طبيعي","unnaturally bigger","إبط","armpit"],"body":{"ar":"<ul><li>حد الذراع العلوي <b>عند أسفل الإبط</b>. وليست كل لمسة بين اليد والكرة مخالفة.</li></ul>\n<h3>تكون مخالفة إذا:</h3>\n<ol><li>لمس اللاعب الكرة بيده أو ذراعه <b>عمدًا</b>، مثل تحريك اليد نحو الكرة.</li>\n<li>لمسها بيده أو ذراعه وقد <b>جعلت جسمه أكبر بشكل غير طبيعي</b>، أي أن وضع اليد ليس نتيجة لحركة جسمه في تلك الحالة ولا مبرَّرًا بها. بهذا الوضع يتحمل اللاعب خطر الإصابة بالكرة والمعاقبة.</li>\n<li>سجّل في مرمى المنافس <b>مباشرة من يده أو ذراعه</b>، ولو عرَضًا، ومنه الحارس.</li>\n<li>سجّل <b>فور لمس الكرة يده أو ذراعه</b>، ولو عرَضًا.</li></ol>\n<h3>الحارس</h3>\n<ul><li>خارج منطقة جزائه مثل أي لاعب.</li>\n<li>داخلها، إذا لمس الكرة بيده حين لا يُسمح له: <b>ركلة حرة غير مباشرة</b> دون عقوبة انضباطية.</li>\n<li>لكن إذا لعب الكرة مرة ثانية بعد استئناف قبل أن يلمسها غيره، وأوقف بذلك هجمة واعدة أو منع هدفًا أو فرصة محققة، فيُعاقَب انضباطيًا.</li></ul>\n<div class=\"note judge\">«جعل الجسم أكبر بشكل غير طبيعي» حكم تقديري يقيّمه الحكم حسب حركة اللاعب في الموقف.</div>","en":"<ul><li>The arm's upper boundary is <b>the bottom of the armpit</b>. Not every hand/arm touch is an offence.</li></ul>\n<h3>It is an offence if a player:</h3>\n<ol><li><b>Deliberately</b> touches the ball with the hand/arm, e.g. moving it towards the ball.</li>\n<li>Touches it when the hand/arm made the body <b>unnaturally bigger</b>, i.e. its position isn't a consequence of, or justified by, the body movement in that situation. That position is a risk the player takes.</li>\n<li>Scores <b>directly from the hand/arm</b>, even accidentally, including the goalkeeper.</li>\n<li>Scores <b>immediately after</b> the ball touched the hand/arm, even accidentally.</li></ol>\n<h3>The goalkeeper</h3>\n<ul><li>Outside their penalty area, like any player.</li>\n<li>Inside it, handling when not permitted: <b>indirect free kick</b>, no sanction.</li>\n<li>But playing the ball a second time after a restart, before anyone else touches it, and stopping a promising attack or denying a goal/OGSO is sanctioned.</li></ul>\n<div class=\"note judge\">‘Unnaturally bigger’ is the referee's judgement based on the player's movement.</div>"},"quiz":[{"ar":["مدافع يقفز وذراعاه ممدودتان عاليًا بعيدًا عن جسمه فتصيب الكرة ذراعه. القرار؟",["لا مخالفة","لمسة يد"],"جعل جسمه أكبر بشكل غير طبيعي. (12.1)"],"en":["A defender jumps with arms stretched high away from the body; the ball hits an arm. Decision?",["No offence","Handball"],"Body made unnaturally bigger. (12.1)"],"a":1,"lvl":"b"},{"ar":["مهاجم لمست الكرة ذراعه عرَضًا ثم سددها فورًا هدفًا. القرار؟",["هدف","لا هدف — لمسة يد"],"(12.1)"],"en":["The ball accidentally hits an attacker's arm and he immediately scores. Decision?",["Goal","No goal — handball"],"(12.1)"],"a":1,"lvl":"p"},{"ar":["أين حد الذراع العلوي في لمسة اليد؟",["الكتف","أسفل الإبط","المرفق"],"(12.1)"],"en":["Where is the arm's upper boundary for handball?",["Shoulder","Bottom of the armpit","Elbow"],"(12.1)"],"a":1,"lvl":"b"}]},{"id":"ifk","title":{"ar":"الركلة الحرة غير المباشرة","en":"Indirect free kick"},"ref":"12.2","k":["ركلة حرة غير مباشرة","indirect free kick","لعب خطر","dangerous","إعاقة دون احتكاك","impede","حيلة","trick","حارس","goalkeeper","اعتراض","dissent"],"body":{"ar":"<h3>اللاعب يُعاقب بركلة حرة غير مباشرة إذا:</h3>\n<ul><li>لعب بطريقة <b>خطرة</b>.</li><li>أعاق تقدم المنافس <b>دون احتكاك</b>.</li>\n<li>اعترض على قرار، أو استخدم لغة أو أفعالًا مسيئة أو مهينة، أو ارتكب أي مخالفة لفظية.</li>\n<li>منع الحارس من إطلاق الكرة من يديه، أو ركل الكرة أو حاول ذلك أثناء إطلاقها.</li>\n<li>استخدم <b>حيلة متعمدة</b> لتمرير الكرة إلى حارسه بالرأس أو الصدر أو الركبة للالتفاف على القانون، لمسها الحارس بيده أم لا. والحارس يُعاقب إن كان هو من بدأ الحيلة.</li>\n<li>ارتكب مخالفة أخرى غير مذكورة يُوقف لها اللعب لإنذار أو طرد.</li></ul>\n<h3>الحارس داخل منطقة جزائه، إذا لمس الكرة بيده:</h3>\n<ul><li>بعد أن أطلقها وقبل أن يلمسها لاعب آخر.</li>\n<li>بعد أن <b>ركلها إليه زميله عمدًا</b>، أو استلمها <b>مباشرة من رمية تماس</b> زميله، إلا إذا كان قد ركلها أو حاول ركلها بوضوح لإطلاقها.</li></ul>\n<div class=\"tbl\"><table><tr><th>المفهوم</th><th>المعنى</th></tr>\n<tr><td>اللعب الخطر</td><td>أي فعل أثناء محاولة لعب الكرة يهدد بإصابة شخص (ومنه اللاعب نفسه)، ومنه منع منافس قريب من اللعب خوفًا من الإصابة. الركلة المقصية مسموحة إن لم تكن خطرة على منافس</td></tr>\n<tr><td>الإعاقة دون احتكاك</td><td>التحرك في طريق المنافس لعرقلته أو إبطائه أو إجباره على تغيير اتجاهه، <b>والكرة ليست في مسافة لعب أي منهما</b></td></tr>\n<tr><td>حماية الكرة</td><td>مسموح الوقوف بين المنافس والكرة إذا كانت في مسافة اللعب، دون إبعاده بالذراعين أو الجسم. ويجوز للمنافس عندها مكاتفته بشكل قانوني</td></tr></table></div>","en":"<h3>An indirect free kick is awarded if a player:</h3>\n<ul><li>Plays in a <b>dangerous manner</b>.</li><li>Impedes an opponent <b>without contact</b>.</li>\n<li>Is guilty of dissent, offensive or abusive language/actions, or other verbal offences.</li>\n<li>Prevents the goalkeeper releasing the ball, or kicks at it while they release it.</li>\n<li>Initiates a <b>deliberate trick</b> to pass to the goalkeeper with head, chest, knee etc. to get around the Law, whether or not they handle it; the goalkeeper is penalised if they started it.</li>\n<li>Commits another unlisted offence for which play is stopped to caution or send off.</li></ul>\n<h3>The goalkeeper inside their penalty area touches the ball with the hand/arm:</h3>\n<ul><li>After releasing it and before another player touches it.</li>\n<li>After it was <b>deliberately kicked</b> to them by a team-mate, or received <b>directly from a team-mate's throw-in</b>, unless they clearly kicked or tried to kick it to release it.</li></ul>\n<div class=\"tbl\"><table><tr><th>Concept</th><th>Meaning</th></tr>\n<tr><td>Dangerous play</td><td>Any action while trying to play the ball that threatens injury to anyone (including the player), incl. stopping a nearby opponent playing it for fear of injury. A bicycle kick is fine if not dangerous to an opponent</td></tr>\n<tr><td>Impeding without contact</td><td>Moving into the opponent's path to block, slow or redirect them <b>when the ball isn't within playing distance of either</b></td></tr>\n<tr><td>Shielding</td><td>Allowed between opponent and ball within playing distance, without holding off with arms or body; the opponent may then fairly charge</td></tr></table></div>"},"quiz":[{"ar":["مدافع يقف في طريق مهاجم والكرة بعيدة عن الاثنين، دون احتكاك. القرار؟",["ركلة حرة غير مباشرة","ركلة حرة مباشرة"],"(12.2)"],"en":["A defender blocks an attacker's path, ball far from both, no contact. Decision?",["Indirect free kick","Direct free kick"],"(12.2)"],"a":0,"lvl":"b"},{"ar":["مرر المدافع الكرة برأسه عمدًا لحارسه فأمسكها بيده. القرار؟",["لا مخالفة","ركلة حرة غير مباشرة"],"الممنوع هو الركلة بالقدم أو الحيلة؛ التمرير بالرأس مسموح ما لم يكن حيلة. (12.2)"],"en":["A defender heads the ball back to his goalkeeper, who catches it. Decision?",["No offence","Indirect free kick"],"Only a deliberate kick or a trick is penalised; a normal header is fine. (12.2)"],"a":0,"lvl":"b"},{"ar":["لاعب رفع قدمه عاليًا قرب رأس منافس دون احتكاك. القرار؟",["لعب خطر — ركلة حرة غير مباشرة","ركلة حرة مباشرة"],"(12.2)"],"en":["A high foot near an opponent's head, no contact. Decision?",["Dangerous play — IFK","Direct free kick"],"(12.2)"],"a":0,"lvl":"b"}]},{"id":"eight","title":{"ar":"الحارس والثواني الثماني","en":"Goalkeeper and the eight seconds"},"ref":"12.3","fig":"eightsec","k":["ثماني ثوان","eight seconds","8","حارس","goalkeeper","ركلة ركنية","corner kick","عد تنازلي","countdown"],"body":{"ar":"<p>إذا سيطر الحارس داخل منطقة جزائه على الكرة بيديه <b>أكثر من 8 ثوانٍ</b> قبل إطلاقها ← <b>ركلة ركنية</b> للمنافس.</p>\n<h3>يُعتبر الحارس مسيطرًا على الكرة بيديه عندما:</h3>\n<ul><li>تكون الكرة بين يديه، أو بين يده وأي سطح (الأرض أو جسمه).</li>\n<li>يحملها في كفّه المفتوحة الممدودة.</li><li>ينطّها على الأرض أو يرميها في الهواء.</li></ul>\n<ul><li>الحكم يحدد متى بدأت السيطرة والعد، و<b>يعدّ آخر 5 ثوانٍ بيده المرفوعة</b>.</li>\n<li>لا يجوز لأي منافس أن ينازع الحارس وهو مسيطر على الكرة بيديه.</li></ul>","en":"<p>If the goalkeeper, inside their penalty area, controls the ball with the hands for <b>more than 8 seconds</b> before releasing it → <b>corner kick</b> to the opponents.</p>\n<h3>The goalkeeper controls the ball with the hands when:</h3>\n<ul><li>It is between the hands, or between a hand and any surface (ground, own body).</li>\n<li>Held in an outstretched open hand.</li><li>Bounced on the ground or thrown in the air.</li></ul>\n<ul><li>The referee decides when control and the count start, and <b>counts down the last 5 seconds with a raised hand</b>.</li>\n<li>No opponent may challenge a goalkeeper in hand control of the ball.</li></ul>"},"quiz":[{"ar":["احتفظ الحارس بالكرة بيديه 10 ثوانٍ. الاستئناف؟",["ركلة حرة غير مباشرة","ركلة ركنية للمنافس"],"(12.3)"],"en":["The goalkeeper holds the ball for 10 seconds. Restart?",["Indirect free kick","Corner kick to opponents"],"(12.3)"],"a":1,"lvl":"b"},{"ar":["الحارس ينطّ الكرة على الأرض. هل يُعد مسيطرًا عليها؟",["نعم","لا"],"(12.3)"],"en":["The goalkeeper bounces the ball. Is that control?",["Yes","No"],"(12.3)"],"a":0,"lvl":"b"},{"ar":["كيف يعدّ الحكم الثواني الأخيرة؟",["بالصافرة","بيده المرفوعة لآخر 5 ثوانٍ"],"(12.3)"],"en":["How does the referee count down?",["With the whistle","Raised hand for the last 5 seconds"],"(12.3)"],"a":1,"lvl":"p"}]},{"id":"caution","title":{"ar":"الإنذارات","en":"Cautions"},"ref":"12.4","k":["إنذار","caution","بطاقة صفراء","yellow","سلوك غير رياضي","unsporting","تمثيل","simulation","احتفال","celebration","قميص","shirt","تأخير","delay","هجمة واعدة","promising attack"],"body":{"ar":"<ul><li>السلطة الانضباطية من دخول الملعب للمعاينة حتى مغادرته بعد المباراة، ومنها ركلات الترجيح. وتُعاقب المخالفة داخل الملعب أو خارجه.</li>\n<li><b>البطاقة الصفراء</b> = إنذار، و<b>الحمراء</b> = طرد. ولا تُعطى إلا للاعب أو بديل أو مستبدَل أو مسؤول فريق.</li></ul>\n<h3>يُنذر اللاعب إذا:</h3>\n<p>أخّر استئناف اللعب · اعترض بالقول أو الفعل · دخل أو عاد أو خرج عمدًا دون إذن · لم يحترم المسافة في الكرة المسقطة أو الركنية أو الحرة أو رمية التماس · كرر المخالفات (لا عدد محدد) · سلوك غير رياضي · دخل منطقة مراجعة الحكم · أفرط في إشارة طلب المراجعة.</p>\n<h3>من صور السلوك غير الرياضي</h3>\n<ul><li><b>خداع الحكم</b> بالتمثيل أو ادعاء الإصابة.</li><li>مخالفة مباشرة <b>بتهور</b>.</li>\n<li>إيقاف <b>هجمة واعدة</b> بمخالفة أو لمسة يد (مع استثناءات عند احتساب ركلة جزاء).</li>\n<li>لمسة يد في محاولة للتسجيل، نجحت أم لا.</li><li>اللعب أثناء الخروج بعد الإذن · قلة احترام اللعبة · حيلة التمرير للحارس · تشتيت المنافس لفظيًا.</li></ul>\n<h3>الاحتفال بالهدف</h3>\n<p>مسموح بلا إفراط. الخروج من الملعب للاحتفال ليس مخالفة، لكن يُنذر اللاعب (ولو أُلغي الهدف) إذا: تسلّق السياج أو اقترب من الجمهور بشكل يهدد السلامة، أو تصرف باستفزاز أو سخرية، أو غطى رأسه أو وجهه بقناع، أو <b>خلع قميصه أو غطى به رأسه</b>.</p>\n<h3>تأخير الاستئناف</h3>\n<p>يُنذر من يؤخر الاستئناف بشكل مفرط، ومنه إبعاد الكرة بعد إيقاف اللعب أو حملها، أو استفزاز مواجهة بلمسها عمدًا، أو تنفيذ ركلة حرة من مكان خاطئ لفرض إعادتها.</p>\n<p class=\"note\">مخالفتان منفصلتان تستحقان الإنذار، ولو متقاربتين، تعني <b>إنذارين</b>.</p>","en":"<ul><li>Discipline runs from entering for the pre-match inspection until leaving after the match, including penalties, on or off the field.</li>\n<li><b>Yellow</b> = caution, <b>red</b> = sending-off; only for players, substitutes, substituted players and team officials.</li></ul>\n<h3>A player is cautioned for:</h3>\n<p>Delaying the restart · dissent · entering, re-entering or deliberately leaving without permission · not respecting the distance at a dropped ball, corner, free kick or throw-in · persistent offences (no set number) · unsporting behaviour · entering the RRA · excessive ‘review’ signals.</p>\n<h3>Unsporting behaviour includes</h3>\n<ul><li><b>Deceiving the referee</b> by simulation or feigning injury.</li><li>A <b>reckless</b> direct free kick offence.</li>\n<li>Stopping a <b>promising attack</b> with a foul or handball (exceptions when a penalty is given).</li>\n<li>Handball attempting to score, successful or not.</li><li>Playing the ball when leaving with permission · lack of respect for the game · the goalkeeper trick · verbally distracting an opponent.</li></ul>\n<h3>Goal celebrations</h3>\n<p>Allowed if not excessive. Leaving the field isn't an offence, but a caution is given (even if the goal is disallowed) for climbing a fence or approaching spectators unsafely, provocative or derisory acts, covering the head/face with a mask, or <b>removing the shirt or covering the head with it</b>.</p>\n<h3>Delaying the restart</h3>\n<p>Caution for excessive delay, including kicking or carrying the ball away after a stoppage, provoking a confrontation by touching it, or taking a free kick from the wrong place to force a retake.</p>\n<p class=\"note\">Two separate cautionable offences, even close together, mean <b>two cautions</b>.</p>"},"quiz":[{"ar":["لاعب خلع قميصه احتفالًا ثم أُلغي الهدف بالتسلل. هل يُنذر؟",["لا، لأن الهدف أُلغي","نعم"],"(12.4)"],"en":["A player removes his shirt celebrating; the goal is then disallowed. Caution?",["No, the goal was disallowed","Yes"],"(12.4)"],"a":1,"lvl":"p"},{"ar":["لاعب سقط متظاهرًا بالعرقلة دون أي احتكاك. القرار؟",["ركلة حرة للاعب","إنذار للتمثيل"],"(12.4)"],"en":["A player dives pretending to be tripped, no contact. Decision?",["Free kick for him","Caution for simulation"],"(12.4)"],"a":1,"lvl":"b"},{"ar":["لاعب دخل الملعب دون إذن ثم تدخل بتهور فورًا. كم إنذارًا؟",["إنذار واحد","إنذاران (طرد)"],"مخالفتان منفصلتان. (12.4)"],"en":["A player enters without permission and immediately tackles recklessly. How many cautions?",["One","Two (sent off)"],"Two separate offences. (12.4)"],"a":1,"lvl":"p"}]},{"id":"sendoff","title":{"ar":"الطرد ومنع الفرصة المحققة","en":"Sending-off and DOGSO"},"ref":"12.4","fig":"dogso","k":["طرد","sending-off","بطاقة حمراء","red","فرصة محققة","dogso","obvious goal-scoring","سلوك مشين","violent conduct","لعب عنيف جسيم","serious foul play","بصق","spit","سلوك عنيف"],"body":{"ar":"<h3>يُطرد اللاعب (أو البديل أو المستبدَل) إذا:</h3>\n<ol><li>منع هدفًا أو فرصة محققة بـ<b>لمسة يد متعمدة</b> (عدا الحارس داخل منطقته).</li>\n<li>منعها بـ<b>لمسة يد غير متعمدة خارج منطقة جزائه</b>.</li>\n<li>منع فرصة محققة عن منافس يتجه نحو مرماه، بمخالفة عقوبتها ركلة حرة (مع الاستثناء أدناه).</li>\n<li><b>لعب عنيف جسيم</b>.</li><li>العض أو البصق.</li><li><b>سلوك مشين</b>.</li><li>لغة أو أفعال مسيئة أو مهينة.</li><li><b>إنذار ثانٍ</b> في المباراة نفسها.</li><li>دخول غرفة تشغيل الفيديو.</li></ol>\n<p>والمطرود يغادر محيط الملعب والمنطقة الفنية.</p>\n<h3>منع الفرصة المحققة داخل منطقة الجزاء (مع احتساب ركلة جزاء)</h3>\n<div class=\"tbl\"><table><tr><th>نوع المخالفة</th><th>العقوبة</th></tr>\n<tr><td>محاولة لعب الكرة أو منافسة عليها</td><td>🟨 إنذار</td></tr>\n<tr><td>إمساك، شد، دفع، لا إمكانية للعب الكرة…</td><td>🟥 طرد</td></tr>\n<tr><td>لمسة يد <b>غير متعمدة</b></td><td>🟨 إنذار</td></tr>\n<tr><td>لمسة يد <b>متعمدة</b> (في أي مكان)</td><td>🟥 طرد</td></tr></table></div>\n<h3>عناصر «الفرصة المحققة» الأربعة</h3>\n<ol><li>المسافة بين المخالفة والمرمى.</li><li>الاتجاه العام للعب.</li><li>احتمال الاحتفاظ بالكرة أو السيطرة عليها.</li><li>موقع وعدد المدافعين والمهاجمين.</li></ol>\n<div class=\"tbl\"><table><tr><th>المفهوم</th><th>المعنى</th></tr>\n<tr><td>لعب عنيف جسيم</td><td>تدخل على الكرة يعرّض سلامة المنافس للخطر أو يستخدم قوة مفرطة أو وحشية، ومنه الانقضاض بساق أو اثنتين من أي اتجاه</td></tr>\n<tr><td>سلوك مشين</td><td>استخدام قوة مفرطة أو وحشية <b>دون منافسة على الكرة</b>، ضد أي شخص، بلمس أو دونه. وضرب الرأس أو الوجه باليد عمدًا عنف ما لم تكن القوة ضئيلة</td></tr></table></div>","en":"<h3>A player (or substitute/substituted player) is sent off for:</h3>\n<ol><li>Denying a goal/OGSO with a <b>deliberate handball</b> (except the goalkeeper in their area).</li>\n<li>Denying it with a <b>non-deliberate handball outside their own penalty area</b>.</li>\n<li>Denying an OGSO to an opponent moving towards goal by a free-kick offence (except below).</li>\n<li><b>Serious foul play</b>.</li><li>Biting or spitting.</li><li><b>Violent conduct</b>.</li><li>Offensive, insulting or abusive language/actions.</li><li>A <b>second caution</b>.</li><li>Entering the VO

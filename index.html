R.</li></ol>\n<p>A sent-off person must leave the vicinity of the field and the technical area.</p>\n<h3>DOGSO inside the penalty area (penalty awarded)</h3>\n<div class=\"tbl\"><table><tr><th>Type of offence</th><th>Sanction</th></tr>\n<tr><td>An attempt to play the ball or a challenge for it</td><td>🟨 Caution</td></tr>\n<tr><td>Holding, pulling, pushing, no chance to play the ball…</td><td>🟥 Sending-off</td></tr>\n<tr><td><b>Non-deliberate</b> handball</td><td>🟨 Caution</td></tr>\n<tr><td><b>Deliberate</b> handball (anywhere)</td><td>🟥 Sending-off</td></tr></table></div>\n<h3>The four DOGSO considerations</h3>\n<ol><li>Distance to goal.</li><li>General direction of play.</li><li>Likelihood of keeping or gaining control.</li><li>Location and number of defenders and attackers.</li></ol>\n<div class=\"tbl\"><table><tr><th>Concept</th><th>Meaning</th></tr>\n<tr><td>Serious foul play</td><td>A challenge that endangers safety or uses excessive force or brutality, including lunging with one or both legs from any direction</td></tr>\n<tr><td>Violent conduct</td><td>Excessive force or brutality <b>when not challenging for the ball</b>, against anyone, with or without contact. Deliberately striking the head/face with hand or arm is violent conduct unless the force was negligible</td></tr></table></div>"},"quiz":[{"ar":["مدافع داخل منطقته حاول لعب الكرة فعرقل مهاجمًا منفردًا بالمرمى. ركلة جزاء و…؟",["طرد","إنذار"],"محاولة لعب الكرة. (12.4)"],"en":["A defender in his area tries to play the ball and trips an attacker clean through. Penalty and…?",["Sending-off","Caution"],"Attempt to play the ball. (12.4)"],"a":1,"lvl":"p"},{"ar":["نفس الحالة لكنه أمسك المهاجم من قميصه دون محاولة لعب الكرة؟",["إنذار","طرد"],"(12.4)"],"en":["Same, but he holds the attacker's shirt with no attempt to play the ball?",["Caution","Sending-off"],"(12.4)"],"a":1,"lvl":"b"},{"ar":["لاعب ضرب منافسه بعيدًا عن الكرة بقوة. التصنيف؟",["لعب عنيف جسيم","سلوك مشين"],"دون منافسة على الكرة. (12.4)"],"en":["A player strikes an opponent hard away from the ball. Category?",["Serious foul play","Violent conduct"],"Not challenging for the ball. (12.4)"],"a":1,"lvl":"b"}]},{"id":"advantage","title":{"ar":"الميزة، وتأخير البطاقة، ومسؤولو الفريق","en":"Advantage, delayed cards and team officials"},"ref":"12.4","k":["ميزة","advantage","ركلة حرة سريعة","quick free kick","مسؤول الفريق","team official","تحذير","warning","منطقة فنية","technical area"],"body":{"ar":"<h3>تأخير الاستئناف لإظهار البطاقة</h3>\n<p>إذا قرر الحكم الإنذار أو الطرد، لا يُستأنف اللعب قبل العقوبة، إلا إذا نفذ الفريق المتضرر ركلة حرة سريعة لديه منها <b>فرصة واضحة للتسجيل</b> ولم يبدأ الحكم إجراء العقوبة. عندها تُعطى العقوبة في التوقف التالي: إنذار إن كانت المخالفة منع فرصة محققة، ولا شيء إن كانت إيقاف هجمة واعدة.</p>\n<h3>الميزة مع مخالفة تستحق بطاقة</h3>\n<ul><li>تُعطى البطاقة عند خروج الكرة التالي.</li>\n<li>إذا كانت منع فرصة محققة: <b>إنذار</b>، إلا إذا سُجّل هدف من الميزة فلا عقوبة. وإذا كانت إيقاف هجمة واعدة: لا إنذار.</li>\n<li><b>لا ميزة عادةً</b> في اللعب العنيف أو السلوك المشين أو الإنذار الثاني، إلا مع فرصة تسجيل واضحة. وإذا لعب المخالف الكرة بعدها، يوقف الحكم اللعب ويطرده ويستأنف بركلة حرة غير مباشرة.</li>\n<li>مدافع بدأ الإمساك خارج منطقة الجزاء واستمر داخلها: <b>ركلة جزاء</b>.</li></ul>\n<h3>مسؤولو الفريق</h3>\n<div class=\"tbl\"><table><tr><th>الإجراء</th><th>أمثلة</th></tr>\n<tr><td>تحذير</td><td>دخول الملعب باحترام، عدم التعاون مع حكم، اعتراض بسيط، مغادرة المنطقة الفنية أحيانًا</td></tr>\n<tr><td>🟨 إنذار</td><td>عدم احترام حدود المنطقة الفنية بوضوح، تأخير الاستئناف، الاعتراض ومنه رمي الزجاجات والتصفيق الساخر، دخول منطقة المراجعة، المطالبة المفرطة بالبطاقات أو المراجعة، الاستفزاز</td></tr>\n<tr><td>🟥 طرد</td><td>تأخير استئناف المنافس، مغادرة المنطقة الفنية للاعتراض أو الاستفزاز، دخول منطقة المنافس بعدوانية، رمي شيء في الملعب، دخول الملعب لمواجهة حكم أو للتدخل، دخول غرفة الفيديو، العدوان الجسدي، إنذار ثانٍ، لغة مسيئة، أجهزة غير مسموحة، سلوك مشين</td></tr></table></div>\n<p>إذا لم يُعرف المخالف من المنطقة الفنية، يُعاقب <b>المدرب الأعلى</b> الموجود.</p>","en":"<h3>Delaying the restart to show a card</h3>\n<p>Once the referee decides to caution or send off, play isn't restarted until it's done, unless the non-offending team takes a quick free kick with a <b>clear goal-scoring opportunity</b> before the procedure starts. Then the card comes at the next stoppage: a caution for DOGSO, nothing for stopping a promising attack.</p>\n<h3>Advantage with a card offence</h3>\n<ul><li>The card is given when the ball is next out.</li>\n<li>For DOGSO: <b>caution</b>, unless a goal results from the advantage (then no sanction). For stopping a promising attack: no caution.</li>\n<li><b>No advantage</b> usually for serious foul play, violent conduct or a second caution, unless there's a clear chance to score. If the offender then plays the ball, stop play, send off and restart with an IFK.</li>\n<li>Holding that starts outside the penalty area and continues inside: <b>penalty kick</b>.</li></ul>\n<h3>Team officials</h3>\n<div class=\"tbl\"><table><tr><th>Action</th><th>Examples</th></tr>\n<tr><td>Warning</td><td>Entering the field respectfully, not cooperating with an official, minor disagreement, occasionally leaving the technical area</td></tr>\n<tr><td>🟨 Caution</td><td>Clearly ignoring technical-area limits, delaying the restart, dissent including throwing bottles or sarcastic clapping, entering the RRA, excessive card or review gestures, provocation</td></tr>\n<tr><td>🟥 Sending-off</td><td>Delaying the opponents' restart, leaving the area to remonstrate or provoke, aggressive entry to the opposing area, throwing objects onto the field, entering to confront an official or interfere, entering the VOR, physical aggression, second caution, abusive language, unauthorised devices, violent conduct</td></tr></table></div>\n<p>If the offender in the technical area can't be identified, the <b>senior coach</b> present is sanctioned.</p>"},"quiz":[{"ar":["طبّق الحكم الميزة بعد منع فرصة محققة، فسُجّل هدف. العقوبة على المخالف؟",["إنذار","لا عقوبة"],"(12.4)"],"en":["Advantage after DOGSO, and a goal is scored. Sanction?",["Caution","None"],"(12.4)"],"a":1,"lvl":"p"},{"ar":["مدرب رمى زجاجة اعتراضًا على قرار. العقوبة؟",["تحذير","إنذار"],"(12.4)"],"en":["A coach throws a bottle in dissent. Sanction?",["Warning","Caution"],"(12.4)"],"a":1,"lvl":"p"},{"ar":["مدافع أمسك مهاجمًا خارج المنطقة واستمر الإمساك داخلها. القرار؟",["ركلة حرة خارج المنطقة","ركلة جزاء"],"(12.4)"],"en":["Holding starts outside the area and continues inside. Decision?",["Free kick outside","Penalty kick"],"(12.4)"],"a":1,"lvl":"b"}]},{"id":"restart","title":{"ar":"استئناف اللعب بعد الأخطاء","en":"Restarts after fouls and misconduct"},"ref":"12.5","k":["استئناف","restart","مخالفة لفظية","verbal","خارج الملعب","outside the field","رمي شيء","object thrown","زميل","team-mate"],"body":{"ar":"<ul><li>إذا كانت الكرة <b>خارج اللعب</b>: يُستأنف حسب القرار السابق.</li></ul>\n<h3>والكرة في اللعب، داخل الملعب</h3>\n<div class=\"tbl\"><table><tr><th>المخالفة البدنية ضد…</th><th>الاستئناف</th></tr>\n<tr><td>منافس</td><td>ركلة حرة مباشرة أو غير مباشرة أو ركلة جزاء</td></tr>\n<tr><td>زميل، أو بديل، أو مستبدَل، أو مطرود، أو مسؤول فريق، أو أحد الحكام</td><td>ركلة حرة مباشرة أو ركلة جزاء</td></tr>\n<tr><td><b>كل المخالفات اللفظية</b></td><td>ركلة حرة غير مباشرة</td></tr>\n<tr><td>عنصر خارجي</td><td>كرة مسقطة (إلا ركلة حرة غير مباشرة لمغادرة الملعب دون إذن، من نقطة الخروج)</td></tr></table></div>\n<h3>مخالفات خارج الملعب والكرة في اللعب</h3>\n<ul><li>لاعب ضد حكم أو منافس، أو بديل أو مطرود أو مسؤول يتدخل مع منافس أو حكم خارج الملعب: <b>ركلة حرة على أقرب نقطة من خط الحدود</b>. وإن كانت مباشرة وداخل منطقة جزاء المخالف: <b>ركلة جزاء</b>.</li>\n<li>لاعب ضد زميله أو أحد أفراد فريقه خارج الملعب: ركلة حرة غير مباشرة على أقرب نقطة من خط الحدود.</li></ul>\n<h3>الأشياء المرمية</h3>\n<ul><li>لمس الكرة بشيء ممسوك (حذاء، واقي ساق…): ركلة حرة مباشرة أو جزاء.</li>\n<li>رمي أو ركل شيء على منافس أو حكم أو الكرة: ركلة حرة مباشرة <b>من مكان الإصابة</b> (أو أقرب نقطة على الخط إن كان خارج الملعب)، وركلة جزاء إن كان داخل منطقة المخالف.</li>\n<li>العقوبة: <b>بتهور</b> ← إنذار. <b>بقوة مفرطة</b> ← طرد (سلوك مشين).</li></ul>","en":"<ul><li>If the ball is <b>out of play</b>: restart per the previous decision.</li></ul>\n<h3>Ball in play, inside the field</h3>\n<div class=\"tbl\"><table><tr><th>Physical offence against…</th><th>Restart</th></tr>\n<tr><td>An opponent</td><td>Indirect or direct free kick, or penalty kick</td></tr>\n<tr><td>A team-mate, substitute, substituted or sent-off player, team official or match official</td><td>Direct free kick or penalty kick</td></tr>\n<tr><td><b>All verbal offences</b></td><td>Indirect free kick</td></tr>\n<tr><td>An outside agent</td><td>Dropped ball (unless an IFK for leaving without permission, from the exit point)</td></tr></table></div>\n<h3>Offences outside the field, ball in play</h3>\n<ul><li>A player against an official or opponent, or a substitute, sent-off player or official interfering with an opponent or official outside the field: <b>free kick on the nearest boundary point</b>; a direct one inside the offender's penalty area becomes a <b>penalty kick</b>.</li>\n<li>A player against their own team member outside the field: IFK on the nearest boundary point.</li></ul>\n<h3>Thrown objects</h3>\n<ul><li>Touching the ball with a held object (boot, shinguard…): DFK or penalty.</li>\n<li>Throwing or kicking an object at an opponent, official or the ball: DFK <b>where it struck</b> (or nearest boundary point if outside), penalty if inside the offender's area.</li>\n<li>Sanction: <b>reckless</b> → caution; <b>excessive force</b> → sending-off for violent conduct.</li></ul>"},"quiz":[{"ar":["لاعب شتم الحكم والكرة في اللعب. الاستئناف؟",["ركلة حرة مباشرة","ركلة حرة غير مباشرة"],"كل المخالفات اللفظية غير مباشرة. (12.5)"],"en":["A player insults the referee with the ball in play. Restart?",["Direct free kick","Indirect free kick"],"All verbal offences are IFK. (12.5)"],"a":1,"lvl":"b"},{"ar":["لاعب دفع زميله في الفريق نفسه داخل الملعب والكرة في اللعب. الاستئناف؟",["ركلة حرة مباشرة","كرة مسقطة"],"(12.5)"],"en":["A player pushes his own team-mate on the field, ball in play. Restart?",["Direct free kick","Dropped ball"],"(12.5)"],"a":0,"lvl":"p"},{"ar":["مدافع رمى حذاءه على الكرة داخل منطقة جزائه فأصابها. القرار؟",["ركلة حرة غير مباشرة","ركلة جزاء"],"(12.5)"],"en":["A defender throws his boot at the ball inside his penalty area and hits it. Decision?",["Indirect free kick","Penalty kick"],"(12.5)"],"a":1,"lvl":"p"}]}],"cases":[{"id":"reckless-tackle","lvl":"b","ref":"12.1 · 12.4","a":1,"ar":{"s":"في منتصف الملعب انزلق لاعب بقوة لقطع الكرة، ولم يكترث بسلامة منافسه فأسقطه، دون أن يستخدم قوة مفرطة أو يعرّض سلامته للخطر. ما قرارك؟","o":["ركلة حرة مباشرة دون عقوبة","ركلة حرة مباشرة وإنذار","ركلة حرة مباشرة وطرد"],"d":"إيقاف اللعب لمخالفة متهورة","r":"ركلة حرة مباشرة من مكان المخالفة","x":"إنذار","w":"المخالفة المهملة لا تحتاج عقوبة، والمتهورة (تجاهل الخطر على المنافس) تستوجب الإنذار، واستخدام القوة المفرطة أو تعريض سلامة المنافس للخطر يستوجب الطرد. وتصنيف الالتحام تقدير للحكم."},"en":{"s":"In midfield a player slides in hard for the ball with disregard for the opponent's safety and brings him down, without using excessive force or endangering his safety. Your call?","o":["Direct free kick, no card","Direct free kick and a caution","Direct free kick and a sending-off"],"d":"Stop play for a reckless offence","r":"Direct free kick from where the offence occurred","x":"Caution","w":"Careless needs no sanction, reckless (disregard of danger to the opponent) is a caution, and excessive force or endangering safety is a sending-off. Grading the challenge is the referee's judgement."}},{"id":"accidental-hand-goal","lvl":"b","ref":"12.1","a":0,"ar":{"s":"أبعد مدافع الكرة فارتطمت بمهاجم وارتدت إلى ذراعه بشكل عرضي، ثم دخلت المرمى مباشرة. ما قرارك؟","o":["إلغاء الهدف وركلة حرة مباشرة للمدافعين","احتساب الهدف لأن اللمس غير متعمد","إلغاء الهدف وكرة مسقطة"],"d":"إلغاء الهدف","r":"ركلة حرة مباشرة للفريق المدافع من مكان لمس الذراع","x":"لا يوجد","w":"ليس كل لمس لليد مخالفة، لكن اللاعب الذي يسجل في مرمى المنافس مباشرة من يده أو ذراعه، أو فور لمسها الكرة، يرتكب مخالفة لمس الكرة باليد حتى لو كان اللمس عرضيًا. ولا عقوبة تأديبية لأن اللمس غير متعمد."},"en":{"s":"A defender's clearance hits an attacker and rebounds accidentally onto his arm, then goes straight into the goal. Your call?","o":["Disallow; direct free kick to the defenders","Award the goal: it was accidental","Disallow; dropped ball"],"d":"Disallow the goal","r":"Direct free kick to the defending team where the arm touched the ball","x":"None","w":"Not every hand/arm touch is an offence, but scoring directly from the hand/arm, or immediately after it touched the ball, is a handball offence even if accidental. No card, as it wasn't deliberate."}},{"id":"gk-eight-seconds","lvl":"b","ref":"12.3","a":2,"ar":{"s":"أمسك حارس المرمى الكرة بيديه داخل منطقة جزائه وأخذ ينطّطها على الأرض ويماطل. عدّ الحكم الثواني الخمس الأخيرة بيده المرفوعة، وتجاوز الحارس ثماني ثوانٍ دون إطلاقها. ما قرارك؟","o":["ركلة حرة غير مباشرة من مكان الحارس","إنذار الحارس فقط لتأخير اللعب","ركلة ركنية للفريق المنافس"],"d":"إيقاف اللعب","r":"ركلة ركنية للفريق المنافس","x":"لا يوجد (لا تنص المادة على عقوبة لمجرد تجاوز الثواني)","w":"إذا سيطر الحارس على الكرة بيديه داخل منطقة جزائه أكثر من ثماني ثوانٍ تُحتسب ركلة ركنية. وتنطيط الكرة على الأرض يُعد سيطرة، والحكم يقرر بداية العد ويعدّ الثواني الخمس الأخيرة بيده."},"en":{"s":"The goalkeeper holds the ball in his penalty area, bouncing it and stalling. The referee counts down the last five seconds with a raised hand, and the keeper exceeds eight seconds without releasing it. Your call?","o":["Indirect free kick from the keeper's position","Caution the keeper for delay only","Corner kick to the opponents"],"d":"Stop play","r":"Corner kick to the opposing team","x":"None (the Law sets no card for simply exceeding the time)","w":"A goalkeeper controlling the ball with the hands in their penalty area for more than eight seconds concedes a corner kick. Bouncing the ball counts as control; the referee decides when the count starts and visually counts the last five seconds."}},{"id":"dogso-holding-pa","lvl":"p","ref":"12.4","a":1,"ar":{"s":"داخل منطقة الجزاء انفرد مهاجم بالمرمى، فأمسك مدافع قميصه من الخلف وأسقطه دون أي محاولة للعب الكرة. ما قرارك؟","o":["ركلة جزاء وإنذار المدافع","ركلة جزاء وطرد المدافع","ركلة جزاء دون عقوبة"],"d":"إيقاف اللعب","r":"ركلة جزاء","x":"طرد (منع فرصة واضحة لتسجيل هدف)","w":"عند منع فرصة واضحة لتسجيل هدف داخل منطقة الجزاء واحتساب ركلة جزاء، يُخفَّض الطرد إلى إنذار فقط إذا كانت المخالفة محاولة للعب الكرة أو التنافس عليها. أما الإمساك والدفع والسحب أو انعدام إمكانية لعب الكرة فتبقى طردًا."},"en":{"s":"Inside the penalty area an attacker is through on goal; a defender pulls his shirt from behind and brings him down with no attempt to play the ball. Your call?","o":["Penalty kick and caution","Penalty kick and sending-off","Penalty kick, no card"],"d":"Stop play","r":"Penalty kick","x":"Sending-off (denying an obvious goal-scoring opportunity)","w":"For DOGSO inside the penalty area with a penalty awarded, the sanction drops to a caution only if the offence was an attempt to play or challenge for the ball. Holding, pulling, pushing or no possibility to play the ball remain a sending-off."}},{"id":"backpass-miskick","lvl":"p","ref":"12.2","a":0,"ar":{"s":"مرّر مدافع الكرة بقدمه عمدًا إلى حارسه داخل منطقة الجزاء، فحاول الحارس ركلها بوضوح لإبعادها لكنه أخطأها، ثم التقطها بيديه. ما قرارك؟","o":["يستمر اللعب، فلا مخالفة","ركلة حرة غير مباشرة للمنافس","ركلة حرة غير مباشرة وإنذار الحارس"],"d":"يستمر اللعب","r":"لا يوجد","x":"لا يوجد","w":"يُعاقب الحارس بركلة حرة غير مباشرة إذا لمس بيده كرة ركلها له زميله عمدًا، إلا إذا ركلها أو حاول بوضوح ركلها لإطلاقها في اللعب. وحتى عند وقوع المخالفة لا تُفرض عقوبة تأديبية عادةً على لمس الحارس باليد داخل منطقته."},"en":{"s":"A defender deliberately kicks the ball back to his goalkeeper in the penalty area; the keeper clearly tries to kick it clear but misses, then picks it up. Your call?","o":["Play on: no offence","Indirect free kick to the opponents","Indirect free kick and caution the keeper"],"d":"Play on","r":"None","x":"None","w":"Handling a ball deliberately kicked by a team-mate is an indirect free kick offence, unless the goalkeeper has clearly kicked or attempted to kick the ball to release it into play. Even when it is an offence, there is normally no card for the keeper handling inside the penalty area."}}],"myths":[{"id":"every-hand-touch-is-handball","ref":"12.1","t":false,"ar":{"s":"أي لمسة للكرة باليد أو الذراع هي لمسة يد تلقائيًا.","w":"ليست كل لمسة مخالفة؛ تُحتسب لمسة اليد إذا لمس اللاعب الكرة عمدًا، أو كانت ذراعه قد كبّرت جسمه بشكل غير طبيعي، أو سجّل هدفًا في مرمى المنافس مباشرة منها أو فور لمسها ولو دون قصد. والحد العلوي للذراع يكون عند مستوى أسفل الإبط."},"en":{"s":"Any time the ball touches a player's hand or arm, it's handball.","w":"Not every touch is an offence: it is handball when the touch is deliberate, when the arm has made the body unnaturally bigger, or when a player scores in the opponents' goal directly from (or immediately after) a hand/arm touch, even accidentally. The arm starts at the bottom of the armpit."}},{"id":"keeper-six-seconds-indirect","ref":"12.3","t":false,"ar":{"s":"إذا احتفظ الحارس بالكرة في يديه أكثر من ست ثوانٍ تُحتسب ركلة حرة غير مباشرة.","w":"في قانون 2026/27 يملك الحارس ثماني ثوانٍ للتحكم بالكرة بيديه داخل منطقة جزائه، ويعدّ الحكم الثواني الخمس الأخيرة بيده المرفوعة؛ وإن تجاوزها تُحتسب ركلة ركنية للمنافس."},"en":{"s":"If the goalkeeper holds the ball for more than six seconds, it's an indirect free kick.","w":"Under 2026/27 the keeper has eight seconds of hand control inside their penalty area, with the referee visibly counting down the last five; going over awards a corner kick to the opponents."}},{"id":"shirt-off-yellow-even-if-disallowed","ref":"12.4","t":true,"ar":{"s":"من يخلع قميصه احتفالًا بهدف يُنذر حتى لو أُلغي الهدف بعد ذلك.","w":"خلع القميص أو تغطية الرأس به أثناء الاحتفال يستوجب الإنذار وإن أُلغي الهدف، أما مغادرة الملعب للاحتفال بحد ذاتها فلا تستوجب إنذارًا، لكن على اللاعب العودة بأسرع ما يمكن."},"en":{"s":"A player who takes their shirt off to celebrate is booked even if the goal is then disallowed.","w":"Removing the shirt or covering the head with it is a caution regardless of whether the goal stands; simply leaving the field to celebrate is not cautionable in itself, though the player should return as soon as possible."}}]},"13":{"pages":{"ar":"ع ص 125–128 · EN p.131–133","en":"EN p.131–133 · AR p.125–128"},"parts":[{"id":"types","title":{"ar":"نوعا الركلة الحرة","en":"Types of free kick"},"ref":"13.1","k":["ركلة حرة","free kick","مباشرة","direct","غير مباشرة","indirect","إشارة","signal","هدف","goal"],"body":{"ar":"<p>تُحتسب الركلة الحرة، مباشرة أو غير مباشرة، للفريق المنافس لمن ارتكب المخالفة: لاعب، أو بديل، أو مستبدَل، أو مطرود، أو مسؤول فريق.</p>\n<h3>إشارة الركلة غير المباشرة</h3>\n<p>يرفع الحكم ذراعه فوق رأسه، ويبقيها مرفوعة حتى تلمس الكرة لاعبًا آخر، أو تخرج، أو يتضح أن التسجيل المباشر لم يعد ممكنًا. وإذا نسي الإشارة وسُدّدت الكرة مباشرة في المرمى، <b>تُعاد الركلة</b>.</p>\n<div class=\"tbl\"><table><tr><th>دخلت الكرة مباشرة…</th><th>القرار</th></tr>\n<tr><td>من ركلة <b>مباشرة</b> في مرمى المنافس</td><td>✅ هدف</td></tr>\n<tr><td>من ركلة <b>غير مباشرة</b> في مرمى المنافس</td><td>ركلة مرمى</td></tr>\n<tr><td>من أي ركلة حرة في <b>مرمى الفريق المنفذ</b></td><td>ركلة ركنية</td></tr></table></div>","en":"<p>Direct and indirect free kicks go to the opponents of the offender: a player, substitute, substituted or sent-off player, or team official.</p>\n<h3>Indirect free kick signal</h3>\n<p>The referee raises an arm above the head and keeps it up until the ball touches another player, goes out, or a direct goal is clearly impossible. If the signal is forgotten and the ball goes straight into the goal, the <b>kick is retaken</b>.</p>\n<div class=\"tbl\"><table><tr><th>Ball goes directly into…</th><th>Decision</th></tr>\n<tr><td>The opponents' goal from a <b>direct</b> free kick</td><td>✅ Goal</td></tr>\n<tr><td>The opponents' goal from an <b>indirect</b> free kick</td><td>Goal kick</td></tr>\n<tr><td>The <b>kicker's own goal</b> from any free kick</td><td>Corner kick</td></tr></table></div>"},"quiz":[{"ar":["سُددت ركلة حرة غير مباشرة مباشرة في مرمى المنافس. القرار؟",["هدف","ركلة مرمى"],"(13.1)"],"en":["An indirect free kick goes straight into the opponents' goal. Decision?",["Goal","Goal kick"],"(13.1)"],"a":1,"lvl":"b"},{"ar":["نسي الحكم رفع ذراعه لركلة غير مباشرة فسُددت مباشرة هدفًا. القرار؟",["هدف","تُعاد الركلة"],"(13.1)"],"en":["The referee forgot the IFK signal and the kick goes straight in. Decision?",["Goal","Retake"],"(13.1)"],"a":1,"lvl":"p"}]},{"id":"procedure","title":{"ar":"إجراءات التنفيذ والحائط","en":"Procedure and the wall"},"ref":"13.2","fig":"wall","k":["حائط","wall","9.15","1 م","1 m","مكان التنفيذ","position","منطقة المرمى","goal area","خداع","feint"],"body":{"ar":"<h3>المكان</h3>\n<p>من <b>مكان المخالفة</b>، إلا:</p>\n<ul><li>ركلة غير مباشرة للمهاجمين داخل <b>منطقة مرمى المنافس</b>: من أقرب نقطة على خط منطقة المرمى الموازي لخط المرمى.</li>\n<li>ركلة للمدافعين داخل منطقة مرماهم: من <b>أي مكان</b> فيها.</li>\n<li>مخالفات الدخول أو الخروج دون إذن: من مكان الكرة لحظة الإيقاف، والمخالفة خارج الملعب: من أقرب نقطة على خط الحدود.</li></ul>\n<h3>التنفيذ</h3>\n<ul><li>الكرة <b>ثابتة</b>، وتصبح في اللعب <b>عندما تُركل وتتحرك بوضوح</b>. ولا يلمسها المنفذ مرة ثانية قبل غيره.</li>\n<li>يجوز رفع الكرة بقدم أو بالقدمين معًا. و<b>الخداع</b> قبل التنفيذ جزء مسموح من اللعبة.</li>\n<li>إذا ركل المنفذ الكرة عمدًا نحو منافس ليلعبها مجددًا، دون إهمال أو تهور أو قوة مفرطة: يستمر اللعب.</li></ul>\n<h3>المسافات</h3>\n<div class=\"tbl\"><table><tr><th>من</th><th>المسافة</th></tr>\n<tr><td>المنافسون</td><td><b>9.15 م</b> على الأقل، إلا إذا كانوا على خط مرماهم بين القائمين</td></tr>\n<tr><td>المنافسون والركلة داخل منطقة جزاء المدافعين</td><td>خارج منطقة الجزاء</td></tr>\n<tr><td>المهاجمون عن <b>حائط من 3 مدافعين أو أكثر</b></td><td><b>1 م</b> على الأقل</td></tr></table></div>","en":"<h3>Position</h3>\n<p>From <b>where the offence happened</b>, except:</p>\n<ul><li>An attacking IFK inside the <b>opponents' goal area</b>: from the nearest point on the goal-area line parallel to the goal line.</li>\n<li>A defending free kick in their goal area: from <b>anywhere</b> in it.</li>\n<li>Entering/leaving without permission: from the ball's position when play stopped; an offence off the field: nearest boundary point.</li></ul>\n<h3>Taking it</h3>\n<ul><li>The ball is <b>stationary</b>; in play <b>when kicked and it clearly moves</b>. The kicker can't touch it again before someone else.</li>\n<li>It may be lifted with one or both feet. <b>Feinting</b> is permitted.</li>\n<li>Deliberately kicking it at an opponent to play it again, without carelessness, recklessness or excessive force: play on.</li></ul>\n<h3>Distances</h3>\n<div class=\"tbl\"><table><tr><th>Who</th><th>Distance</th></tr>\n<tr><td>Opponents</td><td>At least <b>9.15 m</b>, unless on their own goal line between the posts</td></tr>\n<tr><td>Opponents, for a kick inside the defenders' penalty area</td><td>Outside the penalty area</td></tr>\n<tr><td>Attackers from a <b>wall of 3+ defenders</b></td><td>At least <b>1 m</b></td></tr></table></div>"},"quiz":[{"ar":["حائط من 4 مدافعين. على أي بعد يقف المهاجمون منه؟",["لا قيد","1 م على الأقل","9.15 م"],"(13.2)"],"en":["A wall of four defenders. How far must attackers stay?",["No limit","At least 1 m","9.15 m"],"(13.2)"],"a":1,"lvl":"p"},{"ar":["ركلة حرة للمدافعين داخل منطقة مرماهم. من أين تُنفذ؟",["من مكان المخالفة فقط","من أي مكان في منطقة المرمى"],"(13.2)"],"en":["A defending free kick inside their goal area. Where is it taken?",["Exactly where it happened","Anywhere in the goal area"],"(13.2)"],"a":1,"lvl":"b"},{"ar":["هل يجوز للمنفذ الخداع قبل التنفيذ؟",["نعم","لا"],"(13.2)"],"en":["May the kicker feint before taking a free kick?",["Yes","No"],"(13.2)"],"a":0,"lvl":"b"}]},{"id":"offences","title":{"ar":"المخالفات والعقوبات","en":"Offences and sanctions"},"ref":"13.3","k":["إعادة","retake","ركلة سريعة","quick free kick","مسافة","distance","لمسة ثانية","second touch"],"body":{"ar":"<div class=\"tbl\"><table><tr><th>الحالة</th><th>القرار</th></tr>\n<tr><td>منافس أقرب من المسافة المطلوبة</td><td>تُعاد الركلة، إلا إذا أمكن تطبيق الميزة</td></tr>\n<tr><td>نُفذت الركلة <b>بسرعة</b>، واعترضها منافس على أقل من 9.15 م</td><td>يستمر اللعب</td></tr>\n<tr><td>منافس <b>منع عمدًا</b> تنفيذ الركلة بسرعة</td><td>🟨 إنذار (تأخير الاستئناف)</td></tr>\n<tr><td>مهاجم على أقل من <b>1 م</b> من الحائط عند التنفيذ</td><td>ركلة حرة غير مباشرة للمدافعين</td></tr>\n<tr><td>ركلة للمدافعين داخل منطقتهم، ومهاجمون لم يتمكنوا من الخروج</td><td>يستمر اللعب</td></tr>\n<tr><td>منافس داخل المنطقة لمس الكرة أو نازع عليها قبل أن تصبح في اللعب</td><td>تُعاد الركلة</td></tr>\n<tr><td>المنفذ لمس الكرة ثانية قبل غيره</td><td>ركلة حرة غير مباشرة</td></tr>\n<tr><td>المنفذ ارتكب لمسة يد</td><td>ركلة حرة مباشرة، أو ركلة جزاء داخل منطقته (إلا الحارس: غير مباشرة)</td></tr></table></div>","en":"<div class=\"tbl\"><table><tr><th>Situation</th><th>Decision</th></tr>\n<tr><td>An opponent is too close</td><td>Retake, unless advantage applies</td></tr>\n<tr><td>Kick taken <b>quickly</b> and intercepted by an opponent within 9.15 m</td><td>Play on</td></tr>\n<tr><td>An opponent <b>deliberately prevents</b> a quick free kick</td><td>🟨 Caution (delaying the restart)</td></tr>\n<tr><td>An attacker within <b>1 m</b> of the wall when it's taken</td><td>Indirect free kick to the defenders</td></tr>\n<tr><td>Defenders' kick inside their area, attackers had no time to leave</td><td>Play on</td></tr>\n<tr><td>An opponent in the area touches or challenges before the ball is in play</td><td>Retake</td></tr>\n<tr><td>Kicker touches it again before anyone else</td><td>Indirect free kick</td></tr>\n<tr><td>Kicker commits handball</td><td>Direct free kick, or penalty inside their area (goalkeeper: IFK)</td></tr></table></div>"},"quiz":[{"ar":["نُفذت ركلة حرة بسرعة فاعترضها مدافع على بعد 5 أمتار. القرار؟",["إعادة","يستمر اللعب"],"(13.3)"],"en":["A quick free kick is intercepted by a defender 5 m away. Decision?",["Retake","Play on"],"(13.3)"],"a":1,"lvl":"b"},{"ar":["مهاجم وقف ملاصقًا للحائط عند التنفيذ. القرار؟",["إعادة","ركلة حرة غير مباشرة للمدافعين"],"(13.3)"],"en":["An attacker stands right against the wall when the kick is taken. Decision?",["Retake","IFK to the defenders"],"(13.3)"],"a":1,"lvl":"p"}]}],"cases":[{"id":"ifk-direct-goal","lvl":"b","ref":"13.1","a":2,"ar":{"s":"رفع الحكم ذراعه لركلة حرة غير مباشرة خارج منطقة الجزاء، فسدّد المنفذ الكرة مباشرة إلى مرمى المنافس دون أن يلمسها أحد. ما قرارك؟","o":["يُحتسب الهدف","تُعاد الركلة الحرة","لا يُحتسب الهدف، ركلة مرمى"],"d":"عدم احتساب الهدف","r":"ركلة مرمى","x":"لا يوجد","w":"لا يُحتسب هدف مباشر من ركلة حرة غير مباشرة؛ فإذا دخلت مرمى المنافس دون أن يلمسها لاعب آخر تُستأنف المباراة بركلة مرمى."},"en":{"s":"The referee signals an indirect free kick outside the penalty area and the kicker shoots straight into the opponents' goal, untouched. Your call?","o":["Award the goal","Retake the free kick","No goal; goal kick"],"d":"Disallow the goal","r":"Goal kick","x":"None","w":"A goal cannot be scored directly from an indirect free kick; if it goes straight into the opponents' goal, play restarts with a goal kick."}},{"id":"quick-fk-intercept","lvl":"b","ref":"13.3","a":0,"ar":{"s":"نفّذ لاعب ركلة حرة بسرعة، فقطعها مدافع كان على بُعد نحو 5 أمتار من الكرة دون أن يتعمد منع التنفيذ. ما قرارك؟","o":["يستمر اللعب","تُعاد الركلة الحرة","تُعاد الركلة الحرة مع إنذار المدافع"],"d":"يستمر اللعب","r":"لا يوجد","x":"لا يوجد","w":"من ينفذ الركلة الحرة بسرعة يتحمل خطر قطعها من منافس قريب، فيستمر اللعب. أما المنافس الذي يمنع التنفيذ السريع عمدًا فيُنذر لتأخير استئناف اللعب."},"en":{"s":"A player takes a free kick quickly and a defender about 5 m away intercepts it, without having deliberately blocked the kick. Your call?","o":["Play on","Retake the free kick","Retake and caution the defender"],"d":"Play on","r":"None","x":"None","w":"A kicker who takes a free kick quickly accepts the risk of an opponent nearby intercepting it, so play continues. An opponent who deliberately prevents a quick free kick is cautioned for delaying the restart."}},{"id":"wall-one-metre","lvl":"b","ref":"13.2 · 13.3","a":1,"ar":{"s":"شكّل أربعة مدافعين حائط الصد، ووقف مهاجم ملاصقًا للحائط على بُعد أقل من متر عند تنفيذ ركلة حرة مباشرة لفريقه. ما قرارك؟","o":["تُعاد الركلة الحرة","ركلة حرة غير مباشرة للفريق المدافع","يستمر اللعب مع تنبيه المهاجم"],"d":"إيقاف اللعب لمخالفة المهاجم","r":"ركلة حرة غير مباشرة للفريق المدافع","x":"لا يوجد","w":"إذا تكوّن حائط الصد من ثلاثة مدافعين أو أكثر، يجب أن يبتعد لاعبو الفريق المهاجم مترًا على الأقل عنه حتى تصبح الكرة في اللعب، ومخالفة ذلك تُعاقب بركلة حرة غير مباشرة."},"en":{"s":"Four defenders form a wall and an attacker stands right against it, less than 1 m away, when his team's direct free kick is taken. Your call?","o":["Retake the free kick","Indirect free kick to the defending team","Play on and warn the attacker"],"d":"Stop play for the attacker's offence","r":"Indirect free kick to the defending team","x":"None","w":"When three or more defenders form a wall, attackers must stay at least 1 m from it until the ball is in play; breaching this is penalised with an indirect free kick."}},{"id":"gk-fk-handball","lvl":"p","ref":"13.3","a":1,"ar":{"s":"نفّذ الحارس ركلة حرة من داخل منطقة جزائه، فتحركت الكرة بوضوح وارتفعت، ثم أمسكها بيديه قبل أن يلمسها أي لاعب آخر وهو داخل منطقة الجزاء. ما قرارك؟","o":["ركلة جزاء للفريق المنافس","ركلة حرة غير مباشرة للفريق المنافس","تُعاد الركلة الحرة"],"d":"إيقاف اللعب","r":"ركلة حرة غير مباشرة للفريق المنافس من مكان المخالفة","x":"لا يوجد","w":"الكرة صارت في اللعب بمجرد ركلها وتحركها بوضوح. لمس المنفذ لها بيده قبل أن يلمسها لاعب آخر يُعاقب عادةً بركلة حرة مباشرة أو ركلة جزاء، لكن الاستثناء أن المنفذ إذا كان الحارس داخل منطقة جزائه تكون العقوبة ركلة حرة غير مباشرة."},"en":{"s":"The goalkeeper takes a free kick inside his penalty area; the ball clearly moves and rises, and he catches it inside the area before anyone else touches it. Your call?","o":["Penalty kick to the opponents","Indirect free kick to the opponents","Retake the free kick"],"d":"Stop play","r":"Indirect free kick to the opponents from where it happened","x":"None","w":"The ball was in play once kicked and clearly moving. A kicker's handball before another player touches the ball is normally a direct free kick or penalty, but when the kicker is the goalkeeper inside his own penalty area it is an indirect free kick."}},{"id":"ifk-no-signal","lvl":"p","ref":"13.1","a":2,"ar":{"s":"احتسب الحكم ركلة حرة غير مباشرة لكنه نسي رفع ذراعه، فسدّد المنفذ مباشرة في مرمى المنافس. ما قرارك؟","o":["يُحتسب الهدف لأن الحكم لم يُشر","ركلة مرمى","تُعاد الركلة الحرة غير المباشرة"],"d":"عدم احتساب الهدف","r":"ركلة حرة غير مباشرة (إعادة)","x":"لا يوجد","w":"إشارة الركلة غير المباشرة واجبة. إذا لم يُشر الحكم ودخلت الكرة المرمى مباشرة، تُعاد الركلة بدل احتساب ركلة المرمى، حتى لا يُضار الفريق المنفذ بخطأ الحكم."},"en":{"s":"The referee awards an indirect free kick but forgets to raise his arm, and the kicker shoots directly into the opponents' goal. Your call?","o":["Goal, since there was no signal","Goal kick","Retake the indirect free kick"],"d":"Disallow the goal","r":"Indirect free kick (retaken)","x":"None","w":"The indirect signal is required. If the referee failed to give it and the ball goes straight into the goal, the kick is retaken rather than a goal kick awarded, so the kicking team is not punished for the referee's error."}}],"myths":[{"id":"indirect-straight-in-counts","ref":"13.1","t":false,"ar":{"s":"إذا دخلت الركلة الحرة غير المباشرة مرمى المنافس مباشرة يُحتسب الهدف.","w":"لا يُحتسب الهدف؛ تُستأنف المباراة بركلة مرمى للمنافس. أما إذا نسي الحكم رفع ذراعه للإشارة إلى أنها غير مباشرة ودخلت الكرة المرمى مباشرة فتُعاد الركلة."},"en":{"s":"If an indirect free kick goes straight into the opponents' net, the goal counts.","w":"No goal: play restarts with a goal kick to the opponents. If the referee failed to give the raised-arm indirect signal and the ball went straight in, the kick is retaken instead."}},{"id":"attackers-can-join-the-wall","ref":"13.2","t":false,"ar":{"s":"يحق للمهاجمين الوقوف ملاصقين لحائط صد مكوّن من ثلاثة مدافعين أو أكثر عند تنفيذ الركلة الحرة.","w":"إذا شكّل ثلاثة مدافعين أو أكثر حائط صد، يجب أن يبقى جميع لاعبي الفريق المهاجم على بعد متر واحد على الأقل منه حتى تصبح الكرة في اللعب، وإلا تُحتسب ركلة حرة غير مباشرة للفريق المدافع."},"en":{"s":"Attackers are allowed to stand right up against a wall of three or more defenders at a free kick.","w":"When three or more defenders form a wall, every attacking player must stay at least 1 m (1 yd) from it until the ball is in play; otherwise an indirect free kick goes to the defending team."}},{"id":"free-kick-into-own-goal-corner","ref":"13.1","t":true,"ar":{"s":"إذا سدّد لاعب ركلة حرة إلى مرمى فريقه مباشرة فلا يُحتسب هدف، بل ركلة ركنية.","w":"لا يمكن تسجيل هدف في مرمى الفريق نفسه مباشرة من ركلة حرة، مباشرة كانت أو غير مباشرة؛ تُحتسب ركلة ركنية للمنافس."},"en":{"s":"Kick a free kick straight into your own goal and it isn't a goal at all - it's a corner.","w":"A goal cannot be scored directly into the kicker's own goal from any free kick, direct or indirect; a corner kick is awarded to the opponents."}}]},"14":{"pages":{"ar":"ع ص 129–134 · EN p.135–139","en":"EN p.135–139 · AR p.129–134"},"parts":[{"id":"procedure","title":{"ar":"إجراءات ركلة الجزاء","en":"Penalty kick procedure"},"ref":"14 · 14.1","fig":"penalty","k":["ركلة جزاء","penalty","علامة الجزاء","penalty mark","حارس","goalkeeper","خط المرمى","goal line","تحديد المنفذ","identified"],"body":{"ar":"<p>تُحتسب ركلة الجزاء إذا ارتكب لاعب مخالفة عقوبتها ركلة حرة مباشرة <b>داخل منطقة جزائه</b>، أو خارج الملعب ضمن مجريات اللعب. ويجوز التسجيل منها مباشرة.</p>\n<ul><li>الكرة <b>ثابتة</b>، وجزء منها يلمس مركز علامة الجزاء أو فوقه. والقائمان والعارضة والشبكة لا تتحرك.</li>\n<li>المنفذ <b>محدد بوضوح</b>.</li>\n<li>الحارس على خط المرمى، مواجهًا للمنفذ، بين القائمين، حتى تُركل الكرة. ولا يشتت المنفذ بشكل غير عادل، كتأخير الركلة أو لمس القائمين أو العارضة أو الشبكة.</li>\n<li>عند الركل: جزء من <b>قدم واحدة</b> على الأقل للحارس يلمس خط المرمى، أو على امتداده، أو خلفه.</li></ul>\n<h3>بقية اللاعبين</h3>\n<p>على بعد <b>9.15 م</b> من علامة الجزاء على الأقل، <b>خلفها</b>، داخل الملعب، وخارج منطقة الجزاء.</p>\n<ul><li>يُطلق الحكم الإشارة بعد اتخاذ المواقع. وتُركل الكرة <b>للأمام</b>، والكعب مسموح إن تحركت للأمام.</li>\n<li>تصبح في اللعب عندما تُركل وتتحرك بوضوح، ولا يلعبها المنفذ ثانية قبل غيره.</li>\n<li>آخر الشوط: يُمنح وقت لإكمالها. وتكتمل عندما تتوقف الكرة، أو تخرج، أو يلعبها أي لاعب غير الحارس المدافع، أو يوقف الحكم اللعب لمخالفة من المنفذ أو فريقه.</li></ul>","en":"<p>A penalty is awarded for a direct free kick offence <b>inside the offender's penalty area</b>, or off the field as part of play. A goal may be scored directly.</p>\n<ul><li>The ball is <b>stationary</b>, part of it touching or overhanging the centre of the mark; posts, crossbar and net not moving.</li>\n<li>The kicker is <b>clearly identified</b>.</li>\n<li>The goalkeeper stays on the goal line, facing the kicker, between the posts, until the kick; no unfair distraction (delaying, touching posts, crossbar or net).</li>\n<li>At the kick, part of at least <b>one foot</b> touches, is in line with, or behind the goal line.</li></ul>\n<h3>Other players</h3>\n<p>At least <b>9.15 m</b> from the mark, <b>behind</b> it, on the field and outside the penalty area.</p>\n<ul><li>The referee signals once positions are taken. The ball is kicked <b>forward</b>; a backheel is fine if it moves forward.</li>\n<li>In play when kicked and it clearly moves; the kicker can't play it again before someone else.</li>\n<li>End of a half: time is allowed to complete it; it ends when the ball stops, goes out, is played by anyone other than the defending goalkeeper, or play is stopped for an offence by the kicker's team.</li></ul>"},"quiz":[{"ar":["عند الركل، ما الحد الأدنى لموقع قدم الحارس؟",["القدمان على الخط","جزء من قدم واحدة يلمس الخط أو على امتداده أو خلفه"],"(14.1)"],"en":["At the kick, what is the minimum for the goalkeeper's feet?",["Both feet on the line","Part of one foot touching, in line with or behind the line"],"(14.1)"],"a":1,"lvl":"b"},{"ar":["ركل المنفذ الكرة بكعبه فتحركت للأمام. مسموح؟",["نعم","لا"],"(14.1)"],"en":["The kicker backheels the ball and it moves forward. Allowed?",["Yes","No"],"(14.1)"],"a":0,"lvl":"p"}]},{"id":"offences","title":{"ar":"المخالفات أثناء ركلة الجزاء","en":"Offences at the penalty kick"},"ref":"14.2","k":["دخول المنطقة","encroachment","خداع","feint","ركل للخلف","backwards","منفذ خاطئ","wrong kicker","تحرك الحارس","goalkeeper offence","لمسة مزدوجة","double touch"],"body":{"ar":"<p>بعد إشارة الحكم يجب التنفيذ، وإلا جاز الإجراء الانضباطي قبل الإشارة من جديد.</p>\n<h3>مخالفات قبل أن تصبح الكرة في اللعب</h3>\n<div class=\"tbl\"><table><tr><th>المخالفة</th><th>إن دخلت الهدف</th><th>إن لم تدخل</th></tr>\n<tr><td>المنفذ يركل بالقدمين معًا أو تلمس قدمه الأخرى عرَضًا</td><td>إعادة</td><td>ركلة حرة غير مباشرة</td></tr>\n<tr><td>المنفذ أو زميله يخالف (عمومًا)</td><td>إعادة</td><td>ركلة حرة غير مباشرة</td></tr>\n<tr><td>الحارس يخالف</td><td>✅ هدف</td><td>إعادة إذا صدّها الحارس، أو إذا أثّرت مخالفته بوضوح على المنفذ</td></tr>\n<tr><td>زميل الحارس يخالف</td><td>✅ هدف</td><td>إعادة</td></tr>\n<tr><td>لاعبون من الفريقين</td><td colspan=\"2\">إعادة، ما لم تكن مخالفة أحدهم أخطر (مثل الخداع غير القانوني)</td></tr></table></div>\n<h3>دائمًا ركلة حرة غير مباشرة، سُجّل هدف أم لا</h3>\n<ul><li>ركل الكرة <b>للخلف</b>.</li><li>نفّذها <b>زميل</b> المنفذ المحدد ← إنذار لمن نفّذها.</li>\n<li><b>الخداع بعد إكمال الركض</b> ← إنذار للمنفذ. (الخداع أثناء الركض مسموح.)</li></ul>\n<h3>دخول المنطقة مبكرًا: يُعاقب فقط إذا كان له أثر</h3>\n<ul><li><b>زميل المنفذ:</b> إذا أثّر بوضوح على الحارس، أو لعب الكرة أو نازع منافسًا ثم سجّل أو حاول أو صنع فرصة.</li>\n<li><b>زميل الحارس:</b> إذا أثّر بوضوح على المنفذ، أو لعب الكرة أو نازع منافسًا فمنع التسجيل أو محاولته أو صنع فرصة.</li></ul>\n<p><b>الحارس:</b> إذا أدت مخالفته لإعادة الركلة ← <b>تحذير</b> في المرة الأولى في المباراة، و<b>إنذار</b> في التالية.</p>\n<h3>بعد الركل</h3>\n<ul><li>المنفذ لمسها ثانية عمدًا قبل غيره: ركلة حرة غير مباشرة (مباشرة إن كانت لمسة يد).</li>\n<li>عنصر خارجي لمسها وهي تتقدم: إعادة، إلا إذا كانت داخلة والتدخل لم يمنع الحارس أو مدافعًا، فيُحتسب الهدف.</li>\n<li>ارتدت من الحارس أو العارضة أو القائم ثم لمسها عنصر خارجي: كرة مسقطة من مكان اللمس.</li></ul>","en":"<p>Once signalled, the kick must be taken; otherwise the referee may take disciplinary action before signalling again.</p>\n<h3>Offences before the ball is in play</h3>\n<div class=\"tbl\"><table><tr><th>Offence</th><th>Goal scored</th><th>No goal</th></tr>\n<tr><td>Kicker accidentally uses both feet or touches it with the other foot</td><td>Retake</td><td>Indirect free kick</td></tr>\n<tr><td>Kicker or a team-mate offends (general)</td><td>Retake</td><td>Indirect free kick</td></tr>\n<tr><td>Goalkeeper offends</td><td>✅ Goal</td><td>Retake if the goalkeeper saved it, or if the offence clearly impacted the kicker</td></tr>\n<tr><td>Goalkeeper's team-mate offends</td><td>✅ Goal</td><td>Retake</td></tr>\n<tr><td>Players of both teams</td><td colspan=\"2\">Retake, unless one commits a more serious offence (e.g. illegal feinting)</td></tr></table></div>\n<h3>Always an indirect free kick, goal or not</h3>\n<ul><li>Kicked <b>backwards</b>.</li><li>A <b>team-mate</b> of the identified kicker takes it → caution for that player.</li>\n<li><b>Feinting after completing the run-up</b> → caution for the kicker. (Feinting during the run-up is allowed.)</li></ul>\n<h3>Encroachment is penalised only if it has an impact</h3>\n<ul><li><b>Kicker's team-mate:</b> clearly impacts the goalkeeper, or plays/challenges and then scores, attempts to score or creates a chance.</li>\n<li><b>Goalkeeper's team-mate:</b> clearly impacts the kicker, or plays/challenges and prevents a goal, an attempt or a chance.</li></ul>\n<p><b>Goalkeeper:</b> if their offence causes a retake → <b>warning</b> the first time in the match, <b>caution</b> after.</p>\n<h3>After the kick</h3>\n<ul><li>Kicker deliberately touches it again before anyone else: IFK (DFK for handball).</li>\n<li>An outside agent touches it moving forward: retake, unless it was going in and the goalkeeper/defenders weren't prevented — then goal.</li>\n<li>Rebounds off the goalkeeper, crossbar or post then touched by an outside agent: dropped ball where it was touched.</li></ul>"},"quiz":[{"ar":["الحارس تقدم عن خطه قبل الركل والكرة دخلت المرمى. القرار؟",["إعادة","هدف"],"(14.2)"],"en":["The goalkeeper moved off the line early and the ball went in. Decision?",["Retake","Goal"],"(14.2)"],"a":1,"lvl":"b"},{"ar":["المنفذ توقف بعد إكمال الركض وخدع الحارس ثم سجّل. القرار؟",["هدف","ركلة حرة غير مباشرة وإنذار للمنفذ"],"(14.2)"],"en":["The kicker stops after the run-up, feints and scores. Decision?",["Goal","IFK and caution for the kicker"],"(14.2)"],"a":1,"lvl":"b"},{"ar":["مهاجم دخل المنطقة مبكرًا دون أي أثر، وسُجّل الهدف. القرار؟",["هدف","إعادة"],"لا أثر = لا عقوبة. (14.2)"],"en":["An attacker encroached early with no impact; goal scored. Decision?",["Goal","Retake"],"No impact, no penalty. (14.2)"],"a":0,"lvl":"p"}]}],"cases":[{"id":"gk-early-save","lvl":"b","ref":"14.2","a":1,"ar":{"s":"عند تنفيذ ركلة جزاء، كان الحارس قد تقدّم بكلتا قدميه أمام خط المرمى لحظة ركل الكرة، ثم صدّها. هذه أول مخالفة له في المباراة. ما قرارك؟","o":["يستمر اللعب لأن الكرة صُدّت","تُعاد ركلة الجزاء مع تحذير الحارس","تُعاد ركلة الجزاء مع إنذار الحارس"],"d":"إعادة ركلة الجزاء","r":"ركلة جزاء (إعادة)","x":"تحذير الحارس (المخالفة الأولى)","w":"عند الركل يجب أن يبقى جزء من إحدى قدمي الحارس ملامسًا لخط المرمى أو على امتداده أو خلفه. إذا منع الكرة من دخول المرمى بعد مخالفته تُعاد الركلة، ويُحذَّر على المخالفة الأولى في المباراة ويُنذر على ما بعدها."},"en":{"s":"At a penalty the goalkeeper has both feet in front of the goal line when the ball is kicked, then saves it. It is his first such offence in the match. Your call?","o":["Play on, it was saved","Retake the penalty and warn the goalkeeper","Retake the penalty and caution the goalkeeper"],"d":"Retake the penalty","r":"Penalty kick (retaken)","x":"Warning to the goalkeeper (first offence)","w":"When the ball is kicked, part of one of the goalkeeper's feet must be touching, in line with or behind the goal line. If he then stops the ball going in, the kick is retaken; the first such offence brings a warning, later ones a caution."}},{"id":"post-rebound-kicker","lvl":"b","ref":"14.1 · 14.2","a":0,"ar":{"s":"في الوقت الأصلي ارتطمت كرة ركلة الجزاء بالقائم وارتدت إلى المنفذ مباشرة دون أن يلمسها أحد، فسدّدها في المرمى. ما قرارك؟","o":["لا هدف، ركلة حرة غير مباشرة للفريق المدافع","يُحتسب الهدف","تُعاد ركلة الجزاء"],"d":"عدم احتساب الهدف","r":"ركلة حرة غير مباشرة للفريق المدافع","x":"لا يوجد","w":"لا يجوز لمنفذ ركلة الجزاء لعب الكرة مرة ثانية قبل أن تلمس لاعبًا آخر، والقائم ليس لاعبًا. اللمس المتعمد الثاني يُعاقب بركلة حرة غير مباشرة (أو مباشرة إذا كان لمسًا باليد)."},"en":{"s":"In normal time a penalty hits the post and rebounds straight to the kicker, untouched, and he scores. Your call?","o":["No goal; indirect free kick to the defending team","Goal","Retake the penalty"],"d":"Disallow the goal","r":"Indirect free kick to the defending team","x":"None","w":"The kicker may not play the ball again until it has touched another player, and the post is not a player. A deliberate second touch is penalised with an indirect free kick (direct for a handball)."}},{"id":"illegal-feint","lvl":"b","ref":"14.2","a":2,"ar":{"s":"أكمل منفذ ركلة الجزاء ركضه نحو الكرة ثم توقف وتظاهر بالركل ليُربك الحارس، وبعدها سدّد فسجّل. ما قرارك؟","o":["يُحتسب الهدف لأن التمويه مسموح","تُعاد ركلة الجزاء مع إنذار المنفذ","لا هدف، ركلة حرة غير مباشرة وإنذار المنفذ"],"d":"عدم احتساب الهدف","r":"ركلة حرة غير مباشرة للفريق المدافع","x":"إنذار المنفذ","w":"التمويه مسموح أثناء الركض نحو الكرة، لكنه ممنوع بعد اكتمال الركض. هذه المخالفة تُعاقب بركلة حرة غير مباشرة وإنذار المنفذ سواء دخلت الكرة المرمى أم لا."},"en":{"s":"The penalty taker completes his run-up, stops and pretends to kick to fool the goalkeeper, then shoots and scores. Your call?","o":["Goal — feinting is allowed","Retake and caution the kicker","No goal; indirect free kick and caution the kicker"],"d":"Disallow the goal","r":"Indirect free kick to the defending team","x":"Caution the kicker","w":"Feinting during the run-up is allowed, but not once the run-up is complete. That offence is penalised with an indirect free kick and a caution for the kicker whether or not a goal is scored."}},{"id":"encroacher-scores","lvl":"p","ref":"14.2 · 14.3","a":1,"ar":{"s":"دخل زميل لمنفذ ركلة الجزاء منطقة الجزاء قبل ركل الكرة دون أن يؤثر على الحارس. صدّ الحارس الركلة فارتدت الكرة إلى هذا الزميل فسجّل. ما قرارك؟","o":["يُحتسب الهدف لأنه لم يؤثر على الحارس","لا هدف، ركلة حرة غير مباشرة للفريق المدافع","تُعاد ركلة الجزاء"],"d":"عدم احتساب الهدف","r":"ركلة حرة غير مباشرة للفريق المدافع","x":"لا يوجد","w":"دخول زميل المنفذ المبكر لا يُعاقب إلا إذا أثّر بوضوح على الحارس، أو لعب الكرة ثم سجّل أو حاول التسجيل أو صنع فرصة. هنا لعب الكرة وسجّل، ولم يدخل المرمى هدف من الركلة نفسها، فيُوقف اللعب بركلة حرة غير مباشرة."},"en":{"s":"A team-mate of the penalty taker enters the penalty area before the kick without affecting the goalkeeper. The keeper saves, the ball rebounds to that team-mate and he scores. Your call?","o":["Goal — he didn't affect the goalkeeper","No goal; indirect free kick to the defending team","Retake the penalty"],"d":"Disallow the goal","r":"Indirect free kick to the defending team","x":"None","w":"A kicker's team-mate who encroaches is penalised only if he clearly affects the goalkeeper, or plays the ball and then scores, attempts to score or creates a chance. Here he played it and scored, and no goal came from the kick itself, so play restarts with an indirect free kick."}},{"id":"extended-time-rebound","lvl":"p","ref":"14.1","a":2,"ar":{"s":"في نهاية الشوط الأول مُدّد الوقت لتنفيذ ركلة جزاء. صدّ الحارس الكرة فارتدت إلى المنفذ فسجّل منها. ما قرارك؟","o":["يُحتسب الهدف لأن الحارس لمس الكرة","تُعاد ركلة الجزاء","لا هدف، وينتهي الشوط"],"d":"عدم احتساب الهدف وإنهاء الشوط","r":"لا يوجد","x":"لا يوجد","w":"في الوقت الممدد لركلة الجزاء تنتهي الركلة عندما يلعب الكرة أي لاعب غير الحارس المدافع، بما في ذلك المنفذ. لمسة المنفذ بعد الصد أنهت الركلة، فلا يُحتسب ما تلاها."},"en":{"s":"Time is extended at the end of the first half for a penalty. The goalkeeper saves, the ball rebounds to the kicker and he scores. Your call?","o":["Goal — the goalkeeper touched it","Retake the penalty","No goal; the half ends"],"d":"Disallow the goal and end the half","r":"None","x":"None","w":"When time is extended for a penalty, the kick is completed as soon as any player other than the defending goalkeeper, including the kicker, plays the ball. The kicker's touch after the save ended the kick, so his goal does not count."}}],"myths":[{"id":"keeper-both-feet-on-line","ref":"14.1","t":false,"ar":{"s":"يجب أن يُبقي الحارس قدميه الاثنتين على خط المرمى حتى تُركل ركلة الجزاء.","w":"يكفي أن يكون جزء من قدم واحدة على الأقل ملامسًا لخط المرمى أو على امتداده أو خلفه لحظة ركل الكرة، ويمكنه التحرك على الخط قبل ذلك دون أن يتقدم عنه."},"en":{"s":"The goalkeeper must keep both feet on the goal line until the penalty is kicked.","w":"At the moment of the kick, only part of one foot needs to be touching, in line with, or behind the goal line; the keeper may move along the line beforehand but must not leave it."}},{"id":"any-penalty-feint-illegal","ref":"14.2","t":false,"ar":{"s":"أي تمويه أو توقف من منفذ ركلة الجزاء ممنوع.","w":"التمويه أثناء الركض نحو الكرة مسموح. المخالفة هي التمويه بعد إكمال الركض، وعقوبتها ركلة حرة غير مباشرة وإنذار للمنفذ سواء دخلت الكرة المرمى أم لا."},"en":{"s":"Any stutter or fake by the penalty taker is illegal.","w":"Feinting during the run-up is allowed. Feinting once the run-up is complete is the offence: indirect free kick and a caution for the kicker, whether or not the ball goes in."}},{"id":"keeper-warning-first-offence","ref":"14.2","t":true,"ar":{"s":"الحارس الذي يتقدم عن خطه ويصد ركلة الجزاء لا يُنذر على أول مخالفة من هذا النوع في المباراة، بل يُحذَّر فقط.","w":"إذا تسببت مخالفة الحارس في إعادة الركلة، يكتفي الحكم بتحذيره في أول مخالفة له في المباراة، ويُنذره عن أي مخالفة لاحقة."},"en":{"s":"A keeper who comes off the line and saves a penalty is not given a yellow card for the first such offence in the match, only a warning.","w":"When the goalkeeper's offence leads to a retake, the keeper is warned for the first such offence in the match and cautioned for any further one."}}]},"15":{"pages":{"ar":"ع ص 135–136 · EN p.141–142 · بروتوكول العد EN p.26","en":"EN p.141–142 · countdown protocol EN p.26 · AR p.135–136"},"parts":[{"id":"procedure","title":{"ar":"متى وكيف تُنفذ رمية التماس","en":"When and how a throw-in is taken"},"ref":"15 · 15.1","fig":"throwin","k":["رمية تماس","throw-in","خط التماس","touchline","القدمين","feet","2 م","2 m","اليدين","both hands","فوق الرأس","over the head"],"body":{"ar":"<p>تُمنح رمية التماس <b>لمنافسي آخر لاعب لمس الكرة</b> عندما تتجاوز الكرة <b>بكاملها</b> خط التماس، على الأرض أو في الهواء. وتُمنح أيضًا عند معاقبة فريق على تأخير تنفيذ رميته (انظر الجزء التالي).</p>\n<h3>لا هدف مباشر من الرمية</h3>\n<ul><li>إذا دخلت مرمى المنافس مباشرة: <b>ركلة مرمى</b>.</li><li>إذا دخلت مرمى فريق الرامي مباشرة: <b>ركلة ركنية</b> للمنافس.</li></ul>\n<h3>الرامي لحظة الرمي</h3>\n<ul><li>يقف <b>مواجهًا للملعب</b>.</li><li>جزء من <b>كل قدم</b> على خط التماس أو على الأرض خارجه.</li><li>يرمي <b>باليدين معًا</b>، من خلف الرأس ومن فوقه، ومن النقطة التي خرجت منها الكرة.</li></ul>\n<h3>المنافسون والكرة</h3>\n<ul><li>يقف كل المنافسين على بعد <b>2 م</b> على الأقل من نقطة التنفيذ على خط التماس.</li><li>تصبح الكرة في اللعب عندما <b>تدخل الملعب</b>.</li><li>إذا لمست الأرض قبل دخولها: يعيدها <b>الفريق نفسه</b> من الموضع نفسه.</li><li>إذا نُفذت بطريقة غير صحيحة: يعيدها <b>الفريق المنافس</b>.</li><li>لا يلمس الرامي الكرة ثانية قبل أن تلمس لاعبًا آخر.</li></ul>\n<div class=\"note judge\"><b>تقدير الحكم:</b> إذا رمى اللاعب الكرة عمدًا على منافس ليلعبها مجددًا، دون تهور أو استخدام قوة مفرطة ودون إهمال، يستمر اللعب.</div>","en":"<p>A throw-in goes to the <b>opponents of the last player to touch the ball</b> when the <b>whole</b> ball crosses the touchline, on the ground or in the air. It is also awarded when a team is penalised for delaying its own throw-in (next part).</p>\n<h3>No direct goal</h3>\n<ul><li>Straight into the opponents' goal: <b>goal kick</b>.</li><li>Straight into the thrower's own goal: <b>corner kick</b> to the opponents.</li></ul>\n<h3>The thrower, at delivery</h3>\n<ul><li>Stands <b>facing the field</b>.</li><li>Has part of <b>each foot</b> on the touchline or on the ground outside it.</li><li>Throws with <b>both hands</b>, from behind and over the head, from where the ball left the field.</li></ul>\n<h3>Opponents and the ball</h3>\n<ul><li>All opponents at least <b>2 m</b> from the point on the touchline.</li><li>In play when it <b>enters the field</b>.</li><li>Touches the ground before entering: <b>same team</b> retakes from the same place.</li><li>Taken incorrectly: retaken by the <b>opposing team</b>.</li><li>The thrower may not touch it again until it has touched another player.</li></ul>\n<div class=\"note judge\"><b>Referee judgement:</b> deliberately throwing the ball at an opponent to play it again, without carelessness, recklessness or excessive force — play continues.</div>"},"quiz":[{"ar":["دخلت الرمية مرمى المنافس مباشرة دون أن يلمسها أحد. القرار؟",["هدف","ركلة مرمى","إعادة الرمية"],"(15) لا يُحتسب هدف مباشر من رمية التماس."],"en":["A throw-in goes straight into the opponents' goal untouched. Decision?",["Goal","Goal kick","Retake"],"(15) No goal directly from a throw-in."],"a":1,"lvl":"b"},{"ar":["الرامي رفع قدمه الأمامية بالكامل عن الأرض داخل الملعب لحظة الرمي. القرار؟",["يستمر اللعب","يعيد الفريق نفسه","رمية للفريق المنافس"],"(15.1) تنفيذ غير صحيح، فيعيدها المنافس."],"en":["At delivery the thrower's front foot is fully inside the field. Decision?",["Play on","Same team retakes","Throw-in to the opponents"],"(15.1) Incorrectly taken: the opponents retake."],"a":2,"lvl":"b"},{"ar":["لمست الكرة الأرض خارج الملعب قبل أن تدخله. القرار؟",["يعيدها الفريق نفسه","رمية للمنافس","ركلة حرة غير مباشرة"],"(15.1) تُعاد من الفريق نفسه ومن الموضع نفسه."],"en":["The ball touches the ground outside the field before entering. Decision?",["Same team retakes","Throw-in to the opponents","Indirect free kick"],"(15.1) Retaken by the same team, same place."],"a":0,"lvl":"p"},{"ar":["ما أقل مسافة للمنافس عن نقطة التنفيذ؟",["1 م","2 م","9.15 م"],"(15.1)"],"en":["Minimum distance for opponents from the throw-in point?",["1 m","2 m","9.15 m"],"(15.1)"],"a":1,"lvl":"b"}]},{"id":"countdown","title":{"ar":"العد التنازلي ضد إضاعة الوقت","en":"The countdown against time-wasting"},"ref":"15 · 15.2 · بروتوكول العد","k":["عد تنازلي","countdown","خمس ثوان","five seconds","تأخير","delay","إضاعة الوقت","time-wasting","إنذار","caution"],"body":{"ar":"<div class=\"note\"><b>جديد في 2026/27 — العد التنازلي (5 ثوانٍ):</b> إذا رأى الحكم أن الفريق يؤخر التنفيذ عمدًا، يطلق صافرته ويشير بوضوح لتنفيذ الاستئناف، ثم يعدّ خمس ثوانٍ بيد مرفوعة (ويجوز أن يعدّ بصوته أيضًا). ويجوز له قبل ذلك أن يحث اللاعب بالصافرة أو بالصوت على الإسراع، لكن هذا التنبيه ليس شرطًا لبدء العد.</div><h3>ماذا يحدث بعد الثواني الخمس؟</h3>\n<ul><li>إذا لم تصبح الكرة في اللعب: تُمنح <b>رمية التماس للفريق المنافس</b> من الموضع نفسه.</li><li>لا إنذار تلقائيًا. يُنذَر اللاعب (أو زميله) <b>فقط</b> إذا أخّر بعد ذلك بشكل مفرط استئناف الفريق المنافس.</li></ul>\n<div class=\"note judge\"><b>تقدير الحكم:</b> تحديد أن التأخير «متعمد» قرار الحكم. والعد لا يبدأ لمجرد بطء طبيعي.</div>","en":"<div class=\"note\"><b>New in 2026/27 — five-second countdown:</b> if the team deliberately delays the restart, the referee blows the whistle, clearly signals for it to be taken, and counts down five seconds with a raised hand (a verbal count may be added). A prior verbal or whistle cue to hurry up is allowed but not required.</div><h3>After five seconds</h3>\n<ul><li>If the ball is not in play: the <b>throw-in goes to the opponents</b> from the same position.</li><li>No automatic caution. A yellow card only if the player or a team-mate then excessively delays the opponents' restart.</li></ul>\n<div class=\"note judge\"><b>Referee judgement:</b> whether a delay is deliberate is the referee's call; normal slowness doesn't trigger the count.</div>"},"quiz":[{"ar":["انتهى العد ولم تُنفذ الرمية. القرار؟",["إنذار وإعادة","رمية للفريق المنافس","ركلة حرة غير مباشرة"],"(15.2) تنتقل الرمية للمنافس من الموضع نفسه."],"en":["The count ends and the throw-in hasn't been taken. Decision?",["Caution and retake","Throw-in to the opponents","Indirect free kick"],"(15.2) It goes to the opponents, same position."],"a":1,"lvl":"b"},{"ar":["متى يُنذَر اللاعب في هذه الحالة؟",["دائمًا عند انتهاء العد","فقط إذا أخّر بشكل مفرط استئناف المنافس بعد منحه الرمية","لا إنذار أبدًا"],"(15.2)"],"en":["When is a caution given here?",["Always when the count ends","Only for excessive delay of the opponents' restart afterwards","Never"],"(15.2)"],"a":1,"lvl":"p"},{"ar":["كيف يعدّ الحكم الثواني؟",["بيد مرفوعة، ويجوز بصوته أيضًا","بالصافرة كل ثانية","بالإشارة للحكم الرابع"],"(بروتوكول العد)"],"en":["How does the referee count?",["With a raised hand, optionally aloud","A whistle each second","By signalling the fourth official"],"(Countdown protocol)"],"a":0,"lvl":"p"}]},{"id":"offences","title":{"ar":"المخالفات والعقوبات","en":"Offences and sanctions"},"ref":"15 · 15.2","k":["لمس مرتين","second touch","لمس الكرة باليد","handball","تشتيت","distract","إعاقة","impede","سلوك غير رياضي","unsporting behaviour"],"body":{"ar":"<ul><li><b>لمس ثانٍ</b> من الرامي قبل أن تلمس الكرة لاعبًا آخر: <b>ركلة حرة غير مباشرة</b>.</li>\n<li><b>لمس الكرة باليد</b> من الرامي: <b>ركلة حرة مباشرة</b>، أو <b>ركلة جزاء</b> إذا كانت داخل منطقة جزائه. أما إذا كان الحارس المدافع: <b>ركلة حرة غير مباشرة</b>.</li>\n<li>منافس <b>يشتت أو يعيق</b> الرامي بشكل غير عادل، ومنها الاقتراب أقل من 2 م: <b>إنذار</b> لسلوك غير رياضي، و<b>ركلة حرة غير مباشرة</b> إذا كانت الرمية قد نُفذت.</li>\n<li>أي مخالفة أخرى: تُمنح الرمية <b>للفريق المنافس</b>.</li></ul>","en":"<ul><li><b>Second touch</b> by the thrower before another player touches it: <b>indirect free kick</b>.</li>\n<li><b>Handball</b> by the thrower: <b>direct free kick</b>, or a <b>penalty</b> inside their own penalty area — but an <b>indirect free kick</b> if it was the defending goalkeeper.</li>\n<li>An opponent who unfairly <b>distracts or impedes</b> the thrower, including coming closer than 2 m: <b>caution</b> for unsporting behaviour, plus an <b>indirect free kick</b> if the throw was already taken.</li>\n<li>Any other offence: the throw-in goes to the <b>opposing team</b>.</li></ul>"},"quiz":[{"ar":["الرامي لعب الكرة مرة ثانية بقدمه قبل أن يلمسها أحد. القرار؟",["ركلة حرة غير مباشرة","ركلة حرة مباشرة","إعادة الرمية"],"(15.2)"],"en":["The thrower plays it again with the foot before anyone touches it. Decision?",["Indirect free kick","Direct free kick","Retake"],"(15.2)"],"a":0,"lvl":"b"},{"ar":["منافس وقف على بعد متر ولوّح بيديه، والرمية نُفذت. القرار؟",["إنذار + ركلة حرة غير مباشرة","إعادة الرمية فقط","يستمر اللعب"],"(15.2)"],"en":["An opponent stands 1 m away waving and the throw is taken. Decision?",["Caution + indirect free kick","Retake only","Play on"],"(15.2)"],"a":0,"lvl":"b"},{"ar":["الرامي (ليس الحارس) لمس الكرة بيده عمدًا داخل منطقة جزائه بعد الرمية. القرار؟",["ركلة حرة غير مباشرة","ركلة جزاء","إعادة الرمية"],"(15.2)"],"en":["The thrower (not the goalkeeper) handles deliberately in their own penalty area after the throw. Decision?",["Indirect free kick","Penalty kick","Retake"],"(15.2)"],"a":1,"lvl":"p"}]}],"cases":[{"id":"throw-bounce-outside","lvl":"b","ref":"15.1","a":2,"ar":{"s":"نفّذ لاعب رمية التماس بطريقة صحيحة، لكن الكرة ارتطمت بالأرض خارج خط التماس قبل أن تدخل الملعب. ما قرارك؟","o":["يستمر اللعب لأن الكرة دخلت الملعب في النهاية","رمية تماس للفريق المنافس","يعيد الفريق نفسه رمية التماس من المكان نفسه"],"d":"إعادة رمية التماس","r":"رمية التماس للفريق نفسه من المكان نفسه","x":"لا يوجد","w":"لا تصبح الكرة في اللعب إلا عند دخولها الملعب. فإذا لمست الأرض قبل دخولها يعيد الفريق نفسه الرمية من الموضع نفسه، لأن ذلك ليس تنفيذًا خاطئًا من الرامي."},"en":{"s":"A player takes a correct throw-in but the ball lands outside the touchline before entering the field. Your call?","o":["Play on — the ball ended up on the field","Throw-in to the opponents","Same team retakes from the same place"],"d":"Retake the throw-in","r":"Throw-in to the same team from the same position","x":"None","w":"The ball is only in play once it enters the field. If it touches the ground before that, the same team retakes from the same spot — it isn't an incorrect throw by the thrower."}},{"id":"throw-foot-inside","lvl":"b","ref":"15.1","a":0,"ar":{"s":"عند تنفيذ رمية التماس كانت إحدى قدمي الرامي بالكامل داخل الملعب ولا تلمس خط التماس. ما قرارك؟","o":["رمية تماس للفريق المنافس","يستمر اللعب لأن المخالفة بسيطة","يعيد الرامي نفسه الرمية"],"d":"الرمية غير صحيحة","r":"رمية تماس للفريق المنافس","x":"لا يوجد","w":"يجب أن يكون جزء من كل قدم على خط التماس أو على الأرض خارجه لحظة الرمي. وإذا لم تُنفذ الرمية بشكل صحيح تنتقل إلى الفريق المنافس."},"en":{"s":"At a throw-in one of the thrower's feet is completely inside the field, not touching the touchline. Your call?","o":["Throw-in to the opponents","Play on — it's trivial","The same thrower retakes"],"d":"Incorrect throw-in","r":"Throw-in to the opposing team","x":"None","w":"At delivery, part of each foot must be on the touchline or on the ground outside it. An incorrectly taken throw-in is retaken by the opposing team."}},{"id":"throw-direct-goal","lvl":"b","ref":"15","a":1,"ar":{"s":"رمى لاعب رمية تماس طويلة فدخلت الكرة مرمى المنافس مباشرة دون أن يلمسها أحد. ما قرارك؟","o":["هدف","ركلة مرمى","ركلة ركنية"],"d":"لا يُحتسب الهدف","r":"ركلة مرمى للفريق المنافس","x":"لا يوجد","w":"لا يمكن إحراز هدف مباشرة من رمية التماس. إذا دخلت الكرة مرمى المنافس تُحتسب ركلة مرمى، وإذا دخلت مرمى فريق الرامي تُحتسب ركلة ركنية."},"en":{"s":"A long throw-in goes straight into the opponents' goal without anyone touching it. Your call?","o":["Goal","Goal kick","Corner kick"],"d":"No goal","r":"Goal kick to the opponents","x":"None","w":"A goal cannot be scored directly from a throw-in. Into the opponents' goal it's a goal kick; into the thrower's own goal it's a corner kick."}},{"id":"throw-countdown","lvl":"p","ref":"15.2","a":2,"ar":{"s":"فريق متقدم يتعمد تأخير رمية التماس. أطلق الحكم صافرته وبدأ العد التنازلي بيده المرفوعة، ولم تُنفذ الرمية بانتهاء الثواني الخمس. ما قرارك؟","o":["إنذار الرامي وإعادة الرمية للفريق نفسه","رمية تماس للمنافس مع إنذار الرامي فورًا","رمية تماس للمنافس من الموضع نفسه، دون إنذار"],"d":"تنتقل رمية التماس إلى الفريق المنافس","r":"رمية تماس للفريق المنافس من الموضع نفسه","x":"لا يوجد، إلا إذا أخّر اللاعب أو زميله تنفيذ المنافس للرمية بشكل مفرط فيُنذر","w":"في بروتوكول العد التنازلي، إذا لم تكن الكرة في اللعب عند نهاية الثواني الخمس تُمنح الرمية للمنافس من المكان نفسه. والإنذار لا يكون بسبب التأخير الأول، بل فقط إذا أخّر الفريق المخالف بعدها تنفيذ المنافس تأخيرًا مفرطًا. أما تقدير أن التأخير متعمد فيعود للحكم."},"en":{"s":"A team that is leading deliberately delays a throw-in. The referee whistles and counts down with a raised hand; the throw hasn't been taken after five seconds. Your call?","o":["Caution the thrower; same team retakes","Throw-in to the opponents and caution the thrower now","Throw-in to the opponents from the same spot, no caution"],"d":"The throw-in passes to the opposing team","r":"Throw-in to the opponents from the same position","x":"None — unless the player or a team-mate then excessively delays the opponents' restart","w":"Under the countdown protocol, if the ball isn't in play when the five seconds end, the throw-in goes to the opponents from the same spot. A caution applies only if the offending team then excessively delays the opponents' restart. Whether the delay is deliberate is the referee's judgement."}},{"id":"throw-encroach-2m","lvl":"p","ref":"15.2","a":1,"ar":{"s":"أثناء تنفيذ رمية التماس اقترب مدافع إلى أقل من مترين من مكان الرمي، ونُفذت الرمية فارتطمت الكرة به. ما قرارك؟","o":["إعادة الرمية للفريق نفسه دون عقوبة","إنذار المدافع لسلوك غير رياضي وركلة حرة غير مباشرة","ركلة حرة مباشرة دون إنذار"],"d":"إيقاف اللعب وإنذار المدافع","r":"ركلة حرة غير مباشرة لفريق الرامي من مكان المخالفة","x":"إنذار (سلوك غير رياضي)","w":"المنافس الذي يعيق الرامي أو يشتت انتباهه بشكل غير عادل، ومن ذلك الاقتراب لأقل من مترين من مكان تنفيذ الرمية، يُنذر لسلوك غير رياضي. وبما أن الرمية نُفذت، يُستأنف اللعب بركلة حرة غير مباشرة تُنفذ من مكان المخالفة وفق القاعدة العامة في القانون 13."},"en":{"s":"At a throw-in a defender moves to within 2 m of the throw-in point; the throw is taken and hits him. Your call?","o":["Same team retakes, no sanction","Caution the defender for unsporting behaviour; indirect free kick","Direct free kick, no caution"],"d":"Stop play and caution the defender","r":"Indirect free kick to the thrower's team from where the offence occurred","x":"Caution (unsporting behaviour)","w":"An opponent who unfairly distracts or impedes the thrower, including coming closer than 2 m to the throw-in point, is cautioned for unsporting behaviour. As the throw has been taken, play restarts with an indirect free kick from where the offence occurred (general rule of Law 13)."}}],"myths":[{"id":"throw-feet-behind-line","ref":"15.1","t":false,"ar":{"s":"في رمية التماس يجب أن تكون القدمان خلف خط التماس بالكامل.","w":"يكفي أن يكون جزء من كل قدم على خط التماس أو على الأرض خارجه لحظة الرمي، مع الوقوف مواجهًا للملعب والرمي باليدين من خلف الرأس ومن فوقه."},"en":{"s":"Your feet must be completely behind the touchline when you take a throw-in.","w":"Part of each foot only has to be on the touchline or on the ground outside it at the moment of release, while facing the field and throwing with both hands from behind and over the head."}},{"id":"throw-delay-always-yellow","ref":"15.2","t":false,"ar":{"s":"اللاعب الذي يضيع الوقت في رمية التماس يُنذر دائمًا.","w":"عند التأخير المتعمد يبدأ الحكم عدًّا تنازليًا مرئيًا من خمس ثوانٍ، وإن لم تُنفذ الرمية تُمنح للفريق المنافس. لا يُنذر اللاعب إلا إذا أخّر بشكل مفرط استئناف اللعب بعد منحها للمنافس."},"en":{"s":"A player who wastes time on a throw-in is always shown a yellow card.","w":"For deliberate delay the referee starts a visible five-second countdown; if the throw is not taken in time it goes to the opponents. A caution follows only if the player excessively delays the restart after it has been awarded to the other team."}},{"id":"throw-two-metres-caution","ref":"15.2","t":true,"ar":{"s":"المنافس الذي يقترب أكثر من مترين من مكان تنفيذ رمية التماس قد يُنذر.","w":"يجب أن يبتعد جميع المنافسين مترين على الأقل عن نقطة الرمي، ومن يعيق المنفذ أو يشتت انتباهه بشكل غير عادل، بما في ذلك الاقتراب أكثر من مترين، يُنذر لسلوك غير رياضي، وتُحتسب ركلة حرة غير مباشرة إن كانت الرمية قد نُفذت."},"en":{"s":"An opponent who moves closer than 2 metres to the place where the throw-in is taken can be shown a yellow card.","w":"Opponents must be at least 2 m from the throw-in point; one who unfairly distracts or impedes the thrower, including by moving closer than 2 m, is cautioned for unsporting behaviour, with an indirect free kick if the throw has already been taken."}}]},"16":{"pages":{"ar":"ع ص 139–140 · EN p.145–146 · بروتوكول العد EN p.26","en":"EN p.145–146 · countdown protocol EN p.26 · AR p.139–140"},"parts":[{"id":"procedure","title":{"ar":"متى وكيف تُنفذ ركلة المرمى","en":"When and how a goal kick is taken"},"ref":"16 · 16.1","fig":"goalkick","k":["ركلة مرمى","goal kick","منطقة المرمى","goal area","منطقة الجزاء","penalty area","تتحرك بوضوح","clearly moves"],"body":{"ar":"<p>تُمنح ركلة المرمى عندما تتجاوز الكرة <b>بكاملها</b> خط المرمى، على الأرض أو في الهواء، وكان آخر من لمسها <b>لاعبًا مهاجمًا</b>، ولم يُحرز هدف.</p>\n<ul><li>يجوز التسجيل منها مباشرة، لكن <b>في مرمى المنافس فقط</b>. وإذا دخلت مرمى المنفذ مباشرة: <b>ركلة ركنية</b> للمنافس.</li></ul>\n<h3>الإجراءات</h3>\n<ul><li>الكرة <b>ثابتة</b>، ويركلها لاعب من الفريق المدافع من <b>أي نقطة داخل منطقة المرمى</b>.</li>\n<li>تصبح في اللعب عندما <b>تُركل وتتحرك بوضوح</b>، ولا يلزم أن تخرج من منطقة الجزاء.</li>\n<li>يبقى المنافسون <b>خارج منطقة الجزاء</b> حتى تصبح الكرة في اللعب.</li></ul>","en":"<p>A goal kick is awarded when the <b>whole</b> ball crosses the goal line, on the ground or in the air, last touched by an <b>attacker</b>, and no goal is scored.</p>\n<ul><li>A goal may be scored directly, but <b>only against the opponents</b>. Straight into the kicker's own goal: <b>corner kick</b> to the opponents.</li></ul>\n<h3>Procedure</h3>\n<ul><li>The ball is <b>stationary</b> and kicked by a defender from <b>any point in the goal area</b>.</li>\n<li>In play when <b>kicked and it clearly moves</b> — it need not leave the penalty area.</li>\n<li>Opponents stay <b>outside the penalty area</b> until the ball is in play.</li></ul>"},"quiz":[{"ar":["هل يجب أن تخرج الكرة من منطقة الجزاء لتصبح في اللعب؟",["نعم","لا، يكفي أن تُركل وتتحرك بوضوح"],"(16.1)"],"en":["Must the ball leave the penalty area to be in play?",["Yes","No — kicked and clearly moves is enough"],"(16.1)"],"a":1,"lvl":"b"},{"ar":["ركلة مرمى دخلت مرمى المنفذ مباشرة. القرار؟",["هدف للمنافس","ركلة ركنية للمنافس","إعادة الركلة"],"(16)"],"en":["A goal kick goes straight into the kicker's own goal. Decision?",["Goal to the opponents","Corner kick to the opponents","Retake"],"(16)"],"a":1,"lvl":"b"},{"ar":["من أين تُنفذ ركلة المرمى؟",["من زاوية منطقة المرمى فقط","من أي نقطة داخل منطقة المرمى","من أي نقطة داخل منطقة الجزاء"],"(16.1)"],"en":["Where is a goal kick taken from?",["Only the goal-area corner","Any point in the goal area","Any point in the penalty area"],"(16.1)"],"a":1,"lvl":"b"}]},{"id":"countdown","title":{"ar":"العد التنازلي في ركلة المرمى","en":"The goal-kick countdown"},"ref":"16 · 16.2 · بروتوكول العد","k":["عد تنازلي","countdown","خمس ثوان","five seconds","تأخير","delay","ركنية","corner"],"body":{"ar":"<div class=\"note\"><b>جديد في 2026/27 — العد التنازلي (5 ثوانٍ):</b> إذا رأى الحكم أن الفريق يؤخر التنفيذ عمدًا، يطلق صافرته ويشير بوضوح لتنفيذ الاستئناف، ثم يعدّ خمس ثوانٍ بيد مرفوعة (ويجوز أن يعدّ بصوته أيضًا). ويجوز له قبل ذلك أن يحث اللاعب بالصافرة أو بالصوت على الإسراع، لكن هذا التنبيه ليس شرطًا لبدء العد.</div><h3>ماذا يحدث بعد الثواني الخمس؟</h3>\n<ul><li>إذا لم تصبح الكرة في اللعب: تُمنح <b>ركلة ركنية للفريق المنافس</b> من جهة الملعب الأقرب إلى موضع ركلة المرمى.</li><li>لا إنذار تلقائيًا. يُنذَر اللاعب أو زميله <b>فقط</b> إذا أخّر بعد ذلك بشكل مفرط تنفيذ الركنية.</li></ul>","en":"<div class=\"note\"><b>New in 2026/27 — five-second countdown:</b> if the team deliberately delays the restart, the referee blows the whistle, clearly signals for it to be taken, and counts down five seconds with a raised hand (a verbal count may be added). A prior verbal or whistle cue to hurry up is allowed but not required.</div><h3>After five seconds</h3>\n<ul><li>If the ball is not in play: a <b>corner kick to the opponents</b> on the side nearest where the goal kick was to be taken.</li><li>No automatic caution; a yellow card only for excessive delay of the corner afterwards.</li></ul>"},"quiz":[{"ar":["انتهى العد ولم تُنفذ ركلة المرمى. القرار؟",["إنذار للحارس","ركلة ركنية للمنافس","ركلة حرة غير مباشرة"],"(16.2)"],"en":["The count ends and the goal kick isn't taken. Decision?",["Caution the goalkeeper","Corner kick to the opponents","Indirect free kick"],"(16.2)"],"a":1,"lvl":"b"},{"ar":["من أي جهة تُنفذ الركنية الممنوحة بسبب التأخير؟",["الجهة الأقرب إلى موضع ركلة المرمى","يختار الفريق المهاجم","دائمًا الجهة اليمنى"],"(بروتوكول العد)"],"en":["Which side is the corner taken from?",["The side nearest where the goal kick was to be taken","Attacking team's choice","Always the right side"],"(Countdown protocol)"],"a":0,"lvl":"p"}]},{"id":"offences","title":{"ar":"المخالفات والعقوبات","en":"Offences and sanctions"},"ref":"16 · 16.2","k":["لمس مرتين","second touch","لمس الكرة باليد","handball","إعادة","retake","لم يكن لديهم وقت","no time to leave"],"body":{"ar":"<ul><li><b>لمس ثانٍ</b> من المنفذ: <b>ركلة حرة غير مباشرة</b>.</li>\n<li><b>لمس الكرة باليد</b> من المنفذ: <b>ركلة حرة مباشرة</b>، أو <b>ركلة جزاء</b> داخل منطقة جزائه. أما إذا كان المنفذ هو الحارس: <b>ركلة حرة غير مباشرة</b>.</li>\n<li>منافسون داخل منطقة الجزاء <b>لم يكن لديهم وقت للخروج</b>: يستمر اللعب.</li>\n<li>منافس داخل المنطقة (أو دخلها قبل أن تصبح الكرة في اللعب) <b>لمس الكرة أو نافس عليها</b> قبل أن تصبح في اللعب: <b>تُعاد الركلة</b>.</li>\n<li>لاعب دخل المنطقة قبل أن تصبح الكرة في اللعب، ثم <b>ارتكب خطأ أو ارتُكب ضده</b>: تُعاد الركلة، وقد يُنذَر المخطئ أو يُطرد حسب المخالفة.</li>\n<li>أي مخالفة أخرى: <b>تُعاد الركلة</b>.</li></ul>","en":"<ul><li><b>Second touch</b> by the kicker: <b>indirect free kick</b>.</li>\n<li><b>Handball</b> by the kicker: <b>direct free kick</b>, or a <b>penalty</b> in their own penalty area — but an <b>indirect free kick</b> if the kicker was the goalkeeper.</li>\n<li>Opponents still in the area because they <b>had no time to leave</b>: play on.</li>\n<li>An opponent in the area (or entering early) who <b>touches or challenges</b> before the ball is in play: <b>retake</b>.</li>\n<li>A player entering early who <b>fouls or is fouled</b>: retake, and the offender may be cautioned or sent off.</li>\n<li>Any other offence: <b>retake</b>.</li></ul>"},"quiz":[{"ar":["نفّذ الحارس ركلة المرمى ثم لمسها ثانية بيده خارج منطقة جزائه قبل أن يلمسها أحد. القرار؟",["ركلة حرة غير مباشرة","ركلة حرة مباشرة","إعادة الركلة"],"(16.2) لمس الكرة باليد خارج المنطقة = مباشرة."],"en":["The goalkeeper takes the goal kick, then handles it outside the penalty area before anyone touches it. Decision?",["Indirect free kick","Direct free kick","Retake"],"(16.2) Handball outside the area = direct."],"a":1,"lvl":"p"},{"ar":["مهاجم بقي داخل المنطقة ونافس على الكرة قبل أن تتحرك بوضوح. القرار؟",["يستمر اللعب","تُعاد الركلة","ركلة حرة غير مباشرة"],"(16.2)"],"en":["An attacker stayed in the area and challenged before the ball clearly moved. Decision?",["Play on","Retake","Indirect free kick"],"(16.2)"],"a":1,"lvl":"b"},{"ar":["مهاجم لم يكن لديه وقت للخروج ولم يلمس الكرة. القرار؟",["يستمر اللعب","تُعاد الركلة","إنذار"],"(16.2)"],"en":["An attacker had no time to leave and doesn't touch the ball. Decision?",["Play on","Retake","Caution"],"(16.2)"],"a":0,"lvl":"p"}]}],"cases":[{"id":"gk-play-inside-area","lvl":"b","ref":"16.1","a":0,"ar":{"s":"نفّذ المدافع ركلة المرمى بتمريرة قصيرة لزميله الواقف داخل منطقة الجزاء، فتحركت الكرة بوضوح ثم استلمها الزميل. ما قرارك؟","o":["يستمر اللعب","تُعاد الركلة لأن الكرة لم تخرج من منطقة الجزاء","ركلة حرة غير مباشرة للمنافس"],"d":"يستمر اللعب","r":"لا يوجد","x":"لا يوجد","w":"تصبح الكرة في اللعب في ركلة المرمى عندما تُركل وتتحرك بوضوح، ولا يُشترط أن تغادر منطقة الجزاء، فيجوز للزميل لعبها داخلها."},"en":{"s":"A defender takes a goal kick with a short pass to a team-mate inside the penalty area; the ball clearly moves and the team-mate receives it. Your call?","o":["Play on","Retake — the ball didn't leave the penalty area","Indirect free kick to the opponents"],"d":"Play on","r":"None","x":"None","w":"At a goal kick the ball is in play once it is kicked and clearly moves; it doesn't need to leave the penalty area, so a team-mate may play it there."}},{"id":"gk-own-goal","lvl":"b","ref":"16","a":2,"ar":{"s":"نفّذ الحارس ركلة المرمى بتمريرة إلى زميله، لكن الكرة انحرفت ودخلت مرمى فريقه مباشرة دون أن يلمسها أحد. ما قرارك؟","o":["هدف للفريق المنافس","تُعاد ركلة المرمى","ركلة ركنية للفريق المنافس"],"d":"لا يُحتسب هدف","r":"ركلة ركنية للفريق المنافس","x":"لا يوجد","w":"يمكن إحراز هدف مباشرة من ركلة المرمى في مرمى المنافس فقط. فإذا دخلت الكرة مرمى الفريق المنفذ مباشرة تُحتسب ركلة ركنية للمنافس."},"en":{"s":"The goalkeeper's goal-kick pass to a team-mate goes astray and enters their own goal directly without anyone touching it. Your call?","o":["Goal to the opponents","Retake the goal kick","Corner kick to the opponents"],"d":"No goal","r":"Corner kick to the opponents","x":"None","w":"A goal may be scored directly from a goal kick only against the opponents. If the ball goes directly into the kicker's own goal, a corner kick is awarded to the opponents."}},{"id":"gk-no-time-to-leave","lvl":"b","ref":"16.2","a":1,"ar":{"s":"نفّذ الحارس ركلة المرمى بسرعة بينما كان مهاجم ما زال داخل منطقة الجزاء لأنه لم يجد وقتًا للخروج. لم يلمس المهاجم الكرة ولم ينافس عليها، ووصلت الكرة إلى مدافع. ما قرارك؟","o":["تُعاد ركلة المرمى","يستمر اللعب","ركلة حرة غير مباشرة للفريق المدافع"],"d":"يستمر اللعب","r":"لا يوجد","x":"لا يوجد","w":"إذا بقي منافس داخل منطقة الجزاء لأنه لم يجد وقتًا للمغادرة، يسمح الحكم باستمرار اللعب. ولا تُعاد الركلة إلا إذا لمس هذا المنافس الكرة أو نافس عليها قبل أن تصبح في اللعب."},"en":{"s":"The goalkeeper takes a quick goal kick while an attacker is still in the penalty area, having had no time to leave. He doesn't touch or challenge for the ball, which reaches a defender. Your call?","o":["Retake the goal kick","Play on","Indirect free kick to the defending team"],"d":"Play on","r":"None","x":"None","w":"If opponents are in the penalty area because they had no time to leave, the referee lets play continue. The kick is retaken only if such an opponent touches or challenges for the ball before it is in play."}},{"id":"gk-countdown","lvl":"p","ref":"16.2","a":0,"ar":{"s":"الحارس يماطل في تنفيذ ركلة المرمى من الجهة اليسرى لمنطقة المرمى. بدأ الحكم العد التنازلي لخمس ثوانٍ وانتهى دون تنفيذ الركلة. ما قرارك؟","o":["ركلة ركنية للمنافس من الجهة الأقرب إلى مكان ركلة المرمى، دون إنذار","إنذار الحارس وإعادة ركلة المرمى","ركلة حرة غير مباشرة للمنافس على خط منطقة المرمى"],"d":"تُمنح ركلة ركنية للفريق المنافس","r":"ركلة ركنية من جهة الملعب الأقرب إلى مكان ركلة المرمى","x":"لا يوجد، إلا إذا أخّر الفريق المخالف تنفيذ الركلة الركنية تأخيرًا مفرطًا فيُنذر","w":"إذا لم تُنفذ ركلة المرمى عند نهاية العد التنازلي تُمنح ركلة ركنية للمنافس من الجهة الأقرب إلى مكان تنفيذها. ولا يُنذر الحارس على التأخير نفسه، بل فقط إذا أخّر لاحقًا تنفيذ الركلة الركنية بشكل مفرط."},"en":{"s":"The goalkeeper stalls over a goal kick from the left side of the goal area. The referee runs a five-second countdown and it expires without the kick being taken. Your call?","o":["Corner kick to the opponents on the side nearest the goal kick, no caution","Caution the goalkeeper and retake the goal kick","Indirect free kick to the opponents on the goal area line"],"d":"Award a corner kick to the opponents","r":"Corner kick on the side nearest where the goal kick was to be taken","x":"None — unless the offending team then excessively delays the corner kick","w":"If the goal kick isn't taken by the end of the countdown, the opponents get a corner kick on the side closest to where the goal kick was to be taken. The goalkeeper is cautioned only if they then excessively delay the corner kick restart."}},{"id":"gk-keeper-handles","lvl":"p","ref":"16.2","a":2,"ar":{"s":"نفّذ الحارس ركلة المرمى بلمسة قصيرة فتحركت الكرة بوضوح، ثم التقطها بيديه داخل منطقة جزائه قبل أن يلمسها أي لاعب آخر. ما قرارك؟","o":["ركلة جزاء لأنها لمسة يد داخل منطقة الجزاء","تُعاد ركلة المرمى","ركلة حرة غير مباشرة للمنافس"],"d":"إيقاف اللعب","r":"ركلة حرة غير مباشرة للمنافس من موضع اللمسة الثانية","x":"لا يوجد","w":"الكرة أصبحت في اللعب، فلمسها مجددًا من المنفذ قبل أن تلمس لاعبًا آخر مخالفة. ولمسة اليد من المنفذ داخل منطقة جزائه تعني ركلة جزاء عادةً، إلا إذا كان المنفذ هو الحارس فتكون ركلة حرة غير مباشرة."},"en":{"s":"The goalkeeper takes a goal kick with a short touch; the ball clearly moves and the goalkeeper then picks it up inside the penalty area before anyone else touches it. Your call?","o":["Penalty kick — handball in the penalty area","Retake the goal kick","Indirect free kick to the opponents"],"d":"Stop play","r":"Indirect free kick to the opponents where the second touch occurred","x":"None","w":"The ball was in play, so the kicker's second touch before anyone else is an offence. A kicker's handball inside their own penalty area is normally a penalty, but when the kicker is the goalkeeper it is an indirect free kick."}}],"myths":[{"id":"goal-kick-opponents-edge-goal-area","ref":"16.1","t":false,"ar":{"s":"يكفي أن يقف المهاجمون خارج منطقة المرمى عند تنفيذ ركلة المرمى.","w":"يجب أن يبقى المنافسون خارج منطقة الجزاء كلها حتى تصبح الكرة في اللعب، ومن يلمس الكرة أو ينازع عليها داخلها قبل ذلك تُعاد الركلة بسببه."},"en":{"s":"Attackers only need to stay outside the six-yard box during a goal kick.","w":"Opponents must stay outside the whole penalty area until the ball is in play; if one touches or challenges for the ball there before then, the goal kick is retaken."}},{"id":"goal-kick-must-leave-area","ref":"16.1","t":false,"ar":{"s":"يجب أن تخرج الكرة من منطقة الجزاء قبل أن يلمسها أي لاعب في ركلة المرمى.","w":"تصبح الكرة في اللعب بمجرد ركلها وتحركها بوضوح، لذا يمكن لزميل المنفذ استلامها داخل منطقة الجزاء."},"en":{"s":"In a goal kick the ball must leave the penalty area before anyone can touch it.","w":"The ball is in play as soon as it is kicked and clearly moves, so a team-mate may receive it inside the penalty area."}},{"id":"goal-kick-delay-corner","ref":"16.2","t":true,"ar":{"s":"إضاعة الوقت في تنفيذ ركلة المرمى قد تكلّف فريقك ركلة ركنية.","w":"إذا أخّر الفريق ركلة المرمى عمدًا يبدأ الحكم عدًّا تنازليًا من خمس ثوانٍ، وإن لم تُنفذ الركلة تُحتسب ركلة ركنية للمنافس من الجهة الأقرب لمكان ركلة المرمى."},"en":{"s":"Wasting time
